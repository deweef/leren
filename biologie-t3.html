<script>
/* ---------- genetica: notatie, kruisingsschema, stambomen en plaatjes ---------- */
const SVG=(w,h,inh,lab,cls)=>`<svg viewBox="0 0 ${w} ${h}" class="fig${cls?' '+cls:''}" role="img" aria-label="${lab||''}">${inh}</svg>`;
const T=(x,y,t,o='')=>`<text x="${x}" y="${y}" text-anchor="middle" ${o}>${t}</text>`;
const PIJL=`<defs><marker id="pk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>`;
const pijl=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="1.8" marker-end="url(#pk)"/>`;
const fs11='font-size="11" fill="currentColor"',fsb='font-size="12" font-weight="700" fill="currentColor"';
/* allelen als tekens: 'A','a', 'XA','Xa','Y', 'IA','IB','i', 'AR','AW' */
function al(t){if(t==='Y')return 'Y';const m=/^([XIA])([A-Za-z])$/.exec(t);if(m&&(m[1]!=='A'||/[RW]/.test(m[2])))return `${m[1]}<sup>${m[2]}</sup>`;return t}
function gsort(a,b){const r=t=>t==='Y'?3:/^X/.test(t)?(t[1]===t[1].toUpperCase()?0:1):/^I/.test(t)?(t==='i'?2:0):t===t.toUpperCase()?0:1;return r(a)-r(b)||a.localeCompare(b)}
const gt=(x,y)=>[x,y].sort(gsort).map(al).join('');
/* kruisingsschema: zaadcellen links (♂), eicellen boven (♀) */
function kruisTabel(man,vrouw,kleur){return `<table class="kt"><tr><th class="hoek">♂ \\ ♀</th>${vrouw.map(v=>`<th>${al(v)}</th>`).join('')}</tr>${man.map(m=>`<tr><th>${al(m)}</th>${vrouw.map(v=>{const g=gt(m,v);return `<td${kleur&&kleur(m,v)?' class="mk"':''}>${g}</td>`}).join('')}</tr>`).join('')}</table>`}

/* DNA-ladder */
function figDNA(){const top='ACGTAAC'.split(''),par={A:'T',T:'A',C:'G',G:'C'},K={A:'#F4D03F',T:'#E8708A',C:'#A569BD',G:'#5DADE2'};let s='';
 top.forEach((b,i)=>{const x=30+i*44,o=par[b];s+=`<rect x="${x}" y="40" width="34" height="34" rx="4" fill="${K[b]}"/>${T(x+17,62,b,'font-size="16" font-weight="800" fill="#1E2230"')}<rect x="${x}" y="78" width="34" height="34" rx="4" fill="${K[o]}"/>${T(x+17,100,o,'font-size="16" font-weight="800" fill="#1E2230"')}`});
 s+=`<rect x="24" y="22" width="310" height="10" rx="5" fill="#C0793A"/><rect x="24" y="120" width="310" height="10" rx="5" fill="#C0793A"/>`;
 s+=T(180,16,'keten: suiker (desoxyribose) + fosfaat',fs11)+T(180,146,'A past bij T, C past bij G (basenparen)','font-size="11.5" font-weight="700" fill="currentColor"');
 return SVG(360,154,s,'DNA: twee ketens met basenparen','breed')}
/* karyogram (schematisch) */
function figKaryo(sex='XY',extra){let s='';for(let i=1;i<=22;i++){const r=i<=8?0:i<=16?1:2,c=r===2?i-17:(i-1)%8,x=18+c*42,y=14+r*58,h=36-i*1.1;
  const n=extra===i?3:2;for(let k=0;k<n;k++)s+=`<rect x="${x+k*8}" y="${y+40-h}" width="6" height="${h}" rx="3" fill="${k===2?'#C0392B':'#5D6D7E'}"/>`;s+=T(x+7,y+52,i,'font-size="9.5" fill="currentColor"')}
 const x=18+6*42,y=130;const st=sex.split('');st.forEach((c,k)=>{const h=c==='Y'?14:30;s+=`<rect x="${x+k*8}" y="${y+40-h}" width="6" height="${h}" rx="3" fill="${c==='Y'?'#2E86C1':'#C2417A'}"/>`});s+=T(x+12,y+52,sex,'font-size="10" font-weight="700" fill="currentColor"');
 return SVG(360,192,s,'Karyogram','breed')}
/* homologe chromosomen met genen */
function figGenen(){const chr=(x,b)=>`<rect x="${x}" y="14" width="22" height="150" rx="11" fill="#E8E2D6" stroke="#8A7F6B"/><rect x="${x}" y="58" width="22" height="4" fill="#8A7F6B"/>`+b.map(([y,k,t])=>`<rect x="${x}" y="${y}" width="22" height="9" fill="${k}"/><text x="${x+11}" y="${y+7.5}" text-anchor="middle" font-size="8" font-weight="800" fill="#1E2230">${t}</text>`).join('');
 let s=chr(120,[[26,'#F4D03F','A'],[80,'#E8708A','B'],[120,'#5DADE2','d']])+chr(170,[[26,'#F4D03F','A'],[80,'#E8708A','b'],[120,'#5DADE2','d']]);
 s+=`<text x="200" y="34" font-size="11" fill="currentColor">AA: homozygoot</text><text x="200" y="88" font-size="11" fill="currentColor">Bb: heterozygoot</text><text x="200" y="128" font-size="11" fill="currentColor">dd: homozygoot</text>`;
 s+=`<text x="112" y="34" text-anchor="end" font-size="11" fill="currentColor">gen voor</text><text x="112" y="47" text-anchor="end" font-size="11" fill="currentColor">eigenschap 1</text>`+T(156,182,'homologe chromosomen: zelfde genen op dezelfde plek','font-size="11" font-weight="700" fill="currentColor"');
 return SVG(320,190,s,'Genen op homologe chromosomen')}
/* geslachtsbepaling */
function figXY(){let s=PIJL;const c=(x,y,t,k)=>`<circle cx="${x}" cy="${y}" r="16" fill="${k}"/>${T(x,y+5,t,'font-size="13" font-weight="800" fill="#1E2230"')}`;
 s+=c(36,40,'X','#F5B7C6')+c(36,110,'X','#F5B7C6')+T(36,140,'eicel',fs11)+`<text x="70" y="44" font-size="13" font-weight="800" fill="#C2417A">+ X</text><text x="70" y="114" font-size="13" font-weight="800" fill="#2E86C1">+ Y</text>`;
 s+=T(86,140,'zaadcel',fs11)+pijl(110,40,160,40)+pijl(110,110,160,110)+c(190,40,'XX','#F5B7C6')+c(190,110,'XY','#AED6F1')+`<text x="216" y="45" font-size="13" font-weight="700" fill="currentColor">meisje</text><text x="216" y="115" font-size="13" font-weight="700" fill="currentColor">jongen</text>`;
 s+=T(160,166,'de zaadcel (X of Y) bepaalt het geslacht','font-size="11.5" font-weight="700" fill="currentColor"');
 return SVG(300,174,s,'Geslachtsbepaling')}
/* stamboom: p = [{n, s:'m'|'v', x, y, a:1 aangedaan, d:1 draagster}], paar=[[n1,n2]], kind=[[[n1,n2],[kinderen]]] */
function figStamboom(p,paar,kind,leg,hl){const P={};p.forEach(q=>P[q.n]=q);let s='';const R=13;
 paar.forEach(([a,b])=>{s+=`<line x1="${P[a].x}" y1="${P[a].y}" x2="${P[b].x}" y2="${P[b].y}" stroke="currentColor" stroke-width="2"/>`});
 kind.forEach(([[a,b],ks])=>{const mx=(P[a].x+P[b].x)/2,my=P[a].y,ky=P[ks[0]].y-R-10;const xs=ks.map(k=>P[k].x);s+=`<line x1="${mx}" y1="${my}" x2="${mx}" y2="${ky}" stroke="currentColor" stroke-width="2"/><line x1="${Math.min(...xs,mx)}" y1="${ky}" x2="${Math.max(...xs,mx)}" y2="${ky}" stroke="currentColor" stroke-width="2"/>`+ks.map(k=>`<line x1="${P[k].x}" y1="${ky}" x2="${P[k].x}" y2="${P[k].y-R}" stroke="currentColor" stroke-width="2"/>`).join('')});
 p.forEach(q=>{const f=q.a?'#C0392B':'var(--surface)',st=hl===q.n?'#E67E22':'currentColor',w=hl===q.n?4:2;
  s+=q.s==='m'?`<rect x="${q.x-R}" y="${q.y-R}" width="${2*R}" height="${2*R}" fill="${f}" stroke="${st}" stroke-width="${w}"/>`:`<circle cx="${q.x}" cy="${q.y}" r="${R}" fill="${f}" stroke="${st}" stroke-width="${w}"/>`;
  if(q.d)s+=`<circle cx="${q.x}" cy="${q.y}" r="4" fill="currentColor"/>`;s+=T(q.x,q.y+R+13,q.n,'font-size="11" font-weight="700" fill="currentColor"')});
 const H=Math.max(...p.map(q=>q.y))+54;
 s+=`<rect x="8" y="${H-14}" width="12" height="12" fill="#C0392B" stroke="currentColor"/><text x="24" y="${H-4}" font-size="11" fill="currentColor">${leg||'aandoening'}</text><rect x="${150}" y="${H-14}" width="12" height="12" fill="var(--surface)" stroke="currentColor"/><text x="166" y="${H-4}" font-size="11" fill="currentColor">gezond · □ man ○ vrouw</text>`;
 return SVG(340,H+4,s,'Stamboom')}

/* ---------- de zes basisstoffen met hun leerpad ----------
   lp: [titel, html, [vraag, goed, 'fout|fout|fout', uitleg]]; in eigen woorden, naar Biologie voor jou 4 havo, thema 3 Genetica.
   Een '📎 Voorbeeld' is context uit het boek: geen toetsstof, wel handig om het te snappen. */
const VB=(t,h)=>`<div class="vb"><b>📎 Voorbeeld: ${t}</b> <span class="src">(hoef je niet te leren)</span><br>${h}</div>`;
const H=[
{id:'3.1',t:'Fenotype en genotype',kort:'Chromosomen, DNA, genen en milieu',ic:'🧬',lp:[
 ['Fenotype en genotype',`<p><b>Genetica</b> (erfelijkheidsleer) onderzoekt hoe eigenschappen van ouders worden doorgegeven aan hun nakomelingen.</p><ul><li><b>Fenotype</b> = alle <b>waarneembare</b> eigenschappen van een individu: haarkleur, oogkleur, lichaamsgeur, maar ook dingen die je pas met onderzoek ziet, zoals je <b>bloedgroep</b> of <b>kleurenblindheid</b>.</li><li><b>Genotype</b> = de <b>informatie</b> voor alle erfelijke eigenschappen. Die informatie (de <b>genetische informatie</b> of <b>genetische code</b>) ligt opgeslagen in de chromosomen.</li></ul><p>Je genotype ontstaat bij de <b>bevruchting</b>: een zaadcel van je vader en een eicel van je moeder versmelten, allebei met chromosomen. Zo komt de helft (50%) van je genotype van je vader en de helft van je moeder.</p>${VB('designerdogs','Een labradoodle is een kruising van twee rashonden: een poedel en een labrador. Puppy’s uit één nest hebben dezelfde ouders, maar zien er toch verschillend uit: elke pup komt uit een andere eicel en zaadcel en heeft dus een ander genotype.')}`,['Een leeuw krijgt manen als hij volwassen wordt. Wat verandert er?','zijn fenotype','zijn genotype|zijn fenotype én zijn genotype|niets','Manen zie je: dat is het fenotype. De erfelijke informatie (het genotype) ligt vast vanaf de bevruchting en verandert niet.']],
 ['Chromosomen en het karyogram',`<p><b>Chromosomen</b> zijn lange, dunne draden in de celkern: <b>DNA opgerold om eiwitten</b>. Met een lichtmicroscoop zie je ze alleen in cellen die <b>aan het delen</b> zijn.</p><p>Een lichaamscel van de mens heeft <b>46 chromosomen = 23 paar</b>.</p>${figKaryo('XX')}<p>Zet je de chromosomen van één cel op grootte in paren, dan heb je een <b>karyogram</b> (ook: <b>chromosomenportret</b>, zie BiNaS tabel 70B). Paar 1 is het grootst, 21 en 22 het kleinst.</p>`,['Wanneer kun je chromosomen met een lichtmicroscoop zien?','als de cel aan het delen is','altijd, in elke cel|alleen in geslachtscellen|nooit, daarvoor zijn ze te klein','Alleen tijdens de deling zijn de chromosomen zo opgerold dat je ze ziet. In een cel die niet deelt zijn het dunne, onzichtbare draden.']],
 ['Autosomen, geslachtschromosomen en homologe paren',`${figKaryo('XY')}<ul><li><b>Autosomen</b>: de 22 paren die bij mannen en vrouwen gelijk zijn (44 chromosomen).</li><li><b>Geslachtschromosomen</b>: het 23e paar, bepaalt het geslacht. Er is een <b>X-chromosoom</b> en een veel kleiner <b>Y-chromosoom</b>. Vrouw: <b>XX</b>, man: <b>XY</b>.</li><li><b>Homologe chromosomen</b>: de twee chromosomen van één paar. Ze zijn gelijk in <b>lengte en vorm</b> en hebben informatie voor <b>dezelfde eigenschappen</b>.</li></ul><p>X en Y zijn niet gelijk van lengte en vorm, dus niet homoloog. Een vrouw heeft daarom 23 homologe paren, een man 22.</p>`,['Waarom heeft een man maar 22 paar homologe chromosomen?','omdat X en Y niet gelijk zijn in lengte en vorm','omdat hij een chromosoom minder heeft|omdat zijn autosomen niet homoloog zijn|omdat het Y-chromosoom groter is dan het X-chromosoom','Een man heeft gewoon 46 chromosomen en 22 homologe paren autosomen. X en Y vormen wel een paar, maar zijn niet homoloog. En het Y-chromosoom is juist veel kleiner.']],
 ['Een karyogram met een afwijking',`<p>Aan een karyogram zie je of er chromosomen te veel of te weinig zijn. Zo’n afwijking geeft een syndroom:</p><table class="gt"><tr><th>syndroom</th><th>wat zie je in het karyogram?</th></tr><tr><td>Down</td><td>chromosoom 21 drie keer</td></tr><tr><td>Patau</td><td>chromosoom 13 drie keer</td></tr><tr><td>Klinefelter (jongen)</td><td>naast de Y twee of meer X’en (XXY)</td></tr><tr><td>Turner (meisje)</td><td>één X te weinig (alleen één X)</td></tr></table>${figKaryo('XY',21)}<p>Hier zie je bij nummer 21 een extra (rood) chromosoom: een jongen met het syndroom van Down.</p>`,['In een karyogram staan een X, een tweede X en een Y. Welk syndroom is dat?','Klinefelter','Turner|Down|Patau','XXY = Klinefelter. Turner heeft maar één X, Down een extra chromosoom 21 en Patau een extra chromosoom 13.']],
 ['DNA: een ladder van nucleotiden',`<p>Een chromosoom bevat één heel lang <b>DNA-molecuul</b> en veel eiwitten. Een DNA-molecuul bestaat uit <b>twee ketens</b> die als een <b>dubbele spiraal</b> om elkaar heen draaien.</p>${figDNA()}<ul><li>De bouwstenen zijn <b>nucleotiden</b>. Eén nucleotide = een <b>fosfaatgroep</b> + het suiker <b>desoxyribose</b> + een <b>stikstofbase</b>.</li><li>Er zijn vier stikstofbasen: <b>adenine (A)</b>, <b>thymine (T)</b>, <b>cytosine (C)</b> en <b>guanine (G)</b>.</li><li><b>Vaste basenparing</b>: A zit altijd tegenover T, C altijd tegenover G. Twee basen tegenover elkaar heten een <b>basenpaar</b>.</li></ul>`,['In de ene keten staat de volgorde A C G. Wat staat er tegenover in de andere keten?','T G C','A C G|G T A|U G C','A hoort bij T, C bij G en G bij C. Dus A C G wordt T G C. A C G is dezelfde volgorde (geen paren), en U komt in DNA niet voor.']],
 ['Gen en allel',`<p>Een <b>gen</b> is een stuk van een chromosoom met de informatie voor één of meer erfelijke eigenschappen, of voor een deel van een eigenschap. Vaak werken meerdere genen samen aan één eigenschap (oogkleur, lichaamslengte).</p><p>Een gen bestaat uit honderden nucleotiden in een vaste volgorde: de <b>DNA-sequentie</b>.</p><p>Een <b>allel</b> is een <b>variant</b> van een gen, met een iets andere volgorde van basen. Het allel voor zwart haar heeft dus een andere basenvolgorde dan het allel voor blond haar.</p><p>Van groot naar klein: <b>genoom → chromosoom → gen → nucleotide → stikstofbase</b>.</p>`,['Wat is het verschil tussen een gen en een allel?','een allel is een variant van een gen','een gen is een variant van een allel|een allel is groter dan een chromosoom|een allel ligt altijd op het Y-chromosoom','Het gen is het stuk DNA voor een eigenschap (bijv. haarkleur); allelen zijn de varianten ervan (blond, zwart). Een allel is dus kleiner dan een chromosoom en kan op elk chromosoom liggen.']],
 ['Genen aan en uit: genexpressie',`<p>Al je lichaamscellen komen uit dezelfde bevruchte eicel, dus ze hebben <b>hetzelfde DNA</b>. Toch is een spiercel anders dan een zenuwcel. Dat komt doordat genen <b>aan- en uitgezet</b> kunnen worden.</p><ul><li><b>Genexpressie</b>: een gen staat aan, de eigenschap komt tot uiting.</li><li><b>Geninactivatie</b>: een gen staat uit.</li></ul><p>Voorbeeld: in cellen van je hoofdhuid staan de genen voor hoofdhaar aan, in je levercellen staan ze uit.</p><p>Het <b>genoom</b> = alle DNA-moleculen in een cel. Het meeste zit in de kern, maar er zit ook DNA in <b>mitochondriën</b> en (bij planten) in <b>bladgroenkorrels</b>.</p>`,['Een zenuwcel en een spiercel van jou zien er heel anders uit. Hoe komt dat?','in elke celsoort staan andere genen aan en uit','ze hebben een ander genotype|ze hebben een ander aantal chromosomen|een van beide heeft een mutatie','Beide cellen hebben hetzelfde genotype en evenveel chromosomen. Het verschil zit in genexpressie en geninactivatie.']],
 ['Milieu en modificatie',`<p>Je genotype bepaalt niet alles: <b>fenotype = genotype + milieufactoren</b>.</p><p><b>Milieufactoren</b> zijn invloeden uit de omgeving: licht, lucht (roken, vervuiling), vochtigheid, temperatuur, voeding, ziekten en opvoeding.</p><p>Een <b>modificatie</b> is een verandering in het fenotype door het milieu. Het DNA verandert niet, dus een modificatie wordt <b>niet doorgegeven</b> aan je kinderen. Voorbeeld: een storm breekt takken van een eik.</p><table class="gt"><tr><th>eigenschap</th><th>erfelijk of modificatie?</th></tr><tr><td>blond haar vanaf je geboorte</td><td>erfelijk</td></tr><tr><td>blond haar door de kapper</td><td>modificatie</td></tr><tr><td>behaarde bladeren bij een geranium</td><td>erfelijk</td></tr><tr><td>slappe bladeren door te weinig water</td><td>modificatie</td></tr><tr><td>een litteken op je knie</td><td>modificatie</td></tr></table>`,['Iemand heeft een litteken op zijn knie. Wat is dat?','een modificatie','een erfelijke eigenschap|een mutatie|een verandering in het genotype','Het litteken komt door het milieu (een val). Het DNA verandert niet, dus het is geen mutatie en het genotype blijft gelijk.']],
 ['Aangeboren is niet altijd erfelijk',`<p>Het milieu heeft al invloed in de baarmoeder.</p><ul><li><b>Aangeboren afwijking</b> (aandoening): ontstaat in de <b>baarmoeder</b>, door milieufactoren.</li><li><b>Erfelijke ziekte</b> (aandoening): wordt via de <b>chromosomen van de ouders</b> doorgegeven.</li></ul><p>Voorbeeld: drinkt een moeder alcohol tijdens de zwangerschap, dan komt die via het bloed en de placenta bij het kind en remt de groei van de hersenen (foetaal-alcoholsyndroom). Dat is <b>aangeboren</b>, maar <b>niet erfelijk</b>: het DNA verandert niet.</p>${VB('blowen en psychoses','Wiet beïnvloedt de stof dopamine in de hersenen. Hoe gevoelig je bent voor een psychose hangt af van je allelen van het COMT-gen op chromosoom 22 (Val of Met). Met Val/Val loop je het meeste risico. De aanleg is erfelijk (genotype), maar de psychose ontstaat pas door het blowen (milieu): fenotype = genotype + milieu.')}`,['Een baby heeft het foetaal-alcoholsyndroom. Wat klopt?','aangeboren, maar niet erfelijk','erfelijk, maar niet aangeboren|aangeboren én erfelijk|niet aangeboren en niet erfelijk','Het ontstond in de baarmoeder, dus aangeboren. De oorzaak is alcohol (milieu), niet de chromosomen van de ouders, dus niet erfelijk.']]]},

{id:'3.2',t:'Genenparen',kort:'Homozygoot, dominant, recessief en recombinatie',ic:'🧩',lp:[
 ['Genenpaar: homozygoot en heterozygoot',`<p>In een lichaamscel komen chromosomen in paren voor, en dus ook genen. Op twee homologe chromosomen ligt het gen voor een eigenschap op <b>dezelfde plek</b>.</p>${figGenen()}<ul><li><b>Genenpaar</b>: de twee allelen voor een eigenschap op twee homologe chromosomen.</li><li><b>Homozygoot</b>: twee <b>gelijke</b> allelen (bijv. twee keer het allel voor een rechte haarlijn).</li><li><b>Heterozygoot</b>: twee <b>verschillende</b> allelen (één voor een rechte, één voor een V-vormige haarlijn).</li></ul>`,['In de cel van Sjors staan de genenparen AA, Bb, rr en Gg. Voor hoeveel eigenschappen is hij homozygoot?','2','1|3|4','AA en rr hebben twee gelijke allelen: homozygoot. Bb en Gg zijn heterozygoot. Dus 2.']],
 ['Dominant en recessief',`<p>Iemand die heterozygoot is voor de haarlijn heeft een <b>V-vormige</b> haarlijn. Maar één allel komt dus tot uiting.</p><ul><li><b>Dominant allel</b>: komt tot uiting, ook als er maar één van is (bij een heterozygoot).</li><li><b>Recessief allel</b>: komt alleen tot uiting als er <b>geen dominant allel</b> is, dus als iemand homozygoot recessief is.</li></ul><p>Aan het fenotype zie je niet of iemand met het dominante fenotype homozygoot of heterozygoot is. Wie het recessieve fenotype heeft, is <b>altijd homozygoot</b>.</p><p>Een <b>drager</b> is heterozygoot: hij heeft het recessieve allel wel in zijn genotype, maar je ziet het niet. Bij <b>volledige dominantie</b> komt het recessieve allel helemaal niet tot uiting.</p>`,['Een cavia heeft lang haar; kort haar is dominant. Wat weet je van zijn genotype?','hij is homozygoot recessief','hij is heterozygoot|hij is homozygoot dominant|dat kun je niet weten','Een recessief fenotype zie je alleen als er geen dominant allel is, dus twee recessieve allelen. Bij het dominante fenotype (kort haar) kun je het genotype níet zien.']],
 ['Allelen opschrijven',`<ul><li>Dominant allel: <b>hoofdletter</b> (A). Recessief allel: dezelfde <b>kleine letter</b> (a).</li><li>Homozygoot dominant = <b>AA</b>, heterozygoot = <b>Aa</b>, homozygoot recessief = <b>aa</b>.</li><li>Kies een letter waarvan hoofdletter en kleine letter er <b>duidelijk anders</b> uitzien. Dus niet C/c, O/o, P/p of S/s, wel bijvoorbeeld R/r.</li></ul><p>Tellen: in een <b>lichaamscel</b> zitten voor elke eigenschap <b>2 allelen</b> (diploïd), in een <b>geslachtscel</b> maar <b>1</b> (haploïd). Ook een spiercel heeft allelen voor oogkleur: elke lichaamscel heeft al het DNA, het gen staat daar alleen uit.</p>`,['Hoeveel allelen voor oogkleur zitten er in een eicel?','1','2|0|23','Een geslachtscel heeft van elk chromosomenpaar maar één chromosoom, dus van elk genenpaar één allel. Een lichaamscel heeft er 2.']],
 ['Onvolledig dominant en intermediair',`<p>Soms komt het recessieve allel een beetje tot uiting: <b>onvolledig dominant</b>. Bij oogkleur is bruin dominant over blauw, maar homozygoot bruin geeft donkerdere ogen dan heterozygoot.</p><p>Bij <b>leeuwenbekjes</b> zijn de allelen voor rood en wit even sterk. Een heterozygote plant krijgt <b>roze</b> bloemen: een tussenvorm. Zo’n tussenvorm heet een <b>intermediair fenotype</b>.</p><p>Omdat er geen ‘sterke’ of ‘zwakke’ letter is, schrijf je het anders: rood = ${al('AR')}${al('AR')}, wit = ${al('AW')}${al('AW')}, roze = ${al('AR')}${al('AW')}.</p><p>Twee roze planten met elkaar:</p>${kruisTabel(['AR','AW'],['AR','AW'])}<p>Uitkomst: rood : roze : wit = <b>1 : 2 : 1</b>.</p>`,['Wat is het genotype van een roze leeuwenbekje?','AᴿAᵂ (heterozygoot)','AᴿAᴿ|AᵂAᵂ|Aa','Roze is de tussenvorm: één allel voor rood en één voor wit. AᴿAᴿ is rood, AᵂAᵂ is wit, en Aa gebruik je alleen als één allel dominant is.']],
 ['Codominant',`<p>Bij <b>codominantie</b> komen <b>beide allelen volledig</b> tot uiting. Bij Holsteiner runderen geeft een allel voor een witte vacht samen met een allel voor een zwarte vacht een <b>zwart-wit gevlekte</b> vacht (geen grijs).</p><table class="gt"><tr><th>intermediair</th><td>een <b>mengvorm</b> (rood + wit = roze)</td></tr><tr><th>codominant</th><td>beide <b>naast elkaar</b> (zwarte én witte vlekken)</td></tr></table><p>Welk allel dominant is, verschilt <b>per soort</b>: bij erwten is rood dominant over wit (heterozygoot = rood), bij leeuwenbekjes is heterozygoot roze.</p>`,['Een kalf heeft zwarte en witte vlekken, geen grijs. Hoe erft de vachtkleur over?','codominant','intermediair|recessief|X-chromosomaal','Bij intermediair zou het kalf een mengkleur (grijs) krijgen. Hier komen beide allelen volledig tot uiting naast elkaar: codominant.']],
 ['Recombinatie bij de meiose',`<p><b>Recombinatie</b> = het herverdelen van erfelijke eigenschappen, zodat nakomelingen een andere combinatie van allelen krijgen dan hun ouders. Dat gebeurt door de <b>meiose</b> en de <b>geslachtelijke voortplanting</b>.</p><p>In <b>meiose I</b> gaan de chromosomen van elk paar uit elkaar en worden <b>willekeurig</b> over de dochtercellen verdeeld. Elke geslachtscel krijgt zo een andere mix.</p><p>Aantal mogelijke combinaties = <b>2<sup>n</sup></b> (n = aantal chromosomenparen).</p><ul><li>3 paar (2n = 6): 2³ = <b>8</b></li><li>mens, 23 paar: 2²³ ≈ <b>8,4 miljoen</b></li></ul><p>Lichaamscel = <b>diploïd</b> (2n, in paren), geslachtscel = <b>haploïd</b> (n, één van elk paar).</p>`,['Een fruitvlieg heeft 8 chromosomen in een lichaamscel. Hoeveel verschillende geslachtscellen kan hij maken?','16','8|4|256','2n = 8, dus n = 4 paren. 2⁴ = 16. 8 is het aantal chromosomen, 4 het aantal paren.']],
 ['Bevruchting: weer nieuwe combinaties',`<p>Welke eicel en zaadcel samen een nieuw individu worden, is <b>toeval</b>. Bij de bevruchting ontstaat weer een diploïde cel, de <b>zygote</b>, met allelen van beide ouders: nieuwe genenparen.</p><table class="gt"><tr><th>geslachtelijk</th><td>Aa × Aa kan AA, Aa of aa geven: <b>variatie</b></td></tr><tr><th>ongeslachtelijk</th><td>Aa geeft alleen Aa: <b>geen variatie</b></td></tr></table><p>Daarom verschillen broers en zussen (bijna) altijd van genotype.</p>${VB('tomaten veredelen','Een veredelaar maakt eerst ouderrassen die homozygoot zijn, door planten steeds met zichzelf te bestuiven (zelfbestuiving is ook geslachtelijk: er versmelten geslachtscellen). Twee homozygote rassen kruisen geeft heterozygote F1-hybriden met grote vruchten. Die vermeerder je liever ongeslachtelijk, want dan blijft het genotype gelijk.')}`,['Waarom verschillen broers en zussen van dezelfde ouders van elkaar?','elk kind komt uit een andere eicel en zaadcel met een andere mix van allelen','ze krijgen allemaal een mutatie|hun milieu is anders, het genotype is gelijk|alleen de vader geeft allelen door','Door recombinatie bij de meiose en het toeval bij de bevruchting krijgt elk kind een ander genotype. Mutaties zijn zeldzaam, en beide ouders geven allelen door.']],
 ['Genetische variatie en mutatie',`<p>Door recombinatie ontstaat binnen een soort een grote verscheidenheid aan genotypen: <b>genetische variatie</b>.</p><p>Waarom is dat goed? Verandert het milieu, dan is de kans groot dat een paar individuen een genotype hebben dat bij de nieuwe omstandigheden past. De soort heeft zo een grotere <b>overlevingskans</b>.</p><p>Genetische variatie ontstaat ook door <b>mutaties</b>: veranderingen in het DNA, dus in erfelijke eigenschappen.</p>`,['Waardoor ontstaat genetische variatie?','door recombinatie en mutaties','alleen door modificaties|door ongeslachtelijke voortplanting|alleen door milieufactoren','Modificaties en milieufactoren veranderen het DNA niet. Ongeslachtelijke voortplanting geeft juist geen variatie.']],
 ['Eeneiig en twee-eiig',`<table class="gt"><tr><th>eeneiige tweeling</th><td>één eicel + één zaadcel. Het klompje cellen uit de zygote splitst in tweeën. <b>Zelfde genotype</b>, dus ook altijd hetzelfde geslacht.</td></tr><tr><th>twee-eiige tweeling</th><td>twee eicellen + twee zaadcellen. <b>Verschillend genotype</b>; ze lijken net zoveel op elkaar als gewone broers en zussen en kunnen een jongen en een meisje zijn.</td></tr></table>`,['Xander en Ilona zijn een tweeling. Wat voor tweeling zijn ze?','twee-eiig','eeneiig|dat kun je niet weten|eeneiig, want ze zijn even oud','Een jongen (XY) en een meisje (XX) hebben een verschillend genotype, dus twee-eiig. Elke tweeling is even oud, dat zegt niets.']]]},

{id:'3.3',t:'Monohybride kruisingen',kort:'Kruisingsschema, verhoudingen, testkruising en stambomen',ic:'🐇',lp:[
 ['Monohybride: P, F1 en F2',`<p>Bij een <b>monohybride kruising</b> let je op <b>één eigenschap</b>, waarbij <b>één allelenpaar</b> betrokken is. (In het echt werken bij veel eigenschappen meerdere genen samen, zoals bij huidskleur.)</p><table class="gt"><tr><th>P</th><td>de ouders (Parentes)</td></tr><tr><th>F1</th><td>de eerste generatie nakomelingen (Filii = kinderen)</td></tr><tr><th>F2</th><td>de tweede generatie: F1 × F1. Bij planten kan dat ook door <b>zelfbestuiving</b>: stuifmeel komt op de stempels van dezelfde plant.</td></tr></table>`,['Hoe ontstaat de F2?','door F1-individuen onderling te kruisen','door de P opnieuw te kruisen|door een F1 met een P te kruisen|de F2 zijn de grootouders','De F2 is de tweede generatie nakomelingen: kinderen van de F1. De P is juist de oudergeneratie.']],
 ['Een kruisingsvraagstuk in 3 stappen',`<p>Bij konijnen is staande oren (<b>H</b>) dominant over hangende oren (<b>h</b>). Een moer (♀) die homozygoot staande oren heeft, krijgt jongen van een rammelaar (♂) met hangende oren.</p><ol><li><b>Genotypen van de ouders?</b> ♀ HH × ♂ hh</li><li><b>Welke allelen in de geslachtscellen?</b> Een geslachtscel krijgt één allel: eicellen H, zaadcellen h.</li><li><b>Welke combinaties bij de bevruchting?</b> Zet ze in een kruisingsschema.</li></ol>${kruisTabel(['h'],['H'])}<p>Alle F1-jongen zijn <b>Hh</b>: heterozygoot, met staande oren. Afspraak in dit boek: <b>zaadcellen (♂) links, eicellen (♀) boven</b>.</p>`,['Wat is stap 2 bij een kruisingsvraagstuk?','bepalen welke allelen de geslachtscellen kunnen hebben','de genotypen van de ouders opschrijven|het fenotype van de kinderen tekenen|de verhouding in de F2 uitrekenen','Stap 1 = genotypen ouders, stap 2 = allelen in de geslachtscellen, stap 3 = combinaties bij de bevruchting (het schema). De verhouding lees je daarna af.']],
 ['F1 × F1: het kruisingsschema',`<p>Nu twee F1-konijnen: <b>Hh × Hh</b>. Beide maken geslachtscellen met H <b>of</b> h. Welke eicel door welke zaadcel bevrucht wordt, weet je niet: er zijn 4 mogelijkheden, elk met een kans van <b>¼ = 25%</b>.</p>${kruisTabel(['H','h'],['H','h'])}<ul><li>Genotypen: HH : Hh : hh = <b>1 : 2 : 1</b></li><li>Fenotypen: staande : hangende oren = <b>3 : 1</b> (75% en 25%)</li></ul>`,['Hoe groot is in de F2 de kans op een konijn met genotype Hh?','50%','25%|75%|100%','Hh staat 2 keer in de 4 vakjes: 2/4 = 50%. 25% is de kans op HH of hh, 75% is de kans op staande oren.']],
 ['De drie vaste verhoudingen',`<table class="gt"><tr><th>kruising</th><th>genotypen kinderen</th><th>fenotypen</th></tr><tr><td>AA × aa</td><td>alle Aa</td><td>100% dominant</td></tr><tr><td>Aa × aa</td><td>Aa : aa = 1 : 1</td><td>1 : 1</td></tr><tr><td>Aa × Aa</td><td>AA : Aa : aa = 1 : 2 : 1</td><td>3 : 1</td></tr></table><p>Bij <b>intermediair</b> (roze leeuwenbekjes) zijn de fenotypen bij Aa × Aa ook 1 : 2 : 1, want je ziet elk genotype.</p><p>Rekenen met aantallen: een roze plant geeft door zelfbestuiving 56 zaden. De helft is roze: ½ × 56 = <b>28</b>.</p>`,['Welke verhouding van fenotypen krijg je bij Aa × aa?','1 : 1','3 : 1|1 : 2 : 1|alles dominant','Aa maakt A of a, aa maakt alleen a. Kinderen: Aa en aa, evenveel. 3 : 1 hoort bij Aa × Aa, alles dominant bij AA × aa.']],
 ['Terugrekenen van kinderen naar ouders',`<p>Je kunt ook vanuit de kinderen de ouders vinden. Een groene erwtenplant × een gele erwtenplant geeft 204 groene en 187 gele planten: ongeveer <b>1 : 1</b>.</p><ul><li>1 : 1 krijg je alleen bij <b>heterozygoot × homozygoot recessief</b> (Gg × gg).</li><li>Maar welke ouder heterozygoot is, de groene of de gele, weet je niet. Je kunt hier dus <b>niet</b> zeggen welk allel dominant is.</li></ul><p>Zie je ongeveer 3 : 1, dan waren beide ouders heterozygoot, en is het fenotype dat het vaakst voorkomt dominant.</p>`,['Een kruising geeft 302 nakomelingen met het ene en 98 met het andere fenotype. Welke ouders passen daarbij?','twee heterozygote ouders (Aa × Aa)','Aa × aa|AA × aa|AA × AA','302 : 98 is ongeveer 3 : 1, en dat hoort bij Aa × Aa. Aa × aa geeft 1 : 1, AA × aa en AA × AA geven maar één fenotype.']],
 ['De testkruising',`<p>Een cavia met kort haar (dominant) kan <b>AA of Aa</b> zijn. Om dat uit te zoeken kruis je hem met een cavia die <b>homozygoot recessief</b> is (aa, lang haar): een <b>testkruising</b>.</p><p><b>Als hij AA is:</b></p>${kruisTabel(['a','a'],['A','A'])}<p>Alle jongen kortharig (één fenotype).</p><p><b>Als hij Aa is:</b></p>${kruisTabel(['a','a'],['A','a'])}<p>De helft kortharig, de helft langharig (1 : 1). Alleen bij een heterozygote ouder verschijnt het recessieve fenotype.</p><p>Let op: een testkruising is alleen <b>betrouwbaar met genoeg nakomelingen</b>. Bij een paar jongen speelt toeval een grote rol.</p>`,['Je kruist een konijn met staande oren met een konijn met hangende oren (hh). Er komen ook jongen met hangende oren. Wat was het eerste konijn?','heterozygoot (Hh)','homozygoot dominant (HH)|homozygoot recessief (hh)|dat zegt niets','Een HH-ouder geeft alleen H door, dan hebben alle jongen staande oren. Een jong met hangende oren (hh) moet van beide ouders een h krijgen, dus het eerste konijn is Hh. hh kan niet: dat konijn had zelf hangende oren.']],
 ['Een stamboom lezen',`<p>Een <b>stamboom</b> laat zien hoe een eigenschap in een familie overerft. <b>Man = vierkant, vrouw = cirkel</b>. Een horizontale lijn verbindt een paar, daaronder hangen de kinderen.</p>${figStamboom([{n:'1',s:'v',x:120,y:30},{n:'2',s:'m',x:220,y:30},{n:'3',s:'m',x:100,y:110,a:1},{n:'4',s:'v',x:170,y:110},{n:'5',s:'v',x:240,y:110}],[['1','2']],[[['1','2'],['3','4','5']]],'aandoening')}<p>Redeneren:</p><ol><li>Ouders 1 en 2 zijn gezond, maar zoon 3 heeft de aandoening. Gezonde ouders krijgen een kind met een <b>afwijkend fenotype</b>: dan is de aandoening <b>recessief</b>.</li><li>Zoon 3 is dus <b>aa</b>; hij kreeg van elke ouder een a.</li><li>Ouders 1 en 2 zijn gezond én hebben een a: allebei <b>Aa</b>.</li><li>Dochters 4 en 5 zijn gezond: <b>AA of Aa</b>, dat kun je niet zeker weten.</li></ol>`,['Twee ouders met zwart haar krijgen een kind met blond haar. Wat weet je zeker?','blond is recessief en beide ouders zijn heterozygoot','blond is dominant|een van de ouders is homozygoot|het kind is heterozygoot','Ouders met hetzelfde fenotype en een kind met een afwijkend fenotype: dan zijn beide ouders Aa en het kind aa. Het afwijkende fenotype is dus recessief, en het kind homozygoot.']],
 ['Genotypen in een stamboom invullen',`<p>Vaste aanpak:</p><ul><li>Iedereen met het <b>recessieve fenotype</b> is zeker <b>aa</b>.</li><li>Heeft iemand met het dominante fenotype een ouder of kind met aa, dan heeft hij zeker een a: <b>Aa</b>.</li><li>Kun je dat niet aantonen, dan schrijf je <b>AA of Aa</b>.</li></ul><p>Voorbeeld tongrollen (T dominant): moeder kan niet rollen (tt), vader wel. Hun kinderen rollen allemaal. Dan zijn de kinderen zeker <b>Tt</b> (ze kregen t van hun moeder). Van vader weet je het niet: <b>TT of Tt</b>.</p>`,['Een moeder kan niet tongrollen (tt). Haar zoon kan het wel. Wat is het genotype van de zoon?','Tt','TT|tt|TT of Tt','De zoon rolt, dus hij heeft minstens één T. Van zijn moeder (tt) kreeg hij zeker een t. Dus Tt; TT kan niet.']],
 ['Toeval en kleine aantallen',`<p>Een verhouding als 3 : 1 is een <b>kans per kind</b>. Elk kind is een nieuwe trekking; bij een paar kinderen kan het er heel anders uitzien.</p><p>Voorbeeld: twee ouders hebben drie kinderen, twee rechtshandig en één linkshandig. Mag je zeggen dat rechtshandig dominant is? <b>Nee</b>: je kent de ouders niet en drie kinderen is veel te weinig. Hetzelfde kan ook gebeuren als linkshandig dominant is.</p>${VB('een genetisch consulente','Anouk (25) heeft een vader met de ziekte van Huntington, een erfelijke zenuwziekte die dominant overerft. Als Anouk het allel heeft (Hh) en haar vriend Mark niet (hh), is de kans per kind 50% (Hh × hh = 1 : 1). Een genetisch consulent helpt met zulke vragen.')}`,['Ouders Hh × hh hebben al twee kinderen met Hh. Hoe groot is de kans dat het derde kind Hh is?','50%','25%|0%|100%','Elke bevruchting is opnieuw toeval. Hh × hh geeft per kind steeds Hh : hh = 1 : 1, dus 50%, wat de eerdere kinderen ook waren.']]]},

{id:'3.4',t:'Geslachtschromosomen',kort:'Geslachtsbepaling en X-chromosomale overerving',ic:'🚻',lp:[
 ['Het karyogram als formule',`<p>Je kunt een karyogram kort opschrijven: eerst het aantal chromosomen, dan de geslachtschromosomen.</p><ul><li>man: <b>[46, XY]</b></li><li>vrouw: <b>[46, XX]</b></li></ul><p>Na de meiose zijn de chromosomen <b>enkelvoudig</b>: een geslachtscel heeft van elk paar één chromosoom, dus ook maar <b>één geslachtschromosoom</b>. Geslachtschromosomen zitten dus in lichaamscellen (een paar) én in geslachtscellen (één).</p>`,['Hoeveel geslachtschromosomen zitten er in een zaadcel?','1','2|0|23','Een geslachtscel is haploïd: van elk paar één chromosoom, dus één geslachtschromosoom (X of Y). 23 is het totale aantal chromosomen.']],
 ['De zaadcel bepaalt het geslacht',`${figXY()}<ul><li>Een vrouw (XX) maakt eicellen die <b>altijd een X</b> hebben.</li><li>Een man (XY) maakt zaadcellen met een <b>X of een Y</b>.</li><li>Zaadcel met X + eicel → <b>XX = meisje</b>; zaadcel met Y + eicel → <b>XY = jongen</b>.</li></ul><p>Het geslacht ligt dus vast <b>bij de bevruchting</b>, en het is het geslachtschromosoom in de <b>zaadcel</b> dat het bepaalt.</p>`,['Welke cel bepaalt bij de mens of een kind een jongen of een meisje wordt?','de zaadcel','de eicel|de bevruchte eicel na een paar weken|beide evenveel','De eicel heeft altijd een X, dus die bepaalt niets. De zaadcel brengt een X (meisje) of een Y (jongen) mee, en dat ligt vast bij de bevruchting.']],
 ['Vogels: precies andersom',`<p>Bij de meeste diersoorten bepaalt één chromosomenpaar het geslacht.</p><table class="gt"><tr><th>zoogdieren en fruitvliegen</th><td>vrouwtje XX, mannetje XY</td></tr><tr><th>vogels en enkele vissoorten</th><td><b>mannetje XX, vrouwtje XY</b></td></tr></table><p>Een kip heeft 38 paar autosomen en 1 paar geslachtschromosomen: haan <b>[78, XX]</b>, hen <b>[78, XY]</b>. Bij kippen bepaalt dus de <b>eicel</b> het geslacht.</p><p>Bij bijen werkt het nog anders: mannetjes (darren) komen uit onbevruchte eicellen, vrouwtjes uit bevruchte. Daar zijn geen geslachtschromosomen nodig.</p>`,['Bij kippen: welke geslachtscel bepaalt het geslacht?','de eicel','de zaadcel|beide|geen van beide, de temperatuur','De hen is XY en maakt eicellen met X of Y. De haan (XX) maakt alleen zaadcellen met X, die bepalen dus niets.']],
 ['X-chromosomale genen',`<p>Ook in geslachtschromosomen liggen genen. Het Y-chromosoom is veel korter en heeft veel minder genen. Een gen dat alleen op het X-chromosoom ligt en <b>geen allel op het Y-chromosoom</b> heeft, heet <b>X-chromosomaal</b>.</p><p>Notatie: dominant ${al('XA')}, recessief ${al('Xa')}.</p><table class="gt"><tr><th>vrouw</th><td>${al('XA')}${al('XA')} of ${al('Xa')}${al('Xa')} (homozygoot) of ${al('XA')}${al('Xa')} (heterozygoot)</td></tr><tr><th>man</th><td>${al('XA')}Y of ${al('Xa')}Y</td></tr></table><p>Een man heeft maar één X, dus homozygoot of heterozygoot bestaat bij hem <b>niet</b>. Eén recessief X-allel komt bij een man altijd tot uiting.</p>`,['Rood-groenkleurenblindheid is X-chromosomaal recessief (b). Wat is het genotype van een kleurenblinde man?','XᵇY','XᵇXᵇ|bb|XᴮY','Een man heeft één X en een Y. Kleurenblind = het recessieve allel op zijn X: XᵇY. XᵇXᵇ is een vrouw, bb vergeet de X en Y, XᴮY is een man met normaal zicht.']],
 ['Draagster: waarom vooral jongens?',`<p>Een vrouw die heterozygoot is (${al('XA')}${al('Xa')}) heeft een recessieve X-chromosomale eigenschap niet zelf, maar kan hem wel doorgeven: ze is <b>draagster</b>.</p><ul><li>Een <b>jongen</b> heeft één X: één recessief allel is genoeg.</li><li>Een <b>meisje</b> moet het recessieve allel op <b>beide</b> X-chromosomen hebben; met één is ze draagster. Die kans is veel kleiner.</li></ul><p>Daarom komen X-chromosomale aandoeningen, zoals kleurenblindheid, <b>vaker bij mannen</b> voor.</p>`,['Waarom zijn veel meer jongens dan meisjes kleurenblind?','jongens hebben één X, daarop is één recessief allel genoeg','jongens hebben twee X-chromosomen|het allel ligt op het Y-chromosoom|meisjes kunnen het allel niet krijgen','Meisjes kunnen het allel wel krijgen, maar met één zijn ze alleen draagster. Het gen ligt op de X, niet op de Y, en jongens hebben maar één X.']],
 ['Morgans fruitvliegen: de F1',`<p>Thomas Morgan kruiste in 1910 een vrouwtjesfruitvlieg met rode ogen met een mannetje met witte ogen. Rode ogen (${al('XA')}) zijn dominant over witte (${al('Xa')}).</p><p>P: ♀ ${al('XA')}${al('XA')} × ♂ ${al('Xa')}Y. Geslachtscellen: ${al('XA')} × ${al('Xa')} of Y.</p>${kruisTabel(['Xa','Y'],['XA'])}<p>F1: vrouwtjes ${al('XA')}${al('Xa')} (rode ogen, draagster) en mannetjes ${al('XA')}Y (rode ogen). <b>Alle F1 rode ogen.</b></p>`,['Van wie krijgt een zoon zijn X-chromosoom?','van zijn moeder','van zijn vader|van allebei|van niemand, hij heeft geen X','Een zoon krijgt de Y van zijn vader (anders was hij een meisje), dus zijn X komt altijd van zijn moeder.']],
 ['Morgans fruitvliegen: de F2',`<p>F1 × F1: ${al('XA')}${al('Xa')} × ${al('XA')}Y. Geslachtscellen: ${al('XA')} of ${al('Xa')} × ${al('XA')} of Y.</p>${kruisTabel(['XA','Y'],['XA','Xa'])}<ul><li><b>50%</b> vrouwtjes met rode ogen</li><li><b>25%</b> mannetjes met rode ogen</li><li><b>25%</b> mannetjes met witte ogen</li></ul><p>Rood : wit = 3 : 1, maar <b>alle witte vliegen zijn mannetjes</b>. Herkenning: komt na een kruising met veel nakomelingen een fenotype wel bij de mannetjes voor en niet bij de vrouwtjes, dan is er een <b>X-chromosomaal</b> gen in het spel.</p>`,['Hoeveel procent van alle F2-vliegen is een vrouwtje met witte ogen?','0%','25%|50%|12,5%','Alle vrouwtjes krijgen de Xᴬ van hun vader (XᴬY), dus ze hebben allemaal rode ogen. De 25% met witte ogen zijn allemaal mannetjes.']],
 ['Rekenen met draagsters',`<p>Kleurenblindheid: ${al('XB')} = normaal, ${al('Xb')} = kleurenblind.</p><p>Een kleurenblinde man (${al('Xb')}Y) en een vrouw die draagster is (${al('XB')}${al('Xb')}):</p>${kruisTabel(['Xb','Y'],['XB','Xb'])}<ul><li>Zonen: ${al('XB')}Y of ${al('Xb')}Y → kans dat een zoon kleurenblind is: <b>50%</b>.</li><li>Dochters: ${al('XB')}${al('Xb')} (draagster) of ${al('Xb')}${al('Xb')} (kleurenblind).</li></ul><p>Is de moeder ${al('XB')}${al('XB')}, dan is de kans voor een zoon <b>0%</b>: hij krijgt de Y van zijn vader en een ${al('XB')} van zijn moeder.</p>`,['Een kleurenblinde man (XᵇY) krijgt een zoon met een vrouw XᴮXᴮ. Hoe groot is de kans dat de zoon kleurenblind is?','0%','50%|100%|25%','De zoon krijgt de Y van zijn vader en een Xᴮ van zijn moeder: XᴮY, normaal zicht. Het allel van de vader gaat alleen naar dochters.']],
 ['X-chromosomaal in een stamboom',`<p>Regels die je in een stamboom gebruikt:</p><ul><li>Een moeder geeft één van haar twee X-chromosomen door aan een zoon. Zonen erven een X-chromosomale afwijking dus <b>altijd van hun moeder</b>.</li><li>Een vader geeft zijn X aan <b>al zijn dochters</b> en nooit aan zijn zonen.</li><li>Een zieke vader (${al('Xa')}Y) krijgt dus gezonde zonen en dochters die (minstens) draagster zijn.</li><li>De aandoening komt <b>vaker bij mannen</b> voor.</li></ul>${VB('de koninklijke ziekte','Hemofilie (bloed stolt slecht) is X-chromosomaal recessief. Koningin Victoria was draagster (Xᴴ Xʰ), waarschijnlijk door een mutatie in een geslachtscel van haar vader. Via haar dochters kwam het allel in koningshuizen in heel Europa. Haar achterkleinzoon Alexej van Rusland had hemofilie: de kans dat het allel van Victoria via kleindochter Alix bij hem kwam was ½ × ½ × ½ = 1/8.')}`,['Een vader heeft een X-chromosomale recessieve aandoening, de moeder is homozygoot gezond. Wat geldt voor hun dochters?','ze zijn allemaal draagster','ze hebben allemaal de aandoening|ze zijn allemaal homozygoot gezond|de helft is draagster','Elke dochter krijgt de Xᵃ van haar vader en een Xᴬ van haar moeder: XᴬXᵃ, draagster. Ziek zijn kan niet, want ze heeft ook een Xᴬ.']]]},

{id:'3.5',t:'Speciale manieren van overerven',kort:'Bloedgroepen, letale factoren en gekoppelde genen',ic:'🩸',lp:[
 ['Multipele allelen: bloedgroepen',`<p>Tot nu toe had een gen twee allelen. Bij <b>multipele allelen</b> zijn er <b>drie of meer</b> allelen voor één eigenschap. Een lichaamscel heeft er nog steeds maar <b>twee</b>.</p><p>De <b>ABO-bloedgroep</b>: één gen met drie allelen. ${al('IA')} en ${al('IB')} zijn dominant over <b>i</b>.</p><table class="gt"><tr><th>genotype</th><th>bloedgroep</th></tr><tr><td>${al('IA')}${al('IA')} of ${al('IA')}i</td><td>A</td></tr><tr><td>${al('IB')}${al('IB')} of ${al('IB')}i</td><td>B</td></tr><tr><td>${al('IA')}${al('IB')}</td><td>AB</td></tr><tr><td>ii</td><td>0</td></tr></table>`,['Welke bloedgroep hoort bij het genotype Iᴮi?','B','0|AB|A','Iᴮ is dominant over i, dus bloedgroep B. Voor 0 heb je ii nodig, voor AB IᴬIᴮ.']],
 ['Codominant bij bloedgroep AB',`<p>${al('IA')} en ${al('IB')} erven <b>codominant</b> over: bij ${al('IA')}${al('IB')} komen ze <b>allebei volledig</b> tot uiting. Bloed met groep AB heeft de eigenschap van A én van B.</p><table class="gt"><tr><th>codominant</th><td>beide allelen volledig naast elkaar (bloedgroep AB, gevlekt rund)</td></tr><tr><th>intermediair</th><td>een mengvorm/tussenvorm (roze leeuwenbekje)</td></tr></table><p>Door multipele allelen zijn er meer fenotypen mogelijk: bij bloedgroepen vier (A, B, AB en 0).</p>`,['Hoe erven de allelen Iᴬ en Iᴮ ten opzichte van elkaar over?','codominant','intermediair|Iᴬ is dominant over Iᴮ|recessief','Bij AB zie je beide eigenschappen volledig: codominant. Er is geen mengvorm (intermediair) en geen van beide wint.']],
 ['Kruisen met bloedgroepen',`<p>Een vrouw met bloedgroep 0 (ii) en een man met bloedgroep AB (${al('IA')}${al('IB')}). Geslachtscellen: i × ${al('IA')} of ${al('IB')}.</p>${kruisTabel(['IA','IB'],['i'])}<p>Kinderen: ${al('IA')}i (A) of ${al('IB')}i (B). De kans op AB of 0 is <b>0%</b>.</p><p>Twee ouders met AB:</p>${kruisTabel(['IA','IB'],['IA','IB'])}<p>A : AB : B = <b>1 : 2 : 1</b>; bloedgroep 0 kan niet.</p>`,['Een vrouw met bloedgroep 0 en een man met AB krijgen een kind. Hoe groot is de kans op bloedgroep AB?','0%','25%|50%|100%','De moeder geeft altijd i. Het kind krijgt dus Iᴬi (A) of Iᴮi (B), nooit IᴬIᴮ.']],
 ['Bloedgroepen in een stamboom',`<p>Een moeder met bloedgroep A en een vader met bloedgroep B hebben een dochter met A en een zoon met B.</p><ul><li>De dochter heeft A: ze kreeg ${al('IA')} van moeder en <b>i</b> van vader (een ${al('IB')} had AB gegeven). Vader is dus <b>${al('IB')}i</b>.</li><li>De zoon heeft B: ${al('IB')} van vader en <b>i</b> van moeder. Moeder is dus <b>${al('IA')}i</b>.</li></ul>${kruisTabel(['IB','i'],['IA','i'])}<p>Kan een volgend kind bloedgroep 0 krijgen? Ja: ii, kans <b>¼ = 25%</b>.</p>`,['Ouders hebben allebei bloedgroep A en krijgen een kind met bloedgroep 0. Wat zijn de genotypen van de ouders?','allebei Iᴬi','allebei IᴬIᴬ|IᴬIᴬ en Iᴬi|ii en Iᴬi','Het kind is ii en kreeg van elke ouder een i. Met bloedgroep A hebben de ouders ook een Iᴬ: allebei Iᴬi. Een ouder met ii heeft zelf bloedgroep 0.']],
 ['Letale factoren',`<p>Een <b>letale factor</b> is een allel waarmee een individu <b>niet levensvatbaar</b> is als het genenpaar uit twee van die allelen bestaat (homozygoot). Zo’n zygote sterft snel; een deel van de verwachte nakomelingen wordt dus niet geboren.</p><p>Voorbeeld <b>manxkat</b>: korte staart (M) is dominant over een normale staart (m), en <b>MM sterft</b> al als embryo. Een manxkat met korte staart is dus altijd <b>Mm</b>.</p>${kruisTabel(['M','m'],['M','m'],(a,b)=>a==='M'&&b==='M')}<p>Het gekleurde vakje (MM) wordt niet geboren en tel je <b>niet mee</b>. Over: Mm : mm = 2 : 1, dus korte staart : normale staart = <b>2 : 1</b> (67% en 33%) in plaats van 3 : 1.</p>`,['Twee manxkatten met een korte staart krijgen jongen. Welke verhouding korte staart : normale staart verwacht je?','2 : 1','3 : 1|1 : 1|1 : 2 : 1','Mm × Mm geeft 1 MM : 2 Mm : 1 mm, maar MM wordt niet geboren. Er blijven 2 Mm (kort) op 1 mm (normaal) over.']],
 ['Rekenen met een letale factor',`<p>Herken een letale factor aan de verhouding: twee heterozygote ouders geven <b>2 : 1</b> in plaats van 3 : 1.</p><p>Voorbeeld muizen: twee heterozygote gele muizen geven 115 gele en 59 agouti muizen. 115 : 59 ≈ 2 : 1, dus RR is niet levensvatbaar.</p><p>Achondroplasie (een vorm van dwerggroei) erft autosomaal dominant over en is letaal als het embryo homozygoot is. Twee ouders met achondroplasie (Aa × Aa): AA sterft, Aa : aa = 2 : 1. De kans dat een kind <b>geen</b> achondroplasie heeft is dus <b>⅓ ≈ 33%</b> (niet 25%).</p>`,['Twee ouders met achondroplasie (Aa, AA is letaal) krijgen een kind. Hoe groot is de kans dat het kind geen achondroplasie heeft?','⅓ (ongeveer 33%)','¼ (25%)|½ (50%)|0%','Van de vier vakjes valt AA af. Van de drie die geboren worden is er één aa: ⅓. 25% zou kloppen als AA wél geboren werd.']],
 ['Gekoppelde genen',`<p>Tot nu toe lag elk genenpaar in een ander chromosomenpaar: <b>onafhankelijke overerving</b>.</p><p>Liggen twee genen op <b>hetzelfde chromosoom</b>, dan heten ze <b>gekoppelde genen</b>. Een geslachtscel krijgt een heel chromosoom, dus de allelen die samen op één chromosoom liggen gaan <b>samen</b> naar dezelfde geslachtscel: <b>gekoppelde overerving</b>.</p><p>Notatie: elk chromosoom schrijf je als één regel, met een (dubbele) streep ertussen:</p><table class="gt"><tr><th>homozygoot dominant</th><td>GN/GN</td></tr><tr><th>heterozygoot</th><td>GN/gn</td></tr><tr><th>homozygoot recessief</th><td>gn/gn</td></tr></table><p>Een geslachtscel krijgt één regel: GN <b>of</b> gn (niet Gn of gN).</p>`,['Welke geslachtscellen maakt een individu met GN/gn (gekoppeld)?','GN of gn','GN, Gn, gN of gn|alleen GN|Gg of Nn','G en N liggen samen op één chromosoom, g en n op het andere. Een geslachtscel krijgt één heel chromosoom. Vier soorten (GN, Gn, gN, gn) krijg je alleen bij onafhankelijke overerving.']],
 ['Voorbeeld: gekoppeld bij fruitvliegen',`<p>Grijs lichaam (G) is dominant over zwart (g), normale vleugels (N) over vleugelstompjes (n). Beide genen liggen in hetzelfde chromosomenpaar.</p><ol><li>P: grijs met normale vleugels, homozygoot (GN/GN) × zwart met stompjes (gn/gn). Geslachtscellen GN × gn.</li><li>F1: <b>GN/gn</b>, grijs met normale vleugels.</li><li>Een F1-vrouwtje × een zwart mannetje met stompjes: GN/gn × gn/gn.</li></ol><table class="kt"><tr><th class="hoek">♂ \\ ♀</th><th>GN</th><th>gn</th></tr><tr><th>gn</th><td>GN/gn</td><td>gn/gn</td></tr><tr><th>gn</th><td>GN/gn</td><td>gn/gn</td></tr></table><p>Uitkomst: <b>50% grijs met normale vleugels, 50% zwart met stompjes</b>. Grijs met stompjes en zwart met normale vleugels komen niet voor. Bij onafhankelijke overerving had je alle vier de combinaties gekregen (1 : 1 : 1 : 1).</p>`,['GN/gn × gn/gn (gekoppeld). Hoeveel procent van de nakomelingen is grijs met vleugelstompjes?','0%','25%|50%|75%','Het vrouwtje maakt alleen GN of gn, het mannetje alleen gn. Een G komt dus altijd samen met een N: grijs met stompjes kan niet. 25% zou kloppen bij onafhankelijke overerving.']],
 ['Gekoppeld herkennen (en een valkuil)',`<p>Gekoppelde genen geven verhoudingen <b>zoals bij een monohybride kruising</b>, en <b>niet alle combinaties</b> van eigenschappen komen voor. Ontbreken bij veel nakomelingen combinaties die je bij onafhankelijke overerving wel zou zien? Dan zijn de genen gekoppeld.</p><p>Valkuil: het dominante allel van het ene gen kan ook aan het <b>recessieve</b> allel van het andere vastzitten. Konijnen: langharig (A) en hangende oren (b) op één chromosoom, kortharig (a) en rechte oren (B) op het andere. P: Ab/Ab × aB/aB, F1: Ab/aB.</p><table class="kt"><tr><th class="hoek">♂ \\ ♀</th><th>Ab</th><th>aB</th></tr><tr><th>Ab</th><td>Ab/Ab</td><td>Ab/aB</td></tr><tr><th>aB</th><td>Ab/aB</td><td>aB/aB</td></tr></table><p>F2: langharig-recht : langharig-hangend : kortharig-recht = <b>2 : 1 : 1</b>. Kortharig met hangende oren komt niet voor.</p>${VB('een stamceltransplantatie','Derek heeft leukemie en heeft misschien stamcellen van een donor nodig. Daarvoor moeten de bloedgroep en de HLA-eiwitten op zijn cellen overeenkomen. De HLA-genen liggen gekoppeld op chromosoom 6 en hebben elk honderden allelen. Broer Liam heeft maar 25% kans dat hij van beide ouders hetzelfde chromosoom 6 kreeg als Derek.')}`,['Een plant met gele bloemen en pijlvormige bladeren wordt gekruist met een witte plant met ovale bladeren. In de F2 komen alleen geel-pijlvormig (28) en wit-ovaal (11) voor. Wat concludeer je?','de genen zijn gekoppeld','de genen erven onafhankelijk over|er is een letale factor|de genen liggen op het Y-chromosoom','Alleen de combinaties van de ouders komen terug, ongeveer 3 : 1, zoals bij een monohybride kruising. Bij onafhankelijke overerving zou je ook geel-ovaal en wit-pijlvormig zien. Een letale factor geeft 2 : 1.']]]},

{id:'3.6',t:'Opvoeding of aanleg',kort:'Nature, nurture, tweelingen en genexpressie',ic:'👯',lp:[
 ['Nature en nurture',`<p>Is iets aangeboren of aangeleerd? Meestal een <b>combinatie</b>: <b>fenotype = genotype + milieufactoren</b>.</p><ul><li><b>Nature</b> = aanleg = het <b>genotype</b>.</li><li><b>Nurture</b> = opvoeding = het <b>milieu</b>.</li></ul><table class="gt"><tr><th>bijna alleen genotype</th><td>bloedgroep</td></tr><tr><th>(vrijwel) alleen milieu</th><td>een litteken, de lengte van je nagels</td></tr><tr><th>allebei</th><td>de meeste eigenschappen</td></tr></table><p>Je genotype ligt vast <b>bij de bevruchting</b>.</p>`,['Welke termen gebruikt de genetica voor nature en nurture?','genotype en milieu','fenotype en genotype|dominant en recessief|eeneiig en twee-eiig','Nature = aanleg = genotype, nurture = opvoeding = milieu(factoren). Het fenotype is juist de uitkomst van die twee samen.']],
 ['Het genotype zet de grenzen',`<p>Bij veel eigenschappen legt het genotype de <b>uiterste grenzen</b> vast, en bepaalt het milieu <b>hoe dicht je bij die grens</b> komt.</p><p>Voorbeeld: je genotype maakt een lengte van hooguit 1,80 m mogelijk. Met goede voeding en genoeg slaap haal je dat. Krijg je tijdens de groei te weinig eten, te weinig slaap, zwaar werk of een lange ziekte, dan word je kleiner.</p><p>Hetzelfde genotype geeft dus geen vast fenotype, maar een <b>reeks mogelijke fenotypen</b>, afhankelijk van het milieu.</p>`,['Kun je door goed te eten langer worden dan je genotype toelaat?','nee, het genotype legt de bovengrens vast','ja, voeding verandert je genotype|ja, als je maar genoeg slaapt|nee, want lengte hangt alleen van het milieu af','Het milieu bepaalt hoe dicht je bij de grens komt, niet de grens zelf. Voeding verandert je DNA niet, en lengte hangt van genotype én milieu af.']],
 ['Waarom tweelingen?',`<p>Psychologen en onderwijskundigen willen weten hoe groot het aandeel van aanleg en opvoeding is, bijvoorbeeld bij schoolprestaties. Bij planten en dieren kun je dat met experimenten uitzoeken, maar <b>met mensen mag je geen experimenten doen</b>.</p><p>Daarom is <b>tweelingenonderzoek</b> zo belangrijk. Bij een tweeling zijn de <b>leeftijd</b> en vaak de <b>omgeving</b> gelijk:</p><ul><li>een <b>eeneiige</b> tweeling heeft <b>hetzelfde genotype</b>;</li><li>een <b>twee-eiige</b> tweeling heeft een <b>verschillend genotype</b> (zoals broers en zussen) en kan van verschillend geslacht zijn.</li></ul>`,['Waarom is aanleg of opvoeding bij mensen lastiger te onderzoeken dan bij dieren?','je mag geen experimenten met mensen doen','mensen hebben geen genotype|mensen hebben geen milieu|bij mensen is alles erfelijk','Bij dieren kun je genotype en milieu zelf kiezen in een experiment. Bij mensen mag dat niet, dus zoek je natuurlijke ‘proefjes’: tweelingen.']],
 ['Tweelingen vergelijken',`<table class="gt"><tr><th>groep</th><th>genotype</th><th>milieu</th><th>verschillen komen door</th></tr><tr><td>twee-eiig, samen opgegroeid</td><td>verschillend</td><td>gelijk</td><td>vooral het <b>genotype</b></td></tr><tr><td>eeneiig, apart opgegroeid (bijv. adoptie)</td><td>gelijk</td><td>verschillend</td><td>het <b>milieu</b></td></tr></table><p>Een <b>Siamese tweeling</b> is een eeneiige tweeling die niet helemaal gesplitst is: hetzelfde genotype.</p><p>Voorbeeld van een onderzoek: is verslaving aan nicotine nature of nurture? Vergelijk eeneiige tweelingen die allebei roken met eeneiige tweelingen van wie er maar één rookt. Is die tweede groep groot, dan speelt het <b>milieu</b> (nurture) een grote rol: ondanks hetzelfde genotype verschillen ze.</p>`,['Je onderzoekt eeneiige tweelingen die apart zijn opgegroeid. Wat kun je daarmee het best onderzoeken?','de invloed van milieufactoren','de invloed van het genotype|of een allel dominant is|hoe het geslacht bepaald wordt','Hun genotype is gelijk; elk verschil komt dus door hun verschillende milieu. Voor de invloed van het genotype vergelijk je juist twee-eiige tweelingen die samen opgroeiden.']],
 ['Genexpressie en het milieu',`<p>Een verhouding na een kruising kan anders uitvallen dan je verwacht, door:</p><ul><li>een <b>letale factor</b>;</li><li><b>X-chromosomale</b> overerving;</li><li><b>milieufactoren</b>: die kunnen een allel bij het ene individu wel en bij het andere (met hetzelfde allelenpaar) niet tot expressie laten komen.</li></ul><p>Milieufactoren beïnvloeden het <b>aan- en uitzetten van allelen</b>. Voorbeelden:</p><ul><li><b>Muizen</b>: de voeding van de moeder tijdens de zwangerschap beïnvloedt de vachtkleur. Gele muizen met hetzelfde genotype worden geel, gevlekt of donker.</li><li><b>Mensen</b>: kinderen die in de <b>Hongerwinter van 1944</b> verwekt zijn, hebben meer kans op overgewicht en diabetes, doordat sommige genen sterker tot expressie komen.</li></ul>`,['Gele muizen met precies hetzelfde genotype hebben een verschillende vachtkleur. Hoe kan dat?','het milieu beïnvloedt de genexpressie','ze hebben verschillende allelen|het is een letale factor|de vachtkleur is X-chromosomaal','Hetzelfde genotype betekent dezelfde allelen. Het verschil komt doordat milieufactoren (bijv. de voeding van de moeder) het allel aan of uit zetten.']],
 ['Eeneiig, en toch steeds verschillender',`<p>Eeneiige tweelingen gaan op latere leeftijd steeds meer verschillen in uiterlijk en gedrag. Hun genotype is gelijk, maar ze staan langer bloot aan verschillende milieufactoren, en daardoor verschilt <b>welke genen tot uiting komen</b>.</p><p>Bij planten zie je dat ook: stekjes van één hortensia hebben hetzelfde genotype, maar kunnen roze, blauw of lila bloeien, afhankelijk van bijvoorbeeld de bodem, licht, temperatuur of water.</p>`,['Waarom gaan eeneiige tweelingen meer verschillen naarmate ze ouder worden?','door verschillende milieufactoren komen bij hen andere genen tot uiting','hun genotype verandert met de jaren|ze krijgen allebei andere chromosomen|eeneiige tweelingen verschillen nooit','Het genotype blijft gelijk. Maar hoe langer ze leven, hoe meer verschillende milieu-invloeden er zijn, en die zetten genen aan of uit.']],
 ['X-inactivatie: de lapjeskat',`<p>Vrouwelijke zoogdieren hebben twee X-chromosomen, mannelijke één. In elke cel van een vrouwtje wordt <b>willekeurig één X uitgeschakeld</b>. Zo ontstaan groepjes cellen waarin de X van de vader actief is, en groepjes waarin de X van de moeder actief is.</p><p>Bij katten ligt een gen voor vachtkleur op het X-chromosoom. Een <b>lapjeskat</b> is <b>heterozygoot</b> (bijv. een allel voor oranje en een voor zwart): in de ene groep cellen werkt het ene allel, in de andere het andere. Zo krijg je vlekken.</p><p>Een kater heeft maar één X en dus één allel voor dit gen: hij kan <b>geen lapjeskat</b> zijn.</p>`,['Waarom zijn lapjeskatten (bijna) altijd poezen?','een kater heeft maar één X, dus maar één allel voor de vachtkleur','katers zijn altijd homozygoot|bij katers is het gen letaal|het gen ligt op het Y-chromosoom','Voor twee kleuren heb je twee verschillende allelen op twee X-chromosomen nodig. Bij een kater bestaat homozygoot of heterozygoot voor X-genen niet; het gen ligt op de X, niet op de Y.']],
 ['Genen en gedrag werken in twee richtingen',`<p>Genexpressie werkt twee kanten op: je genen beïnvloeden wat je doet, en wat je doet (je milieu) beïnvloedt welke genen aanstaan. Daarom bepaalt een allel zelden alleen je fenotype.</p>${VB('zin in zoetigheid','Het FGF21-gen regelt stoffen en hormonen voor de stofwisseling. Mensen met allel A maken daar minder van, hun hersenen zijn minder gevoelig voor suiker en ze hebben meer zin in zoet. Maar veel suiker eten zet de expressie van FGF21 in de lever juist hoger, waardoor de zin in zoet tijdelijk afneemt. Niet iedereen met allel A krijgt dus overgewicht: het milieu telt mee.')}${VB('twin strangers','Niamh vond een dubbelganger zonder familieband. Mensen hebben 99,5% van hun DNA-sequenties gemeen; de verschillen zitten in 0,5%. Een gemeenschappelijke voorouder zoek je met DNA dat je van één ouder krijgt: het Y-chromosoom (van je vader, alleen bij mannen) of het DNA van je mitochondriën (via de eicel van je moeder).')}`,['Iemand heeft een allel dat de kans op overgewicht vergroot. Krijgt hij dan zeker overgewicht?','nee, ook milieufactoren en genexpressie tellen mee','ja, het genotype bepaalt alles|ja, als het allel dominant is|nee, genen hebben geen invloed op het fenotype','Fenotype = genotype + milieu. Een allel geeft aanleg, maar voeding, beweging en genexpressie bepalen mee of het fenotype ontstaat. Genen hebben wel invloed, alleen niet in hun eentje.']]]}
];
