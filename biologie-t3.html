'3.5':[
{t:'Multipele allelen: de bloedgroepen',s:[
['E','Sem, weet jij eigenlijk welke bloedgroep je hebt?'],
['D','Bloedgroep A. Handig om te weten, want als je ooit een bloedtransfusie nodig hebt, moet het bloed passen.'],
['E','Het boek noemt ook hoe vaak elke bloedgroep op de wereld voorkomt. Nul komt het meest voor en AB het minst. Die getallen hoef je niet te leren.'],
['D','Wat je wel moet weten: je bloedgroep is erfelijk. En hij erft op een speciale manier over. Met multipele allelen.'],
['E','Multipele allelen. Wat betekent dat?'],
['D','Tot nu toe hadden we bij een eigenschap steeds twee allelen. Een dominant en een recessief. Bij multipele allelen bestaan er drie of meer verschillende allelen voor één eigenschap.'],
['E','Dus heb ik dan ook drie allelen in elke cel?'],
['D','Nee, en dat is een valkuil. Er bestaan er drie, maar elke lichaamscel heeft er nog steeds maar twee. Eén van je vader en één van je moeder.'],
['E','Oké. En welke drie zijn het bij de bloedgroepen?'],
['D','In het boek schrijf je een hoofdletter I met een kleine letter erboven. Ik zeg het kort: allel A, allel B en de kleine i.'],
['E','En wie is er dominant?'],
['D','Allel A en allel B zijn allebei dominant over de kleine i. Die kleine i is recessief.'],
['E','Maar als je allel A en allel B samen hebt? Wie wint dan?'],
['D','Niemand. Die twee zijn codominant. Ze komen allebei volledig tot uiting. Dan heb je bloedgroep AB.'],
['E','Codominant, dat hadden we eerder. Dat is iets anders dan intermediair, toch?'],
['D','Ja. Bij intermediair krijg je een tussenvorm, zoals rood en wit die samen roze geven. Bij codominant zie je ze allebei helemaal. AB-bloed heeft de eigenschap van A én van B.'],
['E','Laat ik het rijtje opzeggen. Twee keer allel A, of allel A met een kleine i, geeft bloedgroep A.'],
['D','Goed. Twee keer allel B, of allel B met een kleine i, geeft bloedgroep B. Allel A met allel B geeft AB. En twee keer de kleine i geeft bloedgroep nul.'],
['E','Dus wie bloedgroep nul heeft, is altijd homozygoot recessief.'],
['D','Precies. Nu het voorbeeld uit het boek. Een vrouw met bloedgroep nul krijgt kinderen met een man met bloedgroep AB.'],
['E','De vrouw heeft twee keer de kleine i, dus al haar eicellen hebben een kleine i.'],
['D','En de man maakt zaadcellen met allel A of met allel B. Elk de helft.'],
['E','Dan krijgt het kind allel A met een kleine i, dat is bloedgroep A. Of allel B met een kleine i, dat is bloedgroep B.'],
['D','Ja. De kans op A is vijftig procent en de kans op B ook. En de kans op AB?'],
['E','Nul procent. Het kind krijgt van moeder altijd een kleine i, dus nooit A en B tegelijk. En bloedgroep nul kan ook niet, want van vader krijgt het altijd A of B.'],
['D','Mooi. En stel dat vader en moeder allebei AB hebben. Dan krijg je A, AB of B, in de verhouding een staat tot twee staat tot een. Maar nooit nul.'],
['E','Dus bij multipele allelen zijn er meer fenotypen mogelijk, en welke je krijgt hangt af van de genotypen van de ouders.']
],q:[
['Wat zijn multipele allelen?','Drie of meer verschillende allelen voor één eigenschap','Drie of meer allelen in elke lichaamscel|Twee allelen die allebei dominant zijn|Allelen die op verschillende chromosomen liggen','Bij multipele allelen bestaan er drie of meer allelen voor één eigenschap, maar elke lichaamscel heeft er nog steeds maar twee. Twee dominante allelen samen heet codominant; dat is iets anders. Allelen voor één eigenschap liggen op dezelfde plek van homologe chromosomen, niet op verschillende chromosomen.'],
['Iemand heeft het genotype I<sup>A</sup>I<sup>B</sup>. Welke bloedgroep heeft hij?','AB','A|B|0','I<sup>A</sup> en I<sup>B</sup> zijn codominant: ze komen allebei volledig tot uiting, dus bloedgroep AB. Alleen A of alleen B zou betekenen dat één allel dominant is over het andere, en dat is hier niet zo. Bloedgroep 0 heb je alleen met ii.'],
['Een vrouw met bloedgroep 0 (ii) en een man met bloedgroep AB (I<sup>A</sup>I<sup>B</sup>) krijgen een kind. Hoe groot is de kans op bloedgroep AB?','0%','25%|50%|100%','De moeder geeft altijd i door. Het kind is dus I<sup>A</sup>i (A) of I<sup>B</sup>i (B), elk 50%. Voor AB heb je I<sup>A</sup> én I<sup>B</sup> nodig, maar van moeder komt nooit een I<sup>A</sup> of I<sup>B</sup>. Daarom is 25%, 50% en 100% fout; 50% is de kans op A of de kans op B.'],
['Wat is het verschil tussen codominant en intermediair?','Codominant: beide allelen komen volledig tot uiting; intermediair: een tussenvorm','Codominant: een tussenvorm; intermediair: beide allelen volledig|Codominant: één allel wint; intermediair: geen van beide|Er is geen verschil, het zijn twee woorden voor hetzelfde','Bij codominant zie je beide allelen helemaal, zoals AB-bloed met de eigenschap van A én B. Bij intermediair krijg je een mengvorm, zoals roze uit rood en wit. De tweede optie draait het precies om. Als één allel wint, heet dat gewoon dominant. En het zijn echt twee verschillende dingen.']
]},
{t:'Letale factoren: de manxkat',s:[
['E','Sem, ik zag een foto van een kat met bijna geen staart. Een manxkat. Is dat erfelijk?'],
['D','Ja. En die kat is het voorbeeld van een letale factor.'],
['E','Letaal. Dat klinkt dodelijk.'],
['D','Dat is het ook. Een letale factor is een allel dat in homozygote toestand geen levensvatbaar individu oplevert. Heb je twee van die allelen, dan kun je niet leven.'],
['E','En wat gebeurt er dan precies?'],
['D','Als twee geslachtscellen met dezelfde letale factor versmelten, sterft de zygote al snel. Dat kind wordt dus nooit geboren.'],
['E','Hoe zit het bij de manxkat?'],
['D','Een korte staart is dominant over een normale staart. Noem het allel voor de korte staart grote M en voor de normale staart kleine m. Maar twee keer grote M is letaal. Die katjes sterven al heel vroeg als embryo.'],
['E','Dus een manxkat met een korte staart is altijd heterozygoot. Grote M met kleine m.'],
['D','Precies. Een korte staart met twee keer grote M bestaat niet.'],
['E','En als je twee manxkatten met elkaar kruist?'],
['D','Allebei grote M met kleine m. Ze maken geslachtscellen met grote M of kleine m. In het kruisingsschema krijg je vier vakjes: een keer twee grote M, twee keer grote M met kleine m, en een keer twee kleine m.'],
['E','Normaal zou dat drie korte staarten op één normale staart zijn. Drie staat tot een.'],
['D','Ja, maar dat vakje met twee keer grote M streep je door. Ongeveer een kwart van de zygoten sterft voor de geboorte. Die tel je niet mee.'],
['E','Dan blijven er drie vakjes over. Twee met een korte staart en één met een normale staart.'],
['D','Dus twee staat tot een. Ongeveer zevenenzestig procent korte staart en drieëndertig procent normale staart.'],
['E','Dat is de reden dat je bij een letale factor andere verhoudingen krijgt. Een deel van de verwachte nakomelingen wordt gewoon niet geboren.'],
['D','Het boek heeft nog een voorbeeld bij mensen. Achondroplasie, een vorm van dwerggroei. Je kent misschien de acteur Peter Dinklage. Wie hij is hoef je niet te leren.'],
['E','En hoe erft dat over?'],
['D','Autosomaal dominant. En homozygote embryo’s zijn niet levensvatbaar. Dus het werkt net als bij de manxkat.'],
['E','Als een man en een vrouw allebei achondroplasie hebben, zijn ze allebei heterozygoot. De kans dat hun kind het niet heeft is dan...'],
['D','Van de drie vakjes die overblijven is er één homozygoot recessief. Dus een derde. Ongeveer drieëndertig procent.'],
['E','En bij muizen zag ik het ook. Twee heterozygote gele muizen gaven honderdvijftien gele en negenenvijftig donkere jongen.'],
['D','Dat is ongeveer twee staat tot een. Dan weet je: hier speelt een letale factor. Twee keer het allel voor geel is niet levensvatbaar.'],
['E','Mijn ezelsbruggetje: zie je twee staat tot een in plaats van drie staat tot een, denk dan aan een letale factor.']
],q:[
['Wat is een letale factor?','Een allel dat in homozygote toestand geen levensvatbaar individu oplevert','Een allel dat altijd dodelijk is, ook als je het maar één keer hebt|Een allel dat alleen op het X-chromosoom ligt|Een ziekte die je oploopt door milieufactoren','Een letale factor is alleen dodelijk als je het allel twee keer hebt (homozygoot). Een heterozygote manxkat leeft gewoon. Een letale factor kan op een autosoom liggen, zoals bij de manxkat en achondroplasie. En het is erfelijk, dus niet iets wat je door milieufactoren oploopt.'],
['Waarom is een manxkat met een korte staart altijd heterozygoot (Mm)?','Omdat MM in een vroeg embryonaal stadium sterft','Omdat de korte staart recessief is|Omdat mm een korte staart geeft|Omdat katten maar één allel voor de staart hebben','MM is letaal, dus een levende kat met een korte staart moet Mm zijn. De korte staart is juist dominant, niet recessief. Een kat met mm heeft een normale staart. En katten hebben, net als wij, twee allelen per gen.'],
['Twee manxkatten met een korte staart (Mm × Mm) krijgen jongen. Welke verhouding korte staart : normale staart verwacht je bij de geboren katjes?','2 : 1','3 : 1|1 : 2 : 1|1 : 1','Van de vier vakjes valt MM weg, want die katjes sterven voor de geboorte. Er blijven twee keer Mm (korte staart) en één keer mm (normale staart) over: 2 : 1. 3 : 1 zou kloppen zonder letale factor. 1 : 2 : 1 is een verhouding van genotypen inclusief MM. 1 : 1 krijg je bij Mm × mm.'],
['Een man en een vrouw hebben allebei achondroplasie (autosomaal dominant, letaal bij homozygote embryo’s). Hoe groot is de kans dat hun kind géén achondroplasie heeft?','1/3, ongeveer 33%','1/4, 25%|1/2, 50%|2/3, ongeveer 67%','Beide ouders zijn Aa. AA sterft, dus er blijven Aa, Aa en aa over. Eén van de drie is aa: een derde. 25% krijg je als je het weggevallen vakje AA ten onrechte meetelt. 50% hoort bij Aa × aa. Twee derde is juist de kans dat het kind wél achondroplasie heeft.']
]},
{t:'Gekoppelde genen: samen op één chromosoom',s:[
['E','Sem, tot nu toe keken we steeds naar één eigenschap tegelijk. Dat heette een monohybride kruising.'],
['D','Klopt. Maar je kunt ook twee genen tegelijk volgen. Dan is de vraag: waar liggen die twee genen?'],
['E','Hoe bedoel je, waar?'],
['D','Liggen ze in verschillende chromosomenparen, dan heet het onafhankelijke overerving. Liggen ze in hetzelfde chromosomenpaar, dan zijn het gekoppelde genen. Dan heet het gekoppelde overerving.'],
['E','En wat maakt dat uit?'],
['D','Een geslachtscel krijgt van elk chromosomenpaar één heel chromosoom. De allelen die samen op één chromosoom liggen, gaan dus ook samen naar dezelfde geslachtscel.'],
['E','Dus ze blijven als een pakketje bij elkaar.'],
['D','Ja. Het boek laat een lichaamscel zien met allel grote A en grote B samen op het ene chromosoom, en kleine a en kleine b op het andere. Die cel maakt maar twee soorten geslachtscellen: één met grote A en grote B, en één met kleine a en kleine b.'],
['E','Nu het voorbeeld met de fruitvliegjes. Grijs is dominant over zwart, met de letters grote G en kleine g. Normale vleugels zijn dominant over vleugelstompjes, grote N en kleine n.'],
['D','En die twee genen liggen in hetzelfde chromosomenpaar. Een grijs vrouwtje met normale vleugels, homozygoot voor allebei, wordt gekruist met een zwart mannetje met vleugelstompjes.'],
['E','Hoe schrijf je dat op?'],
['D','Als een breuk met een dubbele streep. Elk chromosoom is een regel. Het vrouwtje is G N over G N. Het mannetje is g n over g n, met kleine letters.'],
['E','De eicel krijgt dan G N, en de zaadcel g n. Dus de F1 is G N over g n. Grijs met normale vleugels.'],
['D','Goed. Nu wordt een F1-vrouwtje gekruist met een zwart mannetje met vleugelstompjes. Dat heet een terugkruising.'],
['E','Het F1-vrouwtje maakt twee soorten eicellen: G N, of g n. Het mannetje maakt alleen g n.'],
['D','Dus de jongen zijn G N over g n, of g n over g n. Vijftig procent grijs met normale vleugels, en vijftig procent zwart met vleugelstompjes.'],
['E','En grijs met vleugelstompjes? Of zwart met normale vleugels?'],
['D','Die komen niet voor. Bij onafhankelijke overerving had je alle vier de combinaties wel verwacht.'],
['E','Dus zo herken je gekoppelde overerving: bij heel veel nakomelingen ontbreken combinaties die je anders wel zou verwachten.'],
['D','Precies. De verhoudingen lijken dan op die van een monohybride kruising. Niet alle combinaties van eigenschappen komen voor.'],
['E','Pas wel op met de letters. Bij de konijnen in een opdracht is langharig gekoppeld aan hangende oren, en kortharig aan rechte oren.'],
['D','Dan zit het dominante allel van het ene gen samen met het recessieve allel van het andere gen op één chromosoom. Kijk dus altijd goed welke allelen samen in één ouder zitten.'],
['E','En dan nog de context over een stamceltransplantatie. Derek heeft leukemie, en zijn broer Liam wil donor zijn.'],
['D','Daarvoor moeten de bloedgroep passen en bepaalde eiwitten op de buitenkant van de cellen, de H L A eiwitten. Welke je hebt, hangt af van meerdere gekoppelde genen met heel veel allelen. Het verhaal van Derek hoef je niet te leren.'],
['E','Maar het laat wel mooi zien: gekoppelde genen erven als één pakketje over, dus een broer of zus heeft ongeveer een kans van een op vier om dezelfde chromosomen te hebben.']
],q:[
['Wanneer erven twee genen gekoppeld over?','Als ze in hetzelfde chromosomenpaar liggen','Als ze in verschillende chromosomenparen liggen|Als ze allebei dominant zijn|Als ze op het X-chromosoom liggen en je een jongen bent','Gekoppeld betekent: de genen liggen in hetzelfde chromosomenpaar, dus de allelen op één chromosoom gaan samen naar een geslachtscel. In verschillende chromosomenparen is juist onafhankelijke overerving. Of een allel dominant is, maakt voor koppeling niet uit. En X-chromosomale overerving gaat over het geslacht, niet over koppeling.'],
['Een fruitvlieg is GN/gn. Welke geslachtscellen maakt hij (zonder rekening te houden met andere genen)?','GN en gn','GN, Gn, gN en gn|Alleen GN|Gg en Nn','G en N liggen samen op het ene chromosoom, g en n op het andere. Een geslachtscel krijgt één heel chromosoom, dus GN of gn. Vier soorten (GN, Gn, gN, gn) zou je krijgen bij onafhankelijke overerving. Alleen GN klopt niet, want de vlieg is heterozygoot. Gg en Nn zijn paren van allelen, en een geslachtscel heeft van elk gen maar één allel.'],
['Terugkruising: GN/gn × gn/gn (grijs = G, normale vleugels = N, genen gekoppeld). Welke jongen verwacht je?','50% grijs met normale vleugels, 50% zwart met vleugelstompjes','Alle vier de combinaties, elk 25%|100% grijs met normale vleugels|75% grijs met normale vleugels, 25% zwart met vleugelstompjes','Het vrouwtje geeft GN of gn, het mannetje alleen gn. Dat geeft GN/gn en gn/gn, elk de helft. Alle vier de combinaties krijg je alleen als de genen niet gekoppeld zijn. 100% zou kloppen als het vrouwtje homozygoot GN/GN was. 75 : 25 hoort bij twee heterozygote ouders, niet bij een terugkruising.'],
['Een onderzoeker kruist twee planten en vindt in de F2 bij heel veel nakomelingen alleen de combinaties van de ouders terug. Wat concludeert hij?','De genen zijn gekoppeld','De genen erven onafhankelijk over|Er is sprake van een letale factor|Er zijn multipele allelen','Ontbreken bij grote aantallen de nieuwe combinaties, dan liggen de genen in hetzelfde chromosomenpaar: gekoppeld. Bij onafhankelijke overerving zou je juist ook nieuwe combinaties zien. Een letale factor herken je aan een verhouding van 2 : 1, niet aan ontbrekende combinaties. Multipele allelen gaan over meer dan twee allelen van één gen.']
]}
],
'3.6':[
{t:'Nature of nurture: aanleg en milieu',s:[
['E','Sem, ik vraag me iets af. Ben je goed in leren omdat je het van je ouders hebt, of omdat je het geleerd hebt?'],
['D','Dat is de grote vraag van deze basisstof: opvoeding of aanleg. En er is steeds meer bewijs dat het een combinatie van allebei is.'],
['E','Hoe zit dat in de biologie?'],
['D','Er is een simpele formule. Fenotype is genotype plus milieufactoren. Wat je ziet, komt door je erfelijke informatie en door je omgeving samen.'],
['E','Zijn er ook eigenschappen die alleen door het genotype komen?'],
['D','Bijna alleen, ja. Je bloedgroep bijvoorbeeld. Het milieu heeft daar geen invloed op.'],
['E','En eigenschappen die alleen door het milieu komen?'],
['D','Een litteken. Of de lengte van je nagels. Dat komt vrijwel alleen door wat er met je gebeurt.'],
['E','En de meeste eigenschappen zitten daar tussenin, denk ik.'],
['D','Klopt. Bij veel eigenschappen legt het genotype de uiterste grenzen vast. Het milieu bepaalt hoe dicht je bij die grens komt.'],
['E','Heb je een voorbeeld?'],
['D','Lichaamslengte. Stel dat jouw genotype maximaal een meter tachtig mogelijk maakt. Met de beste omstandigheden haal je dat.'],
['E','En als die omstandigheden niet goed zijn?'],
['D','Bij te weinig eten, weinig slaap, zwaar werk of een lange ziekte terwijl je groeit, haal je die meter tachtig niet.'],
['E','Dus hetzelfde genotype geeft niet altijd hetzelfde fenotype.'],
['D','Nee. Het geeft een hele reeks mogelijke fenotypen. Welke het wordt, hangt af van het milieu.'],
['E','En waar komen die woorden nature en nurture vandaan?'],
['D','Dat is Engels. Nature is de aanleg, dus het genotype. Nurture is de opvoeding, dus het milieu. In de genetica zeggen we gewoon genotype en milieufactoren.'],
['E','Wie willen dat eigenlijk weten?'],
['D','Psychologen, onderwijskundigen en opvoedkundigen bijvoorbeeld. Zij willen weten hoe groot het aandeel van aanleg en van opvoeding is, zoals bij schoolprestaties.'],
['E','Kun je dat niet gewoon uitproberen?'],
['D','Bij planten en dieren kan dat met onderzoek. Maar met mensen mag je geen experimenten doen. Daarom is het bij mensen veel lastiger.'],
['E','En vanaf wanneer ligt jouw genotype eigenlijk vast?'],
['D','Vanaf de bevruchting. Daarna verandert je genotype niet meer, maar je milieu wel, je hele leven lang.'],
['E','In het boek staat er een Engelse uitspraak bij: je ouders gaven je de genen, maar jij kiest hoe je ze draagt. Die hoef je niet te leren, maar hij past er wel goed bij.']
],q:[
['Welke formule hoort bij nature en nurture?','Fenotype = genotype + milieufactoren','Genotype = fenotype + milieufactoren|Milieufactoren = genotype + fenotype|Fenotype = alleen het genotype','Wat je waarneemt (het fenotype) komt door je erfelijke informatie (genotype) én je omgeving (milieufactoren). Het genotype ligt vast bij de bevruchting en wordt niet door het milieu gemaakt, dus de tweede optie draait het om. De derde optie klopt ook niet. En alleen het genotype geldt maar voor een paar eigenschappen, zoals de bloedgroep.'],
['Welke eigenschap wordt (vrijwel) alleen door het milieu bepaald?','Een litteken','Je bloedgroep|Je lichaamslengte|Je geslacht','Een litteken ontstaat door wat er met je gebeurt, dus door het milieu. De bloedgroep is juist bijna alleen genotype. Bij lichaamslengte legt het genotype de grens vast en bepaalt het milieu hoe dicht je erbij komt: allebei dus. Je geslacht wordt bepaald door je geslachtschromosomen, dus door je genotype.'],
['Wat bedoelt het boek met: het genotype legt de uiterste grenzen vast?','Het milieu bepaalt hoe dicht je bij de grens komt die je genotype mogelijk maakt','Je bereikt altijd precies de grens van je genotype|Het milieu kan je verder brengen dan je genotype toelaat|Het genotype verandert als je ouder wordt','Je genotype maakt bijvoorbeeld maximaal 1,80 m mogelijk; met goede omstandigheden haal je dat, met slechte niet. Je haalt de grens dus niet altijd. Het milieu kan je ook niet voorbij de grens brengen. En het genotype ligt vast vanaf de bevruchting, het verandert niet met de leeftijd.'],
['Waarom is de invloed van nature en nurture bij mensen moeilijker te onderzoeken dan bij dieren?','Je mag geen experimenten met mensen doen','Mensen hebben geen genotype|Bij mensen heeft het milieu geen invloed|Mensen hebben meer chromosomen dan dieren','Bij planten en dieren kun je het milieu met een experiment regelen, bij mensen mag dat niet. Daarom gebruikt men tweelingenonderzoek. Mensen hebben natuurlijk wel een genotype. Het milieu heeft bij mensen juist veel invloed. En het aantal chromosomen heeft hier niets mee te maken.']
]},
{t:'Tweelingenonderzoek',s:[
['E','Sem, je zei dat je bij mensen geen experimenten mag doen. Hoe kom je dan toch meer te weten over aanleg en opvoeding?'],
['D','Met tweelingenonderzoek. Dat levert een belangrijke bijdrage.'],
['E','Waarom juist tweelingen?'],
['D','Er zijn twee soorten. Een eeneiige tweeling heeft hetzelfde genotype. Een twee-eiige tweeling heeft verschillende genotypen.'],
['E','En hoeveel lijkt een twee-eiige tweeling op elkaar?'],
['D','Net zoveel als gewone broers en zussen. Een twee-eiige tweeling kan ook een jongen en een meisje zijn.'],
['E','Een eeneiige tweeling dus niet, want die heeft precies hetzelfde genotype.'],
['D','Precies. En nu het slimme deel. Bij allebei de soorten tweelingen zijn de leeftijd en de omgeving gelijk. Ze groeien samen op in hetzelfde gezin.'],
['E','Dus je kunt ze goed vergelijken.'],
['D','Ja. Een eeneiige tweeling die samen opgroeit heeft een gelijk genotype en een gelijk milieu. Een twee-eiige tweeling die samen opgroeit heeft een verschillend genotype, maar een gelijk milieu.'],
['E','Als een twee-eiige tweeling dan toch verschilt, komt dat vooral door het genotype. Want het milieu is hetzelfde.'],
['D','Goed gezien. En dan is er nog een derde groep. Eeneiige tweelingen die van jongs af in verschillende gezinnen opgroeien, bijvoorbeeld door adoptie.'],
['E','Die hebben een gelijk genotype, maar een verschillend milieu.'],
['D','Ja. Als die van elkaar verschillen, zie je de invloed van de milieufactoren op het fenotype.'],
['E','Er staat ook een foto in het boek van een Siamese tweeling, Yigit en Derman. Ze zaten aan hun hoofd aan elkaar vast en zijn door een operatie gescheiden.'],
['D','Een Siamese tweeling is een eeneiige tweeling. Ze hebben dus hetzelfde genotype. Hun namen hoef je niet te leren.'],
['E','En er is een opdracht over roken. Najib wil weten of verslaving aan nicotine door nature of door nurture komt.'],
['D','Hij vergelijkt twee groepen eeneiige tweelingen. In groep één roken ze allebei. In groep twee rookt er één wel en één niet.'],
['E','Als groep twee groot is, dus als veel eeneiige tweelingen verschillen in roken...'],
['D','...dan komt het vooral door nurture. Ze hebben hetzelfde genotype, en toch verschillen ze. Dan moet het milieu het verschil maken.'],
['E','En als bijna alle tweelingen allebei roken of allebei niet roken, wijst dat meer op aanleg.'],
['D','Klopt. Bij de samenhang van dit thema staat trouwens nog een verhaal over dubbelgangers die geen familie van elkaar zijn. Leuk om te lezen, maar dat hoef je hier niet te leren.'],
['E','Even samenvatten. Eeneiig is hetzelfde genotype. Twee-eiig lijkt zoals gewone broers en zussen.'],
['D','En eeneiige tweelingen die apart opgroeien, laten zien wat het milieu doet.'],
['E','Daarom is tweelingenonderzoek zo belangrijk voor de genetica: je krijgt zicht op de invloed van genotype en milieu op het fenotype.']
],q:[
['Wat is het verschil tussen een eeneiige en een twee-eiige tweeling?','Eeneiig: hetzelfde genotype; twee-eiig: verschillende genotypen','Eeneiig: verschillende genotypen; twee-eiig: hetzelfde genotype|Eeneiig: altijd een jongen en een meisje|Twee-eiig: lijken meer op elkaar dan eeneiig','Een eeneiige tweeling heeft hetzelfde genotype, een twee-eiige tweeling niet. De tweede optie draait het om. Een jongen en een meisje kan alleen bij een twee-eiige tweeling, want een eeneiige tweeling heeft hetzelfde genotype en dus hetzelfde geslacht. Een twee-eiige tweeling lijkt net zoveel op elkaar als gewone broers en zussen, dus juist minder dan een eeneiige.'],
['Een twee-eiige tweeling groeit samen op en verschilt toch in fenotype. Waar komt dat vooral door?','Door verschillen in genotype','Door verschillen in milieu|Door een letale factor|Doordat hun genotype na de geboorte verandert','Het milieu is bij een tweeling die samen opgroeit gelijk, en het genotype verschilt. Dus komen de verschillen vooral door het genotype. Een letale factor zou een kind niet levensvatbaar maken en verklaart dit niet. En een genotype verandert na de bevruchting niet meer.'],
['Welke groep laat het best zien wat de invloed van milieufactoren op het fenotype is?','Eeneiige tweelingen die apart opgroeien','Eeneiige tweelingen die samen opgroeien|Twee-eiige tweelingen die samen opgroeien|Gewone broers en zussen die samen opgroeien','Eeneiige tweelingen die apart opgroeien hebben een gelijk genotype en een verschillend milieu, dus verschillen komen door het milieu. Samen opgegroeide eeneiige tweelingen hebben ook een gelijk milieu, dan zie je weinig verschil. Bij twee-eiige tweelingen en gewone broers en zussen verschilt het genotype, dus kun je de invloed van het milieu niet los zien.'],
['Najib vergelijkt eeneiige tweelingen die allebei roken (groep 1) met eeneiige tweelingen van wie er één rookt (groep 2). Wanneer concludeert hij dat nicotineverslaving vooral door nurture komt?','Als groep 2 groot is ten opzichte van groep 1','Als groep 1 groot is ten opzichte van groep 2|Als beide groepen even groot zijn|Dat kan hij met eeneiige tweelingen nooit onderzoeken','In groep 2 verschillen tweelingen met hetzelfde genotype; als dat vaak voorkomt, maakt het milieu het verschil: nurture. Is groep 1 groot, dan doen tweelingen met hetzelfde genotype vaak hetzelfde, en dat wijst juist op aanleg. Even grote groepen geven geen duidelijke conclusie. En eeneiige tweelingen zijn juist geschikt, omdat hun genotype gelijk is.']
]},
{t:'Genexpressie: genen aan en uit',s:[
['E','Sem, soms klopt de uitkomst van een kruising niet met wat je verwacht. Hoe kan dat?'],
['D','Daar zijn een paar redenen voor. Een letale factor, dat hadden we al. Of X-chromosomale overerving.'],
['E','En is er nog een reden?'],
['D','Ja, milieufactoren. Die kunnen ervoor zorgen dat een allel bij het ene individu wel tot uiting komt, en bij een ander met precies hetzelfde allelenpaar niet.'],
['E','Hoe kan een allel nou niet tot uiting komen?'],
['D','Genen kunnen aan- en uitgezet worden. Een gen aanzetten, zodat de eigenschap tot uiting komt, heet genexpressie. Een gen uitzetten heet geninactivatie.'],
['E','En dat aan- en uitzetten wordt beïnvloed door het milieu?'],
['D','Precies. Een voorbeeld uit het boek: muizen. Wat de moeder eet tijdens de zwangerschap, beïnvloedt de vachtkleur van de jongen.'],
['E','Ook als die jongen hetzelfde genotype hebben?'],
['D','Ja. Gele muizen met hetzelfde genotype worden lichter of donkerder. Op de foto zie je er vijf naast elkaar: van helemaal geel, via gevlekt, tot donker.'],
['E','Er is ook een experiment met alcohol, toch?'],
['D','Ja. Vrouwtjesmuizen kregen vóór de bevruchting wel of geen alcohol. Bij de groep met alcohol waren er minder gele jongen en meer bruine.'],
['E','Dus alcohol verlaagde de expressie van het allel voor de gele vacht.'],
['D','Klopt. En alle jongen hadden hetzelfde genotype, want de moeders waren homozygoot donker en de vaders homozygoot geel. Alle jongen waren dus heterozygoot.'],
['E','Werkt het bij mensen ook zo?'],
['D','Ja. Voedseltekort beïnvloedt de genexpressie. Kinderen die tijdens de Hongerwinter van negentien vierenveertig zijn verwekt, hebben meer kans op overgewicht en diabetes.'],
['E','Hoe komt dat?'],
['D','Doordat de expressie van bepaalde genen bij hen verhoogd is.'],
['E','En bij eeneiige tweelingen? Die hebben toch hetzelfde genotype?'],
['D','Zeker. Maar door het milieu worden de verschillen in uiterlijk en gedrag steeds duidelijker naarmate ze ouder worden. Het genotype is gelijk, maar welke genen aan of uit staan, kan verschillen.'],
['E','En wat was een modificatie ook alweer?'],
['D','Een verandering van het fenotype door milieufactoren. Een modificatie is niet erfelijk.'],
['E','Ik las ook iets over lapjeskatten. Die zijn altijd poezen.'],
['D','Een vrouwelijk zoogdier heeft twee X-chromosomen. In elke cel wordt er willekeurig één uitgeschakeld. Ligt er een gen voor de vachtkleur op de X, en zijn de twee allelen verschillend, dan krijg je vlekken van twee kleuren.'],
['E','En een kater heeft maar één X. Dus maar één allel voor die vachtkleur, en geen lapjes.'],
['D','Precies. Er staat ook een context over zin in zoetigheid en een gen dat daarmee te maken heeft. Die hoef je niet te leren, maar hij laat hetzelfde zien.'],
['E','Dus het korte antwoord: genexpressie zet allelen aan en uit, en milieufactoren kunnen daar invloed op hebben.']
],q:[
['Wat is genexpressie?','Het aanzetten van genen, waardoor een eigenschap tot uiting komt','Het uitzetten van genen|Een verandering van het genotype door het milieu|Het doorgeven van genen aan je kinderen','Genexpressie is het aanzetten van genen. Het uitzetten heet geninactivatie. Bij genexpressie verandert het genotype niet: alleen welke genen aan of uit staan. Het doorgeven van genen gebeurt bij de voortplanting, dat heet overerving.'],
['Muizen met hetzelfde genotype voor een gele vacht hebben toch verschillende kleuren. Hoe kan dat?','Milieufactoren, zoals de voeding van de moeder, beïnvloeden de genexpressie','Ze hebben toch een verschillend genotype|Er is sprake van een letale factor|De vachtkleur is een modificatie die erfelijk is','Het genotype is gelijk, maar het milieu (zoals voeding of alcohol bij de moeder) beïnvloedt of het gele allel aan of uit staat. Het genotype is juist gegeven als gelijk. Een letale factor laat jongen sterven en verklaart geen kleurverschillen. En een modificatie is niet erfelijk.'],
['Waarom gaan eeneiige tweelingen meer van elkaar verschillen naarmate ze ouder worden?','Milieufactoren beïnvloeden welke genen aan of uit staan','Hun genotype verandert in de loop van hun leven|Ze zijn eigenlijk twee-eiig|Hun chromosomen worden kleiner','Eeneiige tweelingen houden hun hele leven hetzelfde genotype, maar door verschillende milieufactoren kan de genexpressie gaan verschillen. Het genotype ligt vast vanaf de bevruchting. Een eeneiige tweeling wordt geen twee-eiige tweeling. En het kleiner worden van chromosomen speelt hier geen rol.'],
['Waarom kan een kater geen lapjeskat zijn?','Een kater heeft maar één X-chromosoom, dus maar één allel voor die vachtkleur','Bij katers wordt geen enkel X-chromosoom aangezet|Het gen voor vachtkleur ligt op het Y-chromosoom|Katers zijn altijd homozygoot voor vachtkleur','Lapjes ontstaan doordat in groepjes cellen een andere X actief is, met een ander allel. Een kater heeft maar één X, dus één allel en één kleur. Bij een kater is zijn ene X juist wel actief. Het gen ligt op het X-chromosoom, niet op het Y. En homozygoot of heterozygoot kan een kater voor dit gen niet zijn: hij heeft maar één allel.']
]}
]
