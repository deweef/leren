'3.1':[
{t:'Fenotype, genotype en chromosomen',s:[
['E','Sem, mag ik je iets vragen? Mijn vader en moeder hebben allebei zwart haar. Kan hun kind dan blond worden?'],
['D','Goeie vraag, Lotte. Dat is precies waar dit thema over gaat: genetica.'],
['E','Genetica. Dat klinkt als een laboratorium met witte jassen.'],
['D','Valt mee. Genetica heet ook wel erfelijkheidsleer. Het is de wetenschap die uitzoekt hoe eigenschappen van ouders doorgaan naar hun kinderen. We beginnen bij twee woorden die op elkaar lijken: fenotype en genotype. Het fenotype is alles wat je aan iemand kunt waarnemen.'],
['E','Dus mijn haarkleur, mijn oogkleur, hoe lang ik ben?'],
['D','Ja. Maar ook je lichaamsgeur. En dingen die je pas ziet na onderzoek, zoals je bloedgroep of of je kleurenblind bent. Dat hoort ook bij je fenotype.'],
['E','En het genotype?'],
['D','Het genotype is de informatie voor al je erfelijke eigenschappen. Een soort bouwtekening. Die informatie heet ook wel de genetische informatie of de genetische code.'],
['E','Dus het fenotype is wat je ziet, en het genotype is het recept erachter.'],
['D','Mooi gezegd. En dat recept ligt opgeslagen in je chromosomen.'],
['E','Wanneer krijg je dat genotype eigenlijk?'],
['D','Bij de bevruchting. Een zaadcel van je vader versmelt met een eicel van je moeder. Allebei hebben ze chromosomen. Op dat moment staat jouw genotype vast.'],
['E','Dus de helft van mijn genotype komt van mijn vader en de helft van mijn moeder?'],
['D','Precies, vijftig procent van elk. Daarna groeit die bevruchte eicel uit tot een baby, en dan zie je het fenotype.'],
['E','Vertel eens meer over die chromosomen. Wat zijn dat?'],
['D','Chromosomen zijn lange, dunne draadjes in de celkern. Ze bestaan uit DNA dat om eiwitten heen is gewikkeld. Je kunt ze alleen met een lichtmicroscoop zien als een cel zich aan het delen is.'],
['E','En hoeveel heb ik er?'],
['D','In elke lichaamscel van een mens zitten er zesenveertig. Dat zijn drieëntwintig paren.'],
['E','Paren? Waarom paren?'],
['D','Omdat je van elk paar er één van je vader en één van je moeder hebt. Als je ze op grootte in paren naast elkaar legt, heet dat een karyogram. Een ander woord is chromosomenportret. Bij mannen en vrouwen zijn tweeëntwintig paren gelijk. Die vierenveertig chromosomen heten de autosomen.'],
['E','En de twee chromosomen van één paar, hoe heten die samen?'],
['D','Homologe chromosomen. Ze zijn even lang, hebben dezelfde vorm en bevatten informatie voor dezelfde eigenschappen.'],
['E','En dat drieëntwintigste paar?'],
['D','Dat zijn de geslachtschromosomen. Die bepalen of je een jongen of een meisje bent. Er is een X-chromosoom en een veel kleiner Y-chromosoom. Een vrouw heeft twee X-chromosomen. Een man heeft een X en een Y.'],
['E','Dus bij een man is dat laatste paar niet gelijk.'],
['D','Klopt. Daarom heeft een vrouw drieëntwintig paar homologe chromosomen en een man maar tweeëntwintig. De X en de Y zijn niet homoloog.']
],q:[
['Wat is het fenotype?','Alle waarneembare eigenschappen van een individu','De informatie voor alle erfelijke eigenschappen|Alle chromosomen in een celkern|Alleen de eigenschappen die je van je ouders krijgt','Het fenotype is alles wat je kunt waarnemen, ook met onderzoek, zoals je bloedgroep. De informatie voor erfelijke eigenschappen is het genotype. Chromosomen zijn de dragers van die informatie. En het fenotype bevat ook eigenschappen die niet erfelijk zijn, zoals een litteken.'],
['Hoeveel procent van jouw genotype komt van je vader?','50 procent','25 procent|75 procent|Dat verschilt per persoon','Bij de bevruchting brengt de zaadcel van je vader precies de helft van je chromosomen mee en de eicel van je moeder de andere helft. Dat is bij iedereen zo, dus het verschilt niet per persoon.'],
['Wat zijn homologe chromosomen?','De twee chromosomen van een paar, even lang en met genen voor dezelfde eigenschappen','Twee chromosomen die precies dezelfde allelen hebben|De twee geslachtschromosomen|Alle 44 autosomen samen','Homologe chromosomen horen bij één paar: zelfde lengte en vorm, genen voor dezelfde eigenschappen. De allelen erop kunnen wel verschillen. De X en Y van een man zijn juist níet homoloog. De 44 autosomen zijn 22 paren, niet één paar.'],
['Waarom heeft een man maar 22 paar homologe chromosomen?','Omdat het X- en het Y-chromosoom niet gelijk zijn','Omdat een man één chromosoom minder heeft|Omdat een man geen autosomen heeft|Omdat een man twee Y-chromosomen heeft','Een man heeft ook 46 chromosomen en ook 44 autosomen. Alleen zijn X en Y verschillend van lengte en vorm, dus dat paar telt niet als homoloog. Een man heeft één X en één Y, niet twee Y.']
]},
{t:'DNA, genen en allelen',s:[
['E','Sem, je zei dat chromosomen uit DNA bestaan. Wat is DNA precies?'],
['D','Een chromosoom bevat één heel lang DNA-molecuul, samen met veel eiwitten. Dat DNA-molecuul bestaat uit twee ketens die om elkaar heen gedraaid zijn.'],
['E','Zo’n gedraaide ladder, toch? Dat zie je vaak op plaatjes.'],
['D','Ja, dat heet een dubbele spiraal. Als je hem uitrolt, zie je echt een ladder.'],
['E','En waar is die ladder van gemaakt?'],
['D','Van bouwsteentjes die nucleotiden heten. Eén nucleotide bestaat uit drie delen: een fosfaatgroep, een suiker die desoxyribose heet, en een stikstofbase.'],
['E','Desoxyribose. Daar zit de D van DNA in, denk ik.'],
['D','Klopt helemaal. En die stikstofbasen zijn het belangrijkste. Er zijn er vier: adenine, thymine, cytosine en guanine. Kort gezegd: A, T, C en G.'],
['E','En hoe zitten die in de ladder?'],
['D','Twee basen tegenover elkaar vormen samen een sport van de ladder. Dat heet een basenpaar. En ze passen alleen op een vaste manier: A altijd met T, en C altijd met G.'],
['E','Dus als ik aan de ene kant A, C, G lees, staat er aan de andere kant T, G, C.'],
['D','Precies. Dat heet de vaste basenparing.'],
['E','En wat is dan een gen?'],
['D','Een gen is een stukje van een chromosoom met de informatie voor een erfelijke eigenschap. Of voor een deel van een eigenschap. Bij oogkleur of lichaamslengte werken bijvoorbeeld meerdere genen samen.'],
['E','Hoe groot is zo’n gen?'],
['D','Een gen bestaat uit honderden nucleotiden in een bepaalde volgorde. Die volgorde heet de DNA-sequentie. En op één chromosoom liggen heel veel genen.'],
['E','Maar als iedereen dezelfde genen heeft, waarom heb ik dan zwart haar en mijn nicht blond?'],
['D','Omdat een gen in verschillende varianten kan voorkomen. Zo’n variant heet een allel. Het allel voor zwart haar heeft een iets andere volgorde van basen dan het allel voor blond haar.'],
['E','Dus het gen gaat over haarkleur, en het allel zegt welke kleur.'],
['D','Ja. En op homologe chromosomen ligt het gen voor dezelfde eigenschap op precies dezelfde plek. Daar kunnen twee dezelfde allelen liggen, of twee verschillende.'],
['E','Nog iets wat ik niet snap. Elke cel heeft hetzelfde DNA. Waarom groeit er dan geen haar op mijn lever?'],
['D','Haha, gelukkig niet. Genen kunnen aan en uit staan. Staat een gen aan, dan komt de eigenschap tot uiting. Dat heet genexpressie. Staat een gen uit, dan heet dat geninactivatie.'],
['E','Dus in mijn hoofdhuid staan de haargenen aan, en in mijn lever staan ze uit.'],
['D','Precies. Daarom ziet een spiercel er ook heel anders uit dan een zenuwcel, terwijl ze hetzelfde genotype hebben.'],
['E','En wat is dan het genoom? Dat woord hoor ik ook vaak.'],
['D','Het genoom is al het DNA in een cel. Het meeste zit in de celkern, maar er zit ook DNA in de mitochondriën. En bij planten ook in de bladgroenkorrels.'],
['E','Even op volgorde van groot naar klein dan: genoom, chromosoom, gen, nucleotide, stikstofbase.'],
['D','Helemaal goed, Lotte.']
],q:[
['Waaruit bestaat één nucleotide?','Een fosfaatgroep, desoxyribose en een stikstofbase','Twee stikstofbasen die een paar vormen|Een gen en een allel|Een chromosoom met eiwitten','Een nucleotide is de bouwsteen van DNA: fosfaatgroep plus de suiker desoxyribose plus één stikstofbase. Twee basen tegenover elkaar is een basenpaar, niet een nucleotide. Genen en chromosomen zijn veel grotere stukken DNA.'],
['In een DNA-keten staat aan één kant A C G. Wat staat er tegenover?','T G C','A C G|G T A|C A T','Vaste basenparing: A past altijd bij T en C altijd bij G. Dus A wordt T, C wordt G en G wordt C. A C G zou dezelfde volgorde zijn, en G T A en C A T volgen de regel niet.'],
['Wat is een allel?','Een variant van een gen, met een iets andere volgorde van basen','Een stukje DNA met informatie voor een eigenschap|Al het DNA in een cel|Een gen dat uit staat','Het stukje DNA voor een eigenschap is het gen zelf; het allel is een variant daarvan, zoals het allel voor blond of zwart haar. Al het DNA in een cel is het genoom. Een gen dat uit staat noem je geninactivatie.'],
['Een zenuwcel en een spiercel in jouw lichaam zien er heel anders uit. Hoe komt dat?','In elke celsoort staan andere genen aan en uit','Ze hebben een verschillend genotype|Spiercellen hebben meer chromosomen|Zenuwcellen hebben geen DNA','Alle lichaamscellen komen uit dezelfde bevruchte eicel en hebben dus hetzelfde genotype en evenveel chromosomen, allemaal met DNA. Het verschil komt door genexpressie en geninactivatie.']
]},
{t:'Milieu, modificatie en blowen',s:[
['E','Sem, ik heb een litteken op mijn knie van een val met de fiets. Hoort dat ook bij mijn fenotype?'],
['D','Ja. Je kunt het zien, dus het is fenotype. Maar het staat niet in je genotype.'],
['E','Dus niet alles wat je ziet komt uit je genen.'],
['D','Nee. Er is een handige formule: fenotype is genotype plus milieufactoren.'],
['E','Milieufactoren, dat zijn dingen uit de omgeving?'],
['D','Ja. Denk aan licht, temperatuur, vochtigheid, voeding, ziekten, roken of vieze lucht. En bij mensen ook opvoeding.'],
['E','Dus als ik veel in de zon zit, word ik bruiner, maar mijn DNA blijft hetzelfde.'],
['D','Precies. Zo’n verandering van je fenotype door het milieu heet een modificatie. De informatie in je chromosomen verandert niet. Daarom geef je een modificatie ook niet door aan je kinderen.'],
['E','Geef eens nog een voorbeeld.'],
['D','Een storm breekt takken van een eik af. De boom ziet er anders uit, maar de eikels die hij maakt groeien gewoon uit tot normale eiken.'],
['E','En blond haar van de kapper is ook een modificatie, maar blond haar vanaf je geboorte is erfelijk.'],
['D','Goed zo. Net als een plant die slap hangt door te weinig water. Dat is modificatie. Maar behaarde blaadjes bij een geranium, dat is erfelijk.'],
['E','Begint dat milieu pas na de geboorte?'],
['D','Nee, al in de baarmoeder. Als een zwangere moeder alcohol drinkt, kan dat de hersenen van de baby beschadigen. Dat heet het foetaal alcoholsyndroom.'],
['E','Is dat dan erfelijk?'],
['D','Nee. Het is een aangeboren aandoening, omdat het in de baarmoeder ontstaat. Maar het is geen erfelijke aandoening, want het DNA verandert niet.'],
['E','Dus aangeboren en erfelijk is niet hetzelfde.'],
['D','Klopt. Erfelijk betekent dat het via de chromosomen van de ouders wordt doorgegeven. Aangeboren betekent alleen dat het voor de geboorte is ontstaan.'],
['E','In het boek stond ook iets over blowen. Wat heeft dat met genen te maken?'],
['D','Wiet en hasj hebben invloed op de stof dopamine in je hersenen. Bij sommige mensen vergroot dat de kans op een psychose. Dan ga je bijvoorbeeld stemmen horen of denk je dat je achtervolgd wordt.'],
['E','Maar niet bij iedereen?'],
['D','Nee, en daar komen de genen om de hoek kijken. Op chromosoom tweeëntwintig ligt het COMT-gen. Daarvan bestaan twee allelen: Val en Met.'],
['E','En omdat je twee chromosomen tweeëntwintig hebt, heb je er twee.'],
['D','Ja. Dus je kunt Val en Val hebben, Val en Met, of Met en Met. Wie twee keer Val heeft, loopt het meeste risico. Ongeveer een kwart van de Nederlanders heeft dat.'],
['E','En met twee keer Met ben je veilig?'],
['D','Je hebt de kleinste kans, maar het is geen garantie. Andere genen en het milieu spelen ook mee.'],
['E','Dus de aanleg is erfelijk, maar de psychose komt pas door het blowen. Aanleg plus milieu.'],
['D','Precies. En het blowen verandert je genotype niet. Alleen je fenotype.']
],q:[
['Wat is een modificatie?','Een verandering van het fenotype door het milieu, die niet wordt doorgegeven','Een verandering in het DNA die wel wordt doorgegeven|Een aandoening die je van je ouders erft|Een gen dat aan wordt gezet','Bij een modificatie verandert alleen het fenotype door milieufactoren, het DNA blijft gelijk. Daarom wordt het niet doorgegeven. Een verandering in het DNA is een mutatie. Een gen dat aan gaat is genexpressie.'],
['Welke eigenschap is een modificatie?','Blond haar door een behandeling bij de kapper','Blond haar vanaf de geboorte|Behaarde bladeren bij een geranium|Je bloedgroep','Kapperskleur komt door een invloed van buitenaf en verandert je DNA niet. Blond haar vanaf je geboorte, behaarde bladeren en je bloedgroep liggen vast in het genotype en zijn dus erfelijk.'],
['Een baby heeft het foetaal alcoholsyndroom. Wat klopt?','Het is aangeboren, maar niet erfelijk','Het is erfelijk en aangeboren|Het is erfelijk, maar niet aangeboren|Het is niet aangeboren en niet erfelijk','Het ontstaat in de baarmoeder, dus het is aangeboren. Het komt door alcohol, een milieufactor, en niet door de chromosomen van de ouders. Daarom is het niet erfelijk.'],
['Iemand heeft voor het COMT-gen twee keer het Met-allel. Wat klopt?','Hij heeft de kleinste kans op een psychose door blowen, maar het kan nog steeds','Hij krijgt nooit een psychose door blowen|Hij heeft het grootste risico op een psychose|Blowen verandert zijn allelen in Val','Met en Met geeft de kleinste kans, maar geen garantie: andere genen en het milieu spelen ook mee. Het grootste risico hoort bij Val en Val. Blowen verandert het genotype niet, alleen het fenotype.']
]}
],
'3.2':[
{t:'Homozygoot, heterozygoot, dominant en recessief',s:[
['D','Lotte, kijk eens naar je voorhoofd in de spiegel. Heb je een rechte haarlijn of een punt in het midden?'],
['E','Een punt. Zo’n V-vorm. Mijn moeder heeft hem ook.'],
['D','Mooi, die haarlijn is een handig voorbeeld voor deze les. Weet je nog dat chromosomen in paren voorkomen?'],
['E','Ja, homologe chromosomen. Eén van mijn vader en één van mijn moeder.'],
['D','En op allebei ligt het gen voor haarlijn op dezelfde plek. Van dat gen bestaan twee allelen: een allel voor een rechte haarlijn en een allel voor een V-vormige haarlijn.'],
['E','En ik heb er twee, op elk chromosoom één.'],
['D','Ja. Die twee allelen voor één eigenschap samen heten een genenpaar.'],
['E','En als die twee allelen hetzelfde zijn?'],
['D','Dan ben je homozygoot. Bijvoorbeeld twee allelen voor een rechte haarlijn. Of twee allelen voor een V-vormige haarlijn.'],
['E','En als ze verschillend zijn, één recht en één V-vormig?'],
['D','Dan ben je heterozygoot. Hetero betekent verschillend, homo betekent gelijk.'],
['E','Maar wat zie je dan bij iemand die heterozygoot is? Een halve punt?'],
['D','Nee, die heeft gewoon een V-vormige haarlijn. Maar één van de twee allelen komt tot uiting. Dat allel noemen we dominant.'],
['E','Dus het V-allel is als het ware sterker.'],
['D','Ja. En het allel dat niet te zien is, heet recessief. Een recessief allel komt alleen tot uiting als er geen dominant allel is. Dus alleen als iemand twee recessieve allelen heeft.'],
['E','Dus iemand met een rechte haarlijn is altijd homozygoot.'],
['D','Precies. Maar bij iemand met een V-vormige haarlijn weet je het niet. Die kan twee V-allelen hebben, of één V-allel en één recht allel. Aan het fenotype zie je dat niet.'],
['E','Hoe noem je zo iemand met dat verstopte rechte allel?'],
['D','Een drager. Een drager is heterozygoot. Het recessieve allel zit in zijn genotype, maar je ziet het niet in zijn fenotype.'],
['E','Dus mijn moeder kan drager zijn van een rechte haarlijn, zonder dat iemand het ziet.'],
['D','Zeker. En als het recessieve allel helemaal niet te zien is, zoals hier, heet dat volledige dominantie.'],
['E','In het boek schrijven ze dat met letters, toch?'],
['D','Ja. Het dominante allel krijgt een hoofdletter, het recessieve allel een kleine letter. Homozygoot dominant is grote A, grote A. Heterozygoot is grote A, kleine a. En homozygoot recessief is kleine a, kleine a.'],
['E','Mag je ook andere letters nemen?'],
['D','Ja, maar kies een letter waarbij de hoofdletter en de kleine letter er echt anders uitzien. Een P of een S is lastig, want die lijken groot en klein bijna hetzelfde. Een R is goed: grote R, kleine r.'],
['E','Dan weet je bij het nakijken tenminste wat je bedoelde.']
],q:[
['Wat betekent heterozygoot?','Je hebt voor een eigenschap twee verschillende allelen','Je hebt voor een eigenschap twee dezelfde allelen|Je hebt alleen recessieve allelen|Je hebt geen genenpaar voor die eigenschap','Hetero betekent verschillend: bijvoorbeeld grote A, kleine a. Twee dezelfde allelen is homozygoot. Twee recessieve allelen is homozygoot recessief. En iedereen heeft voor een eigenschap een genenpaar, op elk homoloog chromosoom één allel.'],
['Het allel voor een V-vormige haarlijn is dominant. Wie heeft een rechte haarlijn?','Iemand die homozygoot recessief is','Iemand die heterozygoot is|Iemand die homozygoot dominant is|Een drager','Een recessief allel komt alleen tot uiting als er geen dominant allel is, dus bij twee recessieve allelen. Een heterozygoot persoon, ook een drager, heeft een dominant allel en dus een V-vorm. Homozygoot dominant heeft ook een V-vorm.'],
['Wat is een drager?','Iemand die heterozygoot is en het recessieve allel niet laat zien','Iemand met twee recessieve allelen|Iemand met twee dominante allelen|Iemand bij wie het recessieve allel goed te zien is','Een drager heeft één dominant en één recessief allel: het recessieve allel zit in het genotype maar niet in het fenotype. Bij twee recessieve allelen is het allel juist wel zichtbaar. Met twee dominante allelen draag je het recessieve allel niet.'],
['Welke letter kun je het beste kiezen om allelen aan te geven?','R, want grote R en kleine r zien er duidelijk anders uit','S, want het is de eerste letter van het woord|P, want die is makkelijk te schrijven|O, want die past bij oogkleur','Kies een letter waarvan de hoofdletter en de kleine letter duidelijk verschillen. Bij S, P en O lijken hoofdletter en kleine letter bijna hetzelfde, dus dan raak je in de war.']
]},
{t:'Onvolledig dominant, intermediair en codominant',s:[
['E','Sem, mijn ouders hebben allebei bruine ogen, maar mijn broertje heeft blauwe ogen. Hoe kan dat?'],
['D','Dat kan best. Het allel voor bruine ogen is dominant over het allel voor blauwe ogen. Als jouw ouders allebei drager zijn van blauw, kan je broertje van allebei het blauwe allel krijgen.'],
['E','Dan is hij homozygoot voor blauw. Logisch.'],
['D','Maar bij oogkleur is er iets bijzonders. Iemand die homozygoot bruin is, heeft meestal donkerdere ogen dan iemand die heterozygoot is.'],
['E','Dus het blauwe allel doet toch een beetje mee?'],
['D','Ja. Dat heet onvolledig dominant. Het recessieve allel komt een klein beetje tot uiting.'],
['E','Dus bij de haarlijn was het volledige dominantie, en bij oogkleur onvolledige dominantie.'],
['D','Precies. Dan nu een plant: het leeuwenbekje. Daar heb je een allel voor rode bloemen en een allel voor witte bloemen.'],
['E','En welke is dominant?'],
['D','Geen van beide. Ze zijn even sterk. Een plant met een rood en een wit allel krijgt roze bloemen.'],
['E','Ha, net als verf mengen.'],
['D','Zo kun je het onthouden. Zo’n tussenvorm, zoals roze, heet een intermediair fenotype. Het ontstaat door twee allelen die onvolledig dominant zijn.'],
['E','Wacht, dus onvolledig dominant en intermediair is hetzelfde?'],
['D','Niet helemaal. Onvolledig dominant zegt iets over de allelen. Intermediair zegt iets over het fenotype dat je ziet, die tussenvorm.'],
['E','Oké. En codominant? Dat woord stond er ook.'],
['D','Bij codominant komen beide allelen helemaal tot uiting, naast elkaar. Denk aan een zwart-wit gevlekte koe, zoals een Holsteiner. Een allel voor een zwarte vacht en een allel voor een witte vacht geven samen een gevlekte vacht.'],
['E','Dus geen grijze koe, maar zwarte en witte vlekken.'],
['D','Precies. Intermediair is mengen, zoals roze. Codominant is naast elkaar, zoals vlekken.'],
['E','Is rood bij alle planten dan even sterk als wit?'],
['D','Nee, dat verschilt per soort. Bij erwtenplanten is rood juist dominant over wit. Een heterozygote erwtenplant heeft dus gewoon rode bloemen. Maar dat geldt dan wel voor alle erwtenplanten.'],
['E','En hoe schrijf je roze leeuwenbekjes op met letters? Een hoofdletter en een kleine letter klopt dan niet.'],
['D','Nee, dan gebruik je een andere manier. Je schrijft een grote A met een klein lettertje erboven. Rood is een grote A met een kleine r erboven, twee keer.'],
['E','En wit is twee keer een grote A met een kleine w erboven.'],
['D','Ja. En roze is één grote A met een r erboven en één grote A met een w erboven.'],
['E','Dus de kleine letter erboven zegt welke kleur dat allel geeft. Handig.']
],q:[
['Een rood leeuwenbekje wordt gekruist met een wit leeuwenbekje. De nakomelingen zijn roze. Hoe heet dit fenotype?','Intermediair','Codominant|Volledig dominant|Recessief','Roze is een tussenvorm van rood en wit, ontstaan door twee onvolledig dominante allelen: dat is een intermediair fenotype. Bij codominant zie je beide kleuren naast elkaar, zoals vlekken. Bij volledige dominantie zou de bloem rood of wit zijn. Recessief zegt iets over een allel, niet over een tussenvorm.'],
['Een Holsteiner koe heeft een allel voor zwart en een allel voor wit en is zwart-wit gevlekt. Hoe heet dit?','Codominant','Intermediair|Onvolledig dominant|Homozygoot','Bij codominantie komen beide allelen volledig tot uiting, naast elkaar: zwarte én witte vlekken. Intermediair en onvolledig dominant zouden een mengkleur geven, zoals grijs. Homozygoot klopt niet, want de koe heeft twee verschillende allelen.'],
['Iemand die homozygoot is voor bruine ogen heeft donkerdere ogen dan iemand die heterozygoot is. Wat zegt dit over het allel voor bruin?','Het is onvolledig dominant','Het is volledig dominant|Het is recessief|Het is codominant','Bruin is dominant, maar het blauwe allel komt een beetje tot uiting bij heterozygoten: onvolledig dominant. Bij volledige dominantie zouden de ogen even donker zijn. Recessief klopt niet, want bruin wint van blauw. Codominant zou blauw en bruin naast elkaar laten zien.'],
['Bij erwtenplanten heeft een heterozygote plant rode bloemen, bij leeuwenbekjes roze. Wat leer je hieruit?','Welk allel dominant is, verschilt per soort','Erwten zijn altijd homozygoot|Bij leeuwenbekjes is wit dominant|Dominantie verschilt per plant binnen een soort','Bij erwten is rood dominant over wit, bij leeuwenbekjes zijn rood en wit even sterk. Dat verschilt per soort, maar geldt binnen een soort voor alle planten. Een heterozygote erwt is juist niet homozygoot, en bij leeuwenbekjes is wit niet dominant, anders waren ze wit.']
]},
{t:'Recombinatie, variatie en tweelingen',s:[
['E','Sem, mijn broertje en ik hebben dezelfde ouders, maar we lijken bijna niet op elkaar. Hoe kan dat?'],
['D','Dat komt door recombinatie. Dat is het herverdelen van erfelijke eigenschappen. Elk kind krijgt een andere combinatie van allelen dan de ouders.'],
['E','En hoe gebeurt dat?'],
['D','Op twee momenten: bij de meiose en bij de geslachtelijke voortplanting.'],
['E','Meiose was de celdeling waarbij geslachtscellen ontstaan, toch?'],
['D','Ja. Een lichaamscel is diploïd: de chromosomen zitten in paren. Een geslachtscel is haploïd: hij heeft maar één chromosoom van elk paar.'],
['E','Dus een eicel van een mens heeft drieëntwintig chromosomen.'],
['D','Precies. En in meiose één gaan de chromosomen van elk paar uit elkaar. Welke van de twee in welke cel terechtkomt, is willekeurig. Bij elk paar opnieuw.'],
['E','Dus elke geslachtscel krijgt een andere mix.'],
['D','Ja. En je kunt uitrekenen hoeveel mixen er mogelijk zijn: twee tot de macht n, waarbij n het aantal paren is.'],
['E','Geef eens een voorbeeld.'],
['D','Een dier met drie paar chromosomen. Twee tot de macht drie is twee keer twee keer twee, dus acht verschillende geslachtscellen.'],
['E','En bij een fruitvlieg met acht chromosomen? Dat zijn vier paren, dus twee tot de macht vier is zestien.'],
['D','Goed zo. En bij de mens is het twee tot de macht drieëntwintig. Dat is ruim acht miljoen combinaties per ouder.'],
['E','Wauw. En welke zaadcel en eicel samenkomen is ook nog eens toeval.'],
['D','Precies. Bij de bevruchting smelten een zaadcel en een eicel samen tot een zygote. Die is weer diploïd. Zo ontstaan nieuwe genenparen.'],
['E','En als een plant zich ongeslachtelijk voortplant, bijvoorbeeld met een stekje?'],
['D','Dan is er geen recombinatie. Een plant met grote A, kleine a geeft dan een nakomeling die ook grote A, kleine a is. Geen variatie dus.'],
['E','Waarom is variatie eigenlijk handig?'],
['D','Al die verschillende genotypen binnen een soort heten samen genetische variatie. Als het milieu verandert, bijvoorbeeld als het warmer wordt, is de kans groot dat een paar individuen goed passen bij de nieuwe situatie. Dan overleeft de soort.'],
['E','Ontstaat variatie alleen door recombinatie?'],
['D','Nee, ook door mutaties. Een mutatie is een verandering in het DNA, dus in de erfelijke eigenschappen zelf.'],
['E','Dan nog de tweelingen. Mijn neefjes lijken als twee druppels water op elkaar.'],
['D','Dan zijn ze waarschijnlijk een eeneiige tweeling. Die ontstaat uit één eicel en één zaadcel. De zygote deelt tot een klompje cellen, en dat klompje splitst in tweeën. Ze hebben dus hetzelfde genotype, en altijd hetzelfde geslacht.'],
['E','En een twee-eiige tweeling?'],
['D','Die ontstaat uit twee eicellen en twee zaadcellen. Ze hebben een verschillend genotype en lijken net zoveel op elkaar als gewone broers en zussen.'],
['E','Dus een tweeling van een jongen en een meisje is altijd twee-eiig.'],
['D','Precies, want hun geslachtschromosomen zijn verschillend. Lekker bezig, Lotte.']
],q:[
['Een diersoort heeft 2n = 6 chromosomen. Hoeveel verschillende combinaties van chromosomen kunnen de geslachtscellen krijgen?','8','6|3|64','Zes chromosomen zijn drie paren, dus n = 3. Het aantal combinaties is twee tot de macht drie, dat is 2 × 2 × 2 = 8. Zes en drie zijn het aantal chromosomen en paren, geen combinaties. 64 krijg je als je per ongeluk twee tot de macht zes uitrekent.'],
['Wat is het verschil tussen diploïd en haploïd?','Diploïd heeft chromosomen in paren, haploïd heeft één chromosoom van elk paar','Diploïd zit in geslachtscellen, haploïd in lichaamscellen|Haploïd heeft twee keer zoveel chromosomen|Diploïd betekent dat er geen homologe chromosomen zijn','Een lichaamscel en een zygote zijn diploïd, met paren. Een geslachtscel is haploïd, met de helft van het aantal en dus geen paren. Het is dus precies andersom dan de foute opties zeggen.'],
['Waarom is genetische variatie belangrijk voor een soort?','Als het milieu verandert, zijn er waarschijnlijk individuen die goed aangepast zijn','Dan zien alle individuen er hetzelfde uit|Dan ontstaan er geen mutaties meer|Dan hoeft de soort zich niet voort te planten','Door variatie is er bij veranderende omstandigheden vaak wel een individu met een passend genotype, zodat de soort overleeft. Variatie betekent juist dat individuen verschillen. Mutaties blijven gewoon ontstaan en zijn zelf een bron van variatie. Voortplanting blijft nodig.'],
['Xander en Ilona zijn een tweeling. Wat klopt?','Ze zijn twee-eiig, want een jongen en een meisje hebben een verschillend genotype','Ze zijn eeneiig, want ze zijn op dezelfde dag geboren|Ze kunnen eeneiig of twee-eiig zijn|Ze zijn eeneiig, want ze hebben dezelfde ouders','Een eeneiige tweeling heeft hetzelfde genotype en dus altijd hetzelfde geslacht. Een jongen en een meisje verschillen in geslachtschromosomen, dus ze zijn twee-eiig. Dezelfde geboortedag en dezelfde ouders gelden voor elke tweeling.']
]}
]});

'3.3':[
{t:'Kruisen in drie vaste stappen',s:[
['E','Sem, stel je voor: je hebt twee konijnen met een mooie vachtkleur en je laat ze jongen krijgen. Hebben alle jongen dan dezelfde kleur?'],
['D','Dat zou je denken. Maar soms zit er ineens een jong tussen dat er heel anders uitziet. Daar gaat deze basisstof over.'],
['E','Precies. We beginnen met de monohybride kruising. Mono betekent één. Je let dus op één eigenschap.'],
['D','En bij die ene eigenschap hoort één allelenpaar. Elke ouder heeft voor die eigenschap twee allelen.'],
['E','In het echt worden veel eigenschappen door meerdere genen samen bepaald. Denk aan huidskleur of oogkleur. Daarom zijn er zoveel verschillende tinten.'],
['D','Maar bij een monohybride kruising houden we het simpel. Eén gen, twee allelen per ouder.'],
['E','Dan de namen van de generaties. De ouders heten P. Dat komt van het Latijnse woord parentes, ouders.'],
['D','De kinderen van die ouders heten F één. F komt van filii, dat is Latijn voor kinderen. De één betekent eerste generatie.'],
['E','En als die F één dieren onderling jongen krijgen, heet de volgende generatie F twee.'],
['D','Bij planten kan dat ook met zelfbestuiving. Dan komt stuifmeel van de meeldraden op de stempel van een bloem van dezelfde plant.'],
['E','Oké. Nu het belangrijkste: elk kruisingsvraagstuk los je op in drie vaste stappen.'],
['D','Stap één: wat zijn de genotypen van de ouders? Die schrijf je op als kruising, bijvoorbeeld grote H grote H gekruist met kleine h kleine h.'],
['E','Stap twee: welke allelen kunnen in de geslachtscellen van elke ouder zitten? Een geslachtscel krijgt altijd maar één van de twee allelen.'],
['D','Stap drie: welke combinaties kunnen er ontstaan als een eicelkern en een zaadcelkern versmelten? Die zet je in een kruisingsschema.'],
['E','Laten we het doen met konijnen. Het allel voor staande oren, grote H, is dominant over het allel voor hangende oren, kleine h.'],
['D','Een vrouwtjeskonijn heet een moer. Onze moer is homozygoot voor staande oren, dus grote H grote H.'],
['E','En een mannetjeskonijn heet een rammelaar. Hij is homozygoot voor hangende oren, dus kleine h kleine h.'],
['D','Stap één hebben we dus al: grote H grote H gekruist met kleine h kleine h.'],
['E','Stap twee. De moer heeft alleen maar grote H. Al haar eicellen krijgen dus grote H.'],
['D','En de rammelaar heeft alleen kleine h. Al zijn zaadcellen krijgen kleine h.'],
['E','Stap drie. Er is maar één mogelijkheid: grote H uit de eicel plus kleine h uit de zaadcel. Dat wordt grote H kleine h.'],
['D','Alle jongen in de F één zijn dus heterozygoot. En ze hebben allemaal staande oren.'],
['E','Want het dominante allel komt tot uiting zodra er minstens één van aanwezig is.'],
['D','Dus honderd procent staande oren. Maar let op: in die jongen zit wel stiekem het allel voor hangende oren.'],
['E','En wat daarmee gebeurt in de F twee, dat hoor je in het volgende deel.']
],q:[
['Wat betekent F1 bij een kruising?','De eerste generatie nakomelingen','De oudergeneratie|De tweede generatie nakomelingen|Alle dieren met het dominante fenotype','F komt van filii, kinderen; de 1 betekent de eerste generatie. De ouders heten P, niet F1. De tweede generatie is F2. Of een dier het dominante fenotype heeft, zegt niets over de generatie.'],
['Hoeveel allelen van één ouder zijn betrokken bij een monohybride kruising?','Twee','Eén|Vier|Dat hangt af van het aantal nakomelingen','Een ouder heeft voor één eigenschap één allelenpaar, dus twee allelen. In elke geslachtscel komt er maar één terecht, maar de ouder zelf heeft er twee. Vier zou gelden voor twee eigenschappen samen. Het aantal nakomelingen verandert niets aan de allelen van de ouder.'],
['Moer HH wordt gekruist met rammelaar hh. Wat is stap 2 van het kruisingsvraagstuk?','Alle eicellen bevatten H, alle zaadcellen bevatten h','De nakomelingen zijn allemaal Hh|De ouders zijn HH en hh|De eicellen bevatten HH, de zaadcellen hh','Stap 2 gaat over de allelen in de geslachtscellen. Een geslachtscel krijgt maar één allel, dus H of h, nooit HH. De genotypen van de ouders zijn stap 1, de nakomelingen Hh zijn de uitkomst van stap 3.'],
['Bij planten kan een F2 ook ontstaan door zelfbestuiving. Wat is dat?','Stuifmeel komt op de stempel van een bloem van dezelfde plant','Een plant maakt zonder stuifmeel zaden|Stuifmeel van een andere plant komt op de stempel|Twee F1-planten groeien samen tot één plant','Bij zelfbestuiving bestuift een plant zichzelf: stuifmeel van de meeldraden komt op een stempel van dezelfde plant. Stuifmeel van een andere plant is kruisbestuiving. Zonder stuifmeel of samengroeien is geen bestuiving.']
]},
{t:'Het kruisingsschema en de verhoudingen',s:[
['D','Lotte, we hadden in de F één allemaal konijnen met grote H kleine h. Wat gebeurt er als twee van die konijnen jongen krijgen?'],
['E','Stap één: grote H kleine h gekruist met grote H kleine h.'],
['D','Stap twee: de moeder maakt eicellen met grote H of met kleine h. De vader maakt zaadcellen met grote H of met kleine h.'],
['E','En je weet niet welke zaadcel welke eicel bevrucht. Dat is toeval. Daarom maken we bij stap drie een kruisingsschema.'],
['D','Een kruisingsschema is een tabelletje met alle mogelijke combinaties. De afspraak in ons boek: de allelen van de zaadcellen zet je links, de allelen van de eicellen zet je boven.'],
['E','Ezelsbruggetje: de eicel ligt bovenop, de zaadcellen zwemmen van links aan. Zaadcellen links, eicellen boven.'],
['D','Boven zet je dus grote H en kleine h. Links ook grote H en kleine h. Dan krijg je vier vakjes.'],
['E','Vakje linksboven: grote H met grote H, dat is grote H grote H. Rechtsboven: grote H kleine h.'],
['D','Linksonder ook grote H kleine h. En rechtsonder kleine h kleine h.'],
['E','Elk vakje heeft evenveel kans: één op vier, dus vijfentwintig procent.'],
['D','Nu tellen. Eén keer grote H grote H, twee keer grote H kleine h, één keer kleine h kleine h. De verhouding van de genotypen is dus één op twee op één.'],
['E','En de fenotypen? Grote H grote H en grote H kleine h hebben staande oren. Dat zijn drie van de vier vakjes.'],
['D','Alleen kleine h kleine h heeft hangende oren. Dus staande oren tegen hangende oren is drie op één.'],
['E','In procenten: vijfenzeventig procent staande oren en vijfentwintig procent hangende oren.'],
['D','En de kans op een jong dat heterozygoot is? Twee van de vier vakjes, dus de helft, vijftig procent.'],
['E','Kijk, daar is ons verrassingskonijn. Twee ouders met staande oren krijgen toch een jong met hangende oren.'],
['D','Nu nog even alle verhoudingen op een rij, want die moet je echt kennen.'],
['E','Eén: homozygoot dominant gekruist met homozygoot recessief. Dus grote A grote A met kleine a kleine a. Alle jongen zijn grote A kleine a. Honderd procent dominant fenotype.'],
['D','Twee: heterozygoot gekruist met homozygoot recessief. Grote A kleine a met kleine a kleine a. Je krijgt grote A kleine a tegen kleine a kleine a, één op één. Dus de helft dominant, de helft recessief.'],
['E','Drie: heterozygoot gekruist met heterozygoot. Genotypen één op twee op één, fenotypen drie op één.'],
['D','Nog een voorbeeld om te oefenen. Bij labradors is zwart, grote B, dominant over bruin, kleine b. Een homozygote zwarte reu krijgt pups met een bruine teef.'],
['E','Stap één: grote B grote B gekruist met kleine b kleine b. Alle pups in de F één zijn grote B kleine b en zwart.'],
['D','Laat je die pups later onderling paren, dan krijg je in de F twee weer drie zwart op één bruin.'],
['E','En bij intermediaire overerving? Bij leeuwenbekjes geeft rood met wit een roze plant. Kruis je twee roze planten, dan krijg je rood, roze en wit in de verhouding één op twee op één.'],
['D','Daar zijn de fenotypen dus gelijk aan de genotypen. Want de heterozygoot ziet er anders uit dan allebei de homozygoten.'],
['E','Rekenvoorbeeld: zesenvijftig zaden van zo’n roze plant. De helft wordt roze. Zesenvijftig gedeeld door twee is achtentwintig roze planten.']
],q:[
['Hoe zet je in het boek de allelen in een kruisingsschema?','Zaadcellen links, eicellen boven','Eicellen links, zaadcellen boven|Vader boven, moeder onder|Dominante allelen links, recessieve allelen boven','De vaste afspraak is: allelen van de zaadcellen links, van de eicellen boven. De andere opties draaien dat om of sorteren op dominant en recessief, en dat is niet de afspraak.'],
['Hh × Hh. Hoe groot is de kans op een nakomeling met genotype Hh?','50%','25%|75%|100%','In het schema staan HH, Hh, Hh en hh: twee van de vier vakjes zijn Hh, dus 50%. 25% is de kans op HH of op hh. 75% is de kans op staande oren, dus het fenotype, niet het genotype Hh.'],
['Aa × aa. Wat is de verhouding van de fenotypen bij de nakomelingen?','1 : 1','3 : 1|1 : 2 : 1|Alle nakomelingen dominant','Aa geeft A of a, aa geeft alleen a. Je krijgt Aa en aa, evenveel: 1 : 1. 3 : 1 en 1 : 2 : 1 horen bij Aa × Aa. Alle nakomelingen dominant krijg je bij AA × aa.'],
['Twee roze leeuwenbekjes (intermediair, A<sup>r</sup>A<sup>w</sup>) leveren 80 zaden. Hoeveel planten worden naar verwachting wit?','20','40|60|0','Het schema geeft rood : roze : wit = 1 : 2 : 1, dus een kwart wit: 80 gedeeld door 4 is 20. 40 is het aantal roze planten. 60 zou kloppen als roze en rood samen werden geteld. 0 klopt niet, want beide ouders hebben het allel voor wit.']
]},
{t:'Testkruising en stambomen',s:[
['E','Sem, ik heb een cavia met korte haren. Kort haar, grote A, is dominant over lang haar, kleine a. Wat is het genotype van mijn cavia?'],
['D','Dat kan ik niet zien. Het kan grote A grote A zijn, maar ook grote A kleine a. Allebei geven korte haren.'],
['E','Daarvoor heb je een testkruising. Je kruist het dier met het dominante fenotype met een dier dat homozygoot recessief is.'],
['D','Dus mijn cavia met korte haren krijgt jongen met een langharige cavia. Die is zeker kleine a kleine a, anders had hij geen lang haar.'],
['E','Mogelijkheid één: mijn cavia is grote A grote A. Dan geeft hij altijd grote A mee, en de langharige altijd kleine a.'],
['D','Alle jongen worden dan grote A kleine a. Honderd procent korte haren. Maar één fenotype.'],
['E','Mogelijkheid twee: mijn cavia is grote A kleine a. Dan geeft hij de helft van de keren grote A en de helft kleine a.'],
['D','Dan krijg je grote A kleine a tegen kleine a kleine a, één op één. De helft kort haar en de helft lang haar.'],
['E','Dus zie je ook maar één jong met lang haar, dan weet je het zeker: mijn cavia is heterozygoot.'],
['D','Maar pas op. Een testkruising is alleen betrouwbaar als er genoeg nakomelingen zijn. Met drie jongen kan het toevallig allemaal kort haar zijn, terwijl de ouder toch heterozygoot is.'],
['E','Een testkruising is vooral handig bij recessieve aandoeningen bij fokdieren. Een dier kan dan drager zijn zonder dat je er iets van ziet.'],
['D','Bij mensen doe je natuurlijk geen testkruisingen. Daar gebruik je een stamboom: een schema van een familie.'],
['E','In een stamboom is een man een vierkant en een vrouw een cirkel. De kleur van het symbool vertelt welk fenotype iemand heeft. Dat staat in de legenda.'],
['D','Een horizontale lijn tussen een vierkant en een cirkel betekent: dat zijn de ouders. Vanaf die lijn gaat een lijn omlaag naar de kinderen.'],
['E','Nu de belangrijkste regel. Twee ouders met hetzelfde fenotype krijgen een kind met een afwijkend fenotype. Wat weet je dan?'],
['D','Dan is het afwijkende fenotype recessief. En beide ouders zijn heterozygoot, grote A kleine a. Het afwijkende kind is kleine a kleine a.'],
['E','Voorbeeld: vader en moeder hebben allebei zwart haar, en hun zoon is blond. Dan is blond recessief en zijn de ouders allebei heterozygoot.'],
['D','En de zussen met zwart haar? Die kunnen grote A grote A of grote A kleine a zijn. Dat weet je niet zeker.'],
['E','Nog een truc. Heeft iemand het recessieve fenotype, dan is die altijd homozygoot recessief. Daarmee kun je vaak de rest invullen.'],
['D','Bijvoorbeeld bij tongrollen. Tongrollen, grote T, is dominant. Een moeder kan niet rollen, dus zij is kleine t kleine t. Haar kinderen die wel kunnen rollen, kregen van haar een kleine t. Die zijn dus grote T kleine t.'],
['E','Je kunt ook kansen uitrekenen met een stamboom. Neem de ziekte van Huntington. Die erft dominant over. Eén ziek allel is al genoeg.'],
['D','Stel, een vrouw heeft het allel voor Huntington, grote H kleine h. Haar partner is gezond, kleine h kleine h.'],
['E','Dat is heterozygoot gekruist met homozygoot recessief, dus één op één. Elk kind heeft vijftig procent kans op de ziekte.'],
['D','Daarom praten mensen in zo’n situatie vaak met een genetisch consulent. Die legt uit wat de kansen zijn en helpt bij moeilijke keuzes.'],
['E','Samengevat: drie stappen, zaadcellen links, eicellen boven, en ken je verhoudingen: honderd procent, één op één, één op twee op één en drie op één.']
],q:[
['Je wilt weten of een konijn met staande oren (H dominant) HH of Hh is. Met welk konijn kruis je het in een testkruising?','Een konijn met hangende oren, hh','Een konijn met staande oren, HH|Een konijn met staande oren, Hh|Maakt niet uit, als er maar veel jongen komen','Bij een testkruising kruis je altijd met een homozygoot recessief dier, hier hh. Met HH krijg je altijd staande oren en leer je niets. Met Hh kun je bij HH en bij Hh allebei jongen met staande oren krijgen. Veel jongen is wel nodig, maar dan wel met hh.'],
['Testkruising: een kortharige cavia met een langharige (aa). Van de 12 jongen hebben er 6 lang haar. Wat is het genotype van de kortharige cavia?','Aa','AA|aa|Niet te bepalen','Er komen langharige jongen (aa), dus de kortharige ouder moet een a hebben meegegeven: hij is Aa, en 6 van 12 past bij 1 : 1. Bij AA zouden alle jongen kort haar hebben. aa kan niet, want dan had de cavia zelf lang haar.'],
['In een stamboom hebben twee ouders allebei bruine ogen en een van hun kinderen heeft blauwe ogen. Wat kun je concluderen?','Blauw is recessief en beide ouders zijn heterozygoot','Bruin is recessief en beide ouders zijn homozygoot|Blauw is dominant en het kind is heterozygoot|Je kunt niets concluderen','Twee gelijke ouders met een afwijkend kind: de afwijking is recessief, het kind is homozygoot recessief en beide ouders zijn heterozygoot. Was blauw dominant, dan moest een van de ouders blauwe ogen hebben. Homozygote ouders kunnen geen afwijkend kind krijgen.'],
['Wat betekent een vierkant in een stamboom?','Een man','Een vrouw|Iemand met de afwijking|Iemand die drager is','Vierkant is man, cirkel is vrouw. Of iemand de afwijking heeft of drager is, zie je aan de kleur of vulling volgens de legenda, niet aan de vorm.']
]}
],
'3.4':[
{t:'Jongen of meisje: de zaadcel beslist',s:[
['D','Lotte, wie bepaalt eigenlijk of een baby een jongen of een meisje wordt?'],
['E','Dat wordt bepaald door de geslachtschromosomen. Even opfrissen: een mens heeft zesenveertig chromosomen, in drieëntwintig paren.'],
['D','Tweeëntwintig paren zijn autosomen. Het laatste paar zijn de geslachtschromosomen.'],
['E','Een vrouw heeft twee X-chromosomen. Een man heeft één X-chromosoom en één Y-chromosoom.'],
['D','Je kunt dat korter opschrijven als een formule van het karyogram. Eerst het aantal chromosomen, dan de geslachtschromosomen.'],
['E','Voor een man is dat: vierkante haak, zesenveertig, komma, X Y, vierkante haak sluiten. Voor een vrouw: zesenveertig, komma, X X.'],
['D','Nu de geslachtscellen. Bij de meiose gaan de chromosomen van elk paar uit elkaar. Een geslachtscel heeft dus van elk paar maar één chromosoom.'],
['E','Dus ook maar één geslachtschromosoom. Een vrouw heeft alleen X-chromosomen, dus een eicel bevat altijd een X.'],
['D','Een man heeft X en Y. De helft van zijn zaadcellen krijgt een X, de andere helft een Y.'],
['E','Bevrucht een zaadcel met een X de eicel, dan krijg je X X. Dat wordt een meisje.'],
['D','En bevrucht een zaadcel met een Y de eicel, dan krijg je X Y. Dat wordt een jongen.'],
['E','Het geslacht ligt dus al vast op het moment van de bevruchting. En het is het geslachtschromosoom in de zaadcel dat het bepaalt.'],
['D','Want de eicel heeft toch altijd een X. Die maakt geen verschil.'],
['E','Je kunt dit ook in een kruisingsschema zetten. Links de zaadcellen, X en Y. Boven de eicel, X.'],
['D','Dan krijg je X X en X Y, evenveel. De kans op een jongen is dus vijftig procent, en op een meisje ook.'],
['E','Geslachtschromosomen zitten trouwens in beide soorten cellen. In een lichaamscel als paar, in een geslachtscel maar één.'],
['D','Bij de meeste diersoorten bepaalt één chromosomenpaar het geslacht. Zoogdieren en fruitvliegjes doen het net als wij: vrouwtjes X X, mannetjes X Y.'],
['E','Maar bij vogels en een paar vissoorten is het precies andersom. Daar zijn de mannetjes X X en de vrouwtjes X Y.'],
['D','Neem de kip. Een haan is X X en een hen is X Y. Kippen hebben achtendertig paar autosomen en één paar geslachtschromosomen.'],
['E','Dat zijn negenendertig paar, dus achtenzeventig chromosomen. De formule voor een haan is achtenzeventig, komma, X X. Voor een hen achtenzeventig, komma, X Y.'],
['D','En bij kippen bepaalt dus niet de zaadcel het geslacht, maar de eicel. De hen maakt eicellen met X of met Y. De haan maakt alleen zaadcellen met X.'],
['E','Bij bijen is het nog gekker. Mannetjes, de darren, komen uit onbevruchte eicellen. Vrouwtjes uit bevruchte eicellen. Daar is geen Y-chromosoom nodig.'],
['D','Onthoud vooral: bij de mens heeft de eicel altijd een X, en de zaadcel met X of Y beslist.']
],q:[
['Welke karyogramformule hoort bij een man?','[46, XY]','[46, XX]|[23, XY]|[44, XY]','Een man heeft 46 chromosomen, waaronder X en Y. [46, XX] is een vrouw. 23 is het aantal in een geslachtscel, en 44 is alleen het aantal autosomen, terwijl je in de formule alle chromosomen telt.'],
['Waardoor wordt bij de mens het geslacht van een kind bepaald?','Door het geslachtschromosoom in de zaadcel','Door het geslachtschromosoom in de eicel|Door de voeding tijdens de zwangerschap|Door het aantal autosomen','Een eicel bevat altijd een X; de zaadcel bevat X of Y en maakt dus het verschil. Bij vogels beslist de eicel, maar niet bij de mens. Voeding speelt geen rol, en het aantal autosomen is bij jongens en meisjes gelijk.'],
['Een haan heeft 38 paar autosomen en 1 paar geslachtschromosomen. Wat is zijn karyogramformule?','[78, XX]','[78, XY]|[39, XX]|[76, XX]','Bij vogels is het mannetje XX. 39 paar is 78 chromosomen. [78, XY] is de hen. 39 is het aantal paren, niet het aantal chromosomen. 76 telt alleen de autosomen.'],
['Een menselijke cel bevat chromosomen in paren, en één paar bestaat uit een lang en een heel kort chromosoom. Wat voor cel is dit?','Een lichaamscel van een man','Een geslachtscel van een man|Een lichaamscel van een vrouw|Een eicel','Chromosomen in paren betekent een lichaamscel; een geslachtscel heeft van elk paar maar één. Het ongelijke paar is X met het korte Y, dus een man. Een vrouw en een eicel hebben geen Y.']
]},
{t:'Genen op het X-chromosoom en de fruitvlieg van Morgan',s:[
['E','In het jaar negentienhonderdtien deed de Amerikaan Thomas Morgan een beroemde proef met fruitvliegjes.'],
['D','Hij kruiste een vrouwtje met rode ogen met een mannetje met witte ogen. Alle jongen hadden rode ogen.'],
['E','Toen liet hij die jongen onderling paren. En wat bleek? Alle vliegjes met witte ogen waren mannetjes. Alle vrouwtjes hadden rode ogen.'],
['D','Raar. Hoe kan een eigenschap nou vastzitten aan het geslacht?'],
['E','Dat komt doordat er ook genen in de geslachtschromosomen liggen. Het Y-chromosoom is veel korter dan het X-chromosoom en heeft veel minder genen.'],
['D','Op het X-chromosoom liggen dus genen die helemaal niet op het Y-chromosoom voorkomen. Die noemen we X-chromosomaal.'],
['E','Voor zo’n gen ligt er geen allel op het Y-chromosoom. Daarom schrijven we het allel bij de X. Het dominante allel schrijf je als X met grote A, het recessieve als X met kleine a.'],
['D','Een vrouw heeft twee X-chromosomen. Zij kan homozygoot zijn: twee keer X met grote A, of twee keer X met kleine a. Of ze is heterozygoot: X met grote A en X met kleine a.'],
['E','Zo’n heterozygote vrouw heet een draagster. Ze draagt het recessieve allel bij zich, maar je ziet het niet aan haar.'],
['D','Een man heeft maar één X. Zijn genotype is X met grote A, Y, of X met kleine a, Y.'],
['E','De woorden homozygoot en heterozygoot gelden bij een man dus niet voor zo’n gen. En heeft hij X met kleine a, dan komt dat recessieve allel altijd tot uiting.'],
['D','Nu terug naar de vliegjes. Rode ogen, X met grote A, is dominant over witte ogen, X met kleine a.'],
['E','Stap één, de P. Het vrouwtje is homozygoot rood: X met grote A, X met grote A. Het mannetje is wit: X met kleine a, Y.'],
['D','Stap twee. Het vrouwtje maakt alleen eicellen met X met grote A. Het mannetje maakt zaadcellen met X met kleine a, of met Y.'],
['E','Stap drie. De dochters krijgen X met grote A van moeder en X met kleine a van vader. Ze hebben rode ogen en zijn draagster.'],
['D','De zonen krijgen X met grote A van moeder en de Y van vader. Ook rode ogen. Dus de hele F één heeft rode ogen, precies wat Morgan zag.'],
['E','Nu de F twee. Een draagster, X met grote A en X met kleine a, gekruist met een mannetje met X met grote A en Y.'],
['D','Zaadcellen links: X met grote A, of Y. Eicellen boven: X met grote A, of X met kleine a.'],
['E','Bovenste rij, met de X van vader: X met grote A, X met grote A. En X met grote A, X met kleine a. Dat zijn twee vrouwtjes met rode ogen.'],
['D','Onderste rij, met de Y van vader: X met grote A, Y. Dat is een mannetje met rode ogen. En X met kleine a, Y. Een mannetje met witte ogen.'],
['E','Dus vijftig procent vrouwtjes met rode ogen, vijfentwintig procent mannetjes met rode ogen en vijfentwintig procent mannetjes met witte ogen.'],
['D','Alles bij elkaar is rood tegen wit nog steeds drie op één. Maar alle witte vliegjes zijn mannetjes.'],
['E','En dat is de herkenningstruc. Zie je na een kruising met veel nakomelingen een fenotype wel bij de mannetjes en niet bij de vrouwtjes? Dan is er een X-chromosomaal gen in het spel.'],
['D','Nog eentje andersom: een vrouwtje met witte ogen met een mannetje met rode ogen. Dan krijgen alle dochters X met grote A van vader en zijn ze rood. Alle zonen krijgen X met kleine a van moeder en zijn wit.'],
['E','Handig om te onthouden: een zoon krijgt zijn X altijd van zijn moeder, en zijn Y van zijn vader.']
],q:[
['Wat is het genotype van een fruitvliegmannetje met witte ogen (wit is X-chromosomaal recessief)?','X<sup>a</sup>Y','X<sup>a</sup>X<sup>a</sup>|X<sup>A</sup>Y|X<sup>a</sup>Y<sup>a</sup>','Een mannetje heeft één X en een Y; het allel voor wit, X<sup>a</sup>, staat op de X. X<sup>a</sup>X<sup>a</sup> is een vrouwtje. X<sup>A</sup>Y heeft rode ogen. Op het Y-chromosoom ligt voor dit gen geen allel, dus Y<sup>a</sup> bestaat niet.'],
['Wat is een draagster?','Een vrouw die heterozygoot is, X<sup>A</sup>X<sup>a</sup>, en het recessieve allel niet laat zien','Een vrouw met de recessieve eigenschap, X<sup>a</sup>X<sup>a</sup>|Een man met X<sup>a</sup>Y|Een vrouw die homozygoot dominant is','Een draagster heeft één recessief allel en één dominant allel, dus je ziet de eigenschap niet. X<sup>a</sup>X<sup>a</sup> heeft de eigenschap zelf. Een man met X<sup>a</sup>Y heeft de eigenschap ook, want hij heeft geen tweede X. X<sup>A</sup>X<sup>A</sup> heeft het recessieve allel helemaal niet.'],
['Morgan: F1 X<sup>A</sup>X<sup>a</sup> × X<sup>A</sup>Y. Welk deel van alle F2-nakomelingen is een mannetje met witte ogen?','25%','50%|0%|75%','Het schema geeft X<sup>A</sup>X<sup>A</sup>, X<sup>A</sup>X<sup>a</sup>, X<sup>A</sup>Y en X<sup>a</sup>Y: één van de vier is een wit mannetje, dus 25%. 50% is het deel vrouwtjes met rode ogen, of de helft van de mannetjes. 75% is het deel met rode ogen. 0% klopt niet, want de moeder geeft de helft van de zonen X<sup>a</sup>.'],
['Aan welk patroon herken je bij veel nakomelingen een X-chromosomaal gen?','Een fenotype komt wel bij de mannetjes voor en niet bij de vrouwtjes','Mannetjes en vrouwtjes hebben precies dezelfde verhouding|De verhouding is altijd 1 : 2 : 1|Het fenotype komt alleen bij de vrouwtjes voor','Omdat mannetjes maar één X hebben, komt een recessief X-allel bij hen veel vaker tot uiting. Een gelijke verdeling over beide geslachten past bij een autosomaal gen. 1 : 2 : 1 hoort bij genotypen van Aa × Aa. Alleen bij vrouwtjes is juist niet het typische patroon.']
]},
{t:'Kleurenblindheid, hemofilie en koningin Victoria',s:[
['D','Lotte, in mijn klas zijn twee jongens kleurenblind. Maar ik ken geen enkel meisje dat het is. Toeval?'],
['E','Geen toeval. Rood-groenkleurenblindheid erft X-chromosomaal recessief over. X met grote B is normaal zien, X met kleine b is kleurenblind.'],
['D','Een jongen heeft maar één X. Heeft hij X met kleine b, dan is hij kleurenblind. Eén recessief allel is genoeg.'],
['E','Een meisje heeft twee X-chromosomen. Zij is alleen kleurenblind als ze op allebei X met kleine b heeft. Met één is ze draagster.'],
['D','En de kans op twee keer dat allel is veel kleiner dan op één keer. Daarom zijn veel meer jongens kleurenblind.'],
['E','Rekenvoorbeeld één. Marijn is kleurenblind, X met kleine b, Y. Zijn vrouw is homozygoot normaal, twee keer X met grote B. Hoe groot is de kans dat hun zoontje kleurenblind is?'],
['D','Een zoon krijgt de Y van zijn vader. Zijn X krijgt hij van zijn moeder, en die heeft alleen X met grote B. Dus de kans is nul procent.'],
['E','Maar alle dochters van Marijn krijgen zijn X met kleine b. Die worden dus allemaal draagster.'],
['D','Rekenvoorbeeld twee. Mohammed is ook kleurenblind, X met kleine b, Y. Zijn vrouw is draagster, X met grote B, X met kleine b.'],
['E','Een zoontje krijgt de Y van Mohammed. Van moeder krijgt hij X met grote B of X met kleine b, allebei met kans de helft.'],
['D','Dus een zoon is X met grote B, Y, of X met kleine b, Y. De kans dat hun zoontje kleurenblind is, is vijftig procent.'],
['E','Pas wel op wat de vraag is. De kans dat een zoon kleurenblind is, is iets anders dan de kans dat een willekeurig kind een kleurenblinde zoon is. Dat laatste is de helft daarvan, vijfentwintig procent.'],
['D','Nu een ernstigere aandoening: hemofilie. Dan stolt het bloed slecht. Je kunt dan inwendige bloedingen krijgen, bijvoorbeeld in je gewrichten.'],
['E','Hemofilie wordt ook veroorzaakt door een recessief allel op het X-chromosoom. Het heet ook wel de koninklijke ziekte.'],
['D','Waarom koninklijk?'],
['E','Omdat het veel voorkwam in Europese koningshuizen. Het begon bij de Britse koningin Victoria. Zij was draagster: X met grote H, X met kleine h.'],
['D','Zelf was ze niet ziek, want ze had ook een dominant allel voor normale bloedstolling.'],
['E','Haar ouders hadden het allel niet. Waarschijnlijk ontstond het door een spontane mutatie in de geslachtscellen van haar vader, die al wat ouder was.'],
['D','Via haar dochters en haar jongste zoon kwam het allel in koningshuizen van onder andere Duitsland, Spanje en Rusland terecht.'],
['E','Een bekend voorbeeld is prins Alexej van Rusland. Hij had hemofilie en was een achterkleinzoon van Victoria.'],
['D','Laten we rekenen hoe groot de kans was dat Alexej dat allel van Victoria zou erven. Victoria gaf het met kans de helft door aan haar dochter Alice.'],
['E','Alice gaf het met kans de helft door aan haar dochter Alix. En Alix gaf het met kans de helft door aan haar zoon Alexej.'],
['D','Dus de helft keer de helft keer de helft. Dat is een achtste, twaalf en een half procent.'],
['E','En kijk je naar de stamboom van die koningshuizen, dan zie je het typische patroon: bijna alleen mannen zijn ziek, en het allel gaat via draagster-moeders naar hun zonen.'],
['D','Een zieke vader geeft zijn X trouwens nooit aan zijn zoon, maar altijd aan zijn dochters. Die worden dan draagster.'],
['E','Kort samengevat: een jongen heeft één X, dus één recessief allel is genoeg. Een meisje heeft er twee nodig, en met één is ze draagster.']
],q:[
['Een kleurenblinde man (X<sup>b</sup>Y) krijgt kinderen met een homozygoot normale vrouw (X<sup>B</sup>X<sup>B</sup>). Hoe groot is de kans dat een zoon kleurenblind is?','0%','50%|25%|100%','Een zoon krijgt de Y van zijn vader en een X van zijn moeder, en die heeft alleen X<sup>B</sup>. Dus 0%. 50% of 25% zou kunnen als de moeder draagster was. 100% klopt niet, want de vader geeft zijn X<sup>b</sup> alleen aan dochters.'],
['Een kleurenblinde man (X<sup>b</sup>Y) en een draagster (X<sup>B</sup>X<sup>b</sup>) krijgen een zoon. Hoe groot is de kans dat die zoon kleurenblind is?','50%','25%|0%|100%','De zoon krijgt de Y van vader en van moeder X<sup>B</sup> of X<sup>b</sup>, elk met kans de helft: 50%. 25% is de kans dat een willekeurig kind een kleurenblinde zoon is, maar hier is al gegeven dat het een zoon is. 0% en 100% passen niet bij een draagster als moeder.'],
['Waarom komt hemofilie veel vaker voor bij jongens dan bij meisjes?','Jongens hebben één X, dus één recessief allel is genoeg','Het allel ligt op het Y-chromosoom|Jongens erven hun X altijd van hun vader|Hemofilie is dominant bij jongens en recessief bij meisjes','Hemofilie is X-chromosomaal recessief: een jongen heeft geen tweede X met een dominant allel, een meisje heeft twee recessieve allelen nodig. Het allel ligt op de X, niet op de Y. Jongens krijgen hun X van hun moeder, niet van hun vader. Dominant of recessief verschilt niet per geslacht.'],
['Koningin Victoria was draagster. Hoe groot was de kans dat haar achterkleinzoon Alexej het allel van haar erfde, via haar dochter Alice en kleindochter Alix?','1/8 = 12,5%','1/2 = 50%|1/4 = 25%|1/3 = 33%','Bij elke stap geeft een draagster het allel met kans de helft door: Victoria naar Alice, Alice naar Alix, Alix naar Alexej. Dat is ½ × ½ × ½ = 1/8. 50% is maar één stap, 25% twee stappen. 1/3 komt in deze berekening niet voor.']
]}
]});
