['3.4','Rood-groenkleurenblindheid erft <b>X-chromosomaal recessief</b>. Leg uit waarom veel meer <b>jongens</b> dan meisjes kleurenblind zijn.',
 'Een jongen heeft maar <b>één X-chromosoom</b> (XY); op het Y-chromosoom ligt <b>geen allel</b> voor dit gen. Eén recessief allel (X<sup>b</sup>Y) is dus al genoeg om kleurenblind te zijn. Een meisje moet het recessieve allel op <b>beide X-chromosomen</b> hebben (X<sup>b</sup>X<sup>b</sup>); die kans is veel kleiner. Met één X<sup>b</sup> is ze alleen <b>draagster</b>.',
 [['jongen heeft één X (XY), Y heeft geen allel','één x|1 x|een x|maar één|xy|y.{0,30}geen'],
  ['één recessief allel is bij jongen genoeg','genoeg|al kleurenblind|komt.{0,20}uiting|altijd'],
  ['meisje moet twee recessieve allelen hebben (anders draagster)','twee|beide|2 x|draagster|xbxb']]],
['3.4','Mohammed is kleurenblind (X<sup>b</sup>Y). Zijn vrouw is niet kleurenblind, maar wel draagster (X<sup>B</sup>X<sup>b</sup>).<br>Hoe groot is de kans dat een <b>zoon</b> van hen kleurenblind is? En een <b>dochter</b>? Maak een kruisingsschema.',
 'P: X<sup>B</sup>X<sup>b</sup> × X<sup>b</sup>Y. Geslachtscellen moeder: X<sup>B</sup> of X<sup>b</sup>; vader: X<sup>b</sup> of Y.<br>Dochters (X<sup>b</sup> van vader): X<sup>B</sup>X<sup>b</sup> (draagster) of X<sup>b</sup>X<sup>b</sup> (kleurenblind) → <b>50%</b>.<br>Zonen (Y van vader): X<sup>B</sup>Y of X<sup>b</sup>Y → <b>50%</b> kleurenblind.',
 [['schema met geslachtscellen XB of Xb en Xb of Y','xb of xb|xb of y|of y'],
  ['zoon krijgt Y van vader en X van moeder: 50%','zoon.{0,60}50|50.{0,60}zoon|zonen.{0,60}50'],
  ['dochter: 50% (XbXb)','dochter.{0,60}50|50.{0,60}dochter|xbxb']]],
['3.4','Bij fruitvliegen zijn <b>rode ogen (X<sup>A</sup>)</b> dominant over <b>witte ogen (X<sup>a</sup>)</b>. Een vrouwtje met <b>witte</b> ogen wordt gekruist met een mannetje met <b>rode</b> ogen.<br>Geef het kruisingsschema met de F1 en leg uit welke F1-vliegjes draagster zijn.',
 'P: ♀ <b>X<sup>a</sup>X<sup>a</sup></b> × ♂ <b>X<sup>A</sup>Y</b>. Geslachtscellen: X<sup>a</sup> × X<sup>A</sup> of Y.<br>F1: vrouwtjes <b>X<sup>A</sup>X<sup>a</sup></b> (rode ogen) en mannetjes <b>X<sup>a</sup>Y</b> (witte ogen), 1 : 1.<br>De <b>vrouwtjes</b> zijn draagster: ze hebben het allel voor witte ogen, maar hebben zelf rode ogen omdat X<sup>A</sup> dominant is.',
 [['P XaXa × XAY','xaxa|xa ?xa'],
  ['F1 vrouwtjes XAXa met rode ogen','vrouwtje.{0,40}rood|vrouwtje.{0,40}rode|xaxa.{0,30}rood'],
  ['F1 mannetjes XaY met witte ogen','mannetje.{0,40}wit|xay.{0,30}wit'],
  ['vrouwtjes zijn draagster (heterozygoot)','vrouwtje.{0,60}draagster|draagster.{0,60}vrouwtje|heterozygo']]],
['3.4','Bij kippen is het andersom dan bij mensen: een <b>haan is XX</b> en een <b>hen is XY</b>. Het allel voor <b>bruine eierschalen (X<sup>A</sup>)</b> is dominant over wit (X<sup>a</sup>) en ligt op het X-chromosoom. Een haan legt geen eieren, maar heeft deze genen wel.<br>Een hen die witte eieren legt wordt gekruist met een haan die homozygoot is voor bruine eieren. Daarna kruist men de F1 onderling.<br>Welk percentage van de <b>hennen in de F2</b> legt witte eieren? Laat je kruisingsschema zien.',
 'P: hen <b>X<sup>a</sup>Y</b> × haan <b>X<sup>A</sup>X<sup>A</sup></b>. F1: hanen X<sup>A</sup>X<sup>a</sup>, hennen X<sup>A</sup>Y (bruin).<br>F1 × F1: haan X<sup>A</sup>X<sup>a</sup> × hen X<sup>A</sup>Y. Een hen krijgt de <b>Y van haar moeder</b> (de hen) en een <b>X van haar vader</b> (de haan): X<sup>A</sup>Y of X<sup>a</sup>Y.<br>Dus <b>50%</b> van de F2-hennen legt witte eieren.',
 [['P: hen XaY × haan XAXA; F1-haan XAXa','xay|xaxa'],
  ['F2-hen krijgt Y van de hen en X van de haan','y.{0,40}(hen|moeder)|x.{0,40}(haan|vader)'],
  ['50% van de hennen wit','50|helft|½']]],
['3.4','<b>Hemofilie</b> (slechte bloedstolling) erft X-chromosomaal recessief. Koningin Victoria was draagster (X<sup>H</sup>X<sup>h</sup>). Prins Alexej van Rusland was de zoon van Alix, en Alix was een dochter van Alice, een dochter van Victoria.<br>Hoe groot was de kans dat Alexej het allel van Victoria zou erven, als je nog niet weet of Alice en Alix draagster zijn? Laat je berekening zien.',
 'Bij elke stap geeft een draagster het allel met een kans van <b>½</b> door (ze geeft één van haar twee X-chromosomen door). Victoria → dochter: ½; dochter → kleindochter: ½; kleindochter → zoon: ½. Samen: <b>½ × ½ × ½ = 1/8 = 12,5%</b>.',
 [['per generatie een kans van ½ (één van twee X-chromosomen)','½|1/2|helft|50'],
  ['kansen vermenigvuldigen: ½ × ½ × ½','½ ?(x|×) ?½|1/2 ?(x|×) ?1/2|keer'],
  ['uitkomst 1/8 = 12,5%','1/8|12,5|12.5|⅛|een achtste']]],
['3.4','HED is een aandoening waarbij de tanden zich slecht ontwikkelen en je weinig zweet. In een familie zie je dit:<br>• Een man met HED en een gezonde vrouw krijgen <b>drie kinderen</b>: een dochter die draagster is en twee gezonde zonen.<br>• Die dochter trouwt met een gezonde man. Ze krijgen een <b>gezonde zoon</b> en een <b>zoon met HED</b>.<br>• In de hele familie hebben alleen mannen HED.<br>Leg uit hoe je hieruit afleidt dat HED <b>recessief</b> is en dat het <b>X-chromosomaal</b> overerft.',
 '<b>Recessief</b>: een gezonde dochter (draagster) en een gezonde man krijgen een zoon met HED; het allel was er dus wel, maar kwam bij de moeder niet tot uiting.<br><b>X-chromosomaal</b>: de zieke vader geeft zijn <b>X</b> aan zijn <b>dochters</b> (die worden draagster) en zijn <b>Y</b> aan zijn <b>zonen</b> (die zijn gezond). Zijn zieke kleinzoon kreeg het allel via de X van zijn <b>moeder</b>. Ook hebben <b>alleen mannen</b> de aandoening: zij hebben maar één X.',
 [['recessief: gezonde ouders krijgen zieke zoon','gezond.{0,60}(zoon|kind)|recessief|komt niet tot uiting|draagster'],
  ['vader geeft X aan dochters (draagster), Y aan zonen (gezond)','dochter|zonen.{0,40}y|y.{0,40}zon'],
  ['zieke zoon kreeg allel van moeder / alleen mannen ziek','moeder|alleen mannen|vooral mannen|één x|1 x']]],

['3.5','Een moeder heeft bloedgroep <b>A</b> en een vader bloedgroep <b>B</b>. Ze hebben een dochter met bloedgroep A en een zoon met bloedgroep B. Er komt een derde kind.<br>a Wat zijn de genotypen van de ouders? Leg uit.<br>b Kan het derde kind bloedgroep 0 hebben? Zo ja, hoe groot is die kans?',
 'a Moeder <b>I<sup>A</sup>i</b>, vader <b>I<sup>B</sup>i</b>. De dochter heeft A: ze kreeg I<sup>A</sup> van moeder en dus <b>i van vader</b> (met I<sup>B</sup> was ze AB geweest). De zoon heeft B: I<sup>B</sup> van vader en dus <b>i van moeder</b>.<br>b <b>Ja</b>: als het kind van allebei de ouders een i krijgt, is het ii. De kans is ½ × ½ = <b>25%</b>.',
 [['moeder IAi, vader IBi','i ?a ?i|iai|ibi|i ?b ?i|heterozygoot'],
  ['uitleg: dochter kreeg i van vader, zoon i van moeder','dochter|zoon|anders ab|geen ab'],
  ['ja, kans 25%','25|kwart|1/4|¼']]],
['3.5','Derek heeft bloedgroep <b>0</b>. Zijn broer Liam en hun beide ouders hebben bloedgroep <b>A</b>.<br>Kun je met zekerheid zeggen welk genotype de ouders hebben? Leg uit.',
 '<b>Ja</b>: allebei <b>I<sup>A</sup>i</b>. Derek is <b>ii</b>, en hij kreeg van <b>elke ouder één i</b>. Omdat de ouders bloedgroep A hebben, moeten ze daarnaast een <b>I<sup>A</sup></b> hebben.',
 [['ja, beide ouders IAi','ja|iai|i ?a ?i|heterozygoot'],
  ['Derek is ii, kreeg van elke ouder een i','ii|van elke|van beide|allebei een i|elke ouder'],
  ['bloedgroep A, dus ook IA','ook.{0,15}i ?a|bloedgroep a|ia']]],
['3.5','<b>Achondroplasie</b> (een vorm van dwerggroei) erft autosomaal <b>dominant</b> over. Het allel is <b>letaal</b>: homozygote embryo’s (AA) sterven al voor de geboorte. Een man en een vrouw hebben allebei achondroplasie.<br>Hoe groot is de kans dat hun kind <b>geen</b> achondroplasie heeft? Laat je berekening zien.',
 'Beide ouders hebben achondroplasie en leven, dus ze zijn <b>Aa</b> (AA leeft niet). Aa × Aa geeft AA : Aa : aa = 1 : 2 : 1. <b>AA sterft</b> en wordt niet geboren, dus die tel je niet mee. Er blijft over: Aa : aa = <b>2 : 1</b>. De kans op een kind zonder achondroplasie (aa) is <b>1/3 ≈ 33%</b>.',
 [['ouders zijn Aa (AA leeft niet)','aa.{0,10}(x|×).{0,10}aa|heterozygoot|aa leeft niet'],
  ['AA sterft en telt niet mee: 2 : 1','2 ?: ?1|sterft|niet mee|niet geboren|valt af'],
  ['kans 1/3 = 33%','1/3|33|⅓|een derde|één derde']]],
['3.5','Bij muizen is een <b>gele vacht (R)</b> dominant over een donkere vacht (agouti, r). Twee heterozygote gele muizen worden een aantal keren met elkaar gekruist. Er worden <b>115 gele</b> en <b>59 donkere</b> jongen geboren.<br>Leg uit welke bijzondere vorm van overerving hier speelt.',
 'Verwacht bij Rr × Rr is <b>3 : 1</b>. De uitkomst 115 : 59 is ongeveer <b>2 : 1</b>. Het allel R is een <b>letale factor</b>: muizen die <b>RR</b> zijn, sterven al als embryo en worden niet geboren. Dan blijft Rr : rr = 2 : 1 over.',
 [['gevonden verhouding ongeveer 2 : 1 (verwacht 3 : 1)','2 ?: ?1'],
  ['letale factor','letaal|letale'],
  ['RR sterft (homozygoot dominant niet levensvatbaar)','rr.{0,30}(sterf|dood|niet)|homozygoot|sterven|niet levensvatbaar|niet geboren']]],
['3.5','Stel: bij mensen liggen de genen voor haarkleur en oogkleur op hetzelfde chromosoom. Bruin haar (A) en bruine ogen (B) liggen samen op één chromosoom, blond haar (a) en blauwe ogen (b) ook. Een vrouw is heterozygoot voor allebei (<b>AB/ab</b>). Ze krijgt kinderen met een man met blond haar en blauwe ogen.<br>Hoe groot is de kans op een kind met <b>blond haar en blauwe ogen</b>? Maak een kruisingsschema.',
 'De man is <b>ab/ab</b>. Kruising: <b>AB/ab × ab/ab</b>. De genen zijn <b>gekoppeld</b>, dus de vrouw maakt maar twee soorten eicellen: <b>AB of ab</b>. De man maakt alleen zaadcellen ab. Kinderen: AB/ab (bruin haar, bruine ogen) of ab/ab (blond, blauw), 1 : 1. De kans is <b>50%</b>.',
 [['man ab/ab; kruising AB/ab × ab/ab','ab ?\\/ ?ab'],
  ['gekoppeld: vrouw maakt alleen eicellen AB of ab','gekoppeld|ab of ab|twee soorten|2 soorten|samen'],
  ['kans 50%','50|helft|½|1/2']]],
['3.5','Bij konijnen is langharig (A) dominant over kortharig (a) en zijn rechte oren (B) dominant over hangende oren (b). De genen liggen op hetzelfde chromosoom. Een <b>langharig mannetje met hangende oren</b> wordt gekruist met een <b>kortharig vrouwtje met rechte oren</b>; beide zijn homozygoot. De F1 wordt onderling gekruist.<br>a Welke allelen zijn gekoppeld?<br>b Welke fenotypen krijg je in de F2 en in welke verhouding? Laat je kruisingsschema zien.',
 'a <b>A met b</b> (bij het mannetje) en <b>a met B</b> (bij het vrouwtje).<br>b P: Ab/Ab × aB/aB → F1: <b>Ab/aB</b> (langharig, rechte oren). F1 × F1: geslachtscellen Ab of aB. F2: 1 Ab/Ab (langharig, hangende oren), 2 Ab/aB (langharig, rechte oren), 1 aB/aB (kortharig, rechte oren).<br>Verhouding <b>langharig-recht : langharig-hangend : kortharig-recht = 2 : 1 : 1</b>. Kortharig met hangende oren komt niet voor.',
 [['A gekoppeld met b, a met B','a met b|ab ?\\/ ?ab|a en b'],

function kruisVraag(){const soort=pick(['dom','dom','dom','int','x','x','abo','let']);let man,vrouw,fen,vr,intro,welke,alle;

 else if(soort==='abo'){const G=[['IA','IA'],['IA','i'],['IB','IB'],['IB','i'],['IA','IB'],['i','i']];man=pick(G);vrouw=pick(G);
  fen=g=>g.includes('IA')&&g.includes('IB')?'AB':g.includes('IA')?'A':g.includes('IB')?'B':'O';welke=pick(['A','B','AB','O']);

 else{man=['M','m'];vrouw=['M','m'];fen=g=>g[0]==='M'&&g[1]==='M'?'dood':g.includes('M')?'zonder staart':'met staart';welke=pick(['zonder staart','met staart']);
  intro=`Bij manxkatten is het allel voor <b>geen staart</b> (M) dominant, maar <b>MM is letaal</b>: zo’n jong sterft al vóór de geboorte. Je kruist twee staartloze katten (Mm × Mm).`;

 const gm=uniq(man),gv=uniq(vrouw);let cel=[];gm.forEach(m=>gv.forEach(v=>cel.push([m,v])));

 else{const p=pr(k,n);goed=p+'%';opts=[goed,...shuffle([0,25,50,75,100].filter(x=>x!==p)).slice(0,3).map(x=>x+'%')]}
 const kleur=(m,v)=>{const c=[m,v];if(soort==='x'&&alle!=='kinderen'&&(alle==='zonen')!==c.includes('Y'))return false;return fen(c)===welke};

 return {q:intro+'<br>'+vr,a:goed,opts,w}}

  <div class="opunt"><div class="label">Had jij dit? (1 punt per vinkje)</div>${q[3].map((p,k)=>{let ok=false;try{ok=new RegExp(p[1],'i').test(t)}catch(e){}return `<label><input type="checkbox" data-p="${i}-${k}"${ok?' checked':''}> ${p[0]}</label>`}).join('')}</div></div>`}).join('')}
 <div class="kaart" id="ouit"></div>`;
 const tel=()=>{const c=P.querySelectorAll('[data-p]'),g=[...c].filter(x=>x.checked).length,f=c.length?g/c.length:0,cijfer=Math.round((1+9*f)*10)/10;$('#osc').textContent=`${g}/${c.length} punten`;
  $('#ouit').innerHTML=`<h3>Score: ${g} van de ${c.length} punten · cijfer ${nf(cijfer)}</h3><p class="sub">${f>=.8?'Super! Dit kun je op de toets ook.':f>=.6?'Goed bezig. Kijk nog even naar de punten die je miste.':'Lees de goede antwoorden nog eens rustig door, en probeer het daarna opnieuw.'}</p><div class="acts"><button class="btn" id="obew">Score bewaren</button><button class="btn licht" id="oopn">Opnieuw</button></div>`;
  $('#obew').onclick=()=>{if(sec)o.per[sec]=Math.max(o.per[sec]||0,f);else o.best=Math.max(o.best||0,f);save();$('#obew').textContent='Bewaard ✓';$('#obew').disabled=true;const n=document.createElement('button');n.className='btn licht';n.textContent=RT.on?'Terug naar de route':'Naar het menu';n.onclick=()=>RT.on?goHome():openMenu();$('#obew').after(n)};
  $('#oopn').onclick=()=>sec?openSet(qs,titel,sec):openProefwerk()};
 P.querySelectorAll('[data-p]').forEach(x=>x.onchange=tel);tel();$('#terug').onclick=()=>openSet(qs,titel,sec)}

/* ---------- begrippenblitz ---------- */
function blitz(){stilte();let punten=0,eind=Date.now()+60000;show('play');
 const vraag=()=>{if(Date.now()>=eind)return stop();const b=pick(BEGR),rev=Math.random()<.5;const fout=shuffle(BEGR.filter(x=>x!==b)).slice(0,2);const goedT=rev?b[0]:b[1];const opts=shuffle([goedT,...fout.map(x=>rev?x[0]:x[1])]);
  P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="teller ok">${punten} punten</span><span class="teller" id="tijd">60 s</span></div>
  <div class="kaart"><div class="label">${rev?'Welk begrip hoort hierbij?':'Wat betekent dit begrip?'}</div><div class="vraag">${rev?b[1]:b[0]}</div><div class="opts">${opts.map((x,k)=>`<button class="opt" data-k="${k}">${x}</button>`).join('')}</div><div id="fb"></div></div>`;
  tik();$('#stop').onclick=goHome;
  P.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{if(P.querySelector('.opt.goed'))return;const ok=opts[+x.dataset.k]===goedT;P.querySelectorAll('.opt').forEach((y,k)=>{if(opts[k]===goedT)y.classList.add('goed');else if(y===x)y.classList.add('fout')});
   if(ok){punten++;setTimeout(vraag,350)}else{$('#fb').innerHTML=`<div class="uitleg"><b class="fout-t">Fout.</b> <b>${b[0]}</b> = ${b[1]}.</div><div class="acts"><button class="btn" id="vd">Verder ↵</button></div>`;$('#vd').onclick=vraag;$('#vd').focus()}})};
 const tik=()=>{const e=$('#tijd');if(e)e.textContent=Math.max(0,Math.ceil((eind-Date.now())/1000))+' s'};
 const stop=()=>{clearInterval(window.__klok);const rec=punten>S.blitz;if(rec)S.blitz=punten;save();
  P.innerHTML=`<div class="kaart" style="text-align:center"><div class="label">Begrippenblitz</div><div class="groot">${punten}</div><p>${rec?'Nieuw record! 🎉':`Record: ${S.blitz}`}${S.blitz>=15?'':' · doel: 15'}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een keer</button>${terugKnop()}</div></div>`;
  $('#opn').onclick=blitz;$('#hm').onclick=goHome};
 window.__klok=setInterval(()=>{tik();if(Date.now()>=eind&&!P.querySelector('#vd'))stop()},250);vraag()}

/* ---------- alles nalezen ---------- */
function samen(){stilte();S.samen=1;save();show('play');
 P.innerHTML=`<div class="top"><button class="btn licht klein" id="terug">‹ Terug</button><span class="stap">Alles nog eens lezen</span><span></span></div>
 <div class="kaart"><p style="margin:0"><b>Thema 3 Genetica.</b> Hoe eigenschappen van ouders op kinderen overgaan: chromosomen, genen en allelen, dominant en recessief, kruisingsschema’s, stambomen, X-chromosomale overerving, bloedgroepen en de invloed van het milieu. Op het examen gaat het vooral om <b>stambomen lezen</b> (dominant of recessief, welk genotype, ‘met zekerheid’) en <b>kansen uitrekenen met een kruisingsschema</b>.</p></div>
 ${H.map(h=>`<h2>${h.ic} ${h.id} ${h.t}</h2>${h.lp.map(c=>`<div class="kaart"><h3>${c[0]}</h3>${c[1]}</div>`).join('')}`).join('')}
 <h2>Begrippen</h2><div class="kaart"><dl class="begr">${BEGR.map(b=>`<dt>${b[0]}</dt><dd>${b[1]}</dd>`).join('')}</dl></div>
 <div class="acts"><button class="btn licht" id="terug2">‹ Terug</button></div>`;$('#terug').onclick=goHome;$('#terug2').onclick=goHome}

renderHome();

</script>
</body>
