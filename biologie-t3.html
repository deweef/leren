const MCQ={
'3.1':[
['Wat is het fenotype van een individu?','Alle waarneembare eigenschappen van dat individu','De informatie voor alle erfelijke eigenschappen|Alle DNA-moleculen in één cel|Een variant van een gen','Het fenotype is alles wat je kunt waarnemen (ook met onderzoek). De informatie voor de erfelijke eigenschappen is het genotype, alle DNA in een cel is het genoom en een variant van een gen is een allel.'],
['Wat is het genotype van een individu?','De informatie voor alle erfelijke eigenschappen van dat individu','Alle waarneembare eigenschappen|De invloed van het milieu op het uiterlijk|Het aantal chromosomen in een geslachtscel','Het genotype is de erfelijke informatie, opgeslagen in de chromosomen. Waarneembare eigenschappen vormen het fenotype; dat ontstaat door genotype én milieu.'],
['Op welk moment ligt het genotype van een mens vast?','Bij de bevruchting','Bij de geboorte|In de puberteit|Als het embryo in de baarmoeder innestelt','Als zaadcel en eicel versmelten, komen de chromosomen van vader en moeder samen in de bevruchte eicel. Vanaf dat moment ligt het genotype vast. Wat later gebeurt, verandert het fenotype, niet het genotype.'],
['Hoeveel procent van je genotype komt van je vader?','50%','25%|75%|100%','Je krijgt van elk chromosomenpaar één chromosoom van je vader (via de zaadcel) en één van je moeder (via de eicel). De helft komt dus van je vader.'],
['Hoort je bloedgroep bij je fenotype?','Ja, want je kunt hem met onderzoek waarnemen','Nee, alleen wat je met het blote oog ziet hoort bij het fenotype|Nee, een bloedgroep hoort alleen bij het genotype|Alleen als je ooit een bloedtransfusie hebt gehad','Fenotype = alle waarneembare eigenschappen, ook als je ze alleen met onderzoek kunt vaststellen, zoals bloedgroep of kleurenblindheid. Het genotype is de informatie erachter.'],
['Hoeveel chromosomen zitten er in een gewone lichaamscel van een mens?','46 (23 paar)','23|44|92','Een menselijke lichaamscel heeft 46 chromosomen in 23 paren. 23 is het aantal in een geslachtscel, 44 is het aantal autosomen.'],
['Hoeveel autosomen heeft een menselijke lichaamscel?','44 (22 paar)','46 (23 paar)|22|2','De 22 paren die bij man en vrouw gelijk zijn heten autosomen: 44 chromosomen. Het 23e paar zijn de geslachtschromosomen, dus 46 is het totaal en niet het aantal autosomen.'],
['Wat zijn homologe chromosomen?','Twee chromosomen van één paar, gelijk in lengte en vorm, met genen voor dezelfde eigenschappen','Twee chromosomen met precies dezelfde allelen|Het X- en het Y-chromosoom van een man|Twee chromosomen uit dezelfde geslachtscel','Homologe chromosomen hebben genen voor dezelfde eigenschappen op dezelfde plek, maar de allelen kunnen verschillen. X en Y zijn juist níet homoloog, en een geslachtscel heeft van elk paar maar één chromosoom.'],
['Een vrouw heeft 23 paar homologe chromosomen, een man maar 22. Hoe komt dat?','Het X- en het Y-chromosoom verschillen in lengte en vorm, dus ze zijn niet homoloog','Een man heeft minder chromosomen dan een vrouw|Een man heeft geen X-chromosoom|Het Y-chromosoom ligt buiten de celkern','Man en vrouw hebben allebei 46 chromosomen. Bij de man vormen X en Y wel een paar, maar het Y-chromosoom is veel kleiner. Daarom tellen ze niet als homoloog.'],
['Wat is een karyogram?','De chromosomen van één cel, op grootte in paren gerangschikt','Een schema van een familie met vierkantjes en rondjes|Een tabel met alle combinaties van geslachtscellen|Een tekening van de dubbele spiraal van DNA','Een karyogram (chromosomenportret) laat de chromosomen van een cel geordend zien, BiNaS tabel 70B. Een familieschema is een stamboom, een tabel met geslachtscellen is een kruisingsschema.'],
['Wanneer kun je chromosomen met een lichtmicroscoop zien?','Alleen in cellen die zich aan het delen zijn','In elke cel, op elk moment|Alleen in geslachtscellen|Nooit, daarvoor is altijd een DNA-test nodig','Chromosomen zijn lange dunne draden. Alleen tijdens de celdeling zijn ze zo opgerold dat je ze met een lichtmicroscoop ziet.'],
['Waaruit bestaat één nucleotide?','Een fosfaatgroep, desoxyribose en een stikstofbase','Een fosfaatgroep, glucose en een aminozuur|Twee stikstofbasen en een eiwit|Desoxyribose en vier stikstofbasen','Een nucleotide is de bouwsteen van DNA: fosfaatgroep + suiker (desoxyribose) + één van de vier stikstofbasen. Aminozuren zijn bouwstenen van eiwitten.'],
['Met welke stikstofbase vormt adenine (A) altijd een paar?','Thymine (T)','Cytosine (C)|Guanine (G)|Adenine (A)','Vaste basenparing: A met T en C met G.'],
['Eén keten van een stukje DNA heeft de basen A C G T T. Welke basen staan er tegenover in de andere keten?','T G C A A','A C G T T|G T A C C|C A T G G','Vaste basenparing: A tegenover T, C tegenover G, G tegenover C, T tegenover A. Dus A C G T T wordt T G C A A. De andere rijtjes houden zich niet aan A-T en C-G.'],
['Wat is een allel?','Een variant van een gen, met een andere volgorde van basen','Het stuk DNA met de informatie voor alle eigenschappen|De twee chromosomen van een paar|Eén bouwsteen van DNA','Een gen kan in varianten voorkomen, bijvoorbeeld voor zwart of blond haar. Zo’n variant heet een allel. Een bouwsteen van DNA is een nucleotide.'],
['Welke rij staat in de goede volgorde van groot naar klein?','genoom, chromosoom, gen, nucleotide, stikstofbase','chromosoom, genoom, gen, nucleotide, stikstofbase|genoom, gen, chromosoom, nucleotide, stikstofbase|genoom, chromosoom, nucleotide, gen, stikstofbase','Het genoom is al het DNA van een cel en bestaat uit chromosomen. Op een chromosoom liggen veel genen; een gen bestaat uit honderden nucleotiden en één nucleotide bevat één stikstofbase.'],
['Wat is het genoom?','Alle DNA-moleculen in een cel','Alle genen op één chromosoom|Alle waarneembare eigenschappen|De twee allelen voor één eigenschap','Het genoom is al het DNA in een cel: in de kern, maar ook in mitochondriën en (bij planten) bladgroenkorrels.'],
['Waar zit DNA buiten de celkern?','In mitochondriën en bladgroenkorrels','In ribosomen en het celmembraan|In de vacuole en de celwand|Nergens, DNA zit alleen in de kern','Het meeste DNA zit in de kern, maar mitochondriën en bladgroenkorrels hebben ook een beetje eigen DNA. Dat hoort ook bij het genoom.'],
['Hebben een zenuwcel en een spiercel van jou hetzelfde genotype?','Ja, maar in elke celsoort staan andere genen aan en uit','Nee, elke celsoort heeft zijn eigen DNA|Nee, een spiercel mist de genen voor zenuwcellen|Ja, en in beide staan precies dezelfde genen aan','Alle lichaamscellen komen uit dezelfde bevruchte eicel en hebben hetzelfde DNA. Ze verschillen doordat er andere genen aan (genexpressie) en uit (geninactivatie) staan.'],
['Wat is genexpressie?','Een gen staat aan, waardoor de eigenschap tot uiting komt','Een gen wordt uitgezet|Een allel verandert door een mutatie|Een gen wordt aan een nakomeling doorgegeven','Genexpressie = gen aan, eigenschap komt tot uiting. Gen uit heet geninactivatie. Een verandering in het DNA is een mutatie.'],
['Een levercel bevat genen voor hoofdhaar. Waarom groeit er geen haar uit je lever?','Die genen staan in levercellen uit (geninactivatie)','Levercellen hebben die genen niet|Die genen staan in levercellen aan|De genen zijn in levercellen gemuteerd','Elke cel heeft hetzelfde DNA, dus ook levercellen hebben genen voor hoofdhaar. Ze staan daar alleen uit; in de hoofdhuid staan ze aan.'],
['Wat is een modificatie?','Een verandering in het fenotype door milieufactoren, die niet erfelijk is','Een verandering in het DNA die wordt doorgegeven|Een variant van een gen|Een afwijking in het aantal chromosomen','Bij een modificatie verandert het fenotype door de omgeving, maar het DNA niet. Daarom wordt een modificatie niet doorgegeven. Een verandering in het DNA is een mutatie.'],
['Welke eigenschap is een modificatie?','Blonde haren door een behandeling bij de kapper','Blonde haren vanaf de geboorte|Behaarde bladeren bij een geranium|Bloedgroep A','Geverfd haar komt door een milieufactor en wordt niet doorgegeven. Blond haar vanaf de geboorte, behaarde bladeren en bloedgroep zijn erfelijk.'],
['Het foetaal alcoholsyndroom ontstaat doordat de moeder alcohol drinkt tijdens de zwangerschap. Wat klopt?','Het is aangeboren, maar niet erfelijk','Het is erfelijk en aangeboren|Het is erfelijk, maar niet aangeboren|Het is niet aangeboren en niet erfelijk','Het ontstaat in de baarmoeder, dus het is aangeboren. Het komt door een milieufactor (alcohol), niet door de chromosomen van de ouders, dus het is niet erfelijk: een modificatie.'],
['Een mannetjesleeuw krijgt manen als hij volwassen wordt. Wat verandert er?','Alleen het fenotype','Alleen het genotype|Het fenotype en het genotype|Niets','Het genotype ligt vast sinds de bevruchting. De genen voor manen komen nu tot uiting, dus alleen het waarneembare (het fenotype) verandert.'],
['Hoe ontstaat het fenotype?','Door het genotype samen met milieufactoren','Alleen door het genotype|Alleen door milieufactoren|Alleen door de allelen van de moeder','Fenotype = genotype + milieufactoren. Het genotype bepaalt veel, maar licht, voeding, temperatuur, ziekte en opvoeding hebben ook invloed.'],
['Wat is de oorzaak van het syndroom van Down?','Een extra chromosoom 21','Een extra chromosoom 13|Een extra X-chromosoom bij een jongen|Eén X-chromosoom te weinig','Down = trisomie 21 (drie keer chromosoom 21). Een extra chromosoom 13 is Patau, XXY is Klinefelter en X0 is Turner.'],
['Een karyogram laat 44 autosomen zien en de geslachtschromosomen XXY. Welk syndroom is dit?','Klinefelter','Turner|Down|Patau','Klinefelter: een jongen (er is een Y) met twee of meer X-chromosomen. Turner is een meisje met één X, Down en Patau gaan over een extra autosoom (21 of 13).'],
['Een karyogram heeft bij de geslachtschromosomen maar één X en geen Y. Welk syndroom is dit?','Turner','Klinefelter|Down|Patau','Eén X en geen Y: een meisje met een X-chromosoom te weinig, het syndroom van Turner. Klinefelter heeft juist een X te veel (XXY).'],
['Het COMT-gen beïnvloedt hoe gevoelig je bent voor een psychose door blowen. Verandert blowen je genotype?','Nee, alleen je fenotype kan veranderen','Ja, de Val-allelen veranderen in Met-allelen|Ja, er komt een extra chromosoom 22 bij|Nee, want blowen heeft geen enkel effect op je lichaam','Blowen is een milieufactor: het DNA verandert niet, maar het fenotype (bijvoorbeeld een psychose) wel. Blowen heeft dus wel effect, alleen niet op je genotype.'],
['Iemand heeft het COMT-genotype Met/Met. Wat klopt?','Hij heeft de kleinste kans op een psychose door blowen, maar geen garantie','Hij krijgt nooit een psychose door blowen|Hij heeft het grootste risico op een psychose door blowen|Hij is heterozygoot voor het COMT-gen','Met/Met geeft het kleinste risico, maar andere genen en milieufactoren spelen ook mee. Het grootste risico hoort bij Val/Val, en Met/Met is homozygoot (twee dezelfde allelen).'],
['Wat is een gen?','Een deel van een chromosoom met informatie voor (een deel van) een erfelijke eigenschap','Een heel chromosoom|Een bouwsteen van DNA|Alle chromosomen van één cel','Een chromosoom bevat veel genen. Een gen bestaat uit honderden nucleotiden in een bepaalde volgorde. Vaak werken meerdere genen samen aan één eigenschap, zoals oogkleur.']
],
'3.2':[
['Wanneer is iemand homozygoot voor een eigenschap?','Als hij twee dezelfde allelen voor die eigenschap heeft','Als hij twee verschillende allelen heeft|Als hij maar één allel heeft|Als er drie of meer allelen bestaan','Homozygoot = twee gelijke allelen (AA of aa). Twee verschillende allelen is heterozygoot. Drie of meer allelen in de bevolking heet multipele allelen.'],
['Welk genotype is heterozygoot?','Aa','AA|aa|A','Heterozygoot = twee verschillende allelen, dus een hoofdletter en een kleine letter. AA en aa zijn homozygoot; één letter is een geslachtscel.'],
['Wat is een dominant allel?','Een allel dat bij een heterozygoot tot uiting komt','Een allel dat alleen tot uiting komt als het dubbel aanwezig is|Een allel dat nooit tot uiting komt|Een allel dat altijd op het X-chromosoom ligt','Bij Aa zie je de eigenschap van A: A is dominant. Een allel dat alleen tot uiting komt als het dubbel aanwezig is, is recessief.'],
['Iemand heeft het recessieve fenotype. Wat weet je dan zeker van zijn genotype?','Hij is homozygoot recessief (aa)','Hij is heterozygoot (Aa)|Hij is homozygoot dominant (AA)|Hij kan AA of Aa zijn','Een recessief allel komt alleen tot uiting als er geen dominant allel is. Het recessieve fenotype hoort dus altijd bij aa.'],
['Iemand heeft het dominante fenotype. Wat weet je van zijn genotype?','Het kan AA of Aa zijn','Het is zeker AA|Het is zeker Aa|Het is zeker aa','Bij AA én bij Aa komt het dominante allel tot uiting. Aan het fenotype zie je dus niet welk van de twee het is.'],
['Wat is een drager?','Iemand die heterozygoot is: hij heeft het recessieve allel, maar je ziet het niet','Iemand die homozygoot recessief is en de eigenschap dus heeft|Iemand die homozygoot dominant is|Iemand die het recessieve allel helemaal niet heeft','Een drager (Aa) draagt het recessieve allel bij zich zonder dat het in het fenotype te zien is. Hij kan het wel doorgeven.'],
['Een V-vormige haarlijn is dominant over een rechte haarlijn. Welke haarlijn heeft een heterozygote man?','Een V-vormige haarlijn','Een rechte haarlijn|Een tussenvorm tussen recht en V-vormig|Dat verschilt per keer dat hij in de spiegel kijkt','Bij een heterozygoot komt het dominante allel tot uiting: V-vormig. Een tussenvorm hoort bij onvolledige dominantie, en dat is bij de haarlijn niet zo.'],
['Bruin is onvolledig dominant over blauw bij oogkleur. Wat klopt?','Iemand die homozygoot bruin is, heeft donkerdere ogen dan iemand die heterozygoot is','Iemand die heterozygoot is, heeft donkerdere ogen dan iemand die homozygoot bruin is|Homozygoot bruin en heterozygoot zijn precies even bruin|Iemand die heterozygoot is, heeft blauwe ogen','Bij onvolledige dominantie komt het recessieve allel een beetje tot uiting. Heterozygoten hebben daardoor lichtere (hazel)bruine ogen dan homozygoot bruine mensen.'],
['Bij leeuwenbekjes geeft A<sup>R</sup> rode en A<sup>W</sup> witte bloemen. Welke kleur heeft een plant met A<sup>R</sup>A<sup>W</sup>?','Roze','Rood|Wit|Rood met witte vlekken','Bij leeuwenbekjes zijn beide allelen onvolledig dominant: de heterozygoot heeft een tussenvorm, roze. Dat heet een intermediair fenotype. Vlekken zou codominantie zijn.'],
['Welk voorbeeld laat codominantie zien?','Een zwart-wit gevlekt Holsteiner kalf','Een roze leeuwenbekje|Lichtbruine ogen bij een heterozygoot|Een rode erwtenbloem bij een heterozygoot','Bij codominantie komen beide allelen volledig tot uiting, naast elkaar: zwarte én witte vlekken. Roze en lichtbruin zijn tussenvormen (onvolledig dominant), en de rode erwt is volledige dominantie.'],
['Wat is het verschil tussen een intermediair fenotype en codominantie?','Intermediair is een mengvorm, bij codominantie zie je beide eigenschappen volledig naast elkaar','Bij codominantie is er een mengvorm, intermediair zijn beide eigenschappen volledig naast elkaar|Er is geen verschil, het zijn twee woorden voor hetzelfde|Intermediair komt alleen bij dieren voor, codominantie alleen bij planten','Intermediair: rood × wit geeft roze (mengvorm). Codominant: zwart en wit naast elkaar (vlekken) of bloedgroep AB. Beide komen bij planten en dieren voor.'],
['Bij erwten is rood dominant over wit. Welke kleur heeft een heterozygote erwtenplant?','Rood','Roze|Wit|Rood-wit gevlekt','Welk allel dominant is, verschilt per soort. Bij leeuwenbekjes geeft heterozygoot roze, maar bij erwten is rood volledig dominant, dus de bloem is rood.'],
['Je kiest een letter voor een allelenpaar. Welk paar is het handigst?','R en r','P en p|S en s|O en o','Kies een letter waarvan de hoofdletter en de kleine letter duidelijk verschillen. Bij P/p, S/s en O/o zie je dat in je handschrift slecht.'],
['Hoe noteer je het genotype van een wit leeuwenbekje?','A<sup>W</sup>A<sup>W</sup>','A<sup>R</sup>A<sup>W</sup>|A<sup>R</sup>A<sup>R</sup>|Ww','Als beide allelen tot uiting komen, gebruik je een hoofdletter met een superscript. Wit is homozygoot: A<sup>W</sup>A<sup>W</sup>. A<sup>R</sup>A<sup>W</sup> is roze, A<sup>R</sup>A<sup>R</sup> rood.'],
['Hoeveel allelen voor oogkleur zitten er (per gen) in een cel van je oog?','2','1|4|46','Een lichaamscel is diploïd: genen komen in paren voor, dus twee allelen per gen.'],
['Hoeveel allelen voor oogkleur zitten er (per gen) in een zaadcel?','1','2|0|23','Een geslachtscel is haploïd: van elk chromosomenpaar zit er één chromosoom in, dus één allel per gen.'],
['Bevat een spiercel ook allelen voor oogkleur?','Ja, twee, maar het gen staat in een spiercel uit','Nee, alleen oogcellen hebben die allelen|Ja, maar maar één|Nee, die zijn bij de celdeling verdwenen','Elke lichaamscel heeft al het DNA, dus ook twee allelen voor oogkleur. In een spiercel staat dat gen alleen uit (geninactivatie).'],
['Een cel heeft de genenparen AA, Bb, rr en Gg. Voor hoeveel van deze eigenschappen is de persoon homozygoot?','2','1|3|4','Homozygoot = twee dezelfde letters: AA en rr. Bb en Gg zijn heterozygoot. Dus 2.'],
['Wat is recombinatie?','Het herverdelen van erfelijke eigenschappen, waardoor nieuwe combinaties van allelen ontstaan','Een verandering in het DNA|Het uitzetten van genen|Het maken van een kloon','Door recombinatie krijgt een nakomeling een andere combinatie van allelen dan beide ouders. Een verandering in het DNA is een mutatie.'],
['Waardoor ontstaat recombinatie?','Door meiose en geslachtelijke voortplanting','Door mitose en groei|Alleen door mutaties|Door ongeslachtelijke voortplanting','Bij meiose worden de chromosomen willekeurig over de geslachtscellen verdeeld, bij de bevruchting komen allelen van twee ouders samen. Bij ongeslachtelijke voortplanting en mitose blijft het genotype gelijk.'],
['In welke fase worden de chromosomen van elk paar willekeurig over de dochtercellen verdeeld?','Meiose I','Meiose II|Mitose|Na de bevruchting','In meiose I gaan de homologe chromosomen uit elkaar; welk chromosoom naar welke cel gaat is toeval. Bij mitose krijgen beide cellen alles. Bij de bevruchting komen chromosomen juist samen.'],
['Een soort heeft 6 chromosomen in een lichaamscel (2n = 6). Hoeveel verschillende combinaties van chromosomen kunnen de geslachtscellen hebben?','8','6|3|64','Stap 1: n = 6 ÷ 2 = 3 paren. Stap 2: 2<sup>n</sup> = 2<sup>3</sup> = 2 × 2 × 2 = 8. 6 is het aantal chromosomen, 3 het aantal paren en 64 is 2<sup>6</sup> (dan reken je met 2n).'],
['Een fruitvlieg heeft 8 chromosomen in een lichaamscel. Hoeveel verschillende combinaties van chromosomen zijn er mogelijk in de geslachtscellen?','16','8|4|256','n = 8 ÷ 2 = 4 paren, dus 2<sup>4</sup> = 16. 256 is 2<sup>8</sup>: dan heb je met alle chromosomen gerekend in plaats van met de paren.'],
['Hoeveel verschillende combinaties van chromosomen kan een geslachtscel van een mens hebben?','2<sup>23</sup> (ongeveer 8,4 miljoen)','2 × 23 = 46|23<sup>2</sup> = 529|2<sup>46</sup>','De mens heeft 23 paren, dus 2<sup>n</sup> = 2<sup>23</sup> ≈ 8,4 miljoen. Je moet 2 tot de macht n doen (niet keer), en n is het aantal paren (23), niet 46.'],
['Een diersoort heeft 10 chromosomen in een lichaamscel. Hoeveel verschillende combinaties van chromosomen zijn er in de geslachtscellen?','32','10|25|1024','n = 10 ÷ 2 = 5 paren, dus 2<sup>5</sup> = 32. 1024 is 2<sup>10</sup> (met alle chromosomen gerekend) en 25 is 5<sup>2</sup>.'],
['Een fruitvlieg heeft 8 chromosomen per lichaamscel. Hoeveel paar homologe chromosomen zitten er in een zaadcel?','0','4|8|2','Een zaadcel is haploïd: hij heeft 4 chromosomen, van elk paar één. Er zijn dus geen paren in een zaadcel.'],
['Waarom is genetische variatie belangrijk voor een soort?','Als het milieu verandert, is de kans groter dat sommige individuen goed passen en overleven','Dan zijn alle individuen gelijk en even sterk|Dan ontstaan er minder mutaties|Dan groeien de individuen sneller','Bij veel verschillende genotypen hebben enkele individuen waarschijnlijk een genotype dat bij nieuwe omstandigheden past. Zo sterft de soort minder snel uit.'],
['Waardoor ontstaat genetische variatie?','Door recombinatie en mutaties','Alleen door modificaties|Alleen door milieufactoren|Door ongeslachtelijke voortplanting','Recombinatie (meiose + bevruchting) en mutaties (veranderingen in het DNA) zorgen voor nieuwe genotypen. Modificaties zijn niet erfelijk en ongeslachtelijke voortplanting geeft juist geen variatie.'],
['Hoe ontstaat een eeneiige tweeling?','Uit één eicel en één zaadcel; het klompje cellen splitst zich in tweeën','Uit twee eicellen en twee zaadcellen|Uit één eicel en twee zaadcellen|Uit twee eicellen en één zaadcel','De zygote deelt zich tot een klompje cellen dat in tweeën splitst. Daarom hebben beide kinderen hetzelfde genotype. Een twee-eiige tweeling komt uit twee eicellen en twee zaadcellen.'],
['Een tweeling bestaat uit een jongen en een meisje. Wat voor tweeling is dit?','Altijd een twee-eiige tweeling','Altijd een eeneiige tweeling|Dat kan allebei|Eeneiig, als ze erg op elkaar lijken','Een eeneiige tweeling heeft hetzelfde genotype, dus ook dezelfde geslachtschromosomen. Een jongen (XY) en een meisje (XX) moeten dus twee-eiig zijn.'],
['Een plant met genotype Aa plant zich ongeslachtelijk voort. Welk genotype hebben de nakomelingen?','Allemaal Aa','AA, Aa of aa|Allemaal AA|Allemaal aa','Bij ongeslachtelijke voortplanting is er geen meiose en geen bevruchting, dus geen recombinatie: de nakomelingen zijn genetisch gelijk aan de ouder. AA, Aa of aa krijg je bij geslachtelijke voortplanting van twee Aa-ouders.'],
['Bij cavia’s is een korte vacht dominant over een lange vacht. Kun je bij een langharige cavia het genotype afleiden?','Ja, hij is zeker homozygoot recessief','Nee, hij kan homozygoot of heterozygoot zijn|Ja, hij is zeker heterozygoot|Nee, daarvoor is altijd een testkruising nodig','Lang haar is recessief en komt alleen tot uiting bij aa. Een testkruising heb je alleen nodig bij het dominante fenotype (AA of Aa).'],
['Florence is heterozygoot (Ff) voor kuiltjes in haar wangen en ze heeft kuiltjes. Wat weet je hierdoor?','Het allel voor kuiltjes is dominant','Het allel voor kuiltjes is recessief|Kuiltjes erven intermediair over|Het gen voor kuiltjes ligt op het X-chromosoom','Bij een heterozygoot komt het dominante allel tot uiting. Florence heeft kuiltjes, dus F (kuiltjes) is dominant. Een recessief allel zou je bij Ff niet zien.'],
['Een veredelaar kruist twee homozygote ouderrassen tomaten (AA × aa). Welk genotype hebben de F1-hybriden?','Allemaal heterozygoot (Aa)','Allemaal homozygoot dominant (AA)|Allemaal homozygoot recessief (aa)|De helft AA en de helft aa','Ouder 1 geeft altijd A, ouder 2 altijd a. Elke nakomeling wordt dus Aa. Daarom willen veredelaars homozygote ouderrassen: de uitkomst is voorspelbaar.']
],
'3.3':[
['Wat is een monohybride kruising?','Een kruising waarbij je let op één eigenschap, met één allelenpaar','Een kruising waarbij je let op twee eigenschappen tegelijk|Een kruising tussen twee organismen van verschillende soorten|Een kruising waarbij een plant zich ongeslachtelijk voortplant','Mono = één: je volgt de overerving van één eigenschap, dus één allelenpaar.'],
['Waar staat P voor in een kruisingsschema?','De oudergeneratie','De eerste generatie nakomelingen|De tweede generatie nakomelingen|De planten na zelfbestuiving','P komt van parentes (ouders). F1 en F2 zijn de eerste en tweede generatie nakomelingen (filii = kinderen).'],
['Hoe ontstaat de F2?','Door F1-individuen onderling te kruisen (of door zelfbestuiving van de F1)','Door de P met de F1 te kruisen|Door de P opnieuw met elkaar te kruisen|Door een F1-individu met een homozygoot recessief individu te kruisen','F2 = de nakomelingen van de F1 onderling. Bij planten kan dat ook door zelfbestuiving van F1-planten. Een F1 met aa kruisen is een testkruising (of terugkruising).'],
['Welke afspraak geldt in het boek voor een kruisingsschema?','Allelen van de zaadcellen links, allelen van de eicellen boven','Allelen van de eicellen links, allelen van de zaadcellen boven|Dominante allelen links, recessieve allelen boven|Genotypen van de ouders in de vakjes, nakomelingen erbuiten','Afspraak: ♂ (zaadcellen) links, ♀ (eicellen) boven. In de vakjes komen de genotypen van de nakomelingen.'],
['Bij konijnen is staande oren (H) dominant over hangende oren (h). Een HH-moer wordt gekruist met een hh-rammelaar. Wat krijg je in de F1?','100% Hh, allemaal staande oren','50% Hh en 50% hh|25% HH, 50% Hh en 25% hh|100% Hh, allemaal hangende oren','Stap 1: HH × hh. Stap 2: eicellen allemaal H, zaadcellen allemaal h. Stap 3: elke combinatie is Hh. H is dominant, dus alle jongen hebben staande oren.'],
['Twee konijnen Hh × Hh krijgen jongen. In welke verhouding komen de genotypen HH : Hh : hh voor?','1 : 2 : 1','1 : 1 : 1|2 : 1 : 1|1 : 1 : 2','Geslachtscellen: H of h bij allebei. Schema: HH, Hh, hH, hh. Dus 1 HH, 2 Hh en 1 hh.'],
['Hh × Hh (staande oren dominant). Hoe groot is de kans op een jong met hangende oren?','25%','50%|75%|0%','Combinaties: HH, Hh, hH, hh. Alleen hh heeft hangende oren: 1 van de 4 = 25%. 75% is de kans op staande oren.'],
['Hh × Hh. Hoe groot is de kans op een jong met genotype Hh?','50%','25%|75%|100%','Van de vier combinaties (HH, Hh, hH, hh) zijn er twee Hh: 2/4 = 50%.'],
['Hh × Hh. Welk deel van de jongen met staande oren is homozygoot (HH)?','1/3','1/4|1/2|3/4','Staande oren: HH, Hh, hH (3 van de 4). Daarvan is er 1 HH. Dus 1/3. De 1/4 geldt voor álle jongen, maar hier kijk je alleen naar de jongen met staande oren.'],
['Aa × aa. In welke verhouding komen de fenotypen dominant : recessief voor?','1 : 1','3 : 1|1 : 2 : 1|Alleen het dominante fenotype','Geslachtscellen: A of a × a. Combinaties: Aa en aa, elk de helft. Dus 1 : 1. 3 : 1 hoort bij Aa × Aa.'],
['Zwarte vacht (B) is bij labradors dominant over bruin (b). Een homozygote zwarte reu × een bruine teef; de F1 onderling. Hoeveel procent van de F2 is bruin?','25%','0%|50%|75%','P: BB × bb → F1 allemaal Bb. F1 × F1: Bb × Bb → BB, Bb, bB, bb. Alleen bb is bruin: 25%. In de F1 is het 0% bruin.'],
['Wat is een testkruising?','Een organisme met het dominante fenotype kruisen met een homozygoot recessief organisme','Een organisme kruisen met een homozygoot dominant organisme|Twee heterozygote organismen kruisen|Een organisme kruisen met een organisme met hetzelfde fenotype','Je weet niet of het dier AA of Aa is. Met aa kruisen laat het zien: alleen een Aa-ouder kan nakomelingen met het recessieve fenotype krijgen.'],
['Een kortharige cavia (kort dominant) wordt gekruist met een langharige. Er komen veel jongen, allemaal kortharig. Wat is het genotype van de kortharige ouder waarschijnlijk?','Homozygoot (AA)','Heterozygoot (Aa)|Homozygoot recessief (aa)|Dat zegt deze kruising helemaal niets','AA × aa geeft alleen Aa (kort). Was de ouder Aa geweest, dan was ongeveer de helft langharig (aa). Bij veel jongen zonder één langharige is AA dus het meest waarschijnlijk.'],
['Een konijn met staande oren wordt gekruist met een hh-konijn. Er komen ook jongen met hangende oren. Wat weet je over het geteste konijn?','Het is heterozygoot (Hh)','Het is homozygoot (HH)|Het is homozygoot recessief (hh)|Er is niets te zeggen','Een jong met hangende oren is hh en kreeg van beide ouders een h. Het geteste konijn heeft dus een h, en met staande oren moet het Hh zijn.'],
['Een kortharige cavia wordt gekruist met een langharige (kort dominant). Er komen maar 3 jongen, alle drie kortharig. Wat kun je concluderen?','Niets met zekerheid: bij zo weinig jongen kan de kortharige ouder ook Aa zijn','De kortharige ouder is zeker AA|De kortharige ouder is zeker Aa|Lang haar is dus dominant','Bij Aa × aa heeft elk jong 50% kans op kort haar. Drie keer kort kan dan gewoon toeval zijn (kans 1/8). Een testkruising is pas betrouwbaar bij genoeg nakomelingen.'],
['Twee ouders hebben drie kinderen: twee rechtshandig en één linkshandig. Mag je concluderen dat rechtshandigheid dominant is?','Nee, je kent de ouders niet en drie kinderen zijn te weinig','Ja, want de meeste kinderen zijn rechtshandig|Ja, want 2 : 1 lijkt op 3 : 1|Nee, want linkshandig is altijd dominant','Zo’n verdeling kan bij weinig kinderen door toeval ontstaan, ook als linkshandig dominant is (bijvoorbeeld Ll × ll geeft 1 : 1). Je hebt meer gegevens nodig.'],
['Twee ouders met zwart haar krijgen een kind met blond haar. Wat kun je concluderen?','Blond is recessief en beide ouders zijn heterozygoot','Blond is dominant en beide ouders zijn homozygoot|Blond is recessief en één ouder is homozygoot dominant|Het kind moet een mutatie hebben','Ouders met hetzelfde fenotype en een kind met een ander fenotype: het afwijkende fenotype is recessief (aa). Het kind kreeg van elke ouder een a, dus beide ouders zijn Aa.'],
['Hoe wordt in een stamboom een vrouw getekend?','Als een cirkel','Als een vierkant|Als een driehoek|Als een ruit','Man = vierkant, vrouw = cirkel. De kleur zegt welk fenotype iemand heeft (zie de legenda).'],
['Tongrollen (T) is dominant over niet-tongrollen (t). Een vader Tt en een moeder tt krijgen een kind. Hoe groot is de kans dat het kind niet kan tongrollen?','50%','25%|75%|0%','Geslachtscellen: T of t (vader) × t (moeder). Combinaties: Tt en tt, elk de helft. tt kan niet rollen: 50%.'],
['Beide ouders kunnen niet tongrollen (tongrollen is dominant). Hoe groot is de kans dat hun kind wel kan tongrollen?','0%','25%|50%|75%','Niet-tongrollen is recessief, dus beide ouders zijn tt. Ze kunnen alleen t doorgeven: elk kind is tt. Kans 0%.'],
['Beide ouders kunnen tongrollen, maar hun eerste kind niet (tongrollen is dominant). Hoe groot is de kans dat het volgende kind wel kan tongrollen?','75%','25%|50%|100%','Het kind is tt, dus beide ouders zijn Tt. Tt × Tt geeft TT, Tt, tT, tt. Drie van de vier kunnen rollen: 75%. 25% is de kans op een kind dat niet kan rollen.'],
['Twee ouders zijn allebei drager (Aa) van een recessieve ziekte. Ze krijgen een gezond kind. Hoe groot is de kans dat dit kind drager is?','2/3 (ongeveer 67%)','1/2 (50%)|1/4 (25%)|3/4 (75%)','Aa × Aa geeft AA, Aa, aA, aa. Het kind is gezond, dus aa valt af. Van de drie overgebleven mogelijkheden zijn er twee drager: 2/3. De 50% geldt als je nog niet weet dat het kind gezond is.'],
['Bij leeuwenbekjes geeft A<sup>R</sup>A<sup>W</sup> roze bloemen. Een roze plant bestuift zichzelf en geeft 56 zaden. Hoeveel planten met roze bloemen verwacht je?','28','14|42|56','A<sup>R</sup>A<sup>W</sup> × A<sup>R</sup>A<sup>W</sup> geeft 1 rood : 2 roze : 1 wit. Roze = 2/4 = ½. ½ × 56 = 28. 14 is het aantal rode (of witte), 42 krijg je met ¾.'],
['Twee roze leeuwenbekjes (A<sup>R</sup>A<sup>W</sup>) worden gekruist. Wat is de verhouding van de fenotypen?','rood : roze : wit = 1 : 2 : 1','rood : wit = 3 : 1|roze : wit = 1 : 1|roze : rood = 2 : 1','Geslachtscellen A<sup>R</sup> of A<sup>W</sup>. Combinaties: A<sup>R</sup>A<sup>R</sup> (rood), A<sup>R</sup>A<sup>W</sup> en A<sup>W</sup>A<sup>R</sup> (roze), A<sup>W</sup>A<sup>W</sup> (wit). Bij intermediaire overerving zie je aan het fenotype het genotype, dus 1 : 2 : 1.'],
['Een rood leeuwenbekje (A<sup>R</sup>A<sup>R</sup>) wordt gekruist met een wit (A<sup>W</sup>A<sup>W</sup>). Welke kleur hebben de nakomelingen?','Allemaal roze','De helft rood, de helft wit|3 rood : 1 wit|Allemaal rood','Rood geeft alleen A<sup>R</sup>, wit alleen A<sup>W</sup>. Alle nakomelingen zijn A<sup>R</sup>A<sup>W</sup>: roze. Rood is niet dominant bij leeuwenbekjes.'],
['Een roze leeuwenbekje (A<sup>R</sup>A<sup>W</sup>) wordt gekruist met een wit (A<sup>W</sup>A<sup>W</sup>). Welke nakomelingen verwacht je?','50% roze en 50% wit','Allemaal roze|25% rood, 50% roze en 25% wit|25% roze en 75% wit','Geslachtscellen: A<sup>R</sup> of A<sup>W</sup> × A<sup>W</sup>. Combinaties: A<sup>R</sup>A<sup>W</sup> (roze) en A<sup>W</sup>A<sup>W</sup> (wit), elk de helft. Rood kan niet, want de witte ouder heeft geen A<sup>R</sup>.'],
['Een groene erwtenplant wordt gekruist met een gele. Er komen 204 groene en 187 gele planten. Welke genotypen hadden de ouders?','Gg × gg','GG × gg|Gg × Gg|GG × GG','204 : 187 is ongeveer 1 : 1. Dat krijg je bij heterozygoot × homozygoot recessief. GG × gg geeft maar één fenotype, Gg × Gg geeft 3 : 1.'],
['Groen × geel geeft bij erwten ongeveer 1 : 1 groen en geel. Kun je hieruit afleiden welk allel dominant is?','Nee, je weet niet welke ouder de heterozygote is','Ja, groen is dominant, want er zijn iets meer groene planten|Ja, geel is dominant, want geel staat als tweede genoemd|Ja, bij 1 : 1 is altijd de moeder heterozygoot','1 : 1 krijg je bij Aa × aa, maar het kan de groene óf de gele ouder zijn die Aa is. Een klein verschil in aantallen (204 tegen 187) is toeval.'],
['De ziekte van Huntington erft dominant over. Anouk is heterozygoot (Hh), haar vriend Mark is gezond (hh). Hoe groot is de kans dat hun kind de ziekte krijgt?','50%','25%|75%|100%','Geslachtscellen: H of h × h. Combinaties: Hh (ziek) en hh (gezond), elk de helft. Bij een dominante ziekte is één H genoeg, dus 50%.'],
['De ziekte van Huntington erft dominant over. Twee gezonde ouders krijgen een kind. Hoe groot is de kans dat het kind de ziekte erft?','0%','25%|50%|100%','Bij een dominante ziekte is iedereen met een H ziek. Gezonde ouders zijn dus allebei hh en kunnen geen H doorgeven. Een gezonde drager bestaat bij een dominante ziekte niet.'],
['Bij varkens geeft een beer met hangoren × een zeug met staande oren een F1 met halfhangende oren. In de F2 is 25% hangend, 50% halfhangend en 25% staand. Welke uitspraak klopt?','Aan het fenotype van de F2-varkens zie je direct hun genotype','Alle F2-varkens zijn homozygoot|Halfhangende oren zijn dominant|In de F1 komen drie verschillende genotypen voor','Dit is intermediaire overerving: elk fenotype hoort bij één genotype. De F1 is allemaal heterozygoot, en in de F2 is 50% heterozygoot (halfhangend), dus niet iedereen is homozygoot.'],
['Een gezonde beer wordt gekruist met een gezonde zeug. Van de 8 biggen hebben er 2 een verkorte onderkaak (recessief). Wat weet je over de beer?','Hij is zeker drager (Aa)','Hij is zeker homozygoot dominant (AA)|Hij is zeker homozygoot recessief (aa)|Er valt niets over hem te zeggen','Een big met een verkorte onderkaak is aa en kreeg van beide ouders een a. De beer heeft dus een a; hij is gezond, dus Aa.'],
['Een gezonde beer krijgt met een gezonde zeug 5 biggen, allemaal gezond (verkorte onderkaak is recessief). Is de beer drager?','Dat weet je niet: hij kan AA of Aa zijn','Nee, hij is zeker AA|Ja, hij is zeker Aa|Ja, want alle biggen zijn gezond','Gezonde biggen krijg je ook als de beer Aa is: de zeug kan AA zijn, of het is toeval bij zo weinig biggen. Alleen een zieke big bewijst dat de beer drager is.'],
['Bij kippen is bruin (B) dominant over wit (b). Een bruine kip heeft met een witte haan een wit kuiken. Wat is het genotype van de bruine kip?','Bb','BB|bb|Dat is niet te bepalen','Het witte kuiken is bb en kreeg van de kip een b. De kip is bruin, dus ze heeft ook een B: Bb. Met BB kan ze geen wit kuiken krijgen.'],
['Waarom is een testkruising vooral nuttig bij recessieve aandoeningen?','Een drager van een recessief allel zie je niet aan het fenotype','Een recessieve aandoening zie je altijd meteen|Bij dominante aandoeningen bestaan meer dragers|Een testkruising verandert het genotype van het dier','Bij een dominante aandoening zie je aan het fenotype of een dier het allel heeft. Bij een recessieve aandoening kan een gezond dier Aa zijn; dat laat een kruising met aa zien.']
],
'3.4':[
['Wat is de karyogramformule van een man?','[46, XY]','[46, XX]|[23, XY]|[44, XY]','Eerst het totale aantal chromosomen (46), dan de geslachtschromosomen (XY). 44 is het aantal autosomen, 23 het aantal in een geslachtscel.'],
['Welk geslachtschromosoom zit in een eicel van een mens?','Altijd een X','X of Y|Altijd een Y|XX','Een vrouw is XX en geeft dus altijd een X door. Een geslachtscel bevat één geslachtschromosoom, nooit twee.'],
['Welk geslachtschromosoom zit in een zaadcel van een mens?','Een X of een Y','Altijd een X|Altijd een Y|X en Y samen','Een man is XY. Bij de meiose gaan X en Y uit elkaar, dus de helft van de zaadcellen heeft een X, de andere helft een Y.'],
['Wat bepaalt bij de mens of een kind een jongen of een meisje wordt?','Het geslachtschromosoom in de zaadcel','Het geslachtschromosoom in de eicel|De temperatuur in de baarmoeder|Het aantal autosomen','De eicel heeft altijd een X. Brengt de zaadcel een X mee, dan wordt het XX (meisje); brengt hij een Y mee, dan wordt het XY (jongen).'],
['Wanneer ligt het geslacht van een mens vast?','Bij de bevruchting','Bij de geboorte|Na de eerste maand van de zwangerschap|In de puberteit','Op het moment dat de zaadcel de eicel bevrucht, ligt vast of de zygote XX of XY is.'],
['Hoe groot is bij de mens de kans dat een kind een jongen wordt?','50%','25%|75%|Dat hangt af van het aantal X-chromosomen van de moeder','XX × XY: eicellen X, zaadcellen X of Y. Combinaties XX en XY, elk de helft. De moeder geeft altijd een X, dus zij bepaalt het niet.'],
['Hoe zit het met de geslachtschromosomen bij vogels?','Mannetjes zijn XX en vrouwtjes zijn XY','Mannetjes zijn XY en vrouwtjes zijn XX|Vogels hebben geen geslachtschromosomen|Mannetjes en vrouwtjes zijn allebei XX','Bij vogels (en enkele vissoorten) is het omgekeerd van de mens: het mannetje is XX, het vrouwtje XY.'],
['Een kip heeft 38 paar autosomen en 1 paar geslachtschromosomen. Wat is de karyogramformule van een haan?','[78, XX]','[78, XY]|[39, XX]|[76, XX]','39 paar = 78 chromosomen. Bij vogels is het mannetje XX. 76 is alleen het aantal autosomen en 39 is het aantal paren.'],
['Welke geslachtscel bepaalt bij kippen het geslacht van het kuiken?','De eicel','De zaadcel|Allebei evenveel|Geen van beide, de temperatuur bepaalt het','De haan (XX) maakt alleen zaadcellen met X. De hen (XY) maakt eicellen met X of Y. Dus de eicel bepaalt of het kuiken een haan of een hen wordt.'],
['Waar komen geslachtschromosomen voor?','In lichaamscellen en in geslachtscellen','Alleen in geslachtscellen|Alleen in lichaamscellen|Alleen in de geslachtsorganen','Een lichaamscel heeft een paar geslachtschromosomen (XX of XY), een geslachtscel heeft er één.'],
['Bij bijen ontstaan darren (mannetjes) uit onbevruchte eicellen. Een geslachtscel heeft 16 chromosomen. Hoeveel chromosomen heeft een lichaamscel van een dar?','16','32|8|15','Een dar komt uit een onbevruchte eicel en heeft dus alleen de 16 chromosomen van die eicel. Een koningin (uit een bevruchte eicel) heeft 32.'],
['Wat betekent X-chromosomaal?','Het gen ligt alleen op het X-chromosoom; het Y-chromosoom heeft geen allel voor dit gen','Het gen ligt op het X- en het Y-chromosoom|Het gen ligt alleen op het Y-chromosoom|Het gen komt alleen bij vrouwen voor','Het Y-chromosoom is veel kleiner en mist veel genen die op het X-chromosoom liggen. Mannen hebben die genen dus maar één keer.'],
['Waarom kun je een man niet homozygoot of heterozygoot noemen voor een X-chromosomaal gen?','Hij heeft maar één X, dus maar één allel voor dat gen','Mannen hebben geen X-chromosoom|Mannen hebben altijd twee dezelfde allelen|Bij mannen staat het gen altijd uit','Homozygoot en heterozygoot gaan over een paar allelen. Een man heeft X<sup>A</sup>Y of X<sup>a</sup>Y: één allel, dat dus altijd tot uiting komt.'],
['Waarom zijn veel meer jongens dan meisjes rood-groenkleurenblind?','Een jongen heeft één X, dus één recessief allel is al genoeg','Jongens hebben twee X-chromosomen|Het allel ligt op het Y-chromosoom|Meisjes kunnen het allel niet erven','Bij een jongen (X<sup>b</sup>Y) komt het recessieve allel altijd tot uiting. Een meisje moet het op beide X-chromosomen hebben (X<sup>b</sup>X<sup>b</sup>); met één is ze draagster.'],
['Wat is een draagster?','Een vrouw die heterozygoot is voor een recessieve X-chromosomale eigenschap en hem zelf niet heeft','Een vrouw die de X-chromosomale aandoening zelf heeft|Een man met een recessief allel op zijn X-chromosoom|Een vrouw die homozygoot dominant is','Een draagster is X<sup>A</sup>X<sup>a</sup>: het dominante allel verbergt het recessieve, maar ze kan het wel aan haar kinderen doorgeven.'],
['Bij fruitvliegen is rood (X<sup>A</sup>) dominant over wit (X<sup>a</sup>). Een vrouwtje X<sup>A</sup>X<sup>A</sup> × een mannetje X<sup>a</sup>Y. Wat krijg je in de F1?','Alle vliegjes hebben rode ogen','Alle mannetjes witte ogen en alle vrouwtjes rode ogen|De helft van alle vliegjes heeft witte ogen|Alle vrouwtjes witte ogen en alle mannetjes rode ogen','Geslachtscellen: X<sup>A</sup> × X<sup>a</sup> of Y. Vrouwtjes: X<sup>A</sup>X<sup>a</sup> (rood, draagster). Mannetjes: X<sup>A</sup>Y (rood). Iedereen heeft dus rode ogen.'],
['Fruitvliegen F1 × F1: X<sup>A</sup>X<sup>a</sup> × X<sup>A</sup>Y (rood dominant). Wat krijg je in de F2?','50% vrouwtjes met rode ogen, 25% mannetjes met rode ogen, 25% mannetjes met witte ogen','25% vrouwtjes met witte ogen, 25% vrouwtjes met rode ogen, 50% mannetjes met rode ogen|Alle vliegjes rode ogen|50% vrouwtjes met witte ogen en 50% mannetjes met rode ogen','Geslachtscellen: X<sup>A</sup> of X<sup>a</sup> (♀) × X<sup>A</sup> of Y (♂). Combinaties: X<sup>A</sup>X<sup>A</sup>, X<sup>A</sup>X<sup>a</sup> (rode vrouwtjes), X<sup>A</sup>Y (rood mannetje), X<sup>a</sup>Y (wit mannetje). Vrouwtjes krijgen altijd X<sup>A</sup> van de vader, dus nooit wit.'],
['Fruitvliegen: een vrouwtje met witte ogen (X<sup>a</sup>X<sup>a</sup>) × een mannetje met rode ogen (X<sup>A</sup>Y). Wat krijg je in de F1?','Alle vrouwtjes rode ogen, alle mannetjes witte ogen','Alle vliegjes rode ogen|Alle vliegjes witte ogen|Alle vrouwtjes witte ogen, alle mannetjes rode ogen','Geslachtscellen: X<sup>a</sup> × X<sup>A</sup> of Y. Dochters krijgen X<sup>A</sup> van de vader: X<sup>A</sup>X<sup>a</sup> (rood). Zonen krijgen Y van de vader en X<sup>a</sup> van de moeder: X<sup>a</sup>Y (wit).'],
['Marijn is kleurenblind (X<sup>b</sup>Y). Zijn vrouw is X<sup>B</sup>X<sup>B</sup>. Hoe groot is de kans dat hun zoon kleurenblind is?','0%','25%|50%|100%','Een zoon krijgt het Y-chromosoom van zijn vader en een X van zijn moeder. De moeder heeft alleen X<sup>B</sup>, dus elke zoon is X<sup>B</sup>Y: niet kleurenblind.'],
['Mohammed is kleurenblind (X<sup>b</sup>Y). Zijn vrouw is draagster (X<sup>B</sup>X<sup>b</sup>). Hoe groot is de kans dat een zoon van hen kleurenblind is?','50%','25%|0%|100%','Een zoon krijgt Y van Mohammed en X<sup>B</sup> of X<sup>b</sup> van zijn moeder. X<sup>B</sup>Y of X<sup>b</sup>Y, elk de helft: 50%.'],
['Mohammed is kleurenblind (X<sup>b</sup>Y), zijn vrouw is draagster (X<sup>B</sup>X<sup>b</sup>). Hoe groot is de kans dat een dochter van hen kleurenblind is?','50%','0%|25%|100%','Een dochter krijgt altijd X<sup>b</sup> van haar vader en X<sup>B</sup> of X<sup>b</sup> van haar moeder. X<sup>B</sup>X<sup>b</sup> of X<sup>b</sup>X<sup>b</sup>, elk de helft: 50% kleurenblind.'],
['Een draagster van kleurenblindheid (X<sup>B</sup>X<sup>b</sup>) krijgt kinderen met een man die normaal kleuren ziet (X<sup>B</sup>Y). Hoe groot is de kans dat een kind (jongen of meisje) kleurenblind is?','25%','50%|0%|75%','Combinaties: X<sup>B</sup>X<sup>B</sup>, X<sup>B</sup>X<sup>b</sup> (dochters, niet kleurenblind), X<sup>B</sup>Y en X<sup>b</sup>Y (zonen). Alleen X<sup>b</sup>Y is kleurenblind: 1 van de 4 = 25%. Bij zonen alleen is het 50%.'],
['X<sup>B</sup>X<sup>b</sup> × X<sup>B</sup>Y. Hoe groot is de kans dat een dochter draagster is?','50%','25%|0%|100%','Een dochter krijgt X<sup>B</sup> van haar vader en X<sup>B</sup> of X<sup>b</sup> van haar moeder. X<sup>B</sup>X<sup>B</sup> of X<sup>B</sup>X<sup>b</sup>, elk de helft.'],
['Een kleurenblinde man (X<sup>b</sup>Y) krijgt kinderen met een vrouw X<sup>B</sup>X<sup>B</sup>. Wat klopt voor de dochters?','Ze zijn allemaal draagster','Ze zijn allemaal kleurenblind|De helft is draagster|Geen van hen is draagster','Elke dochter krijgt de X<sup>b</sup> van haar vader en X<sup>B</sup> van haar moeder: X<sup>B</sup>X<sup>b</sup>. Ze zien normaal, maar zijn allemaal draagster.'],
['Van wie erft een zoon een X-chromosomale aandoening?','Altijd van zijn moeder','Altijd van zijn vader|Van allebei de ouders tegelijk|Van zijn opa via zijn vader','Een zoon krijgt van zijn vader het Y-chromosoom. Zijn enige X komt dus altijd van zijn moeder.'],
['Hemofilie wordt veroorzaakt door een recessief allel op het X-chromosoom (X<sup>h</sup>). Koningin Victoria was draagster. Wat was haar genotype?','X<sup>H</sup>X<sup>h</sup>','X<sup>h</sup>X<sup>h</sup>|X<sup>H</sup>X<sup>H</sup>|X<sup>h</sup>Y','Een draagster is heterozygoot: het dominante allel X<sup>H</sup> zorgt voor normale bloedstolling. X<sup>h</sup>X<sup>h</sup> zou hemofilie geven en X<sup>h</sup>Y is een man.'],
['Victoria (draagster) → dochter Alice → kleindochter Alix → achterkleinzoon Alexej. Hoe groot was vooraf de kans dat Alexej het hemofilie-allel van Victoria zou erven?','1/8 (12,5%)','1/2 (50%)|1/4 (25%)|1/16 (6,25%)','Bij elke stap geeft een draagster het allel met kans ½ door: Victoria → Alice ½, Alice → Alix ½, Alix → Alexej ½. ½ × ½ × ½ = 1/8.'],
['Een meisje heeft hemofilie (X-chromosomaal recessief). Wat weet je zeker over haar vader?','Hij heeft zelf hemofilie','Hij is drager maar gezond|Hij is gezond en heeft het allel niet|Over de vader weet je niets','Het meisje is X<sup>h</sup>X<sup>h</sup>, dus ze kreeg een X<sup>h</sup> van haar vader. Een man met X<sup>h</sup>Y heeft de ziekte; een gezonde mannelijke drager bestaat niet bij X-chromosomaal.'],
['Bij kippen ligt het gen voor een bruine eierschaal (X<sup>A</sup>, dominant) op het X-chromosoom; een hen is XY. Een hen met witte eieren (X<sup>a</sup>Y) × een haan X<sup>A</sup>X<sup>A</sup>. Hoeveel procent van de F1-hennen legt witte eieren?','0%','25%|50%|100%','Geslachtscellen: X<sup>a</sup> of Y (hen) × X<sup>A</sup> (haan). F1-hennen krijgen Y van de moeder en X<sup>A</sup> van de vader: X<sup>A</sup>Y, bruine eieren.'],
['Kippen: een F1-haan X<sup>A</sup>X<sup>a</sup> × een hen X<sup>A</sup>Y (bruine schaal dominant). Hoeveel procent van de hennen in de F2 legt witte eieren?','50%','25%|0%|100%','Hennen krijgen Y van hun moeder en een X van de haan: X<sup>A</sup> of X<sup>a</sup>. X<sup>A</sup>Y (bruin) of X<sup>a</sup>Y (wit), elk de helft. 25% geldt voor alle kuikens samen.'],
['Na een kruising met veel nakomelingen komt een fenotype alleen bij de mannetjes voor. Wat wijst dat waarschijnlijk aan?','Een X-chromosomaal gen','Een letale factor|Gekoppelde genen op een autosoom|Intermediaire overerving','Mannetjes hebben maar één X, dus een recessief X-allel komt bij hen veel vaker tot uiting. Een verschil tussen mannetjes en vrouwtjes past niet bij autosomale overerving.'],
['HED erft X-chromosomaal recessief. Een man met HED krijgt kinderen met een vrouw die het allel niet heeft. Wat klopt?','Zijn zonen zijn gezond en zijn dochters zijn allemaal draagster','Zijn zonen hebben allemaal HED|De helft van zijn zonen heeft HED|Zijn dochters hebben allemaal HED','Zonen krijgen zijn Y en een gezonde X van de moeder. Dochters krijgen zijn X<sup>a</sup> en een X<sup>A</sup> van de moeder: draagster, niet ziek.'],
['Een meisje heeft een recessieve erfelijke ziekte. Haar vader is gezond. Wat weet je zeker?','De ziekte kan niet X-chromosomaal recessief zijn','De ziekte is zeker X-chromosomaal recessief|Haar moeder moet ook ziek zijn|Haar vader is homozygoot dominant','Bij X-chromosomaal recessief is het meisje X<sup>a</sup>X<sup>a</sup> en moet haar vader X<sup>a</sup>Y zijn, dus ziek. De vader is gezond, dus het gen ligt op een autosoom (vader Aa). Een gezonde moeder kan drager zijn.'],
['Baby Stan heeft een recessieve stofwisselingsziekte. Zijn gezonde vader en moeder zijn allebei drager. Hoe groot is de kans dat een volgend kind, een meisje, de ziekte ook krijgt?','25%','0%|50%|12,5%','De vader is gezond én drager; dat kan niet bij een X-chromosomaal gen. Het is dus autosomaal: Aa × Aa geeft ¼ aa. Bij autosomale overerving maakt het geslacht niet uit.']
],
'3.5':[
['Wat zijn multipele allelen?','Drie of meer verschillende allelen voor één erfelijke eigenschap','Twee allelen die allebei dominant zijn|Meerdere genen die samen één eigenschap bepalen|Genen die op hetzelfde chromosoom liggen','Bij de ABO-bloedgroep bestaan drie allelen: I<sup>A</sup>, I<sup>B</sup> en i. Genen op hetzelfde chromosoom zijn gekoppelde genen.'],
['Hoeveel allelen voor de ABO-bloedgroep heeft één lichaamscel?','2','3|1|4','Er bestaan drie allelen, maar elke lichaamscel heeft er twee: één op elk chromosoom van het paar.'],
['Welke bloedgroep hoort bij het genotype I<sup>A</sup>i?','A','AB|0|B','I<sup>A</sup> is dominant over i, dus I<sup>A</sup>i heeft bloedgroep A, net als I<sup>A</sup>I<sup>A</sup>.'],
['Welk genotype hoort bij bloedgroep 0?','ii','I<sup>A</sup>I<sup>B</sup>|I<sup>A</sup>i|I<sup>B</sup>i','i is recessief, dus bloedgroep 0 kan alleen ii zijn.'],
['Hoe erven I<sup>A</sup> en I<sup>B</sup> ten opzichte van elkaar over?','Codominant: bij I<sup>A</sup>I<sup>B</sup> komen ze allebei tot uiting','I<sup>A</sup> is dominant over I<sup>B</sup>|Intermediair: I<sup>A</sup>I<sup>B</sup> geeft een tussenvorm|I<sup>B</sup> is recessief ten opzichte van i','Iemand met I<sup>A</sup>I<sup>B</sup> heeft bloedgroep AB: eigenschap A én B volledig. Dat is codominantie, geen tussenvorm. Allebei zijn dominant over i.'],
['Een vrouw met bloedgroep 0 krijgt kinderen met een man met bloedgroep AB. Welke bloedgroepen kunnen de kinderen hebben?','A of B, elk 50%','A, B, AB of 0, elk 25%|Alleen AB|0 of AB, elk 50%','Geslachtscellen: i (moeder) × I<sup>A</sup> of I<sup>B</sup> (vader). Kinderen: I<sup>A</sup>i (A) of I<sup>B</sup>i (B). AB kan niet (de moeder heeft geen I<sup>A</sup> of I<sup>B</sup>) en 0 kan niet (de vader heeft geen i).'],
['Twee ouders hebben allebei bloedgroep AB. Welke bloedgroepen kunnen hun kinderen hebben?','A, AB en B in de verhouding 1 : 2 : 1','Alleen AB|A, B, AB en 0, elk 25%|A en B in de verhouding 1 : 1','I<sup>A</sup>I<sup>B</sup> × I<sup>A</sup>I<sup>B</sup>: combinaties I<sup>A</sup>I<sup>A</sup> (A), I<sup>A</sup>I<sup>B</sup> en I<sup>B</sup>I<sup>A</sup> (AB), I<sup>B</sup>I<sup>B</sup> (B). Bloedgroep 0 kan niet, want niemand heeft een i.'],
['Moeder I<sup>A</sup>i × vader I<sup>B</sup>i. Hoe groot is de kans op een kind met bloedgroep 0?','25%','0%|50%|75%','Geslachtscellen: I<sup>A</sup> of i × I<sup>B</sup> of i. Combinaties: I<sup>A</sup>I<sup>B</sup> (AB), I<sup>A</sup>i (A), I<sup>B</sup>i (B), ii (0). Elke bloedgroep 25%.'],
['Twee ouders zijn allebei I<sup>A</sup>i. Hoe groot is de kans op een kind met bloedgroep A?','75%','25%|50%|100%','Combinaties: I<sup>A</sup>I<sup>A</sup>, I<sup>A</sup>i, iI<sup>A</sup> (alle drie A) en ii (0). 3 van de 4 = 75%.'],
['Twee ouders met bloedgroep A krijgen een kind met bloedgroep 0. Wat weet je over de ouders?','Ze zijn allebei zeker I<sup>A</sup>i','Ze zijn allebei zeker I<sup>A</sup>I<sup>A</sup>|Eén is I<sup>A</sup>I<sup>A</sup> en één is I<sup>A</sup>i|Er moet een mutatie zijn opgetreden','Het kind is ii en kreeg van elke ouder een i. Met bloedgroep A hebben ze ook een I<sup>A</sup>, dus allebei I<sup>A</sup>i.'],
['Ouders I<sup>A</sup>i × I<sup>A</sup>i krijgen een zoon met bloedgroep A. Hoe groot is de kans dat hij heterozygoot (I<sup>A</sup>i) is?','2/3','1/2|1/4|3/4','Combinaties: I<sup>A</sup>I<sup>A</sup>, I<sup>A</sup>i, iI<sup>A</sup>, ii. De zoon heeft A, dus ii valt af. Van de drie overgebleven zijn er twee I<sup>A</sup>i: 2/3.'],
['Een moeder heeft bloedgroep A, haar kind heeft bloedgroep AB. Welke man kan de vader zijn?','Een man met bloedgroep B','Een man met bloedgroep A|Een man met bloedgroep 0|Geen enkele man, dit kind kan niet bestaan','Het kind is I<sup>A</sup>I<sup>B</sup>. Van de moeder (A) kreeg het I<sup>A</sup>, dus I<sup>B</sup> moet van de vader komen. Een man met A (I<sup>A</sup>I<sup>A</sup> of I<sup>A</sup>i) of 0 (ii) heeft geen I<sup>B</sup>.'],
['Een moeder en haar kind hebben allebei bloedgroep 0. Welke man kan zeker níet de vader zijn?','Een man met bloedgroep AB','Een man met bloedgroep A|Een man met bloedgroep B|Een man met bloedgroep 0','Het kind is ii, dus de vader moet een i hebben gegeven. Een man met AB (I<sup>A</sup>I<sup>B</sup>) heeft geen i. Mannen met A (I<sup>A</sup>i), B (I<sup>B</sup>i) of 0 (ii) kunnen wel een i hebben.'],
['Een moeder heeft bloedgroep B, haar kind bloedgroep A. Welke mannen kunnen de vader zijn?','Een man met bloedgroep A of AB','Alleen een man met bloedgroep 0|Alleen een man met bloedgroep B|Een man met bloedgroep B of 0','Het kind (A) heeft een I<sup>A</sup>. De moeder (B) heeft geen I<sup>A</sup>, dus die komt van de vader. Alleen mannen met A of AB hebben een I<sup>A</sup>. Het kind is dan I<sup>A</sup>i (de moeder is I<sup>B</sup>i).'],
['Een moeder en haar kind hebben allebei bloedgroep AB. Welke bloedgroep kan de vader níet hebben?','0','A|B|AB','Het kind kreeg I<sup>A</sup> of I<sup>B</sup> van de moeder en dan het andere van de vader. De vader moet dus I<sup>A</sup> of I<sup>B</sup> hebben; dat heeft iedereen behalve iemand met bloedgroep 0 (ii).'],
['Moeder I<sup>A</sup>i × vader I<sup>B</sup>i. Hoe groot is de kans op een kind met bloedgroep AB?','25%','50%|0%|75%','Combinaties: I<sup>A</sup>I<sup>B</sup> (AB), I<sup>A</sup>i (A), I<sup>B</sup>i (B), ii (0). Een van de vier is AB: 25%.'],
['Een moeder heeft bloedgroep A en een vader bloedgroep B. Hun dochter heeft A, hun zoon B. Een derde kind heeft bloedgroep 0. Wat waren de genotypen van de ouders?','Moeder I<sup>A</sup>i en vader I<sup>B</sup>i','Moeder I<sup>A</sup>I<sup>A</sup> en vader I<sup>B</sup>I<sup>B</sup>|Moeder I<sup>A</sup>I<sup>A</sup> en vader I<sup>B</sup>i|Moeder I<sup>A</sup>i en vader I<sup>B</sup>I<sup>B</sup>','Een kind met 0 (ii) kreeg een i van beide ouders. Dus de moeder is I<sup>A</sup>i en de vader I<sup>B</sup>i. Met I<sup>A</sup>I<sup>A</sup> of I<sup>B</sup>I<sup>B</sup> kan geen kind 0 krijgen.'],
['Wat is een letale factor?','Een allel waarmee een individu in homozygote toestand niet levensvatbaar is','Een allel dat altijd dominant is|Een milieufactor die de genexpressie verandert|Een allel dat alleen op het Y-chromosoom ligt','Bij een letale factor sterft de zygote (of het embryo) als hij twee van die allelen heeft. Daardoor wordt een deel van de verwachte nakomelingen niet geboren.'],
['Bij manxkatten is korte staart (M) dominant over normale staart (m); MM sterft als embryo. Twee manxkatten met korte staart (Mm × Mm) krijgen jongen. Wat is de verhouding korte staart : normale staart bij de geboren jongen?','2 : 1','3 : 1|1 : 2 : 1|1 : 1','Combinaties: MM (sterft), Mm, mM, mm. De MM-embryo’s worden niet geboren en tel je niet mee. Over blijft 2 Mm (kort) : 1 mm (normaal).'],
['Wat is het genotype van een levende manxkat met een korte staart?','Altijd Mm','Altijd MM|MM of Mm|Altijd mm','MM sterft als embryo en mm heeft een normale staart. Een levende kat met een korte staart is dus altijd Mm.'],
['Een manxkat met een korte staart (Mm) krijgt jongen met een kat met een normale staart (mm). Wat verwacht je?','De helft korte staart, de helft normale staart','2 korte staart : 1 normale staart|Alle jongen korte staart|3 korte staart : 1 normale staart','Mm × mm geeft Mm en mm, elk de helft. Er kan geen MM ontstaan (de mm-ouder heeft geen M), dus er sterven geen embryo’s en de verhouding blijft 1 : 1.'],
['Twee manxkatten (Mm × Mm) krijgen jongen. Welk deel van de zygoten sterft voor de geboorte?','25%','33%|50%|0%','Van de vier combinaties (MM, Mm, mM, mm) sterft MM: een kwart van de zygoten. Van de geboren jongen is daarna 2/3 kort en 1/3 normaal.'],
['Achondroplasie erft autosomaal dominant over en is letaal bij homozygote embryo’s. Een man en een vrouw met achondroplasie krijgen een kind. Hoe groot is de kans dat het kind géén achondroplasie heeft?','1/3 (ongeveer 33%)','1/4 (25%)|1/2 (50%)|0%','Aa × Aa geeft AA (sterft), Aa, aA en aa. Over blijven 2 Aa (achondroplasie) en 1 aa (geen achondroplasie). Kans op aa = 1/3. De 25% klopt alleen als je AA nog meetelt.'],
['Twee heterozygote gele muizen (Rr, geel dominant) krijgen 115 gele en 59 agouti jongen. Wat is de verklaring?','RR is niet levensvatbaar: een letale factor','Het gen ligt op het X-chromosoom|Geel en agouti erven intermediair over|De genen voor kleur zijn gekoppeld aan geslacht','115 : 59 is ongeveer 2 : 1 in plaats van 3 : 1. Dat past bij een letale factor: de RR-jongen sterven en worden niet geboren.'],
['Waarom geeft een letale factor bij twee heterozygote ouders 2 : 1 in plaats van 3 : 1?','De homozygote nakomelingen met de letale factor sterven en tellen niet mee','Er ontstaan meer heterozygoten door mutaties|Het recessieve allel wordt dominant|De ouders maken minder geslachtscellen','Van de vier combinaties valt er één (de homozygote met twee letale allelen) weg. Over blijven er drie: 2 met het dominante fenotype en 1 met het recessieve.'],
['Wanneer erven twee genen gekoppeld over?','Als ze in hetzelfde chromosomenpaar liggen','Als ze in verschillende chromosomenparen liggen|Als het ene gen dominant is en het andere recessief|Als ze allebei op het Y-chromosoom liggen','Gekoppelde genen liggen op hetzelfde chromosoom en gaan daardoor samen naar dezelfde geslachtscel. Genen in verschillende chromosomenparen erven onafhankelijk over.'],
['Bij fruitvliegen liggen G (grijs) en N (normale vleugels) gekoppeld op één chromosoom. Welke geslachtscellen maakt een vrouwtje GN/gn?','GN of gn','GN, Gn, gN of gn|Alleen GN|Gn of gN','Een geslachtscel krijgt één heel chromosoom, dus één regel van de breuk: GN of gn. Gn en gN zou je alleen bij onafhankelijke overerving krijgen.'],
['Fruitvliegen (gekoppeld): GN/gn × gn/gn. Grijs (G) en normale vleugels (N) zijn dominant. Welke nakomelingen verwacht je?','50% grijs met normale vleugels en 50% zwart met vleugelstompjes','Grijs-normaal, grijs-stompjes, zwart-normaal en zwart-stompjes, elk 25%|Alle vliegjes grijs met normale vleugels|75% grijs met normale vleugels en 25% zwart met vleugelstompjes','Geslachtscellen: GN of gn (♀) × gn (♂). Nakomelingen: GN/gn (grijs, normaal) en gn/gn (zwart, stompjes), elk de helft. De andere combinaties ontstaan niet door de koppeling. 1 : 1 : 1 : 1 krijg je bij onafhankelijke overerving.'],
['Welke verhouding verwacht je bij GgNn × ggnn als de genen níet gekoppeld zijn (onafhankelijke overerving)?','1 : 1 : 1 : 1 (alle vier de combinaties)','1 : 1 (alleen de combinaties van de ouders)|3 : 1|9 : 3 : 3 : 1','Onafhankelijk maakt GgNn vier soorten geslachtscellen (GN, Gn, gN, gn), elk 25%. Met gn van de andere ouder geeft dat vier fenotypen in gelijke aantallen. 1 : 1 is het resultaat bij koppeling.'],
['Een man met bruin haar en bruine ogen, homozygoot (AB/AB), krijgt een kind met een vrouw met blond haar en blauwe ogen (ab/ab). De genen zijn gekoppeld. Welk genotype heeft het kind?','Altijd AB/ab: bruin haar en bruine ogen','De helft AB/ab en de helft ab/ab|AB/AB of ab/ab|Ab/aB: bruin haar en blauwe ogen','De man geeft alleen AB, de vrouw alleen ab. Elk kind is dus AB/ab en heeft bruin haar en bruine ogen. Blond met blauwe ogen kan niet.'],
['Hun dochter (AB/ab) krijgt kinderen met een blonde man met blauwe ogen (ab/ab). Hoe groot is de kans op een kind met blond haar en blauwe ogen?','50%','25%|0%|75%','Geslachtscellen: AB of ab (dochter) × ab (man). Kinderen: AB/ab (bruin, bruin) of ab/ab (blond, blauw), elk de helft.'],
['Konijnen: langharig (A) en rechte oren (B) dominant. Gekoppeld: Ab/Ab × aB/aB, daarna F1 × F1 (Ab/aB × Ab/aB). Welke verhouding van fenotypen krijg je in de F2?','langharig-recht : langharig-hangend : kortharig-recht = 2 : 1 : 1','langharig-recht : kortharig-hangend = 3 : 1|9 : 3 : 3 : 1|langharig-recht : langharig-hangend : kortharig-recht : kortharig-hangend = 1 : 1 : 1 : 1','F1 maakt geslachtscellen Ab of aB. Combinaties: Ab/Ab (langharig, hangend), Ab/aB en aB/Ab (langharig, recht), aB/aB (kortharig, recht). Kortharig-hangend (ab/ab) kan niet ontstaan, want geen enkele ouder heeft een ab-chromosoom.'],
['Een plant met gele bloemen en pijlvormige bladeren × een plant met witte bloemen en ovale bladeren. De F2 (na zelfbestuiving) geeft 28 geel-pijlvormig en 11 wit-ovaal. Wat concludeer je?','De genen zijn gekoppeld; geel en pijlvormig zijn dominant','De genen erven onafhankelijk over|Wit en ovaal zijn dominant|Er is een letale factor','Alleen de combinaties van de ouders komen terug, ongeveer 3 : 1, net als bij een monohybride kruising. Bij onafhankelijke overerving zou je ook geel-ovaal en wit-pijlvormig zien (9 : 3 : 3 : 1).'],
['Het HLA-type wordt bepaald door gekoppelde genen op chromosoom 6. Hoe groot is de kans dat een broer precies dezelfde HLA-chromosomen van zijn ouders heeft geërfd als zijn zieke broer?','25%','50%|100%|12,5%','Elke ouder geeft één van zijn twee chromosomen 6 door: kans ½ dat het dezelfde is als bij de broer. Voor beide ouders: ½ × ½ = ¼ = 25%.']
],
'3.6':[
['Wat bedoelt men met nature?','Aanleg: het genotype','Opvoeding: het milieu|Modificaties door de natuur|Alle eigenschappen van planten','Nature = aanleg (genotype), nurture = opvoeding (milieu). In de genetica zeg je genotype en milieufactoren.'],
['Wat bedoelt men met nurture?','Opvoeding: het milieu','Aanleg: het genotype|Erfelijke ziekten|De verzorging van een zwangere vrouw','Nurture is de invloed van de omgeving en de opvoeding. Aanleg heet nature.'],
['Welke eigenschap wordt (bijna) alleen door het genotype bepaald?','Je bloedgroep','Een litteken|De lengte van je nagels|Je lichaamslengte','Het milieu heeft geen invloed op je bloedgroep. Een litteken en nagellengte komen door het milieu; bij lichaamslengte spelen genotype én milieu mee.'],
['Welke eigenschap wordt (vrijwel) alleen door het milieu bepaald?','Een litteken','Je bloedgroep|Je oogkleur|Of je een jongen of een meisje bent','Een litteken ontstaat door een verwonding, een milieufactor. Bloedgroep, oogkleur en geslacht zijn erfelijk.'],
['Hoe werken genotype en milieu samen bij lichaamslengte?','Het genotype legt de uiterste grens vast, het milieu bepaalt hoe dicht je erbij komt','Het milieu legt de grens vast, het genotype bepaalt hoe dicht je erbij komt|Alleen het genotype telt|Alleen het milieu telt','Je genotype maakt bijvoorbeeld maximaal 1,80 m mogelijk. Met goede voeding en gezondheid haal je dat, bij voedselgebrek of ziekte tijdens de groei niet.'],
['Waarom is het onderzoek naar nature en nurture bij mensen lastiger dan bij dieren?','Je mag geen experimenten met mensen doen','Mensen hebben geen genotype|Bij mensen speelt het milieu geen rol|Mensen hebben te veel nakomelingen','Bij dieren kun je genotype en milieu zelf regelen. Bij mensen mag dat niet; daarom is tweelingenonderzoek zo belangrijk.'],
['Wat onderzoek je met eeneiige tweelingen die apart zijn opgegroeid?','De invloed van milieufactoren','De invloed van het genotype|Hoe een eeneiige tweeling ontstaat|Of de kinderen hetzelfde geslacht hebben','Het genotype is gelijk, het milieu verschilt. Verschillen tussen hen komen dus door het milieu.'],
['Een twee-eiige tweeling groeit samen op en toch verschillen ze. Waar komt dat vooral door?','Door verschillen in genotype','Door verschillen in milieu|Door mutaties tijdens de zwangerschap|Door het verschil in leeftijd','Hun milieu en leeftijd zijn gelijk, maar hun genotype verschilt (net als bij gewone broers en zussen). De verschillen komen dus vooral door het genotype.'],
['Yigit en Derman zijn een Siamese tweeling die aan het hoofd vastzaten. Hebben ze hetzelfde genotype?','Ja, een Siamese tweeling is een eeneiige tweeling die niet helemaal gesplitst is','Nee, ze komen uit twee verschillende eicellen|Nee, door de operatie is hun genotype veranderd|Ja, maar alleen als ze hetzelfde milieu hebben','Een Siamese tweeling ontstaat uit één bevruchte eicel, net als een eeneiige tweeling, dus het genotype is gelijk. Een operatie verandert het genotype niet.'],
['Waarom gaan eeneiige tweelingen meer van elkaar verschillen naarmate ze ouder worden?','Ze staan langer bloot aan verschillende milieufactoren, die de genexpressie veranderen','Hun genotype verandert langzaam|Ze krijgen steeds meer verschillende chromosomen|Een van de twee verliest genen','Het genotype blijft gelijk, maar welke genen aan- en uitstaan, verschilt door het milieu. Daarnaast ontstaan er modificaties.'],
['Gele muizen met hetzelfde genotype hebben toch een lichtere of donkerdere vacht. Waardoor komt dat?','De voeding van de moeder tijdens de zwangerschap beïnvloedt de genexpressie','Ze hebben verschillende allelen voor vachtkleur|Het gen voor vachtkleur ligt op het Y-chromosoom|De jongen hebben een letale factor','Het genotype is gelijk, maar een milieufactor (voeding van de moeder) bepaalt hoe sterk het allel voor geel tot expressie komt.'],
['Wat bleek bij kinderen die tijdens de Hongerwinter van 1944 zijn verwekt?','Ze hebben vaker overgewicht en diabetes, doordat de expressie van bepaalde genen verhoogd is','Ze hebben andere allelen gekregen door het voedseltekort|Ze zijn later altijd kleiner gebleven door een mutatie|Ze hebben er geen enkel gevolg van ondervonden','Voedseltekort is een milieufactor die de genexpressie beïnvloedt. Het DNA zelf verandert niet.'],
['Vrouwtjesmuizen krijgen vóór de bevruchting alcohol. Daarna zijn er 6% gele jongen in plaats van 21% (zonder alcohol) en meer bruine. Welke conclusie past hierbij?','Alcohol vóór de bevruchting verlaagt de expressie van het allel voor een gele vacht','Alcohol verandert het allel voor geel in een allel voor bruin|Alcohol heeft geen invloed op de vachtkleur|Alcohol verhoogt de expressie van het allel voor geel','Alle jongen hebben hetzelfde genotype (Aa), maar met alcohol komt het gele allel minder vaak tot uiting. Het allel zelf verandert niet.'],
['In dat experiment kruist men homozygote donkere vrouwtjes (aa) met homozygote gele mannetjes (AA). Welk genotype hebben alle jongen?','Aa','AA|aa|AA of aa','De moeders geven alleen a, de vaders alleen A. Alle jongen zijn dus Aa; de verschillen in kleur komen door genexpressie.'],
['Stekjes van één hortensia krijgen verschillende bloemkleuren (roze, blauw). Wat is daarvan de oorzaak?','Een milieufactor, zoals de zuurgraad of samenstelling van de bodem','Een verschil in genotype tussen de stekjes|Recombinatie tijdens het stekken|Een letale factor','Stekjes van dezelfde plant hebben hetzelfde genotype (er is geen meiose of bevruchting). De kleur verschilt dus door milieufactoren, zoals de bodem.'],
['Waarom zijn lapjeskatten heterozygoot voor een vachtkleurgen op het X-chromosoom?','In elke cel wordt willekeurig één X uitgeschakeld; met twee verschillende allelen ontstaan vlekken','Ze hebben drie X-chromosomen|Het gen ligt op het Y-chromosoom|Bij homozygoten wordt nooit een X uitgeschakeld','Door X-inactivatie is in de ene groep cellen het allel voor de ene kleur actief en in de andere groep het allel voor de andere kleur. Bij homozygoten wordt ook een X uitgeschakeld, maar dan is de kleur overal gelijk.'],
['Waarom kan een kater normaal gesproken geen lapjeskat zijn?','Een kater heeft maar één X en dus maar één allel voor dit gen','Een kater heeft geen X-chromosoom|Bij katers staan alle genen voor vachtkleur uit|Katers zijn altijd homozygoot','Voor twee kleuren heb je twee verschillende allelen op twee X-chromosomen nodig. Een kater is XY en heeft één allel, dus één kleur.'],
['Mensen met allel A van het FGF21-gen maken minder van de stoffen en hormonen die hun hersenen gevoelig maken voor suiker. Wat is het gevolg?','Ze hebben meer zin in zoet','Ze hebben minder zin in zoet|Ze kunnen geen suiker verteren|Ze krijgen zeker diabetes','Minder FGF21-stoffen → hersenen minder gevoelig voor suiker → de zin in zoet wordt minder onderdrukt. Zeker diabetes is te sterk: milieu en leefstijl tellen ook mee.'],
['Wat gebeurt er volgens het onderzoek als je veel suiker eet?','De expressie van FGF21 in levercellen stijgt, waardoor de zin in zoet afneemt','Je allelen voor FGF21 veranderen|De expressie van FGF21 daalt, waardoor je meer zin in zoet krijgt|Er gebeurt niets met de genexpressie','Voeding is een milieufactor die de genexpressie beïnvloedt: meer suiker geeft meer FGF21-stoffen, waardoor de hersenen tijdelijk gevoeliger zijn en de zin in zoet afneemt. De allelen zelf veranderen niet.'],

['3.2','Een tomatenveredelaar maakt eerst door jarenlange zelfbestuiving twee <b>homozygote ouderrassen</b>. Die kruist hij met elkaar: de nakomelingen heten <b>F1-hybriden</b> en groeien snel met grote vruchten.<br>a Waarom wil hij dat de ouderrassen <b>homozygoot</b> zijn?<br>b Telers moeten elk jaar nieuw zaad kopen: als ze zelf zaad winnen van hun F1-planten, zijn de nakomelingen niet meer allemaal zo goed. Verklaar dat.',
 'a Een homozygote plant geeft <b>altijd hetzelfde allel</b> door. Dan zijn <b>alle F1-planten gelijk</b> (allemaal heterozygoot met de gewenste allelen): een voorspelbaar resultaat.<br>b De F1-planten zijn <b>heterozygoot</b>. Bij geslachtelijke voortplanting treedt <b>recombinatie</b> op (bijvoorbeeld Aa × Aa geeft AA, Aa en aa), dus de nakomelingen zijn <b>niet meer allemaal gelijk</b>.',
 [['homozygoot geeft altijd hetzelfde allel door','altijd hetzelfde|zelfde allel|hetzelfde allel|altijd.{0,20}allel|één soort'],
  ['F1 dan allemaal gelijk/voorspelbaar','allemaal gelijk|alle.{0,25}(gelijk|zelfde)|voorspel|zeker'],
  ['F1 is heterozygoot; recombinatie geeft verschillende nakomelingen','heterozygoot|recombinatie|aa|uiteen|verschillend|splitsen']]],

['3.3','Bij labradors is een <b>zwarte vacht (B)</b> dominant over een <b>bruine vacht (b)</b>. Een homozygote zwarte reu wordt gekruist met een bruine teef. De F1-honden krijgen onderling jongen (F2).<br>Maak het kruisingsschema van P tot en met F2 en geef de verhouding van de <b>fenotypen</b> in de F2.',
 'P: ♂ <b>BB</b> × ♀ <b>bb</b>. Geslachtscellen: B × b. F1: allemaal <b>Bb</b> (zwart).<br>F1 × F1: Bb × Bb. Geslachtscellen: B of b × B of b.<br>F2: <b>BB, Bb, Bb, bb</b> (genotypen 1 : 2 : 1).<br>Fenotypen F2: <b>zwart : bruin = 3 : 1</b>.',
 [['ouders BB × bb, F1 allemaal Bb','bb.{0,15}bb|f1.{0,20}bb'],

  ['F2: zwart : bruin = 3 : 1 (75% : 25%)','3 ?: ?1|75|drie op één']]],
['3.3','Bij konijnen zijn <b>staande oren (H)</b> dominant over <b>hangende oren (h)</b>. Een fokker heeft een konijn met staande oren en wil weten of het <b>HH of Hh</b> is. Beschrijf hoe hij met een <b>testkruising</b> achter het genotype komt.',
 'Hij kruist het konijn met een konijn met <b>hangende oren (hh)</b>, homozygoot recessief. Krijgen (bij <b>veel</b> nakomelingen) <b>alle jongen staande oren</b>, dan is het konijn <b>HH</b> (HH × hh geeft alleen Hh). Komen er <b>ook jongen met hangende oren</b> (ongeveer 1 : 1), dan is het <b>Hh</b> (Hh × hh geeft Hh en hh). Hij heeft wel <b>genoeg nakomelingen</b> nodig, anders speelt toeval een te grote rol.',
 [['kruisen met homozygoot recessief (hh, hangende oren)','hh|hangende oren|homozygoot recessief|recessie'],
  ['alleen staande oren → HH','alle.{0,40}staand|alleen staand|homozygoot|100'],
  ['ook hangende oren (1 : 1) → Hh','ook.{0,30}hang|1 ?: ?1|50|heterozygoot'],
  ['genoeg nakomelingen nodig (toeval)','veel|genoeg|toeval|groot aantal|betrouwba']]],
['3.3','<i>MSUD (naar examen havo 2018).</i> Baby Stan heeft <b>MSUD</b>, een zeldzame erfelijke stofwisselingsziekte: een enzym werkt niet goed, waardoor bepaalde aminozuren niet worden afgebroken. Stans ouders zijn allebei gezond. Bij allebei is door DNA-onderzoek één afwijkend allel gevonden.<br>De ouders willen weten hoe groot de kans is dat een volgend kind ook MSUD krijgt, als het een <b>jongen</b> is en als het een <b>meisje</b> is. Leg uit.',
 'Twee gezonde ouders krijgen een ziek kind, dus MSUD is <b>recessief</b>, en beide ouders zijn <b>drager (Aa)</b>. Het is <b>autosomaal</b>: de vader is gezond en heeft toch het afwijkende allel; bij een X-chromosomaal recessief allel zou een man met dat allel ziek zijn. Aa × Aa geeft AA : Aa : aa = 1 : 2 : 1, dus de kans op aa is <b>25% voor een jongen én 25% voor een meisje</b>: het geslacht maakt niet uit.',
 [['recessief, beide ouders Aa (drager)','recessief|aa|drager|heterozygoot'],
  ['autosomaal: geslacht maakt niet uit','autosom|geslacht maakt niet|niet x|maakt niet uit|zelfde kans|even groot'],
  ['kans 25% (bij jongen en meisje)','25|kwart|1/4|¼|één op vier|1 op 4']]],
['3.3','Bij leeuwenbekjes geeft het allel voor rood (A<sup>R</sup>) samen met het allel voor wit (A<sup>W</sup>) een <b>roze</b> bloem. Een roze plant bestuift zichzelf en levert <b>56 zaden</b>, die allemaal uitgroeien.<br>Maak het kruisingsschema en bereken hoeveel <b>roze</b> planten je verwacht. Geef ook de verhouding van de fenotypen.',
 'Roze = <b>A<sup>R</sup>A<sup>W</sup></b> (intermediair). A<sup>R</sup>A<sup>W</sup> × A<sup>R</sup>A<sup>W</sup>; geslachtscellen A<sup>R</sup> of A<sup>W</sup>. Nakomelingen: A<sup>R</sup>A<sup>R</sup> (rood), A<sup>R</sup>A<sup>W</sup> (roze), A<sup>W</sup>A<sup>R</sup> (roze), A<sup>W</sup>A<sup>W</sup> (wit).<br>Roze = 2/4 = ½, dus <b>½ × 56 = 28</b> roze planten. Verhouding <b>rood : roze : wit = 1 : 2 : 1</b>.',
 [['roze ouder is heterozygoot (ARAW)','heterozygoot|arw|ar ?aw|a ?r ?a ?w|rw'],
  ['28 roze planten','28|achtentwintig'],
  ['verhouding rood : roze : wit = 1 : 2 : 1','1 ?: ?2 ?: ?1']]],
['3.3','De ziekte van <b>Huntington</b> is een erfelijke zenuwziekte die <b>dominant</b> overerft (H = Huntington, h = gezond). Anouk heeft het allel voor Huntington (Hh). Haar vriend Mark heeft het niet.<br>Hoe groot is de kans dat een kind van hen het allel voor Huntington krijgt? Laat je kruisingsschema zien.',
 'Mark is gezond, dus <b>hh</b>. Kruising: <b>Hh × hh</b>. Geslachtscellen Anouk: H of h; Mark: alleen h. Nakomelingen: <b>Hh, Hh, hh, hh</b> → Hh : hh = 1 : 1. De kans is <b>50%</b>. Omdat het allel <b>dominant</b> is, is één H genoeg om de ziekte te krijgen.',
 [['Mark is hh; kruising Hh × hh','hh'],
  ['nakomelingen Hh : hh = 1 : 1','1 ?: ?1|hh.{0,20}hh'],
  ['kans 50%','50|helft|½|1/2']]],
['3.3','Een groene erwtenplant wordt gekruist met een gele erwtenplant. Er komen <b>204 groene</b> en <b>187 gele</b> nakomelingen.<br>a Wat zijn de genotypen van de ouders?<br>b Kun je hieruit afleiden welk allel dominant is? Leg uit.',
 'a De verhouding is ongeveer <b>1 : 1</b>. Dat krijg je bij een kruising van een <b>heterozygote</b> plant met een <b>homozygoot recessieve</b> plant: <b>Gg × gg</b>.<br>b <b>Nee</b>: 1 : 1 ontstaat bij Aa × aa, maar je weet <b>niet welke ouder</b> (de groene of de gele) de heterozygote is. Zowel groen als geel kan dus dominant zijn.',
 [['verhouding ongeveer 1 : 1','1 ?: ?1|helft|50'],
  ['heterozygoot × homozygoot recessief (Gg × gg)','heterozygoot|gg|aa'],
  ['nee: je weet niet welke ouder heterozygoot is','nee|niet|weet je niet|kan allebei|beide']]],
['3.3','Quang kan zijn tong rollen (T, dominant over t). Ook zijn vader, zijn oom (broer van zijn vader) en zijn opa (vader van zijn vader) kunnen tongrollen. Zijn oma (moeder van zijn vader), zijn moeder en zijn broertje kunnen het niet.<br>Geef de genotypen van Quang, zijn vader en zijn opa. Leg uit.',
 'Oma, moeder en broertje zijn <b>tt</b> (recessief fenotype). Vader kreeg van oma een t en kan rollen, dus vader is <b>Tt</b>. Quang kreeg van zijn moeder een t en kan rollen, dus Quang is <b>Tt</b>. Van opa weet je het niet zeker: <b>TT of Tt</b> (zijn kinderen kunnen allemaal rollen, ze kregen hun t van oma).',
 [['vader Tt (kreeg t van oma)','vader.{0,30}tt|oma'],

  ['opa TT of Tt, niet zeker','tt of tt|niet zeker|onzeker|weet je niet|niet te bepalen|kan allebei']]],
