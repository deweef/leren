<title>BSM · Bewegen, gezondheid en regelen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* iPad: twee keer snel tikken mag niet inzoomen (knijpen om te zoomen blijft werken) */
*{touch-action:manipulation}
:root{--bg:#F5F2EC;--surface:#fff;--ink:#1E2230;--muted:#5D6375;--line:#DDD6CB;--chip:#EEE8DE;--accent:#1F6F78;--gold:#B8860B;--good:#1E8E5A;--good-bg:#E3F4EA;--bad:#C0392B;--bad-bg:#FBE9E7;--tip:#FFF6DA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161D;--surface:#1D2029;--ink:#E9EAF0;--muted:#A0A5B5;--line:#30343F;--chip:#272A35;--accent:#4FC3C9;--gold:#E8B84A;--good:#4CD68A;--good-bg:#173226;--bad:#FF7B6B;--bad-bg:#3A1E1B;--tip:#2E2A1C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161D;--surface:#1D2029;--ink:#E9EAF0;--muted:#A0A5B5;--line:#30343F;--chip:#272A35;--accent:#4FC3C9;--gold:#E8B84A;--good:#4CD68A;--good-bg:#173226;--bad:#FF7B6B;--bad-bg:#3A1E1B;--tip:#2E2A1C;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-wrap:break-word}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font:800 clamp(30px,7vw,44px)/1.05 Archivo,system-ui,sans-serif;font-stretch:90%;margin:4px 0 6px}
h2{font:800 22px/1.2 Archivo,system-ui,sans-serif;margin:22px 0 8px}
h3{font:800 18px/1.25 Archivo,system-ui,sans-serif;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 16px}
.terug{display:inline-block;margin:0 0 10px;color:inherit;opacity:.7;text-decoration:none;font:700 14px system-ui,sans-serif}
.vlag{display:inline-flex;height:10px;width:44px;border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:8px}
.vlag i{flex:1}.vlag i:nth-child(1){background:#111}.vlag i:nth-child(2){background:#DD0000}.vlag i:nth-child(3){background:#FFCE00}
.kaart{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.opdracht{border-color:var(--ink)}
.opdracht ol{padding-left:22px;margin:8px 0}.opdracht li{margin:4px 0}
.label{font:700 12px/1 "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.mode{display:block;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;font:inherit;position:relative}
.mode h3{margin:0 0 4px}.mode p{margin:0;color:var(--muted);font-size:15px}
.mode.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}.mode.main p{color:var(--bg);opacity:.8}
.mode.gehaald{background:var(--good-bg);border-color:var(--good)}
.mode.gehaald::after{content:"✓ gehaald";position:absolute;top:8px;right:10px;font:700 11px "JetBrains Mono",monospace;color:var(--good)}
.balk{height:10px;background:var(--chip);border-radius:6px;overflow:hidden;margin:8px 0 4px}.balk i{display:block;height:100%;background:var(--good);transition:width .3s}
.btn{font:700 16px system-ui,sans-serif;padding:11px 16px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.licht{background:none;color:var(--ink)}
.btn.klein{font-size:14px;padding:7px 12px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.top>*{white-space:nowrap}
.teller{font:700 14px "JetBrains Mono",monospace;padding:6px 10px;border-radius:10px;background:var(--chip)}
.teller.ok{background:var(--good-bg);color:var(--good)}.teller.te{background:var(--bad-bg);color:var(--bad)}
.stap{font:700 13px "JetBrains Mono",monospace;color:var(--muted)}
textarea{width:100%;min-height:120px;font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.tip{background:var(--tip);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15.5px}
.stenen{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.steen{font:15px "Atkinson Hyperlegible",system-ui,sans-serif;padding:7px 11px;border-radius:10px;border:1.5px dashed var(--muted);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.steen small{display:block;color:var(--muted);font-size:12.5px}
.check{list-style:none;padding:0;margin:8px 0}
.check li{padding:7px 0 7px 30px;position:relative;border-bottom:1px solid var(--line)}
.check li::before{position:absolute;left:4px;top:7px;font-weight:800}
.check li.ja::before{content:"✓";color:var(--good)}.check li.nee::before{content:"✗";color:var(--bad)}.check li.let::before{content:"!";color:var(--gold)}
.check li small{display:block;color:var(--muted);font-size:14px}
label.zelf{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
label.zelf input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--good)}
.brief{white-space:pre-wrap;font:17px/1.6 Georgia,"Times New Roman",serif;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{font:inherit;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt.goed{border-color:var(--good);background:var(--good-bg)}.opt.fout{border-color:var(--bad);background:var(--bad-bg)}
.uitleg{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--chip)}
.tegels{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border-radius:12px;border:2px dashed var(--line);margin:10px 0}
.tegel{font:700 17px "Atkinson Hyperlegible",system-ui,sans-serif;padding:8px 12px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}
.tegel.weg{visibility:hidden}
.goed-t{color:var(--good);font-weight:700}.fout-t{color:var(--bad);font-weight:700}
[hidden]{display:none!important}
.kaart ul{padding-left:20px;margin:6px 0}.kaart li{margin:4px 0}
.opt{font-size:17px;overflow-wrap:anywhere}
.top .stap{white-space:normal;text-align:center;flex:1;min-width:0}
.vraag{margin:6px 0 0;font:700 19px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
.groot{font:800 54px Archivo,system-ui;margin:8px 0}.groot span{font-size:.45em;color:var(--muted)}
.ex{background:var(--chip);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;margin:10px 0}
.src{color:var(--muted);font-size:14px}
.gt{display:block;overflow-x:auto;border-collapse:collapse;font-size:14.5px;margin:8px 0}.gt th,.gt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:normal}.gt th{background:var(--chip)}
.fig{display:block;width:100%;max-width:240px;margin:6px auto;color:var(--ink)}
.figrij{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0;text-align:center}.figrij small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.check{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
.typerow{display:flex;gap:10px;margin-top:12px}.typerow input{flex:1;min-width:0;font:700 18px "Atkinson Hyperlegible",system-ui;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.hk h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
dl.begr{margin:0}.begr dt{font-weight:700;margin-top:8px}.begr dd{margin:0 0 0 12px;color:var(--muted)}
.fig.breed{max-width:440px}.fig.veld{max-width:360px}
.volgrij{min-height:40px;margin:10px 0;padding-left:26px}.volgrij li{font-weight:700;margin:4px 0}
.gt td,.gt th{overflow-wrap:normal}
</style>
</head>
<body>
<main id="home">
  <a href="index.html" class="terug">‹ Alle vakken</a>
  <h1>BSM · Bewegen en regelen</h1>
  <p class="sub">Toetsstof: § 1.1-1.2 (gezonde leefstijl, warming-up), § 2.1-2.3 (communicatie, begeleiden, lesgeven) en de modules padel, softbal en groene spelen. Volg de leerroute, dan heb je alles gehad.</p>
  <div id="stand"></div>
  <h2>Spellen en oefenen</h2>
  <div class="modes">
    <button class="mode" id="prol"><h3>🕵️ Wat is dit?</h3><p>Leiderschapsstijl, Tuckman, bewustwordingsfase of rol: herken het.</p></button>
    <button class="mode" id="psof"><h3>🥎 Softbal-scheids</h3><p>Slag, wijd, fout of uit? En wie staat waar?</p></button>
    <button class="mode" id="ppad"><h3>🎾 Padel-teller</h3><p>15, 30, 40, game: houd de stand bij en ken de regels.</p></button>
    <button class="mode" id="pvolg"><h3>🧩 Op volgorde</h3><p>Fasen en stappen in de goede volgorde zetten.</p></button>
    <button class="mode" id="pblitz"><h3>⚡ Begrippenblitz</h3><p>60 seconden alle begrippen door elkaar.</p></button>
    <button class="mode" id="ptoets"><h3>🎯 Proeftoets</h3><p>20 vragen uit alles, met een cijfer. Doel: een 7.</p></button>
    <button class="mode" id="fouten" hidden><h3>🔁 Mijn fouten</h3><p></p></button>
    <button class="mode" id="psamen"><h3>📄 Alles nog eens lezen</h3><p>Alle uitleg en begrippen onder elkaar.</p></button>
  </div>
  <div id="hst"></div>
  <div class="acts"><button class="btn licht klein" id="wis">Voortgang wissen</button></div>
</main>
<main id="play" hidden></main>
<script>
/* ---------- plaatjes (inline SVG) ---------- */
const SVG=(w,h,inh,lab,cls)=>`<svg viewBox="0 0 ${w} ${h}" class="fig${cls?' '+cls:''}" role="img" aria-label="${lab||''}">${inh}</svg>`;
const T=(x,y,t,o='')=>`<text x="${x}" y="${y}" text-anchor="middle" ${o}>${t}</text>`;
const PIJL=`<defs><marker id="pk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>`;
const pijl=(x1,y1,x2,y2,o='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="2" marker-end="url(#pk)" ${o}/>`;
const blok=(x,y,w,h,t,k='#1F6F78',tk='#fff',fs=14)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${k}"/><text x="${x+w/2}" y="${y+h/2+fs*.36}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${tk}">${t}</text>`;

/* BRAVO */
function figBravo(){const L=[['B','Bewegen','#2E86C1'],['R','niet|Roken','#8E44AD'],['A','geen|Alcohol','#C0392B'],['V','Voeding','#27AE60'],['O','Ont-|spanning','#E67E22']];
 return SVG(360,118,L.map((l,i)=>`<rect x="${4+i*71}" y="6" width="66" height="62" rx="12" fill="${l[2]}"/>${T(37+i*71,52,l[0],'font-size="38" font-weight="800" fill="#fff"')}${l[1].split('|').map((w,j)=>T(37+i*71,86+j*15,w,'font-size="12.5" font-weight="700" fill="currentColor"')).join('')}`).join(''),'BRAVO: Bewegen, niet Roken, geen Alcohol, Voeding, Ontspanning','breed')}
/* WHO: drie kanten van gezondheid */
function figWho(){const c=(x,y,k)=>`<circle cx="${x}" cy="${y}" r="58" fill="${k}" fill-opacity=".28" stroke="${k}" stroke-width="2"/>`;
 return SVG(300,210,c(110,78,'#2E86C1')+c(190,78,'#8E44AD')+c(150,140,'#27AE60')+T(82,62,'lichamelijk','font-size="13" font-weight="700" fill="currentColor"')+T(218,62,'geestelijk','font-size="13" font-weight="700" fill="currentColor"')+T(150,186,'maatschappelijk','font-size="13" font-weight="700" fill="currentColor"')+T(150,106,'gezond','font-size="14" font-weight="800" fill="currentColor"')+T(150,205,'meer dan ‘niet ziek zijn’','font-size="11.5" fill="currentColor" opacity=".75"'),'Gezondheid volgens de WHO: lichamelijk, geestelijk en maatschappelijk welzijn')}
/* Beweegrichtlijnen */
function figRicht(){const kol=(x,kop,k,r1a,r1b,r2a,r2b)=>`<rect x="${x}" y="4" width="172" height="196" rx="12" fill="${k}" fill-opacity=".14" stroke="${k}" stroke-width="2"/>${T(x+86,26,kop,`font-size="14" font-weight="800" fill="${k}"`)}
 ${T(x+86,62,r1a,'font-size="24" font-weight="800" fill="currentColor"')}${T(x+86,80,r1b,'font-size="12" fill="currentColor"')}${T(x+86,94,'matig intensief bewegen','font-size="12" fill="currentColor"')}
 <line x1="${x+20}" y1="108" x2="${x+152}" y2="108" stroke="${k}" stroke-dasharray="4 4"/>
 ${T(x+86,138,r2a,'font-size="24" font-weight="800" fill="currentColor"')}${T(x+86,156,'spier- en botversterkend','font-size="12" fill="currentColor"')}${T(x+86,172,r2b,'font-size="11.5" fill="currentColor" opacity=".8"')}`;
 return SVG(360,240,kol(4,'Jeugd 4 t/m 18 jaar','#2E86C1','1 uur','elke dag','3× per week','')+kol(184,'Volwassenen en ouderen','#E67E22','150 min','per week (2,5 uur), verspreid','2× per week','ouderen: plus balans')+T(180,218,'Voor iedereen: bewegen is goed, meer is beter.','font-size="12" font-weight="700" fill="currentColor"')+T(180,233,'En voorkom veel stilzitten.','font-size="12" font-weight="700" fill="currentColor"'),'De beweegrichtlijnen','breed')}
/* Warming-up, training, cooling-down als curve */
function figBoog(){const fs='font-size="11" fill="currentColor"';
 return SVG(360,222,PIJL+`<line x1="30" y1="165" x2="350" y2="165" stroke="currentColor"/><line x1="30" y1="165" x2="30" y2="14" stroke="currentColor"/>${T(14,90,'intensiteit',`font-size="11" fill="currentColor" transform="rotate(-90 14 90)"`)}${T(336,160,'tijd →',fs)}
 <rect x="30" y="20" width="168" height="145" fill="#E67E22" fill-opacity=".10"/><rect x="262" y="20" width="88" height="145" fill="#2E86C1" fill-opacity=".12"/>
 <path d="M30 155 C70 150 90 128 112 120 L150 118 C170 110 185 80 198 62 L262 52 C285 60 300 120 350 150" fill="none" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
 <line x1="112" y1="25" x2="112" y2="165" stroke="currentColor" stroke-dasharray="3 4" opacity=".5"/><line x1="150" y1="25" x2="150" y2="165" stroke="currentColor" stroke-dasharray="3 4" opacity=".5"/>
 ${T(66,179,'1 algemeen','font-size="10.5" font-weight="700" fill="currentColor"')}${T(66,191,'≥ 10 min',fs)}${T(127,179,'2 rekken','font-size="10.5" font-weight="700" fill="currentColor"')}${T(127,191,'± 5 min',fs)}${T(182,179,'3 sport-','font-size="10.5" font-weight="700" fill="currentColor"')}${T(182,191,'specifiek','font-size="10.5" font-weight="700" fill="currentColor"')}
 ${T(114,34,'warming-up 15-20 min','font-size="12" font-weight="800" fill="#E67E22"')}${T(230,40,'training',`font-size="12" font-weight="800" fill="currentColor"`)}${T(306,34,'cooling-down','font-size="12" font-weight="800" fill="#2E86C1"')}${T(306,48,'5-15 min',fs)}
 ${T(190,214,'laag → hoog · low → high impact · klein → groot · eenvoudig → complex','font-size="10.5" fill="currentColor" opacity=".85"')}`,'Warming-up, training en cooling-down','breed')}
/* Communicatiemodel */
function figComm(){const n=['Zender','Boodschap','Medium','Ontvanger'];
 return SVG(360,70,PIJL+n.map((t,i)=>blok(2+i*90,14,74,40,t,'#1F6F78','#fff',12.5)+(i<3?pijl(77+i*90,34,90+i*90,34):'')).join(''),'Zender, boodschap, medium, ontvanger','breed')}
/* Tuckman */
function figTuckman(){const f=[['Forming','aftasten','🤝'],['Storming','ruzie, taak ligt stil','⚡'],['Norming','afspraken, vertrouwen','📏'],['Performing','echt team','🏆'],['Adjourning','evalueren, uit elkaar','👋']];
 return SVG(360,170,f.map((x,i)=>{const h=i<4?40+i*24:52;const y=150-h;return `<rect x="${4+i*71}" y="${y}" width="66" height="${h}" rx="6" fill="${i===1?'#C0392B':i===4?'#7F8C8D':'#1F6F78'}"/>${T(37+i*71,y-22,x[2],'font-size="18"')}${T(37+i*71,y+16,i+1,'font-size="14" font-weight="800" fill="#fff"')}${T(37+i*71,163,x[0],'font-size="11" font-weight="800" fill="currentColor"')}`}).join(''),'Vijf fasen van groepsvorming van Tuckman','breed')}
/* Sandwich */
function figSandwich(){return SVG(260,130,`<rect x="30" y="8" width="200" height="30" rx="14" fill="#D4A15A"/>${T(130,28,'positief 👍','font-size="13" font-weight="800" fill="#3B2A14"')}<rect x="38" y="44" width="184" height="34" rx="6" fill="#C0392B"/>${T(130,66,'kritiekpunt','font-size="13" font-weight="800" fill="#fff"')}<rect x="30" y="84" width="200" height="30" rx="14" fill="#D4A15A"/>${T(130,104,'positief 👍','font-size="13" font-weight="800" fill="#3B2A14"')}`,'Sandwichmethode: positief, kritiek, positief')}
/* Leiderschapsstijlen */
function figLeider(){return SVG(360,206,`<path d="M40 20 L40 130 L330 130 Z" fill="#1F6F78"/><path d="M40 20 L330 20 L330 130 Z" fill="#7FB3D5"/>${T(110,110,'invloed groep','font-size="14" font-weight="800" fill="#fff"')}${T(260,48,'invloed leider','font-size="14" font-weight="800" fill="#1E2230"')}
 ${[['laissez-faire',40],['democratisch',150],['consulterend',236],['autoritair',330]].map(([t,x],i)=>`<line x1="${x}" y1="${i%2?166:150}" x2="${x}" y2="134" stroke="currentColor" stroke-width="2"/><text x="${x}" y="${i%2?180:162}" text-anchor="${x<60?'start':x>280?'end':'middle'}" font-size="12" font-weight="700" fill="currentColor">${t}</text>`).join('')}
 ${T(185,198,'← groep beslist meer · leider beslist meer →','font-size="11" fill="currentColor" opacity=".8"')}`,'Leiderschapsstijlen: van laissez-faire tot autoritair','breed')}
/* Vier bewustwordingsfasen */
function figMaslow(){const q=(x,y,n,t1,t2,k)=>`<rect x="${x}" y="${y}" width="130" height="78" fill="${k}" fill-opacity=".16"/>${T(x+65,y+30,n,'font-size="15" font-weight="800" fill="currentColor"')}${T(x+65,y+48,t1,'font-size="12" font-weight="700" fill="currentColor"')}${T(x+65,y+63,t2,'font-size="12" font-weight="700" fill="currentColor"')}`;
 return SVG(320,220,PIJL+q(40,10,'II','bewust','onbekwaam','#C0392B')+q(170,10,'III','bewust','bekwaam','#E67E22')+q(40,88,'I','onbewust','onbekwaam','#7F8C8D')+q(170,88,'IV','onbewust','bekwaam','#27AE60')+`<line x1="170" y1="10" x2="170" y2="166" stroke="currentColor" stroke-dasharray="4 4"/><line x1="40" y1="88" x2="300" y2="88" stroke="currentColor" stroke-dasharray="4 4"/><rect x="40" y="10" width="260" height="156" fill="none" stroke="currentColor"/>
 <path d="M70 150 C40 100 50 40 90 30 L250 30 C290 40 300 100 275 140" fill="none" stroke="#2E86C1" stroke-width="5" opacity=".55" marker-end="url(#pk)"/>
 ${T(170,186,'mate van bekwaamheid →','font-size="11.5" fill="currentColor"')}${T(22,88,'mate van bewustheid →','font-size="11.5" fill="currentColor" transform="rotate(-90 22 88)"')}${T(170,210,'I → II → III → IV','font-size="12" font-weight="800" fill="#2E86C1"')}`,'Vier bewustwordingsfasen')}
/* Didactisch model */

 <line x1="${X(10)}" y1="${Y(0)-4}" x2="${X(10)}" y2="${Y(10)+4}" stroke="currentColor" stroke-width="4"/>
 <line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(10)}" stroke="#5DADE2" stroke-width="6"/><line x1="${X(20)}" y1="${Y(0)}" x2="${X(20)}" y2="${Y(10)}" stroke="#5DADE2" stroke-width="6"/>
 ${[0,10].map(yy=>`<line x1="${X(0)}" y1="${Y(yy)}" x2="${X(4)}" y2="${Y(yy)}" stroke="#5DADE2" stroke-width="6"/><line x1="${X(16)}" y1="${Y(yy)}" x2="${X(20)}" y2="${Y(yy)}" stroke="#5DADE2" stroke-width="6"/><line x1="${X(4)}" y1="${Y(yy)}" x2="${X(16)}" y2="${Y(yy)}" stroke="currentColor" stroke-width="2.5" stroke-dasharray="3 3" opacity=".6"/>`).join('')}`;
 if(!o.kaal)s+=`${T(X(10),Y(0)-8,'net',fs+' font-weight="700"')}${T(X(1.5),Y(5)+4,'3 m',fs)}${T(X(6.5),Y(2.5)+4,'servicevak',fs)}${T(X(6.5),Y(7.5)+4,'servicevak',fs)}${T(X(13.5),Y(2.5)+4,'servicevak',fs)}${T(X(13.5),Y(7.5)+4,'servicevak',fs)}
 ${T(X(10),Y(10)+16,'20 m × 10 m · servicelijn 6,95 m van het net',fs)}${T(X(2),Y(0)-8,'glas',fs+' fill="#2E86C1"')}${T(X(7),Y(0)-8,'hek (gaas)',fs)}`;
 if(o.bal)s+=o.bal;
 return SVG(340,200,s,'Padelbaan van bovenaf','breed')}

const H=[
{id:'1.1',nr:'1.1',t:'Gezonde leefstijl',ic:'💚',lp:[
 ['Wat is gezond?',`<p>Bijna iedereen heeft wel een ongezonde gewoonte, ook als hij weet dat het slecht is. <b>Kennis alleen</b> bepaalt je leefstijl dus niet: gewoontes en genieten tellen ook mee. Het boek noemt dat het dilemma tussen <b>hoofd en hart</b>.</p><p>De <b>WHO</b> (Wereldgezondheidsorganisatie) zegt: gezondheid is een toestand van volledig <b>lichamelijk, geestelijk en maatschappelijk welzijn</b>, en niet alleen de afwezigheid van ziekte.</p>${figWho()}`,['Wat zegt de WHO over gezondheid?','het is meer dan niet ziek zijn: lichamelijk, geestelijk én maatschappelijk welzijn','gezond = geen ziekte of gebrek hebben|gezond = genoeg bewegen en goed eten|gezond = een goede conditie hebben','Drie kanten: lichamelijk, geestelijk en maatschappelijk. Niet ziek zijn is dus niet genoeg.']],
 ['BRAVO',`<p>Een gezonde leefstijl kun je onthouden met <b>BRAVO</b>:</p>${figBravo()}<p>Bij sommige dingen is het simpel (roken, vapen, harddrugs: gewoon niet doen). Bij andere dingen zoek je een <b>balans</b>: tussen genieten en je inhouden, tussen ‘iets te veel’ en ‘nu even niet’.</p><p>Een gezonde leefstijl én een gezonde <b>leefomgeving</b> helpen ziektes voorkomen.</p>`,['Waar staat de A van BRAVO voor?','geen Alcohol','Activiteit|Afwisseling|Aandacht','B = Bewegen, R = niet Roken, A = geen Alcohol, V = Voeding, O = Ontspanning.']],
 ['Te weinig bewegen',`<p><b>Immobiliteit</b> = gebrek aan bewegen. Machines nemen veel werk over, veel werk gaat zittend, en ook ontspannen doen we vaak zittend (tv, gamen).</p><ul><li>Ongeveer <b>de helft</b> van de Nederlanders haalt de beweegrichtlijnen. In 2023: <b>45%</b> haalde ze helemaal (50% het intensieve bewegen, 81% het spier- en botversterkende deel).</li><li>Na 2020 ging het omlaag; in 2023 lijkt het stabiel.</li><li>Nederlanders zitten veel: gemiddeld <b>9 uur en 8 minuten</b> per dag. <b>26%</b> zit meer dan 8,5 uur per dag, in de EU is dat gemiddeld 11%.</li></ul>`,['Wat betekent immobiliteit?','gebrek aan bewegen','een blessure aan je gewrichten|niet kunnen stoppen met sporten|te veel zitten op school','Immobiel = niet bewegend. Te veel zitten is er een oorzaak van, maar het begrip zelf betekent: te weinig bewegen.']],
 ['De beweegrichtlijnen',`<p>De <b>Gezondheidsraad</b> maakte in <b>2017</b> de beweegrichtlijnen: hoeveel moet je bewegen om gezond te blijven?</p>${figRicht()}<p><b>Matig intensief</b> = je ademhaling gaat sneller. Spier- en botversterkend is bijvoorbeeld volleybal, dansen, buiten spelen of fietsen.</p><div class="ex">Let op de verschillen: jeugd <b>elke dag 1 uur</b> en <b>3×</b> per week spieren en botten; volwassenen <b>150 minuten per week</b> en <b>2×</b> per week.</div>`,['Hoeveel moet jij (16 jaar) volgens de richtlijn matig intensief bewegen?','elke dag minstens 1 uur','150 minuten per week|3 keer per week een half uur|elke dag minstens 2 uur','Jeugd van 4 tot en met 18 jaar: elke dag minstens een uur. De 150 minuten per week is voor volwassenen.']],
 ['Waarom bewegen?',`<p>Regelmatig bewegen geeft minder kans op <b>hart- en vaatziekten, diabetes type 2, depressieve klachten</b>, borst- en darmkanker en vroeg overlijden. En: hoe meer je beweegt, hoe groter het effect.</p><p>De <b>meeste winst</b> haal je als je van <b>inactief naar actief</b> gaat.</p><ul><li>Kinderen: minder somberheid, betere botten, lagere BMI en vetmassa bij overgewicht.</li><li>Ouderen: minder botbreuken, sterkere spieren, minder kans op dementie.</li></ul><p>Veel <b>zitten</b> is ongezond, maar dat effect wordt kleiner als je ook veel beweegt, en verdwijnt bij mensen die héél veel bewegen.</p>`,['Wanneer haal je de meeste gezondheidswinst?','als je van niet actief naar actief gaat','als je van 5 naar 7 keer per week sport|als je stopt met zitten op school|als je alleen nog krachttraining doet','De grootste sprong zit in de stap van niets doen naar (matig intensief) bewegen.']],
 ['Roken en alcohol',`<p><b>Roken</b>: vooral <b>nicotine en teer</b> zijn slecht. Meer dan <b>19.000</b> mensen per jaar overlijden in Nederland door (mee)roken, en <b>672.000</b> mensen zijn chronisch ziek door roken. Bij longkanker en strottenhoofdkanker komt ruim <b>8 op de 10</b> gevallen door roken, bij de longziekte COPD ruim driekwart.</p><p><b>Alcohol</b> is giftig. Advies van de Gezondheidsraad: niet drinken, of in elk geval niet meer dan <b>1 glas per dag</b>. Het Trimbos-instituut noemt:</p><table class="gt"><tr><th>overmatig</th><td>per <b>week</b>: vrouw meer dan 14, man meer dan 21 glazen</td></tr><tr><th>zwaar</th><td>minstens 1× per week op <b>één dag</b>: vrouw 4+, man 6+ glazen</td></tr><tr><th>bingedrinken</th><td>bij <b>één gelegenheid</b> meer dan 4 à 6 glazen</td></tr></table><p>Binge: 45% van de 12-jarigen heeft het weleens gedaan, bij 16-jarigen 76%. Stop je met drinken, dan merk je na <b>4 tot 6 weken</b> dat je fitter bent en beter slaapt.</p>`,['Wat is bingedrinken?','bij één gelegenheid meer dan 4 à 6 glazen drinken','elke dag 1 glas drinken|meer dan 14 glazen per week|één keer per maand alcohol drinken','Binge = veel tegelijk. Overmatig gaat over een hele week, zwaar over één dag per week.']],
 ['Voeding en ontspanning',`<p><b>Voeding</b>: gevarieerd eten, niet te veel en niet te weinig. Hoeveel ‘te veel’ is, hangt af van wat je verbrandt: een tuinder of een duursporter heeft meer nodig dan iemand met een kantoorbaan. Dat heet de <b>energiebalans</b>: wat je eet tegenover wat je nodig hebt. Lastig, want eten is een gewoonte. Drink <b>1,5 tot 2 liter</b> per dag.</p><p><b>Ontspanning</b>: voor jouw leeftijd is <b>8 uur slaap</b> ideaal. Sporters boeken vooruitgang in de <b>herstelfase</b>. Te lang onder hoge spanning leven geeft <b>stress</b>: hoge bloeddruk, slecht slapen, overspannen of zelfs een burn-out. Durf ook ‘nee’ te zeggen (<b>assertief</b> zijn).</p>`,['Wat is de energiebalans?','het evenwicht tussen wat je eet en wat je verbruikt','het evenwicht tussen sporten en rusten|de hoeveelheid energie in één maaltijd|het verschil tussen suiker en vet','Eet je meer dan je verbruikt, dan kom je aan. Een duursporter heeft dus meer nodig dan iemand die stilzit.']],
 ['Gewoontes veranderen',`<p>Iets <b>aanleren</b> gaat snel, iets <b>afleren</b> is heel moeilijk: je valt makkelijk terug in je oude patroon. Wat helpt:</p><ol><li><b>kleine stapjes</b> tegelijk,</li><li>doelen voor de <b>korte termijn</b>,</li><li>jezelf de <b>tijd geven</b> om te wennen.</li></ol><p>Begin jong: wie vroeg sportief is, heeft er zijn hele leven plezier van. Jong geleerd is oud gedaan.</p>`,['Je wilt meer gaan bewegen. Wat werkt volgens het boek het best?','klein beginnen met een doel voor de korte termijn','meteen elke dag een uur hardlopen|een doel voor over een jaar stellen|eerst alles over sport lezen','Kleine stapjes, kortetermijndoelen en jezelf tijd geven. Te grote stappen houd je niet vol.']]],
 q:[

 ['Welke drie kanten van welzijn noemt de WHO?','lichamelijk, geestelijk en maatschappelijk','lichamelijk, sportief en financieel|geestelijk, sociaal en sportief|voeding, beweging en slaap','Gezondheid is meer dan niet ziek zijn.'],
 ['Wie maakte de beweegrichtlijnen?','de Gezondheidsraad (2017)','de WHO (2020)|het RIVM (2023)|het Trimbos-instituut','De cijfers over hoeveel mensen genoeg bewegen komen van CBS en RIVM, de richtlijnen zelf van de Gezondheidsraad.'],
 ['Hoeveel moet een volwassene volgens de richtlijn matig intensief bewegen?','150 minuten per week, verspreid over meerdere dagen','elke dag minstens een uur|60 minuten per week|3 keer per week een uur','150 minuten = 2,5 uur per week. Jeugd: elke dag een uur.'],

 ['Wat geldt voor iedereen volgens de beweegrichtlijnen?','bewegen is goed, meer bewegen is beter, en voorkom veel stilzitten','meer dan een uur bewegen per dag is ongezond|alleen sport telt, wandelen niet|zitten is niet erg als je sport','Elke vorm van beweging telt.'],
 ['Hoeveel procent van de Nederlanders haalde in 2023 de hele beweegrichtlijn?','45%','81%|25%|65%','50% haalde het intensieve deel, 81% het spier- en botversterkende deel, samen 45%.'],
 ['Hoe lang zit een Nederlander (4+) gemiddeld per dag?','ruim 9 uur','ruim 5 uur|ruim 12 uur|ruim 7 uur','9 uur en 8 minuten in 2023. In het weekend ruim een uur minder.'],
 ['26% van de Nederlanders zit meer dan 8,5 uur per dag. Hoe zit dat in de EU?','gemiddeld 11%, dus Nederlanders zitten veel','gemiddeld 40%, dus Nederlanders zitten weinig|ongeveer hetzelfde, 25%|dat is niet bekend','Nederlanders zijn echte zitters vergeleken met andere Europeanen.'],
 ['Welke stoffen in een sigaret noemt het boek als slecht?','nicotine en teer','koolhydraten en vet|cafeïne en suiker|zuurstof en stikstof','Ook vapen is slecht.'],
 ['Hoeveel mensen overlijden jaarlijks in Nederland door (mee)roken?','meer dan 19.000','ongeveer 1.900|ongeveer 672.000|meer dan 100.000','672.000 is het aantal mensen dat chronisch ziek is door roken.'],
 ['Wat is het drinkadvies van de Gezondheidsraad?','geen alcohol, of in elk geval niet meer dan 1 glas per dag','niet meer dan 2 glazen per dag|niet meer dan 14 glazen per week|alleen in het weekend drinken','Alcohol is giftig voor je organen.'],
 ['Wat is overmatig drinken (Trimbos)?','per week meer dan 14 (vrouw) of 21 (man) glazen','op één dag meer dan 4 of 6 glazen|één keer per week alcohol|elke dag 1 glas','Overmatig = per week. Zwaar = op één dag, minstens 1× per week.'],
 ['Hoeveel procent van de 16-jarigen heeft weleens gebinged?','76%','45%|9%|25%','Bij 12-jarigen is het 45%: het neemt toe met de leeftijd.'],

 ['Hoeveel slaap is voor jouw leeftijd ideaal?','8 uur','6 uur|10 uur|5 uur','Kinderen slapen meer, volwassenen minder, ouderen nog iets minder.'],

 ['Wat helpt het best om een gewoonte te veranderen?','kleine stapjes en doelen voor de korte termijn','één grote verandering in één keer|een doel voor over vijf jaar|alleen veel kennis opdoen','En geef jezelf de tijd om te wennen.'],
 ['Waarom houden mensen ongezonde gewoontes vol, ook als ze weten dat het slecht is?','kennis is niet het enige: gewoontes en genieten spelen ook mee','ze weten niet dat het slecht is|ongezond gedrag is makkelijk af te leren|de overheid verbiedt het niet','Afleren is veel moeilijker dan aanleren.'],
