{id:'1.2',nr:'1.2',t:'Warming-up en cooling-down',ic:'🔥',lp:[
 ['Waarom een warming-up?',`<p>Een <b>warming-up</b> is een tijd van voorbereidende oefeningen vóór een training of wedstrijd, om de <b>prestatie te verbeteren</b> en <b>blessures te voorkomen</b>.</p><p>Je bereidt je <b>lichamelijk én mentaal</b> voor. Veel sporters doen het als vast ritueel voor concentratie en motivatie.</p>${figBoog()}`,['Wat zijn de twee doelen van een warming-up?','beter presteren en blessures voorkomen','afvalstoffen afvoeren en ontspannen|spieren laten groeien en afvallen|melkzuur maken en zweten','Afvalstoffen afvoeren is juist het doel van de cooling-down.']],
 ['Wat gebeurt er in je lijf?',`<p>Tijdens de warming-up verandert er veel:</p><ol><li>Je <b>ademt sneller en dieper</b>: meer zuurstof erin, meer CO₂ eruit.</li><li>Je hart pompt meer bloed rond: <b>hartslag</b> en <b>slagvolume</b> (bloed per slag) gaan omhoog.</li><li>Meer bloed naar de <b>spieren</b>, minder naar organen en hersenen.</li><li>Je spieren worden <b>38-39 °C</b>: de stofwisseling gaat beter.</li><li>Spieren, pezen en gewrichten worden <b>soepeler</b>.</li><li>De smering van je gewrichten (<b>viscositeit</b>) wordt beter.</li><li>Je <b>zenuwen</b> geleiden sneller: betere lenigheid en coördinatie.</li><li>Je <b>maximale kracht</b> neemt toe.</li><li>Je <b>pijngrens</b> gaat omhoog.</li></ol>`,['Waar gaat tijdens de warming-up meer bloed naartoe?','naar de spieren (minder naar organen en hersenen)','naar de hersenen|naar de maag en darmen|overal evenveel','Je spieren hebben nu de meeste zuurstof nodig.']],
 ['De opbouw: van laag naar hoog',`<p>Een goede warming-up duurt <b>15 tot 20 minuten</b> (topsporters nog langer, zoals wielrenners op de rollerbank vóór een tijdrit). Vier aandachtspunten:</p><table class="gt"><tr><th>intensiteit</th><td>van laag naar hoog</td></tr><tr><th>impact (schokbelasting)</th><td>van low impact (zonder springen) naar high impact (met springen)</td></tr><tr><th>bewegingsuitslag</th><td>van klein naar groot</td></tr><tr><th>moeilijkheid</th><td>van eenvoudig naar complex</td></tr></table>`,['Wat betekent low impact?','bewegen zonder springen','bewegen op lage snelheid|bewegen zonder bal|stilstaan en rekken','Impact = schokbelasting. Springen geeft schokken, dat komt pas later in de warming-up.']],
 ['De drie fasen',`<ol><li><b>Algemene warming-up</b> (ook: <b>circulatiewarming-up</b>), minstens <b>10 minuten</b>: ademhaling en bloedsomloop op gang, zo veel mogelijk spieren gebruiken. Inlopen, huppelen, aansluitpas, armzwaaien. Nog <b>geen</b> sprongen, versnellingen of plotselinge draaien.</li><li><b>Stretchen</b>, ongeveer <b>5 minuten</b>: spieren, pezen en banden op lengte brengen. Houd je trainingspak aan, anders koel je af. Daarna eventueel wat krachtoefeningen.</li><li><b>Sportspecifieke oefeningen</b>: oefeningen die bij jouw sport horen, met een hogere intensiteit. Voetbal: passen en trappen, basketbal: lay-ups, sprint: versnellingen. Geen nieuwe, moeilijke technieken: het moet routine zijn.</li></ol>`,['Wat hoort NIET in de algemene warming-up?','plotselinge versnellingen en sprongen','inlopen|armzwaaien|huppelen','In de eerste fase breng je alleen de bloedsomloop op gang, met rustige bewegingen.']],
 ['Statisch of dynamisch rekken?',`<table class="gt"><tr><th></th><th>statisch</th><th>dynamisch</th></tr><tr><th>hoe</th><td>rustig naar je maximale uitslag en <b>vasthouden</b></td><td>gecontroleerd <b>zwaaien</b> over de hele lengte van de spier</td></tr><tr><th>hoe lang</th><td><b>8-15 seconden</b>, dan herhalen</td><td>series van <b>8-12 herhalingen</b>, steeds iets groter</td></tr><tr><th>effect</th><td>grotere bewegingsuitslag</td><td>sportspecifiek, betere prestatie</td></tr><tr><th>nadeel</th><td>spier verliest <b>kracht en explosiviteit</b></td><td>nooit forceren</td></tr><tr><th>handig voor</th><td>turner, balletdanser, vechtsporter</td><td>sprinter, springer, hardloper, zaalvoetballer</td></tr></table><p>Onderzoek van Pereles bij <b>2729 hardlopers</b>: statisch rekken vóór het lopen is zinloos, <b>dynamisch</b> rekken werkt wel. Ook bij sprinten en springen maakt statisch rekken je prestatie slechter. Voorbeelden dynamisch: knieheffen, hakken-billen, kruispas, benen zwaaien.</p>`,['Hoe lang houd je een statische stretch vast?','8 tot 15 seconden','8 tot 12 herhalingen|1 tot 3 seconden|1 minuut','8-12 is het aantal herhalingen bij dynamisch rekken. Niet verwisselen!']],
 ['De cooling-down',`<p>Een <b>cooling-down</b> is een lichte inspanning na intensief sporten, zodat <b>afvalstoffen</b> zoals <b>melkzuur</b> worden afgevoerd. Je krijgt minder <b>spierstijfheid</b> en herstelt sneller. Duur: <b>5 tot 15 minuten</b>, trainingspak aan.</p><table class="gt"><tr><th>actief</th><td>zelf bewegen: rustig uitlopen, huppelen, zijsluitpas, armzwaaien, licht rekken, op je rug met je benen tegen de muur (afvalstoffen zakken met de zwaartekracht uit je benen)</td></tr><tr><th>passief</th><td>je beweegt zelf niet: <b>douchen</b> en <b>massage</b></td></tr></table><p>Door de belasting zijn je spieren <b>korter</b> geworden: licht rekken ontspant ze. Een sportdrankje vult vocht, suikers en zouten aan. Sneller herstellen = eerder weer trainen = beter trainingseffect.</p>`,['Is douchen na het sporten een actieve of een passieve cooling-down?','passief','actief|geen cooling-down|allebei','Passief = je beweegt zelf niet: douchen en massage.']]],
 q:[
 ['Hoe lang duurt een goede warming-up?','15 tot 20 minuten','5 minuten|45 minuten|5 tot 15 minuten','5-15 minuten is de cooling-down.'],
 ['Hoe heet de eerste fase van de warming-up ook?','circulatiewarming-up','sportspecifieke warming-up|stretchfase|cooling-down','Circulatie = bloedsomloop. Die breng je op gang.'],
 ['Hoe lang duurt de algemene warming-up minstens?','10 minuten','2 minuten|5 minuten|20 minuten','Stretchen duurt daarna ongeveer 5 minuten.'],
 ['Wat is de goede volgorde van de warming-up?','algemeen → stretchen → sportspecifiek','stretchen → algemeen → sportspecifiek|sportspecifiek → stretchen → algemeen|algemeen → sportspecifiek → stretchen','Eerst warm worden, dan rekken, dan de oefeningen van je sport.'],
 ['Tot welke temperatuur warmen je spieren op?','38 tot 39 °C','40 tot 42 °C|36 tot 37 °C|35 °C','Bij die temperatuur verloopt de stofwisseling beter.'],
 ['Waarom pompt je hart tijdens de warming-up meer bloed rond?','hartslag én slagvolume nemen toe','alleen de hartslag gaat omhoog|je bloed wordt dunner|je ademt langzamer','Slagvolume = hoeveel bloed het hart per slag wegpompt.'],
 ['Wat is viscositeit?','de smering van je gewrichten','de snelheid van je zenuwen|de lengte van je spieren|de kracht van je hart','Hoe beter de smering, hoe makkelijker je beweegt.'],
 ['Waardoor worden lenigheid en coördinatie beter?','je zenuwen geleiden sneller','je spieren worden korter|er gaat meer bloed naar je hersenen|je pijngrens daalt','De geleidingssnelheid van de zenuwen neemt toe.'],
 ['Wat gebeurt er met je pijngrens tijdens de warming-up?','die gaat omhoog','die gaat omlaag|die blijft gelijk|die verdwijnt','Je hebt minder last van kleine pijntjes.'],
 ['Welk aandachtspunt hoort bij ‘van klein naar groot’?','de bewegingsuitslag','de intensiteit|de impact|de moeilijkheid','Intensiteit: laag → hoog. Impact: low → high. Moeilijkheid: eenvoudig → complex.'],
 ['Hoeveel herhalingen doe je per serie bij dynamisch rekken?','8 tot 12','8 tot 15 seconden|2 tot 3|20 tot 30','Klein beginnen en elke serie iets groter, nooit forceren.'],
 ['Wat is het nadeel van statisch rekken?','de spier verliest kracht en explosiviteit','de spier wordt korter|je raakt sneller geblesseerd aan je hart|het duurt te lang','Daarom is het nadelig voor een sprinter of verspringer.'],
 ['Voor wie is statisch rekken wél nuttig?','een turner of balletdanser','een sprinter|een verspringer|een zaalvoetballer','Zij hebben een grote bewegingsuitslag nodig.'],
 ['Wat bleek uit het onderzoek onder 2729 hardlopers?','statisch rekken is zinloos, dynamisch rekken werkt','statisch rekken voorkomt alle blessures|rekken maakt niet uit|dynamisch rekken is gevaarlijk','Onderzoek van Pereles (George Washington Universiteit).'],
 ['Welke oefening is een voorbeeld van dynamisch rekken?','knieheffen','10 seconden je tenen aanraken|stil zitten in spagaat|tegen de muur leunen en vasthouden','Dynamisch = bewegen, statisch = vasthouden.'],
 ['Een basketballer doet lay-ups in zijn warming-up. Welke fase is dat?','sportspecifieke oefeningen','algemene warming-up|stretchen|cooling-down','Oefeningen die direct bij de sport horen, met een hogere intensiteit.'],
 ['Waarom houd je je trainingspak aan tijdens het stretchen?','zodat je niet afkoelt','zodat je beter kunt rekken|omdat het verplicht is|om meer te zweten','Je beweegt dan weinig, dus je koelt snel af.'],
 ['Wat is een cooling-down?','een lichte inspanning na het sporten om afvalstoffen af te voeren','rekken vóór het sporten|een koude douche voor de wedstrijd|stoppen met bewegen en gaan zitten','Zo krijg je minder spierstijfheid en herstel je beter.'],
 ['Hoe lang duurt een cooling-down?','5 tot 15 minuten','1 minuut|15 tot 20 minuten|een uur','15-20 minuten is de warming-up.'],
 ['Welke afvalstof noemt het boek bij de cooling-down?','melkzuur','zuurstof|suiker|zout','Melkzuur wordt afgevoerd en daarna in de organen afgebroken.'],
 ['Waarom rek je in de cooling-down?','je spieren zijn door de belasting korter geworden','om je spieren sterker te maken|om meer melkzuur te maken|om je hartslag te verhogen','Rekken ontspant ze en verbetert de doorbloeding.'],
 ['Waarom werkt ‘benen tegen de muur’ in de cooling-down?','afvalstoffen zakken met de zwaartekracht uit je benen','je benen worden langer|je hart gaat sneller kloppen|je rekt je hamstrings statisch','Je ligt op je rug en schudt je benen rustig los.'],
 ['Welke is een actieve cooling-down?','rustig uitlopen','een massage|een warme douche|in de sauna zitten','Actief = je beweegt zelf.'],
 ['Wat doet een sportdrankje na de cooling-down?','vocht, suikers en zouten aanvullen','melkzuur maken|je spieren afkoelen|je hartslag verhogen','Meer daarover in § 1.5 Voeding.']]},

{id:'2.1',nr:'2.1',t:'Communicatie en samenwerken',ic:'💬',lp:[
 ['Zender en ontvanger',`<p><b>Communicatie</b> = informatie uitwisselen. Er is altijd een <b>zender</b> en minstens één <b>ontvanger</b>. De zender stuurt een <b>boodschap</b> via een <b>medium</b> (stem, brief, telefoon), in een bepaalde <b>code</b> (bijvoorbeeld Nederlands).</p>${figComm()}`,['Wat is de goede volgorde?','zender → boodschap → medium → ontvanger','zender → medium → ontvanger → boodschap|boodschap → zender → ontvanger → medium|medium → zender → boodschap → ontvanger','De zender maakt een boodschap, die gaat via een medium naar de ontvanger.']],
 ['Verbaal en non-verbaal',`<p><b>Verbaal</b> = alles met <b>taal</b>: praten en chatten (direct), een brief of mail (indirect). Ook <b>gebarentaal</b> is verbaal: elk gebaar staat voor een woord of letter, het is een taal.</p><p><b>Non-verbaal</b> = zonder taal: hoe je kijkt, staat, beweegt en klinkt. Dat geeft vaak de doorslag: iemand zegt ‘ik ben niet zenuwachtig’, maar trilt. Volgens <b>Mehrabian</b> kan een boodschap over gevoelens tot <b>93%</b> non-verbaal zijn.</p><p>Negen non-verbale dingen: <b>uiterlijk, soort kleding, kleur kleding, lichaamshouding, gebaren, gezichtsuitdrukking</b> (ogen en mond!), <b>stemgebruik, toonhoogte</b> (laag = rustig en zeker) en <b>volume</b>.</p>`,['Is gebarentaal verbaal of non-verbaal?','verbaal, want het is een taal','non-verbaal, want je gebruikt je handen|allebei|geen van beide','Valkuil! Handgebaren bij je verhaal zijn non-verbaal, maar gebarentaal is een echte taal.']],
 ['Een groep groeit: Tuckman',`<p><b>Tuckman</b> (1965) zag dat een groep altijd vijf fasen doorloopt:</p>${figTuckman()}<ol><li><b>Forming</b>: losse mensen die elkaar aftasten. Non-verbaal speelt een grote rol.</li><li><b>Storming</b>: iedereen wil zijn ideeën kwijt, kleine ruzies, de taak blijft liggen.</li><li><b>Norming</b>: afspraken (normen), vertrouwen, open voor kritiek.</li><li><b>Performing</b>: een echt team dat elkaars sterke en zwakke kanten kent.</li><li><b>Adjourning</b>: klaar, de groep gaat uit elkaar en <b>evalueert</b>.</li></ol><p>In je BSM-klas gaan de eerste drie fasen steeds sneller, want je kent elkaar al.</p>`,['In welke fase zijn er ruzies en blijft de taak liggen?','storming','forming|norming|performing','Storm = onrust. Iedereen wil zijn eigen idee doordrukken.']],
 ['Luisteren en afspraken',`<p>Goed <b>luisteren</b> begint met iemand <b>laten uitpraten</b>. Laat zien dat je luistert: rechtop zitten, aankijken, knikken, ‘mm’. Vat aan het eind samen wat er gezegd is.</p><p>Bij <b>afspraken</b> is luisteren de belangrijkste vaardigheid. Houdt iemand zich er niet aan, spreek hem dan aan met een <b>ik-boodschap</b>: noem het <b>gedrag</b>, niet de persoon.</p><div class="ex">Goed: ‘Ik vind het vervelend dat je het boek niet hebt gehaald.’<br>Fout: ‘Jij bent ook altijd vergeetachtig.’ (een oordeel over wie iemand <b>is</b> geeft ruzie)</div>`,['Welke zin is een ik-boodschap?','‘Ik vind het vervelend dat je te laat bent.’','‘Jij bent ook altijd te laat.’|‘Iedereen vindt jou onbetrouwbaar.’|‘Waarom ben je zo lui?’','Je benoemt het gedrag (te laat) en hoe jij het vindt, zonder oordeel over de persoon.']],
 ['Feedback: de sandwich',`<p><b>Feedback</b> = terugkoppeling, zodat het de volgende keer beter gaat. Gebruik de <b>sandwichmethode</b>:</p>${figSandwich()}<p>Het eerste positieve punt zorgt dat de ander <b>gaat luisteren</b>. Het laatste geeft een <b>goed gevoel</b>, zodat hij het de volgende keer goed wil doen.</p>`,['Hoe is een feedbacksandwich opgebouwd?','positief – kritiek – positief','kritiek – positief – kritiek|positief – positief – kritiek|kritiek – kritiek – positief','De kritiek zit als beleg tussen twee positieve sneetjes.']],
 ['Leidinggeven: vier stijlen',`<p>In de sport heb je veel leiders: coach, aanvoerder, voorzitter. Er is <b>niet één</b> beste stijl: het hangt van de situatie af.</p>${figLeider()}<table class="gt"><tr><th>autoritair</th><td>de leider beslist alles, snel. Voorbeeld: het <b>leger</b>.</td></tr><tr><th>consulterend</th><td>de leider vraagt de groep om informatie, maar <b>beslist zelf</b>. Voorbeeld: een <b>chirurg</b> met zijn team.</td></tr><tr><th>democratisch</th><td>de <b>groep</b> beslist (meeste stemmen gelden), de leider zorgt dat het goed verloopt. Voorbeeld: voorzitter van de <b>Tweede Kamer</b>.</td></tr><tr><th>laissez-faire</th><td>de leider bemoeit zich bijna nergens mee (‘laten doen’). Handig als de groep meer weet, of aan het begin om veel ideeën te krijgen. Voorbeeld: <b>wetenschappers</b>.</td></tr></table>`,['De leider vraagt iedereen om zijn mening, maar beslist daarna zelf. Welke stijl?','consulterend','democratisch|autoritair|laissez-faire','Consulteren = raadplegen. Bij democratisch beslist de groep zelf.']]],
 q:[
 ['Wat is communicatie?','informatie uitwisselen tussen een zender en een of meer ontvangers','alleen praten met elkaar|een boodschap opschrijven|luisteren naar een ander','Er is altijd een zender en minstens één ontvanger.'],
 ['Wat is in het communicatiemodel het medium?','de weg waarlangs de boodschap gaat, zoals stem, brief of telefoon','de persoon die de boodschap krijgt|de taal waarin je praat|de inhoud van het bericht','De taal noemt het boek de code.'],
 ['Is een e-mail verbale communicatie?','ja, indirect verbaal','nee, want je praat niet|nee, het is non-verbaal|alleen als er plaatjes in staan','Verbaal = met taal. Praten is direct, schrijven indirect.'],
 ['Volgens Mehrabian kan een boodschap over gevoelens voor hoeveel procent non-verbaal zijn?','93%','50%|7%|25%','Bij andere onderwerpen is het minder.'],
 ['Welke delen van je gezicht zijn het belangrijkst voor je gezichtsuitdrukking?','ogen en mond','neus en oren|wenkbrauwen en kin|voorhoofd en wangen','Daarmee laat je boosheid, verdriet of blijdschap zien.'],
 ['Hoe komt een lage stem over?','zeker en rustig','zenuwachtig|boos|komisch','Een hoge piepstem kan juist bijna komisch klinken.'],
 ['Iemand zegt ‘ik ben niet boos’ maar kijkt kwaad. Wat geeft de doorslag?','de non-verbale communicatie','de woorden die hij zegt|niets, het is onduidelijk|het medium','Mensen reageren vaak onbewust op non-verbale signalen.'],
 ['Welke is GEEN non-verbale gedraging uit het boek?','gebarentaal','toonhoogte|kleur van je kleding|lichaamshouding','Gebarentaal is verbaal, want het is een taal.'],
 ['Wie beschreef de fasen van groepsvorming?','Tuckman (1965)','Maslow (1954)|Mehrabian (1981)|Ton Boot','Maslow hoort bij de bewustwordingsfasen (2.2), Mehrabian bij de 93%.'],
 ['In welke fase tast iedereen elkaar af en speelt non-verbaal een grote rol?','forming','storming|norming|adjourning','De groep wordt gevormd (form).'],
 ['In welke fase worden normen afgesproken en staat men open voor kritiek?','norming','storming|forming|performing','Norm = afspraak over hoe je met elkaar omgaat.'],
 ['In welke fase is de groep een echt team?','performing','norming|forming|adjourning','Perform = presteren.'],
 ['In welke fase vindt de evaluatie plaats?','adjourning','performing|norming|storming','Bij het uit elkaar gaan kijk je terug, zodat je de goede punten meeneemt.'],
 ['Wat is de eerste valkuil bij luisteren?','iemand niet laten uitpraten','te veel knikken|samenvatten wat iemand zei|iemand aankijken','Laten uitpraten is het eerste teken van goed luisteren.'],
 ['Welke vaardigheid is het belangrijkst bij het maken van afspraken?','luisteren','hard praten|alles opschrijven|de leider zijn','Zonder luisteren weet je niet wat je hebt afgesproken.'],
 ['Waarom is ‘jij bent vergeetachtig’ geen goede reactie?','het is een oordeel over hoe iemand is, dat geeft ruzie','het is te aardig|het is een ik-boodschap|het is te lang','Benoem liever het gedrag met een ik-boodschap.'],
 ['Waarom begin je feedback met iets positiefs?','dan gaat de ander luisteren en komt de kritiek beter aan','zodat je de kritiek kunt overslaan|omdat dat beleefd is, verder niet|zodat de ander niet merkt dat er kritiek komt','En met het positieve eind wil hij het de volgende keer goed doen.'],
 ['Welke leiderschapsstijl past bij het leger?','autoritair','democratisch|laissez-faire|consulterend','Snel beslissen bij gevaar: de leider bepaalt.'],
 ['Welke stijl past bij een chirurg die een operatie voorbereidt?','consulterend','autoritair|democratisch|laissez-faire','Hij heeft de informatie van zijn team nodig, maar beslist zelf.'],
 ['Welke stijl past bij de voorzitter van de Tweede Kamer?','democratisch','autoritair|consulterend|laissez-faire','Hij zorgt dat het overleg goed loopt, de Kamer beslist.'],
 ['Welke stijl past bij wetenschappers die samen onderzoek doen?','laissez-faire','autoritair|consulterend|democratisch','De groepsleden weten zelf het meest.'],
 ['Bij welke stijl heeft de groep de meeste invloed?','laissez-faire','democratisch|consulterend|autoritair','Laissez-faire = laten doen: de leider bemoeit zich bijna nergens mee.'],
 ['Is er één beste leiderschapsstijl?','nee, het hangt van de situatie af','ja, democratisch|ja, autoritair|ja, consulterend','Een sergeant leidt anders dan de leider van een onderzoeksteam.']]},

{id:'2.2',nr:'2.2',t:'Begeleiden: instructeur, coach, scheids, jury',ic:'🧑‍🏫',lp:[
 ['De instructeur',`<p>Bij een bewegingsactiviteit heb je verschillende <b>rollen</b>: instructeur, coach (begeleider), scheidsrechter of spelleider, en jurylid.</p><p>Een <b>instructeur</b> is iemand die <b>lesgeeft in een vaardigheid</b>: tennisleraar, zeilinstructeur, rij-instructeur. Hij is de expert en moet:</p><ol><li>de goede <b>techniek</b> kennen,</li><li>de <b>veiligheid</b> bewaken,</li><li>het kunnen <b>overbrengen</b> aan de groep.</li></ol><p>Dat bedenk je vooraf en zet je op je <b>lesvoorbereidingsformulier (LVF)</b>.</p>`,['Wat moet een instructeur NIET per se doen volgens het boek?','de wedstrijd winnen met de groep','de techniek kennen|de veiligheid bewaken|het overbrengen aan de groep','Zijn drie taken: techniek, veiligheid en overbrengen.']],
 ['Coach of trainer?',`<table class="gt"><tr><th>coach (begeleider)</th><td>begeleidt de sporter ook <b>geestelijk en emotioneel</b>. Vaak bij <b>wedstrijden</b>.</td></tr><tr><th>trainer</th><td>werkt vooral aan de <b>lichamelijke prestaties</b>. Vaak bij <b>trainingen</b>.</td></tr></table><p>Basketbalcoach <b>Ton Boot</b>: een coach heeft altijd twee dingen nodig: <b>sportspecifieke kennis</b> (een golftrainer kan geen volleybalteam coachen) en <b>(sociaal-)psychologische kennis</b>, want hij werkt intensief met mensen.</p>`,['Wat is het verschil tussen een coach en een trainer?','de coach begeleidt ook geestelijk en emotioneel, de trainer vooral lichamelijk','de trainer is er bij wedstrijden, de coach bij trainingen|er is geen verschil|de coach geeft alleen techniekles','Coach: vaak bij wedstrijden. Trainer: vaak bij trainingen.']],
 ['Vier fasen van leren',`<p>Wie iets nieuws leert, gaat door vier <b>bewustwordingsfasen</b> (het boek noemt Maslow):</p>${figMaslow()}<ol><li><b>Onbewust onbekwaam</b>: je kunt het niet en weet het niet eens (‘leven in het donker’). Tennis lijkt op tv zo makkelijk.</li><li><b>Bewust onbekwaam</b>: je merkt dat je het niet kunt. Vervelend gevoel.</li><li><b>Bewust bekwaam</b>: het lukt, maar je moet er nog bij nadenken.</li><li><b>Onbewust bekwaam</b>: het gaat vanzelf.</li></ol>`,['Bij je eerste tennisles merk je hoe moeilijk het is. In welke fase zit je?','bewust onbekwaam','onbewust onbekwaam|bewust bekwaam|onbewust bekwaam','Je bent je er nu van bewust dat je het (nog) niet kunt.']],
 ['Soorten coaching',`<table class="gt"><tr><th>inhoudelijk</th><td>een <b>vaardigheid</b> aanleren. Een oud-voetballer leert een team voetballen. Bij één sporter vooral dit.</td></tr><tr><th>procesmatig (mental coaching)</th><td>leren <b>omgaan met</b> winnen, verliezen of een intimiderende tegenstander. Bij een <b>groep</b> vooral dit: teamspirit, groepsvorming (Tuckman!).</td></tr></table><p>Een <b>mental coach</b> helpt sporters hun mentale vaardigheden te verbeteren.</p>`,['Een coach helpt een speler die na een verloren finale niet meer durft. Welke coaching?','procesmatige coaching','inhoudelijke coaching|een instructie|jureren','Het gaat om omgaan met verlies, niet om techniek.']],
 ['Scheidsrechter of spelleider?',`<p>Een <b>scheidsrechter</b> zorgt dat een wedstrijd <b>ordelijk en eerlijk</b> verloopt en ziet toe op de <b>regels</b>. Hij kent de regels en de <b>handgebaren</b>, beslist snel en blijft rustig.</p><ul><li>Meestal één hoofdscheids, soms met lijnrechters. Bij <b>hockey</b> zijn er <b>twee</b>.</li><li>Tennis: <b>umpire</b>. Rugby: <b>referee</b>.</li><li>Hulpmiddelen: <b>Hawk-Eye</b> bij tennis (de uitspraak is <b>onherroepelijk</b>) en de <b>VAR</b> (Video Assistant Referee) bij voetbal sinds <b>2018</b>.</li></ul><p>Een <b>spelleider</b> let op de regels én <b>stimuleert en begeleidt</b> de groep, bijvoorbeeld op een sportdag van de basisschool.</p>`,['Wat doet een spelleider méér dan een scheidsrechter?','hij stimuleert en begeleidt de groep ook','hij geeft rode kaarten|hij kijkt naar de VAR|hij geeft cijfers voor de uitvoering','Scheids: regels en eerlijk verloop. Spelleider: regels én begeleiden.']],
 ['Het jurylid',`<p>Een <b>jurylid</b> is een <b>expert</b> die een <b>vaardigheid beoordeelt</b>. Bij sporten die je niet kunt meten (anders dan een sprint met een stopwatch) is dat deels <b>subjectief</b>. Daarom geven juryleden <b>twee cijfers</b> en vallen het hoogste en laagste cijfer vaak weg.</p><table class="gt"><tr><th>D-score</th><td><b>D</b>ifficulty = moeilijkheid. Geen maximum, ligt vooraf vast per element.</td></tr><tr><th>E-score</th><td><b>E</b>xecution = uitvoering. Je begint met een <b>10</b>, per fout gaat er wat af.</td></tr></table><p>Jurysporten: turnen, kunstschaatsen, dressuur, schoonspringen, kunstzwemmen. <b>Skispringen</b> combineert meten (afstand) met jureren (stijl). Bij atletiek en zwemmen let de jury op overtredingen. Hoe je jureert staat in het <b>wedstrijdreglement</b>.</p>`,['Waar staat de E-score bij turnen voor?','de uitvoering (execution), je begint met een 10','de moeilijkheid, zonder maximum|het eindcijfer|de energie van de turner','De D-score is de moeilijkheid (difficulty).']]],
 q:[
 ['Welke vier rollen noemt het boek bij het begeleiden van een activiteit?','instructeur, coach, scheidsrechter of spelleider, jurylid','trainer, voorzitter, aanvoerder, scheids|leraar, ouder, sponsor, jury|coach, fysiotherapeut, scheids, publiek','Dit zijn de rollen die je zelf bij BSM kunt vervullen.'],
 ['Wat is een instructeur?','iemand die lesgeeft in een vaardigheid','iemand die een wedstrijd leidt|iemand die een prestatie beoordeelt|iemand die sporters mentaal begeleidt','Ook een rij-instructeur of pianoleraar is een instructeur.'],
 ['Op welk formulier zet een instructeur zijn voorbereiding?','het lesvoorbereidingsformulier (LVF)','het scoreformulier|het wedstrijdreglement|de inventarisatielijst','Meer daarover in § 2.3.'],
 ['Een trainer richt zich vooral op…','het verbeteren van de lichamelijke prestaties','de emoties van de sporter|het leiden van de wedstrijd|het beoordelen van de uitvoering','Vaak bij trainingen. De coach begeleidt ook geestelijk, vaak bij wedstrijden.'],
 ['Welke twee basisvaardigheden heeft een coach volgens Ton Boot?','sportspecifieke kennis en (sociaal-)psychologische kennis','een diploma en een fluitje|kracht en uithoudingsvermogen|regelkennis en handgebaren','Een golftrainer kan geen volleybalteam coachen.'],
 ['Wat is de goede volgorde van de bewustwordingsfasen?','onbewust onbekwaam → bewust onbekwaam → bewust bekwaam → onbewust bekwaam','bewust onbekwaam → onbewust onbekwaam → bewust bekwaam → onbewust bekwaam|onbewust onbekwaam → onbewust bekwaam → bewust onbekwaam → bewust bekwaam|bewust bekwaam → onbewust bekwaam → bewust onbekwaam → onbewust onbekwaam','Eerst merk je dat je het niet kunt, dan leer je het met nadenken, tot het vanzelf gaat.'],
 ['Welke fase heet ook ‘het leven in het donker’?','onbewust onbekwaam','bewust onbekwaam|bewust bekwaam|onbewust bekwaam','Je weet niet eens dat je het niet kunt.'],
 ['Je fietst naar school zonder erbij na te denken. Welke fase?','onbewust bekwaam','bewust bekwaam|bewust onbekwaam|onbewust onbekwaam','Het gaat vanzelf.'],
 ['Je kunt een lay-up, maar moet nog goed nadenken over je passen. Welke fase?','bewust bekwaam','onbewust bekwaam|bewust onbekwaam|onbewust onbekwaam','Het lukt, maar nog niet automatisch.'],
 ['Een oud-voetballer leert een team een nieuwe aanvalstactiek. Welke coaching?','inhoudelijke coaching','procesmatige coaching|mental coaching|geen coaching, dit is jureren','Inhoudelijk = een vaardigheid aanleren.'],
 ['Wat is een ander woord voor procesmatige coaching?','mental coaching','inhoudelijke coaching|instructie|scheidsrechteren','Omgaan met winst, verlies en spanning.'],
 ['Een coach van een team doet vooral…','procesmatige coaching (teamspirit)','alleen inhoudelijke coaching|jureren|niets, dat doet de aanvoerder','Bij een groep krijgt hij te maken met groepsvorming.'],
 ['Wat is de taak van een scheidsrechter?','zorgen dat de wedstrijd ordelijk en eerlijk verloopt volgens de regels','de spelers motiveren|de sporters techniek leren|punten geven voor de uitvoering','Hij moet ook de handgebaren kennen.'],
 ['Hoe heet de scheidsrechter bij tennis?','umpire','referee|jurylid|line judge','Bij rugby heet hij referee.'],
 ['Bij welke sport zijn er gewoonlijk twee hoofdscheidsrechters?','hockey','voetbal|tennis|rugby','Bij de meeste sporten is er één hoofdscheids.'],
 ['Sinds wanneer wordt bij voetbal de VAR gebruikt?','2018','2010|2022|2000','VAR = Video Assistant Referee.'],
 ['Kun je bezwaar maken tegen een beslissing van Hawk-Eye?','nee, die is onherroepelijk','ja, bij de umpire|ja, binnen 5 minuten|alleen in een finale','Hawk-Eye laat zien waar de bal precies landde.'],
 ['Op een sportdag van de basisschool leid je een spel en moedig je de kinderen aan. Wat ben je?','spelleider','scheidsrechter|jurylid|trainer','Regels bewaken én begeleiden en stimuleren.'],
 ['Wat is een jurylid?','een expert die een vaardigheid beoordeelt','iemand die de tijd opneemt|iemand die de spelers coacht|iemand die de wedstrijd organiseert','Sommige sporten zijn niet te meten, dus is een expert nodig.'],
 ['Waarom worden het hoogste en laagste jurycijfer vaak weggestreept?','zo blijft de beoordeling zo eerlijk (objectief) mogelijk','omdat die altijd fout zijn|om tijd te sparen|omdat er te veel juryleden zijn','Juryleden kunnen het oneens zijn.'],
 ['Waar staat de D-score bij turnen voor?','de moeilijkheid (difficulty), zonder maximum','de uitvoering, van 1 tot 10|de duur van de oefening|het aantal fouten','De E-score is de uitvoering.'],
 ['Bij welke sport wordt meten gecombineerd met jureren?','skispringen','turnen|kunstschaatsen|sprinten','De afstand wordt gemeten en de stijl beoordeeld.'],
 ['Waar staat hoe een jurylid moet beoordelen?','in het wedstrijdreglement','op het LVF|in de krant|nergens, dat bepaalt hij zelf','De uitspraak is meestal bindend.']]},

{id:'2.3',nr:'2.3',t:'Leren lesgeven',ic:'📋',lp:[
 ['Het didactisch model',`<p>Een <b>didactisch model</b> is een les in een schema. Het boek gebruikt vier onderdelen:</p>${figDida()}<p>De <b>lesstof</b> is de weg van A (<b>beginsituatie</b>: waar begin je?) naar B (<b>lesdoel</b>: waar wil je heen?). Daarna volgt de <b>evaluatie</b>. Waar ‘les’ staat kun je ook ‘training’ lezen.</p>`,['Welke vier onderdelen heeft het didactisch model?','beginsituatie, lesdoel, lesstof, evaluatie','warming-up, kern, cooling-down, evaluatie|praatje, plaatje, daadje, evaluatie|forming, storming, norming, performing','De lesstof brengt je van de beginsituatie naar het lesdoel.']],
 ['Zes stappen om een les voor te bereiden',`<ol><li><b>Taakdefinitie</b>: beginsituatie en lesdoel bepalen, samen met je docent. Dit is de <b>kern</b> van een goede les.</li><li><b>Zoeken</b> naar goede informatie en materiaal.</li><li><b>Selecteren</b>: welke oefeningen passen bij je doel (de lesstof)?</li><li><b>Vastleggen</b> op je <b>LVF</b> (lesvoorbereidingsformulier). Geef je met z’n tweeën les, dan maakt ieder een eigen LVF.</li><li><b>Uitvoeren</b>: de les geven.</li><li><b>Evalueren</b>, met verbeterpunten voor de volgende keer.</li></ol><p>Vragen bij de taakdefinitie: <b>Wat ga ik doen? Wat wil ik de leerlingen leren? Wat wil ik zelf leren?</b></p>`,['Wat is de kern van een goede les?','de taakdefinitie','de warming-up|de evaluatie|het materiaal','Daarmee begin je: beginsituatie en lesdoel bepalen.']],
 ['Een SMART lesdoel',`<p>Een lesdoel moet <b>haalbaar</b> zijn voor de hele klas (‘iedereen springt 2,20 m hoog’ kan niet). Maak het <b>SMART</b>:</p><table class="gt"><tr><th>S</th><td><b>Specifiek</b>: concreet (jongleren met drie ballen)</td></tr><tr><th>M</th><td><b>Meetbaar</b>: wanneer is het gehaald? (elke bal minstens één keer gegooid en gevangen)</td></tr><tr><th>A</th><td><b>Acceptabel / Aanwijsbaar</b>: wie moet het halen? (<b>75%</b> van de klas)</td></tr><tr><th>R</th><td><b>Realistisch</b>: past bij de beginsituatie</td></tr><tr><th>T</th><td><b>Tijdgebonden</b>: wanneer? (aan het eind van het lesuur)</td></tr></table><div class="ex">Aan het eind van dit lesuur kan 75% van de BSM-leerlingen jongleren met drie ballen, waarbij ze elke bal minstens één keer gooien en vangen.</div><p><b>Backward design</b>: eerst het <b>lesdoel</b>, dan de <b>lesstof</b>, en dan pas een passende <b>warming-up</b>.</p>`,['‘Aan het eind van het lesuur’ hoort bij welke letter van SMART?','T (tijdgebonden)','S (specifiek)|M (meetbaar)|R (realistisch)','T = wanneer moet het doel gehaald zijn?']],
 ['De beginsituatie',`<p>De <b>beginsituatie</b> beantwoordt de vraag: <b>waar moet ik beginnen?</b></p><table class="gt"><tr><th>persoonlijk</th><td>wat kunnen en weten de leerlingen al, hoe oud zijn ze, <b>hoeveel</b> zijn het? En ook: hoe goed ben <b>jij</b> als lesgever?</td></tr><tr><th>materieel</th><td>welke <b>accommodatie</b> (gymzaal, sporthal, buiten) en welke <b>materialen</b>? Maak een <b>inventarisatielijst</b> (alle materialen) en een <b>situatieschets</b> (tekening van de zaal: waar staan materialen, leerlingen en jij?).</td></tr></table><p>Vergeet de <b>tijd</b> niet: heb je een deel van de les of het hele uur?</p>`,['Wat is een situatieschets?','een tekening van de zaal met materialen en waar iedereen staat','een lijst met alle materialen|een beschrijving van het lesdoel|een cijferlijst van de leerlingen','De lijst met materialen is de inventarisatielijst.']],
 ['Lesgeven is presenteren',`<p>De <b>lesstof</b> is <b>niet het doel</b> maar het <b>middel</b> om het lesdoel te halen.</p><p>Als je lesgeeft presenteer je ook jezelf:</p><ul><li><b>non-verbaal</b>: oogcontact, gezichtsuitdrukking, gebaren, houding (actief of passief);</li><li><b>verbaal</b>: stemgebruik (duidelijk articuleren), <b>fluency</b> (vloeiend, zonder veel ‘eh’) en <b>enthousiasme</b> (intonatie);</li><li><b>inhoud</b>: rekening houden met de groep, je doel, structuur, het onderwerp aankondigen, tijd, informatiedichtheid, plaatjes/voorbeelden, volledigheid en interactie.</li></ul>`,['Wat betekent fluency?','vloeiend praten, zonder veel aarzelingen','hard praten|veel gebaren maken|snel praten','Een van de drie punten van verbaal contact, naast stemgebruik en enthousiasme.']],
 ['Een gymles geven',`<ol><li><b>Jouw plek</b>: een eindje vóór de groep, zodat iedereen je ziet. Niet met je rug naar de groep, leerlingen niet tegen de zon in. Begin pas als iedereen stil is en naar je kijkt.</li><li><b>De leerlingen</b>: dicht bij je (in rijen, kring of halve kring), dan hoef je niet te schreeuwen.</li><li><b>Praatje-plaatje-daadje</b>:</li></ol>${figPPD()}<ul><li><b>Praatje</b>: kort uitleggen wat de bedoeling is.</li><li><b>Plaatje</b>: voordoen (de meeste kinderen leren visueel: goed voorbeeld doet goed volgen).</li><li><b>Daadje</b>: aan de slag; jij loopt rond en helpt.</li></ul><p>Daarna controleren: <b>loopt ’t, lukt ’t, leeft ’t?</b> Neem even afstand en kijk of het veilig is en goed gaat. Bij een aanwijzing <b>stoppen</b> de leerlingen met bewegen.</p><p>Materiaal halen en opruimen: zeg <b>wie</b> wat doet, <b>wanneer</b>, <b>waar</b> en <b>wat daarna</b>.</p>`,['Wat doe je bij ‘loopt ’t, lukt ’t, leeft ’t’?','afstand nemen en controleren of de les veilig en goed verloopt','de leerlingen laten hardlopen|de les afsluiten|de materialen tellen','Daarna geef je aanwijzingen of maak je de oefening makkelijker of moeilijker.']],
 ['Evalueren',`<p>Na de les stel je jezelf drie vragen:</p><table class="gt"><tr><th>productevaluatie</th><td>Heb ik mijn <b>lesdoel</b> gehaald? (lukt alleen met een SMART doel)</td></tr><tr><th>procesevaluatie</th><td>Hoe is de les <b>verlopen</b>? Hoe vonden de leerlingen het?</td></tr><tr><th>reflecteren</th><td>Hoe heb <b>ik</b> het gedaan als lesgever? Gericht op je eigen leerdoelen.</td></tr></table>`,['‘Heb ik mijn lesdoel gehaald?’ Welke evaluatie is dat?','productevaluatie','procesevaluatie|reflecteren|beginsituatie','Het product van de les = wat de leerlingen geleerd hebben.']]],
 q:[
 ['Wat is een didactisch model?','een les in een schema','een sporter die als voorbeeld dient|een soort warming-up|een beoordelingsformulier','Met beginsituatie, lesdoel, lesstof en evaluatie.'],
 ['Wat is de lesstof in het didactisch model?','de weg van de beginsituatie naar het lesdoel','het doel van de les|het eindcijfer|de evaluatie achteraf','De lesstof is het middel, niet het doel.'],
 ['Wat is stap 1 van de lesvoorbereiding?','de taakdefinitie','vastleggen op het LVF|de uitvoering|informatie zoeken','Beginsituatie en lesdoel bepalen.'],
 ['Wat staat er op een LVF?','alles wat belangrijk is voor je les','de cijfers van de leerlingen|de spelregels van alle sporten|het rooster van de school','LVF = lesvoorbereidingsformulier.'],
 ['Je geeft met z’n tweeën dezelfde les. Hoeveel LVF’s?','ieder een eigen LVF','één samen|geen, dat is niet nodig|één voor de docent','Zo staat het in het boek.'],
 ['Waar staat de S van SMART voor?','specifiek','snel|sportief|samen','Duidelijk en concreet.'],
 ['‘75% van de leerlingen moet het halen’ hoort bij welke letter?','A (acceptabel / aanwijsbaar)','M (meetbaar)|R (realistisch)|T (tijdgebonden)','Wie moet wat doen om het doel te halen?'],
 ['‘Het doel past bij wat de leerlingen al kunnen’ hoort bij welke letter?','R (realistisch)','S (specifiek)|A (acceptabel)|T (tijdgebonden)','Realistisch sluit aan bij de beginsituatie.'],
 ['Waarom is ‘iedereen springt aan het eind 2,20 m hoog’ geen goed lesdoel?','het is niet realistisch voor de hele klas','het is niet meetbaar|het is niet specifiek|het is niet tijdgebonden','Dat past bij een topatleet, niet bij een schoolklas.'],
 ['Wat is backward design?','eerst het lesdoel, dan de lesstof, dan de warming-up','eerst de warming-up, dan het doel|achteruit lopen in de warming-up|de les van achter naar voren evalueren','Je werkt terug vanaf je doel.'],
 ['Welke vraag beantwoordt de beginsituatie?','Waar moet ik beginnen?','Wat wil ik bereiken?|Hoe ging de les?|Wie doet wat?','Het lesdoel beantwoordt: wat wil ik bereiken?'],
 ['Wat hoort bij de materiële beginsituatie?','de accommodatie en de materialen','wat de leerlingen al kunnen|hoe oud de leerlingen zijn|jouw eigen ervaring als lesgever','Dat andere is de persoonlijke beginsituatie.'],
 ['Wat is een inventarisatielijst?','een lijst met alle aanwezige materialen','een tekening van de zaal|een presentielijst|een lijst met lesdoelen','De tekening is de situatieschets.'],
 ['Is de lesstof het doel van de les?','nee, het is het middel om het lesdoel te halen','ja, altijd|alleen bij een gymles|ja, de lesstof is hetzelfde als het lesdoel','Er moet iets geleerd worden.'],
 ['Welke drie punten horen bij verbaal contact tijdens presenteren?','stemgebruik, fluency en enthousiasme','oogcontact, gebaren en houding|kleding, kleur en uiterlijk|tijd, structuur en volledigheid','Oogcontact, gebaren en houding zijn non-verbaal.'],
 ['Waar ga je staan als je uitleg geeft?','een eindje vóór de groep, zodat iedereen je ziet','midden in de groep|achter de groep|met je rug naar de groep bij het materiaal','En laat de leerlingen niet tegen de zon in kijken.'],
 ['Wanneer begin je met praten?','als iedereen stil is en naar je kijkt','meteen, dan worden ze vanzelf stil|als de helft luistert|na het fluitsignaal, ook als er gepraat wordt','Geen dictator, wel zelfverzekerd.'],
 ['Waarom is het ‘plaatje’ zo belangrijk?','de meeste kinderen leren visueel: goed voorbeeld doet goed volgen','dan hoef je niets te zeggen|zodat je zelf ook beweegt|omdat het in het reglement staat','Leg accenten: waar moeten ze op letten?'],
 ['Wat doen de leerlingen als jij een aanwijzing geeft?','ze stoppen met bewegen','ze gaan gewoon door|ze gaan zitten op de bank|ze halen materiaal','Anders horen ze je niet.'],
 ['Welke vragen stel je bij het halen van materiaal?','wie doet wat, wanneer, waar en wat daarna?','hoeveel, hoe duur, van wie?|waarom, hoe lang, hoe hard?|wie wint, wie verliest?','Bijvoorbeeld: als ik het zeg pakt ieder tweetal een bal…'],
 ['Wat is een voorbeeld van een manier waarop leerlingen kunnen bewegen?','in een zigzagbaan','in een didactisch model|in een LVF|in een inventarisatielijst','Ook: omgangsbaan, slingerbaan, in een cirkel, vrij door de ruimte.'],
 ['‘Hoe vonden de leerlingen de les?’ Welke evaluatie?','procesevaluatie','productevaluatie|reflecteren|taakdefinitie','Proces = hoe het verliep.'],
 ['‘Hoe heb ik het gedaan als lesgever?’ Hoe heet dat?','reflecteren','productevaluatie|procesevaluatie|backward design','Gericht op je eigen ontwikkeling.'],
 ['Waarom kun je een productevaluatie alleen goed doen met een SMART doel?','anders kun je niet controleren of het doel gehaald is','omdat de docent dat wil|omdat SMART korter is|dat hoeft niet, het kan ook zonder','Meetbaar is daarbij de sleutel.']]},

{id:'pad',nr:'module',t:'Padel',ic:'🎾',lp:[
 ['Wat is padel?',`<p>Padel lijkt op tennis: de bal moet over het net, in het vak van de tegenstander. Het grote verschil: je mag de bal tegen de <b>glazen wanden</b> laten kaatsen. Padel speel je <b>altijd met z’n vieren</b> (2 tegen 2).</p>${figPadel()}<p>De baan is <b>20 × 10 m</b>, met glas aan de achterkant en een stuk van de zijkant, en verder <b>hek (gaas)</b>. De <b>servicelijn</b> ligt 6,95 m van het net, dus 3 m van de achterwand.</p><p>De module: 3 lessen bij <b>Tree 11 in Alkmaar</b>. Je wordt beoordeeld op forehand, backhand, service, muur spelen, je volley-les, spel leiden en punten tellen, en meedoen.</p>`,['Met hoeveel spelers speel je padel?','altijd met z’n vieren (2 tegen 2)','1 tegen 1 of 2 tegen 2|met z’n zessen|met z’n tweeën','Padel is altijd een dubbelspel.']],
 ['GRAS',`<p>Bij elke slag let je op <b>GRAS</b>:</p><table class="gt"><tr><th>G</th><td><b>Greep</b>: hoe houd je het racket vast?</td></tr><tr><th>R</th><td><b>Raakpunt</b>: waar raak je de bal? (vóór je lichaam)</td></tr><tr><th>A</th><td><b>Armactie</b>: hoe zwaai je uit?</td></tr><tr><th>S</th><td><b>Stand van het lichaam</b>: hoe sta je, hoe gebruik je je lijf?</td></tr></table><p>Daarnaast leer je voetenwerk, de bal plaatsen, en de rollen van <b>scheidsrechter, teller, observator en coach</b>.</p>`,['Waar staat de R van GRAS voor?','raakpunt','racket|richting|rust','G = greep, R = raakpunt, A = armactie, S = stand van het lichaam.']],
 ['Tellen zoals bij tennis',`<ul><li>Game: <b>15 – 30 – 40 – game</b>.</li><li>Bij <b>40-40</b> (deuce) moet je <b>twee punten op rij</b> winnen.</li><li>Set: <b>6 games</b>, met 2 games verschil.</li><li>Bij <b>6-6</b> een <b>tiebreak</b>: gewoon tellen (1-0, 2-0…) tot <b>7</b>. Wie de tiebreak wint, wint de set met <b>7-6</b>.</li><li>Match: wie <b>2 sets</b> wint, wint.</li><li>Wissel van kant na elke <b>oneven</b> game (1, 3, 5…).</li></ul>`,['De stand is 30-15. Jullie winnen het punt. Wat is de nieuwe stand?','40-15','45-15|40-30|game','15 – 30 – 40 – game.']],
 ['De service',`<p>${figPadel({vak:'r',boven:true,kaal:true})}</p><ul><li><b>Onderhands</b>: je raakt de bal op of onder <b>navelhoogte</b>.</li><li>Laat de bal eerst <b>één keer stuiteren</b> achter de servicelijn.</li><li>Sla <b>schuin (diagonaal)</b> naar het servicevak van de tegenstander (het gele vak).</li><li>Sta achter de servicelijn met <b>minstens één voet op de grond</b>.</li><li>De service mag <b>niet via glas of hek</b> in het vak komen. <b>Na</b> de stuit in het vak mag de bal wel tegen het glas.</li><li>Volgens de module moet ook de <b>return</b> (terugslag van de service) onderhands.</li></ul>`,['Mag de service via de glazen wand in het servicevak komen?','nee, pas ná de stuit in het vak mag de bal tegen het glas','ja, altijd|ja, maar alleen via de zijwand|alleen bij de tweede service','Eerst stuiteren in het vak, daarna mag het glas.']],
 ['Regels in het kort',`<ol><li>De bal mag maar <b>één keer de grond</b> raken.</li><li>Je mag de bal <b>vóór en na de stuit</b> spelen (een volley mag dus).</li><li>De bal moet eerst <b>stuiteren</b> voordat hij tegen glas of hek kaatst.</li><li>Raakt de bal het <b>hek vóórdat</b> hij over het net gaat: <b>fout</b>.</li><li>Sla je de bal <b>over de wand</b> de kooi uit: <b>punt voor jou</b> (tenzij iemand hem van buiten terugspeelt).</li><li>Raakt de bal <b>jou of je maatje</b>: punt <b>verloren</b>.</li></ol>`,['De bal stuitert in jullie vak, kaatst tegen het glas en jij slaat hem terug over het net. Mag dat?','ja, na de stuit mag de bal tegen het glas','nee, de bal mag nooit tegen het glas|nee, je moet hem vóór het glas raken|alleen bij de service','Dat is juist het leuke van padel.']],
 ['De slagen',`<p>De module noemt: <b>service, forehand, backhand, volley, lob en smash</b>, en <b>muur spelen</b>.</p><ul><li><b>Volley</b>: de bal uit de lucht slaan, vlak bij het net; kort ‘blokje’, niet zwaaien.</li><li><b>Lob</b>: een hoge boog over de tegenstanders aan het net heen.</li><li><b>Smash</b>: hard bovenhands slaan op een hoge bal.</li><li><b>Muur spelen</b>: de bal na de stuit van de achterwand laten terugkomen, dan pas slaan.</li></ul><p>Les 1: GRAS, service en forehand. Les 2: service in diepte, backhand en muur. Les 3: de volley-lessen van de tweetallen, lob en smash, en elkaar beoordelen.</p><p class="src">Hoe je de slagen precies uitvoert staat niet in de module; vraag het je docent of kijk naar de rubric.</p>`,['Wat is een lob?','een hoge boog over de tegenstanders aan het net heen','een harde bovenhandse slag|een bal uit de lucht vlak bij het net|een onderhandse service','De smash is de harde slag op een hoge bal.']]],
 q:[
 ['Hoe groot is een padelbaan?','20 × 10 m','24 × 11 m|18 × 9 m|10 × 5 m','Met in het midden het net.'],
 ['Hoe ver ligt de servicelijn van de achterwand?','3 m','6,95 m|1 m|5 m','6,95 m is de afstand tot het net.'],
 ['Waar staat de G van GRAS voor?','greep','gewicht|glas|gooien','Greep, raakpunt, armactie, stand van het lichaam.'],
 ['Waar staat de A van GRAS voor?','armactie','aanval|afstand|ademhaling','Hoe zwaai je uit?'],
 ['Wat is de telling in een game?','15 – 30 – 40 – game','1 – 2 – 3 – game|10 – 20 – 30 – game|15 – 30 – 45 – game','Net als bij tennis.'],
 ['Wat gebeurt er bij 40-40?','je moet twee punten op rij winnen','het volgende punt beslist|er komt een tiebreak|de game wordt overgespeeld','40-40 heet deuce.'],
 ['Hoeveel games moet je winnen voor een set?','6, met 2 games verschil','4|7, altijd|10','Bij 6-6 volgt een tiebreak.'],
 ['Wanneer speel je een tiebreak?','bij 6-6 in games','bij 40-40|bij 1-1 in sets|bij 5-5 in games','De winnaar wint de set met 7-6.'],
 ['Hoeveel sets moet je winnen voor de match?','2','3|1|6','Best of three.'],
 ['Hoe sla je de service?','onderhands, na één stuit, schuin naar het servicevak','bovenhands, zonder stuit, recht vooruit|onderhands, zonder stuit, recht vooruit|bovenhands, na één stuit, schuin','Raken op of onder navelhoogte.'],
 ['Op welke hoogte raak je de bal bij de service?','op of onder navelhoogte','boven je hoofd|op schouderhoogte|maakt niet uit','De service is onderhands.'],
 ['De service komt via het hek in het servicevak. Is dat goed?','nee, fout','ja, goed|alleen als hij daarna stuitert|ja, maar alleen bij de tweede service','De service mag niet via glas of hek in het vak.'],
 ['Hoe vaak mag de bal aan jouw kant de grond raken?','één keer','twee keer|nul keer|zo vaak als je wilt','Daarna moet je hem terugslaan.'],
 ['Mag je de bal uit de lucht slaan (volley)?','ja','nee, hij moet altijd eerst stuiteren|alleen bij de service|alleen de tegenstander','De bal mag vóór en na de stuit gespeeld worden.'],
 ['Jouw slag raakt het hek vóórdat hij over het net gaat. Wat nu?','fout, punt voor de tegenstander','goed, spel gaat door|over spelen|punt voor jou','Bij je eigen slag eerst over het net.'],
 ['Je slaat de bal over de wand de kooi uit. Wat gebeurt er?','punt voor jou, tenzij iemand hem van buiten terugspeelt','punt voor de tegenstander|het punt wordt overgespeeld|de bal is dood, geen punt','De tegenstanders konden de bal niet meer spelen.'],
 ['De bal raakt je maatje. Wat gebeurt er?','jullie verliezen het punt','het punt wordt overgespeeld|jullie winnen het punt|niets, gewoon doorspelen','Raakt de bal jou of je maatje, dan verlies je het punt.'],
 ['Wanneer wissel je van kant?','na elke oneven game','na elke game|na elke set|na elke even game','Na game 1, 3, 5…'],
 ['Hoe moet de return volgens de module?','onderhands','bovenhands|via de achterwand|met een smash','Daarna mag je ook bovenhands spelen.'],
 ['Welke slagen komen in les 3?','lob en smash','service en forehand|backhand en muur|alleen de service','Plus de volley-lessen die jullie zelf geven.'],
 ['Wat bereid je voor les 3 met z’n tweeën voor?','een trainingsvorm voor de forehand- en backhandvolley','een toernooischema|een warming-up voor de hele school|een spreekbeurt over tennis','En lees de rubric door.']]},

{id:'sof',nr:'module',t:'Softbal',ic:'🥎',lp:[
 ['Het veld',`<p>${figVeld()}</p><ul><li>Het <b>binnenveld</b> is het vierkant van de thuisplaat en de drie honken. Tussen de honken zit <b>18,30 m</b> (honkbal: 27,43 m).</li><li>Van de thuisplaat tot de <b>werpplaat</b>: op school en bij vrouwen <b>12 à 14 m</b>, bij mannen 15,24 m.</li><li>Alles buiten de twee <b>foutlijnen</b> is <b>foutgebied</b>.</li><li>Verschil met honkbal: <b>grotere bal</b>, <b>grotere handschoen</b>, <b>lichtere knuppel</b>. Een wedstrijd duurt <b>7 innings</b> (honkbal 9).</li></ul>`,['Hoeveel innings duurt een softbalwedstrijd?','7','9|5|3','Honkbal heeft er 9.']],
 ['Wie staat waar?',`<p>${figVeld()}</p><table class="gt"><tr><th>P</th><td>werper (op de werpplaat)</td><th>C</th><td>achtervanger (achter de thuisplaat)</td></tr><tr><th>1H</th><td>eerste honkman</td><th>2H</th><td>tweede honkman</td></tr><tr><th>KS</th><td>korte stop (tussen 2e en 3e honk)</td><th>3H</th><td>derde honkman</td></tr><tr><th>LV</th><td>linksvelder</td><th>MV</th><td>midvelder</td></tr><tr><th>RV</th><td>rechtsvelder</td><th></th><td></td></tr></table><p>Links en rechts tel je <b>vanaf de thuisplaat</b> gezien. Verder: de <b>backstop</b> (hek achter de thuisplaat), de <b>dugout</b> (teambank), het <b>helpersvak</b> voor de honkcoach en de <b>warningtrack</b> (gravelstrook vóór het hek achterin).</p>`,['Waar staat de korte stop?','tussen het 2e en 3e honk','tussen het 1e en 2e honk|achter de thuisplaat|midden in het buitenveld','De tweede honkman staat tussen het 1e en 2e honk.']],
 ['Opwerpen: slag of wijd',`<ul><li>De werper begint met <b>twee voeten op de werpplaat</b> en werpt <b>onderhands</b>.</li><li>Door de <b>slagzone</b> = <b>slagbal</b>. Ernaast = <b>wijdbal</b>.</li><li><b>Vier wijdballen</b>: de slagman mag <b>vrij naar het 1e honk</b>.</li><li>Een slagbal waar niet op geslagen wordt, telt als <b>slag</b>.</li><li>Zwaai je naar een wijdbal (de knuppel gaat door de slagzone), dan is het ook een <b>slag</b>.</li></ul>`,['De werper gooit door de slagzone, maar de slagman slaat niet. Wat is het?','een slag','een wijdbal|niets, overgooien|een vrije loop','Een goede bal laten gaan telt als slag.']],
 ['Slaan: goed, fout of mis',`<ul><li><b>Goed</b>: de bal komt in het binnen- of buitenveld.</li><li><b>Fout</b>: de bal komt in het foutgebied. Je mag opnieuw, ook als je al twee slag had (een foutslag is nooit je derde slag).</li><li><b>Mis</b>: je zwaait en raakt niets. Telt als slag.</li><li>Je loopt bij de <b>eerste goede slag</b> of na de <b>derde slag</b>.</li></ul><div class="ex"><b>Binnenveld</b>: waar de bal <b>tot stilstand</b> komt telt.<br><b>Buitenveld</b>: waar de bal <b>het eerst neerkomt</b> telt (rolt hij daarna het foutgebied in, dan is hij toch goed).<br>De <b>lijnen</b> horen bij het veld: op de lijn = goed.</div>`,['De bal komt in het buitenveld neer en rolt dan het foutgebied in. Goed of fout?','goed','fout|overslaan|uit','In het buitenveld telt waar de bal eerst neerkomt.']],
 ['Wanneer ben je uit?',`<p>De <b>slagman</b> is uit als:</p><ul><li>zijn bal <b>zonder stuit gevangen</b> wordt (vangbal),</li><li>hij de <b>derde slag mis</b> slaat en de achtervanger vangt de bal,</li><li>hij wordt <b>uitgebrand</b> of <b>uitgetikt</b>.</li></ul><p>Een <b>honkloper</b> is uit als:</p><ul><li>hij tussen de honken wordt <b>uitgetikt</b> met de bal of de hand met de bal (laat de veldspeler de bal vallen: niet uit),</li><li>hij bij een <b>gedwongen loop</b> wordt <b>uitgebrand</b>: de veldspeler raakt met de bal het honk vóórdat de loper er is,</li><li>hij meer dan <b>1 meter</b> van de lijn tussen de honken afwijkt,</li><li>hij een veldspeler <b>hindert</b>,</li><li>hij <b>te vroeg</b> vertrekt (pas als de werper de bal loslaat),</li><li>hij bij een <b>vangbal</b> al liep en niet eerst terug is naar zijn honk.</li></ul>`,['Een veldspeler tikt de loper aan, maar laat daarbij de bal vallen. Is de loper uit?','nee, niet uit','ja, uit|alleen bij een gedwongen loop|de scheids beslist zomaar wat','Je moet tikken met de bal of met de hand waarin je de bal hebt.']],
 ['Honklopen en gedwongen loop',`<ul><li>Raak de honken in de goede volgorde aan; met je voet is genoeg.</li><li>Er mag maar <b>één loper op een honk</b>. Inhalen mag niet. Je mag terug naar het honk waar je vandaan kwam.</li><li><b>Gedwongen loop</b>: je <b>moet</b> door, omdat de slagman (of een loper achter je) jouw honk nodig heeft. Dat is zo als het 1e honk bezet is, het 1e en 2e, of alle drie (honken vol).</li></ul>${figVeld(null,{lopers:[1,2]})}<p>Hierboven: lopers op 1 en 2 en de slagman slaat goed: <b>allebei gedwongen</b>. Staat er alleen iemand op het 2e honk (1e leeg), dan is die <b>niet</b> gedwongen.</p><p>De werper kan het honklopen stoppen door met de bal in de <b>cirkel</b> om de werpplaat te gaan staan; de loper kiest dan: doorlopen of terug. Een loper die alle honken rond is en <b>veilig de thuisplaat</b> haalt, scoort een punt.</p>`,['Er staat alleen een loper op het 2e honk en de slagman slaat goed. Is die loper gedwongen?','nee, het 1e honk is vrij','ja, altijd|ja, want hij staat op het 2e honk|alleen als de bal in het buitenveld komt','De slagman heeft het 1e honk nodig, niet het 2e.']]],
 q:[
 ['Hoe ver liggen de honken bij softbal uit elkaar?','18,30 m','27,43 m|12 m|30 m','27,43 m is bij honkbal.'],
 ['Hoe ver is het op school van de thuisplaat naar de werpplaat?','12 à 14 m','18,44 m|5 m|30 m','Bij mannen 15,24 m, bij honkbal 18,44 m.'],
 ['Wat is een verschil in materiaal met honkbal?','een grotere bal','een zwaardere knuppel|een kleinere handschoen|een hardere bal','Grotere bal, grotere handschoen, lichtere knuppel.'],
 ['Hoe werpt de werper bij softbal op?','onderhands, met twee voeten op de werpplaat bij de start','bovenhands, vanaf de werpheuvel|zijwaarts, met aanloop|onderhands, met één voet op de thuisplaat','Bij honkbal wordt bovenhands geworpen.'],
 ['Hoe heet een bal die buiten de slagzone gaat?','wijdbal','slagbal|foutbal|vangbal','Vier wijdballen = vrije loop naar het 1e honk.'],
 ['Wat gebeurt er na vier wijdballen?','de slagman mag vrij naar het 1e honk','de slagman is uit|de werper wordt gewisseld|de slagman mag opnieuw','Lopers die daardoor gedwongen zijn, schuiven ook een honk op.'],
 ['De werper gooit wijd, maar de slagman zwaait (de knuppel gaat door de slagzone). Wat is het?','een slag','een wijdbal|een foutslag|niets','Wie zwaait, krijgt een slag.'],
 ['De bal komt in het foutgebied. Wat nu?','foutslag: de slagman mag opnieuw slaan','de slagman is uit|de slagman moet lopen|het is een wijdbal','Een foutslag telt nooit als derde slag.'],
 ['In het binnenveld: wat telt voor goed of fout?','waar de bal tot stilstand komt','waar de bal het eerst neerkomt|waar de werper staat|hoe hard de bal geslagen is','In het buitenveld telt waar hij eerst neerkomt.'],
 ['De bal komt precies op de foutlijn. Goed of fout?','goed, de lijn hoort bij het veld','fout|overslaan|de slagman is uit','Op de lijn = in het veld.'],
 ['Wanneer moet de slagman lopen?','na de eerste goede slag of na de derde slag','na elke slag|na vier wijdballen pas|als hij dat zelf wil','Bij vier wijdballen loopt hij vrij naar het 1e honk.'],
 ['De geslagen bal wordt zonder stuit gevangen. Wat gebeurt er?','de slagman is uit','de slagman mag naar het 1e honk|het is een foutslag|het is een wijdbal','Dat heet een vangbal.'],
 ['Wat is uitbranden?','met de bal het honk aanraken vóór de loper er is (bij een gedwongen loop)','de loper aantikken met de handschoen zonder bal|de knuppel weggooien|de bal over het hek slaan','Uitbranden kan alleen bij een gedwongen loop.'],
 ['Lopers op het 1e en 2e honk. De slagman slaat goed. Wie zijn er gedwongen?','beide lopers','alleen de loper op het 1e honk|alleen de loper op het 2e honk|niemand','Er mag maar één loper per honk staan, dus iedereen moet door.'],
 ['Hoeveel mag een honkloper afwijken van de rechte lijn tussen de honken?','maximaal 1 meter','maximaal 5 meter|helemaal niet|zoveel als hij wil','Anders is hij uit.'],
 ['Wanneer mag een honkloper van zijn honk vertrekken?','als de werper de bal opwerpt (loslaat)','wanneer hij wil|pas als de bal geslagen is|als de achtervanger de bal heeft','Vertrekt hij eerder, dan is hij uit.'],
 ['Hoe zet de werper het honklopen stop?','met de bal in de cirkel om de werpplaat gaan staan','de bal naar de achtervanger gooien|“stop” roepen|op de thuisplaat gaan staan','De loper moet dan kiezen: doorlopen of terug.'],
 ['Er wordt een vangbal gevangen terwijl de loper al onderweg was. Wat moet hij doen?','eerst terug naar zijn eigen honk','gewoon doorlopen naar het volgende honk|naar de thuisplaat|niets, hij is veilig','Daar mag hij ook uitgebrand worden.'],
 ['Mag een honkloper een andere honkloper inhalen?','nee','ja|alleen bij een vangbal|alleen in het buitenveld','En er mag maar één loper op een honk staan.'],
 ['Wat is de backstop?','het hek achter de thuisplaat','het hek achter in het buitenveld|de teambank|de plek waar de werper staat','De teambank heet de dugout.'],
 ['Wat is de warningtrack?','een gravelstrook vóór het hek achter in het buitenveld','de lijn naar het 1e honk|de wachtcirkel voor de volgende slagman|het helpersvak','Zo voelt de veldspeler dat het hek eraan komt.'],
 ['Wat betekent de afkorting LV?','linksvelder','lange vanger|loper vrij|laatste veldspeler','Links gezien vanaf de thuisplaat.'],
 ['Waarop word je bij softbal beoordeeld?','werpen, slaan, vangen, veldpositie, scheids zijn, honklopen, theorie en zelfevaluatie','alleen op hoe hard je slaat|alleen op de theorietoets|op het aantal punten van je team','Dat staat op het voorblad van de module.']]},

{id:'gro',nr:'module',t:'Groene spelen en lesgeven',ic:'🌱',lp:[
 ['De module',`<p>Vijf weken één les van 100 minuten: de helft <b>discuswerpen</b>, de helft <b>groene spelen</b> (lesgeven, hoort bij § 2.1-2.3).</p><table class="gt"><tr><th>discus</th><td>loslaten, richting en tempo op elkaar afstemmen; werper én <b>observator</b> zijn; met een <b>foutenanalyseformulier</b> een beweging analyseren en verbeteren. Cijfer: techniek + afstand, en je rol als observator.</td></tr><tr><th>groene spelen</th><td>samen een les voorbereiden en voor de groep staan. Cijfer: <b>opstarten</b>, <b>op gang houden / motiveren</b> en <b>presenteren</b>.</td></tr></table>`,['Waarop word je bij lesgeven beoordeeld?','opstarten, op gang houden en motiveren, presenteren','de afstand van je worp|hoe vaak je wint|de lengte van je LVF','Bij discus tellen techniek, afstand en je rol als observator.']],
 ['Wat zijn groene spelen?',`<p>Bij <b>groene spelen</b> gaat het <b>niet om winnen</b>, maar om <b>samen</b> iets doen. Ze heten ook <b>coöperatieve spelen</b>: er zijn geen winnaars en verliezers.</p><ul><li>Het doel zit <b>in de activiteit zelf</b>.</li><li>Het spel lukt alleen als <b>iedereen meedoet</b>.</li><li>Je haalt het doel alleen <b>samen</b>; vaak ontstaat er een mooie groepsbeweging.</li></ul><p>Voorbeeld: <b>schootzitten</b>. Iedereen staat dicht achter elkaar in een kring en gaat tegelijk op de schoot van de persoon achter zich zitten. Als één iemand het niet goed doet, valt de hele kring.</p>`,['Wat staat bij groene spelen voorop?','samen bezig zijn, niet winnen','zo snel mogelijk winnen|de beste speler kiezen|zo min mogelijk bewegen','Coöperatief = samenwerkend.']],
 ['Eerst de aandacht',`<p>Je kunt pas uitleggen als je de <b>aandacht</b> hebt:</p><ul><li>Gebruik een <b>vast signaal</b> (fluitje, twee blokjes tegen elkaar).</li><li><b>Hand opsteken</b>: jij steekt je hand op, de leerlingen ook, en ze zijn stil. Je hoeft niet te schreeuwen.</li><li>Zet de groep in een <b>U-vorm</b> op de banken: iedereen ziet en hoort je.</li><li>Is het bijna stil? Begin dan met een <b>pakkende intro</b>; de laatste praters gaan vanzelf luisteren.</li></ul>`,['Wat is het voordeel van ‘hand opsteken’?','je hoeft niet te roepen om stilte','de leerlingen kunnen een vraag stellen|het is een goede warming-up|je weet wie er is','Iedereen steekt zijn hand op en is stil.']],
 ['Plaatje, praatje, daadje',`<p>${figPPD()}</p><p>In de <b>module</b> begin je met het <b>plaatje</b>, in je <b>boek</b> (§ 2.3) met het praatje. Het idee is hetzelfde: weinig praten, veel laten zien, snel aan de slag.</p><ul><li><b>Plaatje</b>: voordoen op het niveau van de groep (oefen het vooraf). Laat een paar leerlingen helpen die het kunnen; met te veel wordt het chaos.</li><li><b>Praatje</b>: de regels en afspraken die je <b>niet kunt laten zien</b> (en de gevaren). Kort, en passend bij de groep; voor kleine kinderen kun je er een verhaaltje van maken.</li><li><b>Daadje</b>: ze gaan aan de slag. Regels uitleggen op het moment dat ze nodig zijn, en je kunt zelf <b>meedoen</b> om bij te sturen.</li></ul>`,['Wat vertel je in het ‘praatje’?','de regels en afspraken die je niet kunt laten zien','alles wat je ook voordoet, nog een keer|je eigen sportverleden|niets, je doet alleen voor','Kort en duidelijk, kinderen willen snel beginnen.']],

 $('#hst').innerHTML=blok('Hoofdstuk 1 · Bewegen en gezondheid',['1.1','1.2'])+blok('Hoofdstuk 2 · Bewegen en regelen',['2.1','2.2','2.3'])+blok('Praktijkmodules',['pad','sof','gro']);
 const g=(id,ok)=>{const e=$('#'+id);if(e)e.classList.toggle('gehaald',ok)};Object.keys(SPEL).forEach(k=>g('p'+k,(S.sp[k]||0)>=SPEL[k].doel));g('pblitz',S.blitz>=15);g('ptoets',S.toets>=7);g('psamen',!!S.samen);

Object.keys(SPEL).forEach(k=>$('#p'+k).onclick=()=>spel(k));$('#pblitz').onclick=()=>blitz();$('#ptoets').onclick=()=>toets();$('#psamen').onclick=()=>samen();$('#fouten').onclick=()=>foutRonde();

/* ---------- leerpad: kaartje voor kaartje, met checkvraag ---------- */
function leerpad(id){const h=H.find(x=>x.id===id);let i=0;show('play');
 const teken=()=>{const c=h.lp[i];const opts=c[2]?shuffle([c[2][1],...c[2][2].split('|')]):[];
  P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="stap">Leerpad · ${h.t}</span><span class="teller">${i+1}/${h.lp.length}</span></div>
  <div class="balk"><i style="width:${i/h.lp.length*100}%"></i></div>
  <div class="kaart"><h2 style="margin-top:0">${c[0]}</h2>${c[1]}${c[2]?`<div class="check"><div class="label">Even checken</div><h3 style="margin:6px 0 0;font-family:inherit">${c[2][0]}</h3><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><div id="fb"></div></div>`:''}
  <div class="acts" id="nav" ${c[2]?'hidden':''}>${i?'<button class="btn licht" id="vor">← Terug</button>':''}<button class="btn" id="vd">${i<h.lp.length-1?'Verder →':'Klaar ✓'}</button></div></div>`;
  $('#stop').onclick=goHome;const vd=()=>{i++;if(i>=h.lp.length){S.lp[id]=1;save();klaar()}else teken()};
  const nav=()=>{$('#nav').hidden=false;$('#vd').onclick=vd;const v=$('#vor');if(v)v.onclick=()=>{i--;teken()};$('#vd').focus()};
  if(c[2])P.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(P.querySelector('.opt.goed'))return;const ok=opts[+b.dataset.k]===c[2][1];
   P.querySelectorAll('.opt').forEach((x,k)=>{if(opts[k]===c[2][1])x.classList.add('goed');else if(x===b)x.classList.add('fout')});
   $('#fb').innerHTML=`<div class="uitleg"><b class="${ok?'goed-t':'fout-t'}">${ok?'Goed!':'Niet goed.'}</b> ${c[2][3]}</div>`;nav()});else nav()};
 const klaar=()=>{P.innerHTML=`<div class="kaart" style="text-align:center"><div class="label">Leerpad klaar</div><h2>${h.ic} ${h.t}</h2><p>Nu oefenen: 10 vragen, haal er 8.</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">✅ Oefenronde</button><button class="btn licht" id="hm">${RT.on?'Terug naar de route':'Naar het overzicht'}</button></div></div>`;
  $('#opn').onclick=()=>ronde(id);$('#hm').onclick=goHome;$('#opn').focus()};
 teken()}

/* ---------- vragen stellen (meerkeuze); fout = herkansing aan het eind ---------- */
function quiz(qs,o){let i=0,goed=0,opnieuw=[];const n=qs.length;
 const volgende=()=>{if(i>=qs.length){if(opnieuw.length&&!o.geenHer){qs=qs.concat(opnieuw);opnieuw=[]}else return einde()}
  const q=qs[i],her=i>=n;const opts=shuffle(q.opts);
  P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="stap">${o.titel}</span><span class="teller">${Math.min(i+1,n)}/${n}${her?' · herkansing':''}</span></div>
  <div class="kaart">${her?'<div class="label" style="color:var(--gold)">Herkansing: deze ging eerder fout</div>':''}${q.h?`<div class="label">${q.h.ic} ${q.h.t}</div>`:''}${q.fig||''}<h3 class="vraag">${q.q}</h3>
  <div class="opts">${opts.map((x,k)=>`<button class="opt" data-k="${k}">${x}</button>`).join('')}</div><div id="fb"></div></div>`;
  $('#stop').onclick=goHome;
  const af=ok=>{if(!her&&ok)goed++;if(ok){if(q.id)delete S.mis[q.id]}else{if(q.id&&q.h)S.mis[q.id]=q.h.id;if(!her)opnieuw.push(q)}save();
   $('#fb').innerHTML=`<div class="uitleg"><b class="${ok?'goed-t':'fout-t'}">${ok?'Goed!':'Niet goed.'}</b> ${!ok&&!q.w?`Het is: <b>${q.a}</b>.`:q.w}</div><div class="acts"><button class="btn" id="vd">Verder ↵</button></div>`;
   i++;$('#vd').onclick=volgende;$('#vd').focus()};
  P.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(P.querySelector('.opt.goed'))return;const ok=opts[+b.dataset.k]===q.a;P.querySelectorAll('.opt').forEach((x,k)=>{if(opts[k]===q.a)x.classList.add('goed');else if(x===b)x.classList.add('fout')});af(ok)})};
 const einde=()=>{P.innerHTML=`<div class="kaart" style="text-align:center"><div class="label">${o.titel}</div><div class="groot">${goed}<span> / ${n}</span></div>${o.klaar(goed,n)}</div>`;o.na&&o.na()};
 show('play');volgende()}
const terugKnop=()=>`<button class="btn licht" id="hm">${RT.on?'Terug naar de route':'Naar het overzicht'}</button>`;

function ronde(id){const h=H.find(x=>x.id===id);const qs=shuffle(h.q).slice(0,10).map(v=>mcItem(v,h));
 quiz(qs,{titel:'Oefenronde · '+h.t,klaar:(goed,n)=>{const f=goed/n;if(f>(S.b[id]||0))S.b[id]=f;save();
  return `<p>${f>=.8?'Gehaald! 🎉':'Nog niet: 8 van de 10 in één keer goed is het doel.'}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een ronde</button><button class="btn licht" id="lp">Leerpad nalezen</button>${terugKnop()}</div>`},
  na:()=>{$('#opn').onclick=()=>ronde(id);$('#lp').onclick=()=>leerpad(id);$('#hm').onclick=goHome}})}
function spelKlaar(k,goed,n){const f=goed/n,d=SPEL[k].doel;if(f>(S.sp[k]||0))S.sp[k]=f;save();
 return `<p>${f>=d?'Gehaald! 🎉':`Doel: ${Math.ceil(d*n)} van de ${n} in één keer goed.`}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een keer</button>${terugKnop()}</div>`}
function spel(k){if(k==='volg')return volg();
 quiz(SPEL[k].v(),{titel:SPEL[k].t,geenHer:k==='pad',klaar:(goed,n)=>spelKlaar(k,goed,n),na:()=>{$('#opn').onclick=()=>spel(k);$('#hm').onclick=goHome}})}

/* ---------- op volgorde: tik de tegels in de goede volgorde ---------- */
function volg(){const set=shuffle(VOLG).slice(0,8);let i=0,goed=0;show('play');
 const teken=()=>{if(i>=set.length){P.innerHTML=`<div class="kaart" style="text-align:center"><div class="label">${SPEL.volg.t}</div><div class="groot">${goed}<span> / ${set.length}</span></div>${spelKlaar('volg',goed,set.length)}</div>`;$('#opn').onclick=volg;$('#hm').onclick=goHome;return}
  const [titel,juist]=set[i];let los;do{los=shuffle(juist)}while(los.join()===juist.join());const rij=[];
  const bouw=()=>{P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="stap">${SPEL.volg.t}</span><span class="teller">${i+1}/${set.length}</span></div>
   <div class="kaart"><div class="label">Zet op volgorde</div><h3 class="vraag">${titel}</h3><p class="sub" style="margin:4px 0 0">Tik de tegels aan van eerste naar laatste.</p>
   <ol class="volgrij">${rij.map(t=>`<li>${t}</li>`).join('')}</ol>
   <div class="tegels">${los.map((t,k)=>`<button class="tegel${rij.includes(t)?' weg':''}" data-k="${k}">${t}</button>`).join('')}</div>
   <div id="fb"></div><div class="acts" id="ra">${rij.length?'<button class="btn licht klein" id="wis2">↺ Opnieuw</button>':''}</div></div>`;
   $('#stop').onclick=goHome;const w=$('#wis2');if(w)w.onclick=()=>{rij.length=0;bouw()};
   P.querySelectorAll('.tegel').forEach(b=>b.onclick=()=>{if(b.classList.contains('weg'))return;rij.push(los[+b.dataset.k]);if(rij.length<juist.length)return bouw();
    bouw();const ok=rij.join()===juist.join();if(ok)goed++;$('#ra').innerHTML='';
    $('#fb').innerHTML=`<div class="uitleg"><b class="${ok?'goed-t':'fout-t'}">${ok?'Goed!':'Niet goed.'}</b>${ok?'':` De goede volgorde:<ol>${juist.map(t=>`<li>${t}</li>`).join('')}</ol>`}</div><div class="acts"><button class="btn" id="vd">Verder ↵</button></div>`;
    P.querySelectorAll('.tegel').forEach(x=>x.disabled=true);$('#vd').onclick=()=>{i++;teken()};$('#vd').focus()})};
  bouw()};
 teken()}

/* ---------- proeftoets: 20 vragen uit alles ---------- */
function toets(){const qs=shuffle(H.flatMap(h=>shuffle(h.q).slice(0,3).map(v=>mcItem(v,h)))).slice(0,20);
 quiz(qs,{titel:'Proeftoets',geenHer:1,klaar:(goed,n)=>{const c=Math.round((1+9*goed/n)*10)/10;if(c>S.toets)S.toets=c;save();
  return `<p>Cijfer: <b style="font-size:22px">${String(c).replace('.',',')}</b>${c>=7?' 🎉':''}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een proeftoets</button>${terugKnop()}</div>`},
  na:()=>{$('#opn').onclick=toets;$('#hm').onclick=goHome}})}
function foutRonde(){const lijst=Object.entries(S.mis).map(([id,hid])=>{const h=H.find(x=>x.id===hid);const v=h&&h.q.find(v=>v[0]===id);return v?mcItem(v,h):null}).filter(Boolean);
 if(!lijst.length){S.mis={};save();return goHome()}quiz(shuffle(lijst).slice(0,15),{titel:'Mijn fouten',klaar:()=>`<p>${Object.keys(S.mis).length?`Nog ${Object.keys(S.mis).length} in je foutenlijst.`:'Foutenlijst leeg. Top!'}</p><div class="acts" style="justify-content:center">${terugKnop()}</div>`,na:()=>{$('#hm').onclick=goHome}})}

/* ---------- begrippenblitz ---------- */
function blitz(){let punten=0,eind=Date.now()+60000;show('play');
 const vraag=()=>{if(Date.now()>=eind)return stop();const b=pick(BEGR),rev=Math.random()<.5;const fout=shuffle(BEGR.filter(x=>x!==b)).slice(0,2);const goedT=rev?b[0]:b[1];const opts=shuffle([goedT,...fout.map(x=>rev?x[0]:x[1])]);
  P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="teller ok">${punten} punten</span><span class="teller" id="tijd">60 s</span></div>
  <div class="kaart"><div class="label">${rev?'Welk begrip hoort hierbij?':'Wat betekent dit begrip?'}</div><h3 class="vraag">${rev?b[1]:b[0]}</h3><div class="opts">${opts.map((x,k)=>`<button class="opt" data-k="${k}">${x}</button>`).join('')}</div><div id="fb"></div></div>`;
  tik();$('#stop').onclick=goHome;
  P.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{if(P.querySelector('.opt.goed'))return;const ok=opts[+x.dataset.k]===goedT;P.querySelectorAll('.opt').forEach((y,k)=>{if(opts[k]===goedT)y.classList.add('goed');else if(y===x)y.classList.add('fout')});
   if(ok){punten++;setTimeout(vraag,350)}else{$('#fb').innerHTML=`<div class="uitleg"><b class="fout-t">Fout.</b> <b>${b[0]}</b> = ${b[1]}.</div><div class="acts"><button class="btn" id="vd">Verder ↵</button></div>`;$('#vd').onclick=vraag;$('#vd').focus()}})};
 const tik=()=>{const e=$('#tijd');if(e)e.textContent=Math.max(0,Math.ceil((eind-Date.now())/1000))+' s'};
 const stop=()=>{clearInterval(window.__klok);const rec=punten>S.blitz;if(rec)S.blitz=punten;save();
  P.innerHTML=`<div class="kaart" style="text-align:center"><div class="label">Begrippenblitz</div><div class="groot">${punten}</div><p>${rec?'Nieuw record! 🎉':`Record: ${S.blitz}`}${S.blitz>=15?'':' · doel: 15'}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een keer</button>${terugKnop()}</div></div>`;
  $('#opn').onclick=blitz;$('#hm').onclick=goHome};
 window.__klok=setInterval(()=>{tik();if(Date.now()>=eind&&!P.querySelector('#vd'))stop()},250);vraag()}

/* ---------- alles nalezen ---------- */
function samen(){S.samen=1;save();show('play');
 P.innerHTML=`<div class="top"><button class="btn licht klein" id="terug">‹ Terug</button><span class="stap">Alles nog eens lezen</span></div>
 <div class="kaart"><p style="margin:0"><b>BSM · toetsstof.</b> Hoofdstuk 1 (§ 1.1 gezonde leefstijl, § 1.2 warming-up en cooling-down), hoofdstuk 2 (§ 2.1 communicatie, § 2.2 begeleiden, § 2.3 lesgeven) en de modules padel, softbal en groene spelen. Hieronder alle uitleg van de leerpaden op een rij.</p></div>
 ${H.map(h=>`<h2>${h.ic} ${h.t} <span class="stap">${h.nr==='module'?'module':'§ '+h.nr}</span></h2>${h.lp.map(c=>`<div class="kaart"><h3>${c[0]}</h3>${c[1]}</div>`).join('')}`).join('')}
 <h2>Begrippen</h2><div class="kaart"><dl class="begr">${BEGR.map(b=>`<dt>${b[0]}</dt><dd>${b[1]}</dd>`).join('')}</dl></div>
 <div class="acts"><button class="btn licht" id="terug2">‹ Terug</button></div>`;$('#terug').onclick=goHome;$('#terug2').onclick=goHome}

renderHome();
</script>
</body>
</html>
