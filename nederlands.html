  <h1>Nederlands · Taalverzorging</h1>
  <p class="sub">Spelling, leestekens en zinsbouw: theorie 86 t/m 105, plus verwarde woorden, zinsbouwfouten en verwijswoorden. Per onderwerp eerst de regel, dan 10 vragen.</p>

    <button class="mode" id="pblitz"><h3>⚡ Snelle ronde</h3><p>60 seconden: welke van de twee is goed? Hoeveel haal jij?</p></button>
    <button class="mode" id="fouten" hidden><h3>🔁 Mijn fouten</h3><p></p></button>

<script>
/* ---------- Onderwerpen: regel (eigen woorden, kort) + vragen [vraag, goed, 'fout|fout', uitleg] ---------- */
const T=[
{id:'ww',nr:'86',t:'Werkwoordspelling',ic:'✍️',regel:`<p><b>Stap 1: welke vorm is het?</b> Persoonsvorm (pv), voltooid deelwoord (vdw) of hele werkwoord?</p>
<ul><li><b>pv tegenwoordige tijd:</b> ik-vorm (stam), +t bij jij/je, u, hij, zij, het. Staat <i>jij/je</i> <b>achter</b> de pv? Dan géén t: <i>word jij</i>, <i>vind je</i>. Bij <i>u</i> blijft de t: <i>wordt u</i>.</li>
<li><b>pv verleden tijd (zwak):</b> eindigt de stam op een letter van <b>'t ex-kofschip</b> (t, x, k, f, s, ch, p)? Dan <b>-te(n)</b>, anders <b>-de(n)</b>. Kijk naar de letter in het hele werkwoord: verhui<b>z</b>en → verhuis<b>de</b>, le<b>v</b>en → leef<b>de</b>.</li>
<li><b>vdw:</b> denk aan de verleden tijd. Hoor je <i>-te</i>, dan eindigt het vdw op <b>-t</b> (gefietst); hoor je <i>-de</i>, dan op <b>-d</b> (verhuisd, gebeurd).</li></ul>
<p>Sterke werkwoorden veranderen van klank (breken, brak, gebroken): daar geldt 't ex-kofschip niet.</p>`,q:[
['Gisteren <b>___</b> hij zijn hand aan de pan. <i>(verbranden)</i>','verbrandde','verbrande|verbrandt','Verleden tijd: stam <i>verbrand</i>, d zit niet in \'t ex-kofschip → stam + de = verbrand<b>de</b>. <i>Verbrande</i> mist de d van de stam; <i>verbrandt</i> is tegenwoordige tijd.'],
['Het pakketje is gisteren <b>___</b>. <i>(bezorgen)</i>','bezorgd','bezorgt|bezorgdt','Voltooid deelwoord (na <i>is</i>). Verleden tijd is <i>bezorgde</i> → het vdw eindigt op <b>-d</b>. <i>Bezorgt</i> is een pv (hij bezorgt).'],
['<b>___</b> jij later ook kok? <i>(worden)</i>','Word','Wordt|Worde','<i>Jij</i> staat achter de pv: dan geen t. <i>Word jij</i>, maar <i>jij wordt</i>.'],
['Jij <b>___</b> steeds beter in wiskunde. <i>(worden)</i>','wordt','word|wort','<i>Jij</i> staat vóór de pv: ik-vorm (word) + t = word<b>t</b>.'],
['Hij <b>___</b> gisteren niet op mijn appje. <i>(antwoorden)</i>','antwoordde','antwoorde|antwoordte','Stam <i>antwoord</i>, d zit niet in \'t ex-kofschip → antwoord + de = antwoord<b>de</b>.'],
['Wij <b>___</b> vorige week naar Utrecht. <i>(fietsen)</i>','fietsten','fietsden|fietste','Stam <i>fiets</i> eindigt op s (\'t ex-kofschip) → -te, en meervoud (wij) → fiets<b>ten</b>.'],
['Hij <b>___</b> vorig jaar naar Groningen. <i>(verhuizen)</i>','verhuisde','verhuiste|verhuisdde','Valkuil! Kijk naar het hele werkwoord: verhui<b>z</b>en. De z zit niet in \'t ex-kofschip → ik-vorm + de = verhuis<b>de</b>.'],
['Zij <b>___</b> vroeger in Spanje. <i>(leven)</i>','leefde','leefte|leefdde','Kijk naar het hele werkwoord: le<b>v</b>en. De v zit niet in \'t ex-kofschip → leef<b>de</b>.'],
['Ze heeft het hek groen <b>___</b>. <i>(verven)</i>','geverfd','geverft|geverfdt','Verleden tijd: ver<b>v</b>en → verfde (v niet in \'t ex-kofschip). Dus vdw op -d: geverf<b>d</b>.'],
['Ik <b>___</b> het een goed plan. <i>(vinden)</i>','vind','vindt|vint','Bij <i>ik</i> alleen de stam: ik vind. Geen t.'],
['<b>___</b> je het leuk om mee te gaan? <i>(vinden)</i>','Vind','Vindt|Vinde','<i>Je</i> staat achter de pv → geen t: <i>Vind je …?</i>'],
['Wanneer <b>___</b> u mijn mail? <i>(beantwoorden)</i>','beantwoordt','beantwoord|beantwoorden','Bij <i>u</i> komt er altijd een t bij, ook als u achter de pv staat: <i>beantwoordt u</i>.'],
['Het meisje <b>___</b> iedereen met haar stem. <i>(verbazen, nu)</i>','verbaast','verbaasd|verbaasdt','Pv tegenwoordige tijd: zij verbaas + t = verbaas<b>t</b>. <i>Verbaasd</i> is het voltooid deelwoord (ze is verbaasd).'],
['Wat is er gisteren <b>___</b>? <i>(gebeuren)</i>','gebeurd','gebeurt|gebeurdt','Voltooid deelwoord (na <i>is</i>). Verleden tijd <i>gebeurde</i> → vdw op -d. <i>Het gebeurt</i> is tegenwoordige tijd.'],
['De trein <b>___</b> elke dag om acht uur. <i>(vertrekken)</i>','vertrekt','vertrek|vertrekd','Hij/zij/het (de trein) → ik-vorm + t: vertrek<b>t</b>.'],
['Ze <b>___</b> het pakket gisteren op. <i>(halen)</i>','haalde','haalte|haaldde','Stam <i>haal</i>: l zit niet in \'t ex-kofschip → haal<b>de</b>.']]},

{id:'eng',nr:'87',t:'Engelse werkwoorden',ic:'🇬🇧',regel:`<p>Engelse werkwoorden vervoeg je <b>als Nederlandse zwakke werkwoorden</b>, met 't ex-kofschip.</p>
<p>Let op: soms eindigt de stam op een <b>e</b> die je niet uitspreekt (time, race, skype). Dan kijk je naar de <b>klank</b> die je hoort, en de e blijft staan:</p>
<ul><li>timen: je hoort ‘taim’, m niet in 't ex-kofschip → time<b>de</b>, getime<b>d</b></li><li>racen: je hoort ‘rees’, s wel in 't ex-kofschip → race<b>te</b>, gerace<b>t</b></li><li>relaxen: relax + te → relax<b>te</b>, gerelax<b>t</b></li></ul>`,q:[
['De wedstrijd is gisteren <b>___</b>. <i>(racen)</i>','geracet','geraced|geracetd','Je hoort ‘rees’: de s zit in \'t ex-kofschip → -t. De e van race blijft staan: gerace<b>t</b>.'],
['Zijn sprong was perfect <b>___</b>. <i>(timen)</i>','getimed','getimet|getimd','Je hoort ‘taim’: m zit niet in \'t ex-kofschip → -d. De e blijft: getime<b>d</b>.'],
['Hij <b>___</b> de hele middag in de tuin. <i>(relaxen, verleden tijd)</i>','relaxte','relaxde|relaxtte','Stam <i>relax</i> eindigt op x (\'t ex-kofschip) → relax<b>te</b>.'],
['Ik heb het bestand <b>___</b>. <i>(deleten)</i>','gedeletet','gedeleted|gedeletd','Je hoort ‘dielieet’: t zit in \'t ex-kofschip → -t, de e blijft: gedelete<b>t</b>.'],
['Oma <b>___</b> elke zondag met haar kleinkinderen. <i>(skypen, verleden tijd)</i>','skypete','skypede|skypte','Je hoort ‘skaip’: p zit in \'t ex-kofschip → -te, en de e blijft: skype<b>te</b>.'],
['We hebben de hele avond <b>___</b>. <i>(gamen)</i>','gegamed','gegamet|gegaamd','Je hoort ‘geem’: m zit niet in \'t ex-kofschip → -d, de e blijft: gegame<b>d</b>.'],
['Jij <b>___</b> dat je ziek bent! <i>(faken, nu)</i>','faket','fakt|faakt','Tegenwoordige tijd: ik fake, jij fake + t = fake<b>t</b>. De e blijft staan.'],
['Ik heb de foto\'s net <b>___</b>. <i>(uploaden)</i>','geüpload','geupload|geüploadt','Verleden tijd uploadde → vdw op -d. Trema op de u, anders lees je ‘geu’ als één klank.']]},

{id:'samen',nr:'88',t:'Tussen-n en tussen-s',ic:'🧩',regel:`<p><b>-en-</b> schrijf je als het eerste deel een zelfstandig naamwoord is dat <b>alleen een meervoud op -en</b> heeft: pann<b>en</b>koek, paard<b>en</b>bloem, boek<b>en</b>kast.</p>
<p><b>Geen n</b> als het eerste deel:</p><ul><li>een meervoud op -s heeft (scorekaart) of op -s én -n (groentesoep, gedachtegang);</li><li>geen meervoud heeft (tarwebrood);</li><li>een werkwoord of versterking is (huilebalk, beresterk);</li><li>maar één keer bestaat (zonnebrand, maneschijn).</li></ul>
<p><b>Tussen-s</b>: schrijf hem als je hem hoort (stadsmuur). Begint het tweede deel met een s-klank, test dan met een ander woord: stad<b>s</b>muur → stad<b>s</b>centrum.</p>`,q:[
['Welke is goed?','pannenkoek','pannekoek|pannenkoeck','Pan heeft alleen het meervoud pann<b>en</b> → met -en-.'],
['Welke is goed?','paardenbloem','paardebloem|paardsbloem','Paard: meervoud alleen paard<b>en</b> → met -en-.'],
['Welke is goed?','zonnebrand','zonnenbrand|zonsbrand','Er is maar één zon → geen n.'],
['Welke is goed?','groentesoep','groentensoep|groentessoep','Groente heeft twee meervouden (groenten én groentes) → geen n.'],
['Welke is goed?','tarwebrood','tarwenbrood|tarwesbrood','Tarwe heeft geen meervoud → geen n.'],
['Welke is goed?','huilebalk','huilenbalk|huilbalk','Huilen is een werkwoord, geen zelfstandig naamwoord → geen n.'],
['Welke is goed?','scorekaart','scorenkaart|scoreskaart','Score heeft alleen een meervoud op -s (scores) → geen n.'],
['Welke is goed?','kippensoep','kippesoep|kipsoep','Kip: meervoud alleen kipp<b>en</b> → met -en-.'],
['Welke is goed?','gedachtegang','gedachtengang|gedachtesgang','Gedachte heeft twee meervouden (gedachten én gedachtes) → geen n.'],
['Welke is goed?','stadscentrum','stadcentrum|statscentrum','Test met een ander woord: stad<b>s</b>muur. Daar hoor je de s → ook stad<b>s</b>centrum.'],
['Welke is goed?','liefdesverdriet','liefdeverdriet|liefdensverdriet','Test: liefd<b>es</b>brief, je hoort de s → liefdesverdriet.'],
['Welke is goed?','boekenkast','boekekast|boekskast','Boek: meervoud alleen boek<b>en</b> → met -en-.']]},

{id:'aaneen',nr:'89',t:'Aaneen of los?',ic:'🔗',regel:`<ul><li>Samenstellingen schrijf je <b>zo veel mogelijk aaneen</b>: asielzoekerscentrum, hogesnelheidstrein, alcoholvrij, koffiezetten.</li>
<li>Woorden met <b>er, daar, hier, waar</b> aaneen: erin, daarvoor, waartegenover. Maar volgt er een zelfstandig naamwoord, dan los: <i>Het kind zit <b>voor op</b> de fiets</i>, maar <i>het zitje hangt <b>voorop</b></i>.</li>
<li><b>Getallen</b> tot duizend aaneen (tweehonderdzesendertig). Ná duizend een spatie (zesduizend vierhonderd). Miljoen en miljard los (drie miljoen).</li>
<li><b>Betekenis</b> verandert: <i>een teveel</i> (overschot) / <i>te veel</i> betaald; <i>tenslotte</i> (uiteindelijk) / <i>ten slotte</i> (aan het eind); <i>tekort</i> (schaarste) / <i>te kort</i>.</li>
<li>Vaak fout: bijvoorbeeld, dankzij, tezamen, tweemaal, per se, van tevoren. Linker-/rechter- vast bij lichaamsdelen, kleding en voertuigen (linkerhand), anders los (linker ingang).</li></ul>`,q:[
['Hij heeft veel <b>___</b> betaald.','te veel','teveel|te-veel','Hier betekent het ‘meer dan nodig’ → los: <i>te veel</i>. <i>Een teveel</i> (zelfstandig naamwoord) schrijf je aaneen.'],
['Een <b>___</b> aan suiker is ongezond.','teveel','te veel|te-veel','Met <i>een</i> ervoor is het een zelfstandig naamwoord (een overschot) → aaneen.'],
['We hebben er <b>___</b> hard voor gewerkt. <i>(= uiteindelijk)</i>','tenslotte','ten slotte|ten-slotte','Betekenis ‘uiteindelijk, per slot van rekening’ → aaneen.'],
['<b>___</b> volgt nog een samenvatting. <i>(= aan het eind)</i>','Ten slotte','Tenslotte|Ten-slotte','Betekenis ‘aan het eind’ → los.'],
['Het kinderzitje hangt <b>___</b>.','voorop','voor op|voor-op','Er volgt geen zelfstandig naamwoord → aaneen.'],
['Het kind zit <b>___</b> de fiets.','voor op','voorop|voor-op','Er volgt een zelfstandig naamwoord (de fiets) → los.'],

{id:'hoofd',nr:'95-96',t:'Hoofdletters en kleine letters',ic:'🔠',regel:`<p><b>Hoofdletter:</b> begin van de zin, eigennamen, bedrijven en gebouwen (voetbalclub Vitesse), merknamen (een Magnum), God, <b>feestdagen</b> (Pasen, Koningsdag), <b>aardrijkskundige namen</b> en afleidingen (Frankrijk, Fransman, Franse les, het Frans), belangrijke gebeurtenissen (de Tweede Wereldoorlog). Bij titels alleen het eerste woord (<i>Goede tijden, slechte tijden</i>).</p>

{id:'trema',nr:'98-100',t:'Trema en streepjes',ic:'¨',regel:`<p><b>Trema</b> (¨) in een <b>niet-samengesteld</b> woord, waar een nieuwe lettergreep begint: beëindigen, reünie, financiële, geüpload, tweeëntwintig. Bij -iee- en -ii- niet nodig: financieel, kopieerde. Niet bij -eum, -eus, -ei, -ien: museum, elektricien.</p>
<p><b>Liggend streepje</b> in een <b>samenstelling</b> als het anders verkeerd leest: zee-egel, auto-ongeluk, milieu-uitgave, video-installatie. Geen probleem? Geen streepje: massaontslag, milieuvriendelijk.</p>
<p>Ook een streepje bij: gelijkwaardige delen (minister-president), afkortingen/letters/cijfers (e-mailen, A-merk, 24-jarige), Sint-Nicolaas, Amsterdam-Noord, ex-, oud-, adjunct- enz. (ex-vriend, oud-leerling). Anti alleen voor een hoofdletter, i of e: anti-Duits, maar antikapitalist.</p>
<p><b>Weglatingsstreepje:</b> zomer- en winterseizoen. Maar bij losse woorden niet: hoge en lage cijfers.</p>`,q:[
['Welke is goed?','beëindigen','beeindigen|be-eindigen','Niet-samengesteld woord, nieuwe lettergreep → trema.'],

['Welke is goed?','zee-egel','zeeëgel|zeeegel','Samenstelling met twee gelijke klinkers → liggend streepje.'],
['Welke is goed?','massaontslag','massa-ontslag|massaöntslag','a-o geeft geen uitspraakprobleem → geen streepje.'],
['Welke is goed?','oud-leerling','oudleerling|oud leerling','Met oud- schrijf je een streepje.'],
['Welke is goed?','antikapitalist','anti-kapitalist|anti kapitalist','Anti- alleen met streepje voor een hoofdletter, i of e. Hier niet.'],

['Welke is goed?','hoge en lage cijfers','hoge- en lage cijfers|hoge -en lage cijfers','Je laat een los woord weg (cijfers), geen woorddeel → geen streepje.'],

<p><b>Afkortingen:</b> kleine letters met punten (enz., m.b.t., mevr.); uitgesproken als woord of letter voor letter: klein en zonder punten (wc, tv, havo); bedrijven en instellingen: hoofdletters zonder punten (KLM, EU, GGD). Onbekende afkorting? Eerst voluit, afkorting tussen haakjes. Geen sociale-media-afkortingen (ff, isg) in formele teksten.</p>`,q:[

['Welke afkorting is goed?','enz.','enz|ENZ.','Gewone afkortingen: kleine letters met een punt.'],

{id:'accent',nr:'103-104',t:'Accenten en afbreken',ic:'✓',regel:`<p><b>Klemtoonteken</b> (é) voor nadruk: hét automerk. Twee letters → twee accenten: móéten. Drie letters → alleen de eerste twee: móóie. <b>Op hoofdletters geen accent:</b> Eén patatje → hoofdletter E zonder accent.</p>
<p>Alleen een accent als het anders verkeerd gelezen kan worden: <i>een van de beste</i> (geen accent), <i>eenrichtingsverkeer</i>.</p>
<p><b>Afbreken</b> aan het eind van een lettergreep, en: samenstellingen tussen de delen (circus-act, vis-hengel); bij -achtig, -loos, -baar, -heid tussen woord en achtervoegsel (schaap-achtig, bereik-baar); niet voor of na één letter (ali-nea); niet zo dat het verkeerd leest (reser-vering); trema en extra letters verdwijnen (twee-entwintig, cola-tje).</p>`,q:[
['Welke zin is goed?','Hij is een van de beste spelers.','Hij is één van de beste spelers.|Hij is éen van de beste spelers.','Hier kan <i>een</i> niet verkeerd gelezen worden → geen accent.'],
['Welke is goed? <i>(begin van de zin)</i>','Eén ijsje, graag!','Één ijsje, graag!|Éen ijsje, graag!','Op een hoofdletter komt geen accent.'],
['Nadruk op <i>moeten</i>:','móéten','moéten|mòèten','Klank met twee letters → twee accenten.'],
['Hoe breek je <i>circusact</i> af?','circus-act','cir-cusact|circu-sact','Samenstelling → tussen de delen (circus + act).'],
['Hoe breek je <i>schaapachtig</i> af?','schaap-achtig','schaapach-tig|schaa-pachtig','Bij -achtig breek je af tussen het woord en het achtervoegsel.'],
['Hoe breek je <i>alinea</i> af?','ali-nea','a-linea|alin-ea','Niet afbreken voor of na een lettergreep van één letter.'],
['Hoe breek je <i>reservering</i> af?','reser-vering','reserve-ring|re-servering','Afbreken mag niet zo dat je het verkeerd leest (reserve-ring).'],
['Hoe breek je <i>tweeëntwintig</i> af?','twee-entwintig','tweeën-twintig|twee-ëntwintig','Het trema verdwijnt bij het afbreken.']]},

{id:'lees',nr:'105',t:'Leestekens',ic:'❗',regel:`<ul><li><b>Punt</b> aan het eind van de zin; niet na ?, ! of een afkorting met punt (enz.). Eén ? of ! is genoeg.</li>
<li><b>Komma</b>: in een opsomming (niet voor <i>en</i> bij twee delen), bij een aangesproken persoon (<i>Claudia, wil je …</i>), na een tussenwerpsel (<i>Ach, …</i>), om een bijstelling (<i>Mark, de buurman, …</i>), meestal voor voegwoorden (maar bijna nooit voor <i>dat</i> en <i>of</i>), <b>tussen twee persoonsvormen</b> (<i>Wie te laat <b>is</b>, <b>moet</b> nablijven</i>).</li>
<li><b>Bijzin met <i>die/dat</i></b>: zonder komma's geldt het voor een deel (<i>de fietsers die zonder licht reden</i> = alleen die), met komma's voor iedereen.</li>
<li><b>Dubbele punt</b> voor directe rede en voor een opsomming of uitleg.</li><li><b>Aanhalingstekens</b> bij directe rede: punt/vraagteken binnen het citaat; loopt de zin door, dan een komma <b>buiten</b> het citaat: <i>'Ik kom morgen', zei ze.</i> Bij gedachten geen aanhalingstekens.</li><li><b>Puntkomma</b> tussen twee zinnen die nauw samenhangen.</li></ul>`,q:[
['Welke zin is goed?','Claudia, wil je het raam dichtdoen?','Claudia wil je het raam dichtdoen?|Claudia, wil je, het raam dichtdoen?','Aangesproken persoon → komma erachter.'],
['Welke zin is goed?','Hij vroeg of ik mee wilde.','Hij vroeg, of ik mee wilde.|Hij vroeg of, ik mee wilde.','Voor <i>of</i> en <i>dat</i> zet je bijna nooit een komma.'],
['Welke zin is goed?','Wie te laat komt, moet nablijven.','Wie te laat komt moet nablijven.|Wie, te laat komt, moet nablijven.','Twee persoonsvormen naast elkaar (komt, moet) → komma ertussen.'],
['Welke zin is goed?','\'Ik kom morgen\', zei ze.','\'Ik kom morgen.\', zei ze.|\'Ik kom morgen,\' zei ze.','Loopt de zin door na het citaat: geen punt, maar een komma buiten het citaat. (In romans staat de komma soms binnen.)'],
['Welke zin is goed?','Ze zei: \'Ik kom morgen.\'','Ze zei \'Ik kom morgen\'.|Ze zei: \'Ik kom morgen\'.','Dubbele punt voor de directe rede; de punt staat binnen het citaat.'],
['Welke zin is goed?','Hoe laat vertrekt de trein?','Hoe laat vertrekt de trein?.|Hoe laat vertrekt de trein???','Na een vraagteken geen punt, en één vraagteken is genoeg.'],
['Welke zin is goed?','Hij dacht: wat een goed idee!','Hij dacht: \'Wat een goed idee!\'|Hij dacht, wat een goed idee!','Bij gedachten zet je geen aanhalingstekens.'],
['Welke zin is goed?','Ik koop appels, peren en bananen.','Ik koop appels, peren, en bananen.|Ik koop, appels, peren en bananen.','Komma\'s tussen de delen van een opsomming, maar niet voor <i>en</i>.'],
['Alleen de fietsers zonder licht kregen een boete. Welke zin past?','De fietsers die zonder licht reden, kregen een boete.','De fietsers, die zonder licht reden, kregen een boete.|De fietsers die, zonder licht reden kregen een boete.','Geen komma vóór <i>die</i>: de bijzin zegt welke fietsers (alleen die zonder licht). Na de bijzin zet je een komma. Met komma\'s eromheen betekent het dat ze <b>allemaal</b> zonder licht reden.'],
['Welke zin is goed?','Mark, de buurman, heeft een nieuwe auto.','Mark de buurman, heeft een nieuwe auto.|Mark, de buurman heeft een nieuwe auto.','Een bijstelling (de buurman = Mark) staat tussen twee komma\'s.']]},

{id:'woord',nr:'112-113',t:'Verwarde woorden en contaminatie',ic:'🔀',regel:`<p><b>Verwarde woorden</b> lijken op elkaar maar betekenen iets anders:</p><ul><li>ovatie (applaus) – ovulatie (eisprong)</li><li>gedupeerd (benadeeld) – gedeputeerd (lid van de provincie)</li><li>verwijderen (weghalen) – verwijden (wijder maken)</li><li>gefuseerd (samengegaan) – gefusilleerd (doodgeschoten)</li><li>overlevering (oud verhaal) – overleving (in leven blijven)</li><li>curator (bij een faillissement) – conservator (in een museum)</li><li>koortsig (een beetje koorts) – koortsachtig (gehaast, druk)</li><li>gelegitimeerd (met legitimatie) – gelimiteerd (beperkt)</li></ul>
<p>Soms bestaat een woord niet: <i>bedoezelen</i> → bezoedelen.</p>
<p><b>Contaminatie</b> = twee uitdrukkingen met dezelfde betekenis door elkaar: <i>nachecken</i> (nakijken + checken), <i>volgens mijn mening</i> (volgens mij + naar mijn mening).</p>`,q:[
['Na het concert kreeg de zangeres een staande <b>___</b>.','ovatie','ovulatie|ovaasie','Ovatie = applaus. Ovulatie = eisprong.'],
['Door de staking waren duizenden reizigers <b>___</b>.','gedupeerd','gedeputeerd|gedepudeerd','Gedupeerd = benadeeld. Een gedeputeerde zit in het provinciebestuur.'],
['De twee scholen zijn vorig jaar <b>___</b>.','gefuseerd','gefusilleerd|gefuuseerd','Gefuseerd = samengegaan. Gefusilleerd = doodgeschoten!'],
['De <b>___</b> van het museum toont de nieuwe schilderijen.','conservator','curator|conservatie','Een conservator beheert een museumcollectie. Een curator regelt een faillissement.'],
['Hij zocht <b>___</b> naar zijn sleutels.','koortsachtig','koortsig|koortsachtend','Koortsachtig = gehaast en druk. Koortsig = een beetje koorts hebben.'],
['Het verhaal is via <b>___</b> bewaard gebleven.','overlevering','overleving|overleveren','Overlevering = oude verhalen die doorgegeven worden. Overleving = in leven blijven.'],
['Welke zin is goed (geen contaminatie)?','Ik moet mijn auto even laten nakijken.','Ik moet mijn auto even laten nachecken.|Ik moet mijn auto even laten nagechecked.','<i>Nachecken</i> is een contaminatie van nakijken + checken.'],
['Welke zin is goed?','Naar mijn mening is dit te duur.','Volgens mijn mening is dit te duur.|Volgens mijn mening is dit te dure.','<i>Volgens mijn mening</i> = volgens mij + naar mijn mening door elkaar.'],
['Welke zin is goed?','Ik besef dat het laat is.','Ik besef me dat het laat is.|Ik besefte me dat het laat is.','<i>Ik besef me</i> = <i>ik besef</i> + <i>ik realiseer me</i> door elkaar (contaminatie).'],
['Welk woord bestaat echt?','bezoedelen','bedoezelen|bezoezelen','<i>Bedoezelen</i> bestaat niet; het is <i>bezoedelen</i> (vuil maken, beschadigen).']]},

{id:'zin',nr:'123-131',t:'Zinsbouwfouten',ic:'🛠️',regel:`<ul><li><b>Congruentie</b>: enkelvoudig onderwerp → enkelvoudige pv, meervoudig → meervoudig: <i>De media <b>maken</b></i>, <i>de lading boomstammen <b>werd</b></i>.</li>
<li><b>Lijdende vorm</b> (de auto wordt door Bas gewassen) is omslachtig; de <b>bedrijvende vorm</b> (Bas wast de auto) leest prettiger.</li>
<li><b>Tangconstructie</b>: niet te veel woorden tussen bij elkaar horende delen.</li>
<li><b>Verkeerd aangesloten bijzin</b>: het verborgen onderwerp van de bijzin moet het onderwerp van de hoofdzin zijn. Fout: <i>Na uren in de file te hebben gestaan, vertrok de boot.</i> (De boot stond niet in de file!)</li>
<li><b>Losstaand zinsdeel</b>: een bijzin los met een punt ervoor. Fout: <i>Het regende. Waardoor de wedstrijd niet doorging.</i></li>
<li><b>Foutieve samentrekking</b>: je mag een woord alleen weglaten als het in beide delen dezelfde vorm en functie heeft. Fout: <i>Stijn ging met de auto en wij op de fiets</i> (ging/gingen).</li>
<li><b>Symmetrie</b>: delen van een opsomming hebben dezelfde vorm: <i>het begin, het middenstuk en het einde</i> (niet: ‘en hoe het afloopt’).</li></ul>`,q:[
['De media <b>___</b> melding van een aardbeving.','maken','maakt|maakten melding','<i>De media</i> is meervoud → meervoudige pv: maken.'],
['De lading boomstammen <b>___</b> naar de werkplaats gebracht.','werd','werden|worden','Het onderwerp is <i>de lading</i> (enkelvoud) → werd.'],
['Iedereen <b>___</b> blij met de uitslag.','was','waren|wazen','<i>Iedereen</i> is enkelvoud → was.'],
['Welke zin is correct?','Nadat we uren in de file hadden gestaan, vertrok de boot eerder dan gepland.','Na uren in de file te hebben gestaan, vertrok de boot eerder dan gepland.|Na uren in de file gestaan te hebben, vertrok de boot eerder.','In de foute zinnen is <i>de boot</i> het onderwerp, maar die stond niet in de file. Met <i>nadat we</i> klopt het.'],
['Welke is correct?','Het regende hard, waardoor de wedstrijd niet doorging.','Het regende hard. Waardoor de wedstrijd niet doorging.|Het regende hard; Waardoor de wedstrijd niet doorging.','<i>Waardoor…</i> is een bijzin en mag niet los staan met een punt ervoor.'],
['Welke zin is correct?','Stijn ging met de auto en wij gingen op de fiets.','Stijn ging met de auto en wij op de fiets.|Stijn ging met de auto en wij ging op de fiets.','Foutieve samentrekking: <i>ging</i> (enkelvoud) kun je niet weglaten bij <i>wij</i> (gingen).'],
['Welke zin is correct?','De pianiste stond op het podium en haar werd een bloemetje overhandigd.','De pianiste stond op het podium en werd een bloemetje overhandigd.|De pianiste stond op het podium en werd haar een bloemetje overhandigd.','In het tweede deel is de pianiste niet het onderwerp (het bloemetje wordt <i>haar</i> gegeven) → je moet <i>haar</i> herhalen.'],
['Welke zin heeft symmetrie?','Gamen dwingt je snel te reageren en goed je verstand te gebruiken.','Gamen dwingt je tot snelle reacties en goed je verstand te gebruiken.|Gamen dwingt je snel reageren en je verstand te gebruiken.','Beide delen van de opsomming hebben dezelfde vorm: <i>te reageren … te gebruiken</i>.'],
['Welke zin is bedrijvend (actief)?','Bas wast elke week de auto van de buurman.','De auto van de buurman wordt elke week door Bas gewassen.|De auto van de buurman is door Bas gewassen.','In de bedrijvende vorm doet het onderwerp (Bas) zelf de handeling. Die vorm leest levendiger.'],
['Welke zin is correct?','Yasmin maakte eerst haar bed op en maakte daarna zichzelf op.','Yasmin maakte eerst haar bed op en daarna zichzelf.|Yasmin maakte eerst haar bed en zichzelf op.','<i>Bed opmaken</i> en <i>zich opmaken</i> hebben een andere betekenis → niet samentrekken.']]},

{id:'verw',nr:'132',t:'Verwijswoorden',ic:'👉',regel:`<ul><li>Naar <b>het-woorden</b> verwijs je met <i>het, dit, dat</i> en <i>zijn</i>: <i>Het huis… Het is nu groen.</i> Veelgemaakte fout: <i>haar</i> in plaats van <i>zijn</i>: <i>Het bedrijf laat <b>zijn</b> medewerkers…</i></li>
<li>Namen van <b>landen en steden</b> zijn het-woorden: <i>Frankrijk heeft <b>zijn</b> tarieven…</i></li><li>Alle <b>verkleinwoorden</b> zijn het-woorden: <i>Het vaatdoekje is vuil. Was <b>het</b> even.</i></li>
<li>In zakelijke teksten: gebruik een verwijswoord pas als het noemende woord eerder genoemd is.</li></ul>`,q:[
['Het bedrijf laat <b>___</b> medewerkers een cursus volgen.','zijn','haar|hun','<i>Het bedrijf</i> is een het-woord → zijn.'],
['Frankrijk heeft <b>___</b> tarieven verlaagd.','zijn','haar|hun','Landen zijn het-woorden → zijn.'],
['Het vaatdoekje is vuil. Doe <b>___</b> maar in de was.','het','hem|haar','Verkleinwoorden zijn het-woorden → het.'],
['Het team speelde <b>___</b> beste wedstrijd.','zijn','haar|hun','<i>Het team</i> is een het-woord → zijn.'],
['Delft is mooi. <b>___</b> heeft prachtige grachten.','Het','Zij|Hij','Steden zijn het-woorden → het.'],
['Het boek <b>___</b> ik lees, is spannend.','dat','die|wat','Het boek is een het-woord → dat.'],
['De gemeente heeft <b>___</b> plannen gepresenteerd.','haar','zijn|hun','<i>De gemeente</i> is een vrouwelijk de-woord (zoals woorden op -heid, -ing, -te) → haar.']]}
];

const KEY='ned-taal-v1';
const $=s=>document.querySelector(s);
let S={b:{},toets:0,blitz:0,mis:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const P=$('#play');
function show(id){$('#home').hidden=id!=='home';P.hidden=id!=='play';scrollTo(0,0)}
const gehaald=id=>(S.b[id]||0)>=.8;
const pct=()=>Math.round(T.filter(t=>gehaald(t.id)).length/T.length*90+(S.toets>=7?10:0));
window.leerVoortgang=pct;
const qid=q=>q[0]+'|'+q[1];

/* ---------- hoofdscherm ---------- */
function renderHome(){const n=T.filter(t=>gehaald(t.id)).length;
 $('#stand').innerHTML=`<div class="top"><b>Jouw stand</b><span class="teller">${pct()}%</span></div><div class="balk"><i style="width:${pct()}%"></i></div>
  <div class="sub" style="margin:0;font-size:15px">${n} van de ${T.length} onderwerpen gehaald (8 van de 10 goed).${S.toets?` Beste proeftoets: <b>${String(S.toets).replace('.',',')}</b>.`:''}${S.blitz?` Record snelle ronde: <b>${S.blitz}</b>.`:''}</div>`;
 $('#onder').innerHTML=T.map(t=>`<button class="mode${gehaald(t.id)?' gehaald':''}" data-t="${t.id}"><h3>${t.ic} ${t.t}</h3><p>Theorie ${t.nr} · ${t.q.length} vragen${S.b[t.id]!=null?` · beste ${Math.round(S.b[t.id]*10)}/10`:''}</p></button>`).join('');
 P.innerHTML='';const fm=Object.keys(S.mis).length;$('#fouten').hidden=!fm;$('#fouten p').textContent=`${fm} vraag${fm===1?'':'en'} die je eerder fout had. Zijn ze nu goed, dan verdwijnen ze uit de lijst.`;
 $('#ptoets').classList.toggle('gehaald',S.toets>=7)}
function goHome(){show('home');renderHome()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b&&!$('#home').hidden)regel(b.dataset.t)});
$('#ptoets').onclick=()=>toets();$('#pblitz').onclick=()=>blitz();$('#pspiek').onclick=()=>spiek();$('#fouten').onclick=()=>foutRonde();
$('#wis').onclick=()=>{if(confirm('Al je voortgang bij Nederlands wissen?')){S={b:{},toets:0,blitz:0,mis:{}};save();renderHome()}};

/* ---------- regel lezen, dan oefenen ---------- */
function regel(id){const t=T.find(x=>x.id===id);show('play');
 P.innerHTML=`<div class="top"><button class="btn licht klein" id="terug">‹ Terug</button><span class="stap">Theorie ${t.nr}</span></div>
 <div class="kaart"><div class="label">De regel</div><h2 style="margin-top:6px">${t.ic} ${t.t}</h2>${t.regel}</div>
 <div class="acts"><button class="btn" id="go">Oefenen: 10 vragen →</button></div>`;
 $('#terug').onclick=goHome;$('#go').onclick=()=>ronde(t);$('#go').focus()}
function ronde(t){const qs=shuffle(t.q).slice(0,10).map(q=>({q,t}));
 quiz(qs,{titel:t.t,klaar:(goed,n)=>{const f=goed/n;const nieuw=f>(S.b[t.id]||0);if(nieuw)S.b[t.id]=f;save();
  return `<p>${f>=.8?'Gehaald! Dit onderwerp staat nu op groen.':'Nog niet gehaald: 8 van de 10 in één keer goed is het doel.'}</p><div class="acts"><button class="btn" id="opn">Nog een ronde</button><button class="btn licht" id="rg">Regel nog eens lezen</button><button class="btn licht" id="hm">Naar het overzicht</button></div>`},
  na:()=>{$('#opn').onclick=()=>ronde(t);$('#rg').onclick=()=>regel(t.id);$('#hm').onclick=goHome}})}

/* ---------- vragen stellen (meerkeuze), fout = aan het eind nog eens ---------- */
function quiz(qs,o){let i=0,goed=0,eerst=qs.length,opnieuw=[];const n=qs.length;
 const volgende=()=>{if(i>=qs.length){if(opnieuw.length){qs=qs.concat(opnieuw);opnieuw=[]}else return einde()}
  const {q,t,her}=qs[i];const opts=shuffle([q[1],...q[2].split('|')]);
  P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="stap">${o.titel}</span><span class="teller">${Math.min(i+1,n)}/${n}${i>=n?' · herkansing':''}</span></div>
  <div class="kaart">${her?'<div class="label" style="color:var(--gold)">Herkansing: deze ging eerder fout</div>':''}${o.toon?`<div class="label">${t.ic} ${t.t}</div>`:''}<h3 style="margin-top:6px;font-weight:700;font-family:inherit;font-size:19px;line-height:1.45">${q[0]}</h3>
  <div class="opts">${opts.map((x,k)=>`<button class="opt" data-k="${k}">${x}</button>`).join('')}</div><div id="fb"></div></div>`;
  $('#stop').onclick=goHome;
  P.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(P.querySelector('.opt.goed'))return;const ok=opts[+b.dataset.k]===q[1];
   P.querySelectorAll('.opt').forEach((x,k)=>{if(opts[k]===q[1])x.classList.add('goed');else if(x===b)x.classList.add('fout')});
   if(i<n&&ok)goed++;if(ok)delete S.mis[qid(q)];else{S.mis[qid(q)]=t.id;if(!her)opnieuw.push({q,t,her:1})}save();
   $('#fb').innerHTML=`<div class="uitleg"><b class="${ok?'goed-t':'fout-t'}">${ok?'Goed!':'Niet goed.'}</b> ${q[3]}</div><div class="acts"><button class="btn" id="vd">Verder ↵</button></div>`;
   i++;$('#vd').onclick=volgende;$('#vd').focus()})};
 const einde=()=>{P.innerHTML=`<div class="kaart" style="text-align:center"><div class="label">${o.titel}</div><div style="font:800 54px Archivo,system-ui;margin:8px 0">${goed}<span style="font-size:.45em;color:var(--muted)"> / ${n}</span></div>${o.klaar(goed,n)}</div>`;o.na&&o.na()};
 show('play');volgende()}

/* ---------- proeftoets: 20 gemengde vragen, cijfer ---------- */
function toets(){const pool=shuffle(T.flatMap(t=>shuffle(t.q).slice(0,2).map(q=>({q,t})))).slice(0,20);
 quiz(pool,{titel:'Proeftoets',toon:1,klaar:(goed,n)=>{const c=Math.round((1+9*goed/n)*10)/10;if(c>S.toets)S.toets=c;save();
  return `<p>Cijfer: <b style="font-size:22px">${String(c).replace('.',',')}</b>${c>=7?' 🎉':''}</p><p class="sub">Alleen de eerste poging telt voor het cijfer; foute vragen kwamen daarna nog een keer terug.</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een proeftoets</button><button class="btn licht" id="hm">Naar het overzicht</button></div>`},
  na:()=>{$('#opn').onclick=toets;$('#hm').onclick=goHome}})}
function foutRonde(){const lijst=Object.entries(S.mis).map(([k,id])=>{const t=T.find(x=>x.id===id);const q=t&&t.q.find(q=>qid(q)===k);return q?{q,t}:null}).filter(Boolean);
 if(!lijst.length)return goHome();quiz(shuffle(lijst).slice(0,15),{titel:'Mijn fouten',toon:1,klaar:(g,n)=>`<p>${Object.keys(S.mis).length?`Er staan nog ${Object.keys(S.mis).length} vragen in je foutenlijst.`:'Je foutenlijst is leeg. Top!'}</p><div class="acts" style="justify-content:center"><button class="btn licht" id="hm">Naar het overzicht</button></div>`,na:()=>{$('#hm').onclick=goHome}})}

/* ---------- snelle ronde: 60 seconden, welke is goed? ---------- */
function blitz(){const alle=T.flatMap(t=>t.q.map(q=>({q,t})));let punten=0,eind=Date.now()+60000,klok;show('play');
 const vraag=()=>{if(Date.now()>=eind)return stop();const {q,t}=alle[Math.random()*alle.length|0];const fout=shuffle(q[2].split('|'))[0];const opts=shuffle([q[1],fout]);
  P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="teller ok" id="pt">${punten} punten</span><span class="teller" id="tijd">60 s</span></div>
  <div class="kaart"><div class="label">${t.ic} ${t.t}</div><h3 style="margin-top:6px;font-weight:700;font-family:inherit;font-size:19px;line-height:1.45">${q[0]}</h3><div class="opts">${opts.map((x,k)=>`<button class="opt" data-k="${k}">${x}</button>`).join('')}</div><div id="fb"></div></div>`;
  tik();$('#stop').onclick=()=>{clearInterval(klok);goHome()};
  P.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(P.querySelector('.opt.goed'))return;const ok=opts[+b.dataset.k]===q[1];P.querySelectorAll('.opt').forEach((x,k)=>{if(opts[k]===q[1])x.classList.add('goed');else if(x===b)x.classList.add('fout')});
   if(ok){punten++;setTimeout(vraag,350)}else{S.mis[qid(q)]=t.id;save();eind+=0;$('#fb').innerHTML=`<div class="uitleg"><b class="fout-t">Fout.</b> ${q[3]}</div><div class="acts"><button class="btn" id="vd">Verder ↵</button></div>`;$('#vd').onclick=vraag;$('#vd').focus()}})};
 const tik=()=>{const s=Math.max(0,Math.ceil((eind-Date.now())/1000));const e=$('#tijd');if(e)e.textContent=s+' s'};
 const stop=()=>{clearInterval(klok);const rec=punten>S.blitz;if(rec)S.blitz=punten;save();
  P.innerHTML=`<div class="kaart" style="text-align:center"><div class="label">Snelle ronde</div><div style="font:800 54px Archivo,system-ui;margin:8px 0">${punten}</div><p>${rec?'Nieuw record! 🎉':`Record: ${S.blitz}`}</p><p class="sub">Tip: bij een fout staat de klok niet stil, dus lees de uitleg rustig: die tijd telt mee.</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een keer</button><button class="btn licht" id="hm">Naar het overzicht</button></div></div>`;
  $('#opn').onclick=blitz;$('#hm').onclick=goHome};
 klok=setInterval(()=>{tik();if(Date.now()>=eind&&!P.querySelector('#vd'))stop()},250);vraag()}

/* ---------- spiekbriefje: alle regels onder elkaar ---------- */
function spiek(){show('play');P.innerHTML=`<div class="top"><button class="btn licht klein" id="terug">‹ Terug</button><span class="stap">Alle regels</span></div>
 ${T.map(t=>`<div class="kaart"><div class="label">Theorie ${t.nr}</div><h2 style="margin-top:6px">${t.ic} ${t.t}</h2>${t.regel}</div>`).join('')}
 <div class="acts"><button class="btn licht" id="terug2">‹ Terug naar het overzicht</button></div>`;$('#terug').onclick=goHome;$('#terug2').onclick=goHome}

renderHome();
</script>
