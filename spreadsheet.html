<script>
/* ---------- de rekenkern: een klein rekenblad dat formules snapt zoals Google Spreadsheets ----------
   Nederlandse én Engelse functienamen, ; of , tussen de delen, komma als decimaalteken. */
const KOL='ABCDEFGH';
const isNum=s=>/^-?\d+([.,]\d+)?$/.test(String(s).trim());
const toNum=s=>parseFloat(String(s).trim().replace(',','.'));
class Fout{constructor(c){this.c=c}}
const FOUT={div:'#DEEL/0!',naam:'#NAAM?',waarde:'#WAARDE!',ref:'#VERW!',na:'#N/B',parse:'#FOUT!'};
function celNaam(c,r){return KOL[c]+(r+1)}
function celPos(n){const m=/^\$?([A-H])\$?(\d+)$/.exec(n.toUpperCase());return m?[KOL.indexOf(m[1]),+m[2]-1]:null}
/* tokens */
function tokens(src){const t=[];let i=0;const s=src;
 while(i<s.length){const ch=s[i];
  if(/\s/.test(ch)){i++;continue}
  if(ch==='"'){let j=i+1,v='';while(j<s.length&&s[j]!=='"')v+=s[j++];if(j>=s.length)throw new Fout(FOUT.parse);t.push({k:'str',v});i=j+1;continue}
  let m=/^\$?[A-Ha-h]\$?\d+/.exec(s.slice(i));if(m&&!/^[A-Za-z.]/.test(s.slice(i+m[0].length))){t.push({k:'ref',v:m[0].toUpperCase()});i+=m[0].length;continue}
  m=/^\d+(?:[.,]\d+)?/.exec(s.slice(i));if(m){t.push({k:'num',v:toNum(m[0])});i+=m[0].length;continue}
  m=/^[A-Za-z][A-Za-z0-9.]*/.exec(s.slice(i));if(m){t.push({k:'naam',v:m[0].toUpperCase()});i+=m[0].length;continue}
  m=/^(<=|>=|<>|[-+*/^():;,<>=&%])/.exec(s.slice(i));if(m){t.push({k:'op',v:m[0]});i+=m[0].length;continue}
  throw new Fout(FOUT.parse)}
 return t}
/* functies: elke functie krijgt de argumenten (getal, tekst of lijst) */
const vlak=args=>args.flatMap(a=>Array.isArray(a)?a.filter(x=>typeof x==='number'):[typeof a==='number'?a:(typeof a==='string'&&isNum(a)?toNum(a):(a===''?0:(()=>{throw new Fout(FOUT.waarde)})()))]);
const sorteer=a=>[...a].sort((x,y)=>x-y);
function kwartiel(a,k){const s=sorteer(a),n=s.length;if(!n)throw new Fout(FOUT.na);if(k<0||k>4)throw new Fout(FOUT.waarde);const p=(n-1)*k/4,l=Math.floor(p);return l+1<n?s[l]+(p-l)*(s[l+1]-s[l]):s[l]}
function voldoet(v,crit){let c=String(crit).trim(),op='=';const m=/^(<=|>=|<>|<|>|=)/.exec(c);if(m){op=m[1];c=c.slice(op.length).trim()}
 const cn=isNum(c)?toNum(c):null,vn=typeof v==='number'?v:(isNum(v)?toNum(v):null);
 if(cn!==null&&vn!==null)return op==='='?vn===cn:op==='<>'?vn!==cn:op==='<'?vn<cn:op==='>'?vn>cn:op==='<='?vn<=cn:vn>=cn;
 const a=String(v).toLowerCase(),b=c.toLowerCase();return op==='<>'?a!==b:op==='='?a===b:false}
const FN={};
const def=(namen,f)=>namen.forEach(n=>FN[n]=f);
def(['SOM','SUM'],a=>vlak(a).reduce((x,y)=>x+y,0));
def(['GEMIDDELDE','AVERAGE'],a=>{const v=vlak(a);if(!v.length)throw new Fout(FOUT.div);return v.reduce((x,y)=>x+y,0)/v.length});
def(['MEDIAAN','MEDIAN'],a=>{const s=sorteer(vlak(a)),n=s.length;if(!n)throw new Fout(FOUT.na);return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2});
def(['MODUS','MODE','MODE.SNGL'],a=>{const v=vlak(a),c=new Map();let best=null,bn=1;v.forEach(x=>{const k=(c.get(x)||0)+1;c.set(x,k);if(k>bn){bn=k;best=x}});if(best===null)throw new Fout(FOUT.na);return best});
def(['MIN'],a=>{const v=vlak(a);return v.length?Math.min(...v):0});
def(['MAX'],a=>{const v=vlak(a);return v.length?Math.max(...v):0});
def(['AANTAL','COUNT'],a=>a.flatMap(x=>Array.isArray(x)?x:[x]).filter(x=>typeof x==='number').length);
def(['AANTALARG','COUNTA'],a=>a.flatMap(x=>Array.isArray(x)?x:[x]).filter(x=>x!==''&&x!==null).length);
def(['AANTAL.ALS','COUNTIF'],a=>{if(a.length!==2||!Array.isArray(a[0]))throw new Fout(FOUT.waarde);return a[0].filter(v=>v!==''&&voldoet(v,a[1])).length});
def(['KWARTIEL','QUARTILE','KWARTIEL.INC','QUARTILE.INC'],a=>{if(a.length!==2)throw new Fout(FOUT.waarde);return kwartiel(vlak([a[0]]),Math.round(vlak([a[1]])[0]))});
def(['STDEV.P','STDEVP','STDEV.POP'],a=>{const v=vlak(a),n=v.length;if(!n)throw new Fout(FOUT.div);const g=v.reduce((x,y)=>x+y,0)/n;return Math.sqrt(v.reduce((s,x)=>s+(x-g)**2,0)/n)});
def(['STDEV','STDEV.S'],a=>{const v=vlak(a),n=v.length;if(n<2)throw new Fout(FOUT.div);const g=v.reduce((x,y)=>x+y,0)/n;return Math.sqrt(v.reduce((s,x)=>s+(x-g)**2,0)/(n-1))});
def(['SOMPRODUCT','SUMPRODUCT'],a=>{if(a.length<2||!a.every(Array.isArray)||a.some(x=>x.length!==a[0].length))throw new Fout(FOUT.waarde);return a[0].reduce((s,_,i)=>s+a.reduce((p,l)=>p*(typeof l[i]==='number'?l[i]:0),1),0)});
def(['AFRONDEN','ROUND'],a=>{const v=vlak(a),d=v[1]||0;return Math.round(v[0]*10**d)/10**d});
def(['WORTEL','SQRT'],a=>{const v=vlak(a)[0];if(v<0)throw new Fout(FOUT.waarde);return Math.sqrt(v)});
def(['ABS'],a=>Math.abs(vlak(a)[0]));
def(['MACHT','POWER'],a=>{const v=vlak(a);return v[0]**v[1]});
def(['ALS','IF'],a=>(a[0]&&a[0]!==0)?(a[1]??true):(a[2]??false));
/* het blad: ruwe inhoud per cel, waarden worden steeds opnieuw uitgerekend */
class Blad{
 constructor(rij,kol,cellen){this.rij=rij;this.kol=kol;this.c=Object.assign({},cellen||{})}
 ruw(n){return this.c[n]??''}
 waarde(n,bezig=new Set()){const r=this.ruw(n);if(r===''||r===null)return '';const s=String(r);
  if(s[0]!=='=')return isNum(s)?toNum(s):s;
  if(bezig.has(n))throw new Fout(FOUT.ref);bezig.add(n);
  try{const v=this.formule(s.slice(1),bezig);return v}finally{bezig.delete(n)}}
 toon(n){try{const v=this.waarde(n);return v}catch(e){if(e instanceof Fout)return e;throw e}}
 formule(src,bezig){const t=tokens(src);let i=0;const kijk=()=>t[i],neem=()=>t[i++];
  const isOp=v=>t[i]&&t[i].k==='op'&&t[i].v===v;
  const getal=x=>{if(x instanceof Fout)throw x;if(Array.isArray(x))throw new Fout(FOUT.waarde);if(typeof x==='number')return x;if(x==='')return 0;if(typeof x==='boolean')return x?1:0;if(isNum(x))return toNum(x);throw new Fout(FOUT.waarde)};
  const cel=n=>{const p=celPos(n);if(!p)throw new Fout(FOUT.ref);if(p[0]>=this.kol||p[1]>=this.rij)return '';return this.waarde(celNaam(p[0],p[1]),bezig)};
  const vergelijk=()=>{let a=som();while(t[i]&&t[i].k==='op'&&['=','<>','<','>','<=','>='].includes(t[i].v)){const o=neem().v,b=som();const x=typeof a==='number'||typeof b==='number'?[getal(a),getal(b)]:[String(a),String(b)];a=o==='='?x[0]===x[1]:o==='<>'?x[0]!==x[1]:o==='<'?x[0]<x[1]:o==='>'?x[0]>x[1]:o==='<='?x[0]<=x[1]:x[0]>=x[1]}return a};
  const som=()=>{let a=keer();while(isOp('+')||isOp('-')){const o=neem().v,b=keer();a=o==='+'?getal(a)+getal(b):getal(a)-getal(b)}return a};
  const keer=()=>{let a=macht();while(isOp('*')||isOp('/')){const o=neem().v,b=macht();if(o==='*')a=getal(a)*getal(b);else{if(getal(b)===0)throw new Fout(FOUT.div);a=getal(a)/getal(b)}}return a};
  const macht=()=>{let a=min();while(isOp('^')){neem();a=getal(a)**getal(min())}return a};
  const min=()=>{if(isOp('-')){neem();return -getal(min())}if(isOp('+')){neem();return getal(min())}let v=basis();if(isOp('%')){neem();v=getal(v)/100}return v};
  const basis=()=>{const k=neem();if(!k)throw new Fout(FOUT.parse);
   if(k.k==='num')return k.v;if(k.k==='str')return k.v;
   if(k.k==='ref'){if(isOp(':')){neem();const e=neem();if(!e||e.k!=='ref')throw new Fout(FOUT.parse);const a=celPos(k.v),b=celPos(e.v);const l=[];
     for(let c=Math.min(a[0],b[0]);c<=Math.max(a[0],b[0]);c++)for(let r=Math.min(a[1],b[1]);r<=Math.max(a[1],b[1]);r++){l.push(c>=this.kol||r>=this.rij?'':this.waarde(celNaam(c,r),bezig))}return l}
    return cel(k.v)}
   if(k.k==='naam'){if(!isOp('('))throw new Fout(FOUT.naam);neem();const f=FN[k.v];const args=[];
    if(!isOp(')')){do{args.push(vergelijk())}while((isOp(';')||isOp(','))&&neem())}
    if(!isOp(')'))throw new Fout(FOUT.parse);neem();if(!f)throw new Fout(FOUT.naam);
    args.forEach(a=>{if(a instanceof Fout)throw a;if(Array.isArray(a))a.forEach(x=>{if(x instanceof Fout)throw x})});return f(args)}
   if(k.k==='op'&&k.v==='('){const v=vergelijk();if(!isOp(')'))throw new Fout(FOUT.parse);neem();return v}
   throw new Fout(FOUT.parse)};

/* formule doortrekken: rijnummers zonder $ schuiven mee */
function schuif(f,dr){if(String(f)[0]!=='=')return f;let uit='',inStr=false;const s=String(f);
 for(let i=0;i<s.length;i++){if(s[i]==='"'){inStr=!inStr;uit+=s[i];continue}
  if(!inStr){const m=/^(\$?)([A-Ha-h])(\$?)(\d+)/.exec(s.slice(i));const voor=i?s[i-1]:'';
   if(m&&!/[A-Za-z0-9.]/.test(voor)&&!/^[A-Za-z(.]/.test(s.slice(i+m[0].length))){uit+=m[1]+m[2].toUpperCase()+m[3]+(m[3]?m[4]:Math.max(1,+m[4]+dr));i+=m[0].length-1;continue}}
  uit+=s[i]}
 return uit}
/* netjes tonen: komma als decimaalteken */
function mooi(v){if(v instanceof Fout)return v.c;if(typeof v==='boolean')return v?'WAAR':'ONWAAR';if(typeof v!=='number')return String(v);
 if(Number.isInteger(v))return String(v);let s=String(Math.round(v*1e6)/1e6);return s.replace('.',',')}
function getalTekst(v){return typeof v==='number'?String(Math.round(v*1e6)/1e6).replace('.',','):String(v)}

 for(let r=0;r<rij;r++){h+=`<tr><th>${r+1}</th>`;for(let c=0;c<kol;c++){const n=celNaam(c,r),v=cellen[n]??'';h+=`<td class="${isNum(v)?'n':''}${o.hl&&o.hl.includes(n)?' hl':''}">${esc(v)}</td>`}h+='</tr>'}
 return h+'</table></div>'}

 $('#stand').innerHTML=`<button class="mode main" id="rtbox" style="width:100%"><h3>${nx?(pct()?'Ga verder: ':'Begin: ')+nx[2]:'Leerroute klaar. Herhalen?'}</h3><p>🧭 Leerroute · ${pct()}%${S.toets?` · beste proeftoets ${String(S.toets).replace('.',',')}`:''}</p><div class="balk" style="background:rgba(127,127,127,.35)"><i style="width:${pct()}%"></i></div></button>`;
 $('#rtbox').onclick=routeScreen;
 $('#lessen').innerHTML=L.map((l,i)=>`<div class="kaart hk"><h3>${l.ic} ${l.t} <span class="stap">les ${i+1}</span></h3><div class="acts" style="margin-top:8px"><button class="btn klein${S.lp[l.id]?' ok':' licht'}" data-lp="${l.id}">📖 Leerpad${S.lp[l.id]?' ✓':''}</button>${l.blad?`<button class="btn klein${S.blad[l.id]?' ok':' licht'}" data-bl="${l.id}">🧪 Oefenblad${S.blad[l.id]?' ✓':''}</button>`:`<button class="btn klein${(S.b[l.id]||0)>=7/8?' ok':' licht'}" data-pr="${l.id}">✅ Vragen</button>`}</div></div>`).join('');
 const g=(id,ok)=>{const e=$('#'+id);if(e)e.classList.toggle('gehaald',ok)};g('puit',(S.sp.uit||0)>=.8);g('pwelke',(S.sp.welke||0)>=.8);g('ptoets',S.toets>=7);g('psamen',!!S.samen);P.innerHTML=''}
function goHome(){if(RT.on)return routeScreen();show('home');renderHome()}
document.addEventListener('click',e=>{if($('#home').hidden)return;const b=e.target.closest('[data-lp],[data-bl],[data-pr]');if(!b)return;if(b.dataset.lp)leerpad(b.dataset.lp);else if(b.dataset.bl)blad(b.dataset.bl);else ronde(b.dataset.pr)});
$('#puit').onclick=()=>spel('uit');$('#pwelke').onclick=()=>spel('welke');$('#pvrij').onclick=()=>blad('vrij');$('#ptoets').onclick=()=>toets();$('#psamen').onclick=()=>samen();
$('#wis').onclick=()=>{if(confirm('Al je voortgang bij Spreadsheets wissen?')){S=leeg();save();renderHome()}};

/* ---------- leerpad ---------- */
function leerpad(id){const l=L.find(x=>x.id===id);let i=0;show('play');
 const teken=()=>{const c=l.lp[i];const opts=c[2]?shuffle([c[2][1],...c[2][2].split('|')]):[];
  P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="stap">Leerpad · ${l.t}</span><span class="teller">${i+1}/${l.lp.length}</span></div>
  <div class="balk"><i style="width:${i/l.lp.length*100}%"></i></div>
  <div class="kaart"><h2 style="margin-top:0">${c[0]}</h2>${c[1]}${c[2]?`<div class="check"><div class="label">Even checken</div><h3 style="margin:6px 0 0;font-family:inherit">${c[2][0]}</h3><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div>`:''}
  <div class="acts" id="nav" ${c[2]?'hidden':''}>${i?'<button class="btn licht" id="vor">← Terug</button>':''}<button class="btn" id="vd">${i<l.lp.length-1?'Verder →':'Klaar ✓'}</button></div></div>`;
  $('#stop').onclick=goHome;const vd=()=>{i++;if(i>=l.lp.length){S.lp[id]=1;save();klaar()}else teken()};
  const nav=()=>{$('#nav').hidden=false;$('#vd').onclick=vd;const v=$('#vor');if(v)v.onclick=()=>{i--;teken()};$('#vd').focus()};
  if(c[2])P.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(P.querySelector('.opt.goed'))return;const ok=opts[+b.dataset.k]===c[2][1];
   P.querySelectorAll('.opt').forEach((x,k)=>{if(opts[k]===c[2][1])x.classList.add('goed');else if(x===b)x.classList.add('fout')});
   $('#fb').innerHTML=`<div class="uitleg"><b class="${ok?'goed-t':'fout-t'}">${ok?'Goed!':'Niet goed.'}</b> ${c[2][3]}</div>`;nav()});else nav()};
 const klaar=()=>{P.innerHTML=`<div class="kaart" style="text-align:center"><div class="label">Leerpad klaar</div><h2>${l.ic} ${l.t}</h2><p>${l.blad?'Nu zelf doen in het oefenblad.':'Nu de vragen.'}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">${l.blad?'🧪 Oefenblad':'✅ Vragen'}</button><button class="btn licht" id="hm">${RT.on?'Terug naar de route':'Naar het overzicht'}</button></div></div>`;
  $('#opn').onclick=()=>l.blad?blad(id):ronde(id);$('#hm').onclick=goHome;$('#opn').focus()};
 teken()}

/* ---------- het oefenblad ---------- */
const CHIPS={cel:[],som:['SOM('],gmm:['GEMIDDELDE(','MEDIAAN(','MODUS(','MAX(','MIN(','AANTAL('],freq:['SOM(','AANTAL.ALS(','SOMPRODUCT('],spr:['KWARTIEL(','MAX(','MIN(','STDEV.P('],vast:['SOM('],vrij:['SOM(','GEMIDDELDE(','MEDIAAN(','MODUS(','MAX(','MIN(','AANTAL(','AANTAL.ALS(','KWARTIEL(','STDEV.P(']};
function cellenVan(spec){const [a,b]=spec.split(':');const p=celPos(a),q=celPos(b||a);const l=[];for(let c=p[0];c<=q[0];c++)for(let r=p[1];r<=q[1];r++)l.push(celNaam(c,r));return l}
const basisF=t=>t.opl.split(', dan')[0].split(' (')[0].trim();
function oplossing(B){const o=new Blad(B.rij,B.kol,B.data);B.taken.forEach(t=>{const cs=cellenVan(t.cel),f=basisF(t);cs.forEach((n,i)=>o.c[n]=schuif(f,i))});return o}
function controleer(b,B,t,sol){const uit=[];for(const n of cellenVan(t.cel)){const r=String(b.ruw(n)).trim();
  if(!r){uit.push({n,ok:false});continue}
  if(r[0]!=='='){uit.push({n,ok:false,w:`${n}: begin met een <b>=</b>, anders rekent het blad niet.`});continue}
  if(!/\$?[A-H]\$?\d/i.test(r)){uit.push({n,ok:false,w:`${n}: reken met de <b>cellen</b> (zoals A2), niet met getallen die je overtypt.`});continue}
  const v=b.toon(n);if(v instanceof Fout){uit.push({n,ok:false,w:`${n} geeft <b>${v.c}</b>. ${v.c==='#DEEL/0!'?'Je deelt door 0 of door een lege cel.':v.c==='#NAAM?'?'Die functienaam kent het blad niet: controleer de spelling.':v.c==='#VERW!'?'De formule verwijst naar zichzelf of naar een cel buiten het blad.':'Controleer haakjes, ; en : in je formule.'}`});continue}
  if(t.fn&&!t.fn.test(r.toUpperCase())){uit.push({n,ok:false,w:`${n}: gebruik hier een functie (${esc(basisF(t).match(/=([A-Z.]+)\(/)?.[1]||'')}).`});continue}
  if(t.must&&!t.must.test(r)){uit.push({n,ok:false,w:`${n}: ${t.must.source==='\\('?'zet haakjes om de som.':'gebruik de cellen uit de opdracht.'}`});continue}
  if(t.dollar&&!r.includes('$')){uit.push({n,ok:false,w:`${n}: zet het totaal vast met <b>$</b>, anders schuift het mee bij doortrekken.`});continue}
  let e=sol.toon(n),ok=typeof v==='number'&&typeof e==='number'&&Math.abs(v-e)<=1e-9*Math.max(1,Math.abs(e));
  if(!ok&&t.alt){const o2=new Blad(sol.rij,sol.kol,sol.c);o2.c[n]=t.alt;const e2=o2.toon(n);ok=typeof v==='number'&&typeof e2==='number'&&Math.abs(v-e2)<=1e-9*Math.max(1,Math.abs(e2))}
  uit.push({n,ok,w:ok?'':`${n}: de uitkomst klopt nog niet. Kijk naar het bereik en de rekentekens.`})}
 return uit}
function blad(id){const vrij=id==='vrij';const l=vrij?null:L.find(x=>x.id===id);
 const B=vrij?{rij:15,kol:6,data:{},taken:[]}:l.blad;S.cel[id]=S.cel[id]||{};
 const b=new Blad(B.rij,B.kol,Object.assign({},B.data,S.cel[id]));const vast=new Set(Object.keys(B.data));
 const sol=vrij?null:oplossing(B);const doelen=new Set(B.taken.flatMap(t=>cellenVan(t.cel)));
 let sel=B.taken.length?cellenVan(B.taken[0].cel)[0]:'A1',melding='',hints={};
 show('play');
 P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="stap">${vrij?'Vrij rekenblad':'Oefenblad · '+l.t}</span><span class="teller" id="score"></span></div>
 ${vrij?'<div class="kaart"><p style="margin:0">Probeer alles uit wat je wilt. Wat je typt wordt bewaard.</p></div>':`<div class="kaart"><div class="label">Opdrachten</div><ol class="taken" id="taken"></ol></div>`}
 <div class="kaart blad"><div class="fbar"><span id="naam"></span><span class="fx">fx</span><input id="fx" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Inhoud van de cel"></div>
 <div class="chips">${['=','(',')',':',';','$','"','*','/','+','-',...CHIPS[id]].map(c=>`<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
 <div class="ws" id="ws"></div>
 <div class="acts"><button class="btn klein" id="ok">✓ Invoeren</button><button class="btn licht klein" id="trek">⤓ Doortrekken</button><button class="btn licht klein" id="wiscel">✕ Cel leeg</button></div><div id="mld"></div></div>
 <div id="klaarbox"></div>`;
 const fx=$('#fx');
 const tekenGrid=()=>{const res=vrij?[]:B.taken.map(t=>controleer(b,B,t,sol));const okCel=new Set(res.flat().filter(x=>x.ok).map(x=>x.n));
  let h='<table class="sh"><tr><th></th>'+[...Array(B.kol)].map((_,c)=>`<th>${KOL[c]}</th>`).join('')+'</tr>';
  for(let r=0;r<B.rij;r++){h+=`<tr><th>${r+1}</th>`;for(let c=0;c<B.kol;c++){const n=celNaam(c,r),v=b.toon(n),num=typeof v==='number';
    h+=`<td data-n="${n}" class="${vast.has(n)?'vast':''}${doelen.has(n)?(okCel.has(n)?' ok':' doel'):''}${n===sel?' sel':''}${num?' n':''}${v instanceof Fout?' err':''}">${esc(mooi(v))}</td>`}h+='</tr>'}
  $('#ws').innerHTML=h+'</table>';$('#naam').textContent=sel;
  if(!vrij){const af=B.taken.map((t,i)=>res[i].every(x=>x.ok));
   $('#taken').innerHTML=B.taken.map((t,i)=>{const fout=res[i].find(x=>!x.ok&&x.w);return `<li class="${af[i]?'af':''}">${t.t}${af[i]?' <b class="goed-t">✓</b>':''}${!af[i]&&fout?`<div class="tw-fb">${fout.w}</div>`:''}${!af[i]?` <button class="hintk" data-h="${i}">💡${hints[i]>=1?' antwoord':''}</button>${hints[i]?`<div class="tip">${hints[i]>=2?`Zo kan het: <code class="f">${esc(t.opl)}</code>`:esc(t.hint)}</div>`:''}`:''}</li>`}).join('');
   $('#score').textContent=`${af.filter(Boolean).length}/${B.taken.length} ✓`;
   P.querySelectorAll('.hintk').forEach(k=>k.onclick=()=>{const i=+k.dataset.h;hints[i]=(hints[i]||0)+1;tekenGrid()});
   if(af.every(Boolean)){const nieuw=!S.blad[id];S.blad[id]=1;save();$('#klaarbox').innerHTML=`<div class="kaart" style="border-color:var(--good);background:var(--good-bg);text-align:center"><b class="goed-t" style="font-size:20px">Blad af! ${nieuw?'🎉':'✓'}</b><p>Alle opdrachten kloppen.</p><div class="acts" style="justify-content:center">${terugKnop()}</div></div>`;$('#hm').onclick=goHome}}
  $('#mld').innerHTML=melding?`<div class="uitleg">${melding}</div>`:''};
 const kies=n=>{sel=n;fx.value=b.ruw(n);melding='';tekenGrid();if(fijn)fx.focus()};
 const invoer=()=>{const v=fx.value.trim();if(vast.has(sel)){if(v===String(b.ruw(sel)))return true;if(true){melding='Deze cel hoort bij de gegevens: die laat je staan. Kies een lege cel.';fx.value=b.ruw(sel)}tekenGrid();return false}
  if(v)b.c[sel]=v;else delete b.c[sel];if(v)S.cel[id][sel]=v;else delete S.cel[id][sel];save();melding='';return true};
 const verplaats=(dc,dr)=>{const p=celPos(sel);const c=Math.max(0,Math.min(B.kol-1,p[0]+dc)),r=Math.max(0,Math.min(B.rij-1,p[1]+dr));kies(celNaam(c,r))};
 const plakRef=()=>{const v=fx.value,pos=fx.selectionStart??v.length;return document.activeElement===fx&&v[0]==='='&&/[=+\-*/^(;:,<>&]$/.test(v.slice(0,pos))};
 $('#ws').addEventListener('pointerdown',e=>{const td=e.target.closest('td[data-n]');if(!td)return;
  if(plakRef()){e.preventDefault();const pos=fx.selectionStart,v=fx.value;fx.value=v.slice(0,pos)+td.dataset.n+v.slice(pos);fx.setSelectionRange(pos+td.dataset.n.length,pos+td.dataset.n.length);return}
  if(fx.value.trim()!==String(b.ruw(sel)))invoer();kies(td.dataset.n)});
 fx.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(invoer())verplaats(0,1);else tekenGrid()}
  else if(e.key==='Tab'){e.preventDefault();if(invoer())verplaats(e.shiftKey?-1:1,0)}
  else if(e.key==='Escape'){fx.value=b.ruw(sel)}
  else if((e.key==='ArrowDown'||e.key==='ArrowUp')&&fx.value===String(b.ruw(sel))){e.preventDefault();verplaats(0,e.key==='ArrowDown'?1:-1)}});
 P.querySelectorAll('.chip').forEach(c=>{c.addEventListener('pointerdown',e=>e.preventDefault());c.onclick=()=>{const t=c.dataset.c,pos=fx.selectionStart??fx.value.length,v=fx.value;fx.value=v.slice(0,pos)+t+v.slice(fx.selectionEnd??pos);fx.focus();fx.setSelectionRange(pos+t.length,pos+t.length)}});
 $('#ok').onclick=()=>{if(invoer())verplaats(0,1);else tekenGrid()};
 $('#wiscel').onclick=()=>{fx.value='';invoer();tekenGrid()};
 $('#trek').onclick=()=>{if(fx.value.trim()!==String(b.ruw(sel)))invoer();const raw=String(b.ruw(sel));const p=celPos(sel);
  if(raw[0]!=='='){melding='Kies eerst een cel met een formule (die begint met =). Die trek je dan door naar beneden.';return tekenGrid()}
  let r=p[1];const links=rr=>p[0]>0&&vast.has(celNaam(p[0]-1,rr))&&b.ruw(celNaam(p[0]-1,rr))!=='';
  while(r+1<B.rij&&links(r+1)&&!vast.has(celNaam(p[0],r+1)))r++;
  if(r===p[1]){melding='Hier valt niets door te trekken: links van de cellen eronder staan geen gegevens.';return tekenGrid()}
  for(let rr=p[1]+1;rr<=r;rr++){const n=celNaam(p[0],rr),f=schuif(raw,rr-p[1]);b.c[n]=f;S.cel[id][n]=f}save();
  melding=`Doorgetrokken tot ${celNaam(p[0],r)}. Kijk maar: in ${celNaam(p[0],p[1]+1)} staat nu <code class="f">${esc(b.ruw(celNaam(p[0],p[1]+1)))}</code>.`;tekenGrid()};
 $('#stop').onclick=goHome;
 kies(sel)}

/* ---------- vragen: meerkeuze of een getal ---------- */
const terugKnop=()=>`<button class="btn licht" id="hm">${RT.on?'Terug naar de route':'Naar het overzicht'}</button>`;
const leesGetal=v=>{const t=String(v).trim().replace(/\s/g,'').replace(',','.');return t===''||isNaN(+t)?NaN:+t};
function quiz(qs,o){let i=0,goed=0,opnieuw=[];const n=qs.length;
 const volgende=()=>{if(i>=qs.length){if(opnieuw.length&&!o.geenHer){qs=qs.concat(opnieuw);opnieuw=[]}else return einde()}
  const q=qs[i],her=i>=n;const opts=q.num?[]:shuffle(q.opts);
  P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="stap">${o.titel}</span><span class="teller">${Math.min(i+1,n)}/${n}${her?' · herkansing':''}</span></div>
  <div class="kaart">${her?'<div class="label" style="color:var(--gold)">Herkansing: deze ging eerder fout</div>':''}${q.fig||''}<h3 class="vraag">${q.q}</h3>
  ${q.num?`<form class="typerow" id="nf" autocomplete="off"><input id="ni" inputmode="decimal" placeholder="uitkomst" aria-label="Antwoord"><button class="btn" type="submit" id="nb">Controleer</button></form>`:`<div class="opts">${opts.map((x,k)=>`<button class="opt${q.code?' code':''}" data-k="${k}">${esc(x)}</button>`).join('')}</div>`}<div id="fb"></div></div>`;
  $('#stop').onclick=goHome;
  const af=ok=>{if(!her&&ok)goed++;if(!ok&&!her)opnieuw.push(q);
   $('#fb').innerHTML=`<div class="uitleg"><b class="${ok?'goed-t':'fout-t'}">${ok?'Goed!':'Niet goed.'}</b> ${q.num&&!ok?`Het antwoord is <b>${mooi(q.a)}</b>. `:''}${q.w}</div><div class="acts"><button class="btn" id="vd">Verder ↵</button></div>`;
   i++;$('#vd').onclick=volgende;$('#vd').focus()};
  if(q.num){const inp=$('#ni');inp.focus();$('#nf').onsubmit=e=>{e.preventDefault();const v=leesGetal(inp.value);if(isNaN(v)){inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');return}
   inp.readOnly=true;$('#nb').hidden=true;af(Math.abs(v-q.a)<=Math.abs(q.a)*.001+1e-9)}}
  else P.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(P.querySelector('.opt.goed'))return;const ok=opts[+b.dataset.k]===q.a;P.querySelectorAll('.opt').forEach((x,k)=>{if(opts[k]===q.a)x.classList.add('goed');else if(x===b)x.classList.add('fout')});af(ok)})};
 const einde=()=>{P.innerHTML=`<div class="kaart" style="text-align:center"><div class="label">${o.titel}</div><div class="groot">${goed}<span> / ${n}</span></div>${o.klaar(goed,n)}</div>`;o.na&&o.na()};
 show('play');volgende()}
const mc=v=>({q:v[0],a:v[1],opts:[v[1],...v[2].split('|')],w:v[3]});
const welkeVraag=v=>({q:`<span class="label">Welke formule is goed?</span><br>${v[0]}`,a:v[1],opts:[v[1],...v[2].split('|')],w:v[3],code:1});
function ronde(id){const l=L.find(x=>x.id===id);quiz(shuffle(l.q).slice(0,8).map(mc),{titel:'Vragen · '+l.t,klaar:(g,n)=>{const f=g/n;if(f>(S.b[id]||0))S.b[id]=f;save();
 return `<p>${f>=7/8?'Gehaald! 🎉':'Doel: 7 van de 8 in één keer goed.'}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een keer</button>${terugKnop()}</div>`},na:()=>{$('#opn').onclick=()=>ronde(id);$('#hm').onclick=goHome}})}
function spel(k){const qs=k==='uit'?Array.from({length:10},watKomtEruit):shuffle(WELKE).slice(0,10).map(welkeVraag);
 quiz(qs,{titel:SPEL[k].t,klaar:(g,n)=>{const f=g/n;if(f>(S.sp[k]||0))S.sp[k]=f;save();return `<p>${f>=.8?'Gehaald! 🎉':'Doel: 8 van de 10 in één keer goed.'}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een keer</button>${terugKnop()}</div>`},
  na:()=>{$('#opn').onclick=()=>spel(k);$('#hm').onclick=goHome}})}
function toets(){const qs=shuffle([...shuffle(L.flatMap(l=>l.q)).slice(0,10).map(mc),...Array.from({length:4},watKomtEruit),...shuffle(WELKE).slice(0,2).map(welkeVraag)]);
 quiz(qs,{titel:'Proeftoets',geenHer:1,klaar:(g,n)=>{const c=Math.round((1+9*g/n)*10)/10;if(c>S.toets)S.toets=c;save();
  return `<p>Cijfer: <b style="font-size:22px">${String(c).replace('.',',')}</b>${c>=7?' 🎉':''}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een proeftoets</button>${terugKnop()}</div>`},na:()=>{$('#opn').onclick=toets;$('#hm').onclick=goHome}})}

/* ---------- spiekbrief ---------- */
function samen(){S.samen=1;save();show('play');
 const FS=[['=SOM(A2:A9)','optellen'],['=GEMIDDELDE(A2:A9)','gemiddelde'],['=MEDIAAN(A2:A9)','mediaan'],['=MODUS(A2:A9)','modus'],['=MIN(…) / =MAX(…)','kleinste / grootste'],['=AANTAL(A2:A9)','hoeveel getallen'],['=AANTAL.ALS(A2:A9;">=5,5")','hoeveel voldoen'],['=SOMPRODUCT(A2:A7;B2:B7)','waarde × frequentie opgeteld'],['=KWARTIEL(A2:A9;1)','Q1 (3 = Q3)'],['=STDEV.P(A2:A9)','standaardafwijking (σ)'],['=B2/$B$9*100','procent van een vast totaal']];
 P.innerHTML=`<div class="top"><button class="btn licht klein" id="terug">‹ Terug</button><span class="stap">Spiekbrief</span></div>
 <div class="kaart"><h2 style="margin-top:0">Alle functies</h2><table class="gt">${FS.map(f=>`<tr><td><code class="f">${esc(f[0])}</code></td><td>${f[1]}</td></tr>`).join('')}</table><p class="sub">Formule begint met = · bereik met : · losse delen met ; · vastzetten met $ · keer * · delen /</p></div>
 ${L.map((l,i)=>`<h2>${l.ic} Les ${i+1}: ${l.t}</h2>${l.lp.map(c=>`<div class="kaart"><h3>${c[0]}</h3>${c[1]}</div>`).join('')}`).join('')}
 <div class="acts"><button class="btn licht" id="terug2">‹ Terug</button></div>`;$('#terug').onclick=goHome;$('#terug2').onclick=goHome}

renderHome();
</script>
