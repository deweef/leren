  <h1>Maatschappijleer · Introductie</h1>
  <p class="sub">Wat krijg je bij maatschappijleer? Per thema een korte podcast met Eva en Daan, uitleg en een paar vragen, en het spel ‘Eens of oneens?’. Geen toets: gewoon kennismaken.</p>

<script>
/* ---------- Introductie tot maatschappijleer: vijf delen met hun leerpad ----------
   lp: [titel, html, [vraag, goed, 'fout|fout|fout', uitleg]]; geen boek, in eigen woorden naar de vaste opbouw van het vak
   (rechtsstaat, parlementaire democratie, verzorgingsstaat, pluriforme samenleving). Neutraal: geen partijnamen, geen stemadvies.
   Een '📎 Voorbeeld' is een situatie uit het dagelijks leven om het te snappen. */
const VB=(t,h)=>`<div class="vb"><b>📎 Voorbeeld: ${t}</b><br>${h}</div>`;
const H=[
{id:'intro',t:'Wat is maatschappijleer?',kort:'Waar het vak over gaat, de vier thema’s en hoe je werkt',ic:'🧭',lp:[
 ['Waar gaat het vak over?',`<p><b>Maatschappijleer</b> gaat over hoe onze samenleving werkt, en hoe jij daarin <b>meedoet</b>.</p><ul><li>Wie maakt de regels, en waarom?</li><li>Wat zijn jouw rechten en plichten?</li><li>Hoe gaan we om met mensen die anders denken of leven?</li></ul><p>Het lijkt ver van je bed, maar het gaat over jouw leven: je bijbaantje (minimumloon, werktijden), je scooter (verkeersregels, boetes), je school (leerplicht) en straks je stem bij verkiezingen.</p>`,['Waar gaat maatschappijleer vooral over?','Hoe de samenleving werkt en hoe jij daarin meedoet','Hoe je een bedrijf start|De geschiedenis van de Romeinen|Hoe het lichaam werkt','Het vak gaat over samenleven, regels, politiek en meedoen. Een bedrijf starten hoort bij economie, de Romeinen bij geschiedenis en het lichaam bij biologie.']],
 ['De vier thema’s',`<p>Het vak heeft vier vaste thema’s. Die kom je steeds weer tegen:</p><table class="gt"><tr><th>thema</th><th>kort gezegd</th></tr><tr><td>⚖️ Rechtsstaat</td><td>regels, grondrechten, rechters, politie</td></tr><tr><td>🏛️ Parlementaire democratie</td><td>verkiezingen, Tweede Kamer, kabinet, gemeente</td></tr><tr><td>🤝 Verzorgingsstaat</td><td>uitkeringen, zorg, onderwijs, belasting</td></tr><tr><td>🌍 Pluriforme samenleving</td><td>cultuur, identiteit, migratie, samenleven</td></tr></table><p>💡 Ezelsbruggetje: <b>regels</b>, <b>macht</b>, <b>zorg</b> en <b>samenleven</b>.</p>`,['Bij welk thema hoort de vraag ‘Wie betaalt de AOW?’','Verzorgingsstaat','Rechtsstaat|Parlementaire democratie|Pluriforme samenleving','De AOW is een uitkering, en uitkeringen en zorg horen bij de verzorgingsstaat. Over de hoogte beslist wel de politiek, maar het onderwerp zelf is de verzorgingsstaat.']],
 ['Een probleem van alle kanten bekijken',`<p>Bij maatschappijleer bekijk je een <b>maatschappelijk probleem</b> vanuit verschillende kanten. Daar is een vast stappenplan voor, de <b>politiek-probleembenadering</b>:</p><ol><li><b>Wat</b> is het probleem?</li><li><b>Waarom</b> is het een maatschappelijk (politiek) probleem? Het raakt veel mensen en men vindt dat de overheid iets moet doen.</li><li>Wat zijn de <b>oorzaken</b>?</li><li>Welke <b>oplossingen</b> zijn er, en wie wil welke (welke belangen en waarden)?</li><li>Hoe verloopt de <b>besluitvorming</b>: wie beslist?</li><li>Hoe pakt het besluit uit in de <b>praktijk</b>?</li></ol>${VB('vuurwerk','Probleem: gewonden en schade. Oorzaak: zwaar en illegaal vuurwerk. Oplossingen: een verbod, of alleen strengere regels. Hulpverleners en dierenorganisaties willen vaak een verbod, liefhebbers en verkopers niet. Gemeente en kabinet beslissen.')}`,['Welke stap komt in de politiek-probleembenadering vóór ‘welke oplossingen zijn er?’','Wat zijn de oorzaken?','Hoe pakt het besluit uit in de praktijk?|Hoe verloopt de besluitvorming?|Wie wint de verkiezingen?','Je zoekt eerst de oorzaken, want een oplossing moet bij de oorzaak passen. Besluitvorming en praktijk komen pas daarna, en verkiezingen zijn geen stap.']],
 ['Belangen en waarden',`<p>Waarom zijn mensen het zo vaak oneens? Door twee dingen:</p><ul><li><b>Belang</b>: wat levert het mij (of mijn groep) op, of wat kost het mij? Een vuurwerkverkoper verliest geld bij een verbod.</li><li><b>Waarde</b>: wat vind ik belangrijk? De een vindt <b>veiligheid</b> het belangrijkst, de ander <b>vrijheid</b> of <b>traditie</b>.</li></ul><p>💡 Snap je het zo? Belang = wat het je oplevert. Waarde = wat je belangrijk vindt, ook als het je niets oplevert.</p>`,['Een oma zonder huisdieren wil een vuurwerkverbod omdat ze ‘veiligheid voor iedereen’ belangrijk vindt. Waar baseert zij haar mening vooral op?','Een waarde','Een belang|Een wet|Een grondrecht','Ze heeft er zelf geen voordeel van, maar vindt veiligheid belangrijk: dat is een waarde. Een belang zou zijn dat zij er zelf iets mee wint of verliest.']],
 ['Waarom is het nuttig?',`<ul><li>Vanaf <b>18 jaar</b> mag je stemmen. Dan wil je snappen waar je over beslist.</li><li>Je begrijpt het <b>nieuws</b> beter: wat doet een minister, waarom valt een kabinet, wat is een coalitie?</li><li>Je kent je <b>rechten</b>: wat mag de politie, wat mag je werkgever, wat als je gediscrimineerd wordt?</li><li>Je leert <b>luisteren</b> naar mensen die anders denken.</li></ul><p>In de bovenbouw is maatschappijleer voor iedereen verplicht (meestal in klas 4) en sluit je het af met een schoolexamen. Wie er meer van wil, kan het profielvak <b>maatschappijwetenschappen</b> kiezen.</p>`,['Vanaf welke leeftijd mag je in Nederland stemmen voor de Tweede Kamer?','18 jaar','16 jaar|21 jaar|14 jaar','Je mag vanaf 18 jaar stemmen. Er is wel discussie over stemrecht vanaf 16, maar dat geldt (nog) niet.']],
 ['Hoe ziet een les eruit?',`<ul><li>📰 <b>Actualiteit</b>: je begint vaak met iets uit het nieuws.</li><li>🗣️ <b>Discussie</b>: in de klas wissel je meningen uit, met respect.</li><li>✍️ <b>Betoog</b>: je neemt een <b>standpunt</b> in en onderbouwt het met <b>argumenten</b>. Je noemt ook een tegenargument en weerlegt dat.</li><li>🔎 <b>Bronnen</b>: is dit een feit of een mening? Wie zegt het, en waarom?</li></ul><p>De leraar zegt niet wat je moet vinden of stemmen. Het gaat erom dat jij je mening goed kunt <b>onderbouwen</b>.</p>`,['Wat maakt een betoog sterk?','Een duidelijk standpunt met argumenten, en een tegenargument dat je weerlegt','Zo vaak mogelijk ‘ik vind’ zeggen|Alleen je eigen kant noemen|De mening van de leraar overnemen','Een sterk betoog onderbouwt en laat zien dat je de andere kant kent. Herhalen of overnemen is geen onderbouwing.']]
]},
{id:'rs',t:'Rechtsstaat',kort:'Grondwet, grondrechten, trias politica, rechtspraak en jeugdstrafrecht',ic:'⚖️',lp:[
 ['Wat is een rechtsstaat?',`<p>In een <b>rechtsstaat</b> moeten niet alleen burgers zich aan de wet houden, maar <b>ook de overheid</b>. De macht van de overheid is begrensd.</p><ul><li>De overheid mag alleen doen wat de wet toestaat.</li><li>Burgers hebben <b>grondrechten</b> die de overheid moet respecteren.</li><li>De macht is <b>verdeeld</b>, zodat niemand alles alleen beslist.</li><li>Er zijn <b>onafhankelijke rechters</b> bij wie je terechtkunt, ook tegen de overheid.</li></ul><p>Het tegenovergestelde is een dictatuur: daar staat de leider boven de wet.</p>`,['Welke situatie past níet bij een rechtsstaat?','Een minister laat een journalist oppakken omdat hij kritisch schrijft','Een burger daagt de gemeente voor de rechter|Een verdachte krijgt een advocaat|De politie heeft toestemming nodig om een huis te doorzoeken','Iemand oppakken om kritiek gaat in tegen de vrijheid van meningsuiting en tegen het idee dat de overheid zelf aan de wet gebonden is. De andere drie zijn juist kenmerken van een rechtsstaat.']],
 ['De Grondwet en grondrechten',`<p>De <b>Grondwet</b> is de belangrijkste wet van Nederland. Andere wetten mogen er niet mee in strijd zijn. Hij regelt hoe de staat is ingericht en bevat de <b>grondrechten</b>.</p><ul><li><b>Artikel 1</b>: gelijke behandeling in gelijke gevallen, en een verbod op discriminatie.</li><li>Vrijheid van <b>godsdienst</b>, van <b>meningsuiting</b>, van <b>onderwijs</b>.</li><li>Recht op <b>privacy</b>, vrijheid van <b>vereniging</b> en <b>betoging</b> (demonstreren).</li><li><b>Kiesrecht</b>.</li></ul><p>De Grondwet veranderen is extra lastig: daar is in de tweede ronde een <b>tweederdemeerderheid</b> voor nodig.</p>`,['Wat staat er in artikel 1 van de Grondwet?','Gelijke behandeling in gelijke gevallen en een verbod op discriminatie','De vrijheid van meningsuiting|Dat Amsterdam de hoofdstad is|Hoe de koning gekozen wordt','Artikel 1 is het gelijkheidsbeginsel. Meningsuiting staat in een ander artikel, en de koning wordt niet gekozen.']],
 ['Klassiek of sociaal?',`<p>Er zijn twee soorten grondrechten:</p><table class="gt"><tr><th>klassieke grondrechten</th><th>sociale grondrechten</th></tr><tr><td>beschermen je <b>tegen</b> de overheid</td><td>de overheid moet <b>zorgen voor</b> iets</td></tr><tr><td>de overheid moet zich er <b>buiten houden</b></td><td>de overheid moet <b>iets doen</b></td></tr><tr><td>vrijheid van meningsuiting, godsdienst, privacy, demonstreren</td><td>werkgelegenheid, bestaanszekerheid, volksgezondheid, onderwijs, huisvesting</td></tr></table><p>💡 Snap je het zo? Klassiek = <b>handen af</b>. Sociaal = <b>handen uit de mouwen</b>.</p><p>Sociale grondrechten kun je meestal niet bij de rechter afdwingen: de overheid moet haar best doen, maar je kunt niet eisen dat ze je morgen een baan geeft.</p>`,['Welk grondrecht is een <b>sociaal</b> grondrecht?','De overheid zorgt voor voldoende werkgelegenheid','Vrijheid van meningsuiting|Het recht om te demonstreren|Het recht op privacy','Bij werkgelegenheid moet de overheid iets doen: sociaal grondrecht. De andere drie zijn klassiek: de overheid moet je daarbij met rust laten.']],
 ['Trias politica: de macht in drieën',`<p>De Franse denker <b>Montesquieu</b> bedacht in de 18e eeuw: verdeel de macht over drie delen, zodat ze elkaar in evenwicht houden. Dat heet de <b>trias politica</b>.</p><table class="gt"><tr><th>macht</th><th>taak</th><th>in Nederland</th></tr><tr><td>wetgevende</td><td>wetten maken</td><td>regering + Staten-Generaal (Tweede en Eerste Kamer)</td></tr><tr><td>uitvoerende</td><td>wetten uitvoeren, besturen</td><td>regering (koning + ministers)</td></tr><tr><td>rechterlijke</td><td>rechtspreken</td><td>onafhankelijke rechters</td></tr></table><p>In Nederland is de scheiding niet helemaal strikt: de regering doet mee aan wetgeven én voert uit. Daarom spreken we ook wel van <b>machtenspreiding</b>.</p>`,['Waarom is het slim om de macht in drieën te verdelen?','Zodat niemand alle macht heeft en de machten elkaar controleren','Omdat het werk dan sneller gaat|Omdat er drie partijen in de Kamer zitten|Zodat de koning meer macht krijgt','Het gaat om evenwicht en controle, niet om snelheid. Het heeft niets te maken met het aantal partijen, en de koning krijgt er juist minder macht door.']],
 ['Van verdachte tot vonnis',`<p>Bij een <b>strafzaak</b> (iemand heeft mogelijk een strafbaar feit gepleegd) werken drie partijen samen:</p><ol><li><b>Politie</b>: opsporing. Bewijs verzamelen, verdachten aanhouden en verhoren.</li><li><b>Openbaar Ministerie</b> (de officier van justitie): beslist of iemand vervolgd wordt en eist een straf.</li><li><b>Rechter</b>: beslist of de verdachte schuldig is en welke straf hij krijgt.</li></ol><p>Belangrijke regels: je bent <b>onschuldig tot het tegendeel bewezen is</b>, je hebt recht op een <b>advocaat</b> en je hoeft niet mee te werken aan je eigen veroordeling (zwijgrecht).</p><p>Naast het strafrecht is er het <b>privaatrecht</b> (burgerlijk recht): ruzies tussen burgers of bedrijven, zoals een kapotte telefoon die de winkel niet wil vervangen.</p>`,['Wie beslist uiteindelijk of een verdachte schuldig is?','De rechter','De politie|De officier van justitie|Het slachtoffer','De politie spoort op en de officier van justitie vervolgt en eist een straf, maar alleen de rechter beslist over schuld en straf.']],
 ['Jeugdstrafrecht en Halt',`<ul><li>Onder de <b>12 jaar</b> kun je niet vervolgd worden.</li><li>Van <b>12 tot 18 jaar</b> geldt het <b>jeugdstrafrecht</b> (voor jongvolwassenen tot 23 soms ook).</li><li>Doel: vooral <b>opvoeden en leren</b>, niet alleen straffen. Straffen zijn lichter, zoals een <b>taakstraf</b> (werken of een leertraject) of <b>jeugddetentie</b>.</li><li>Bij lichte vergrijpen (vandalisme, vuurwerk, winkeldiefstal, spijbelen) krijg je vaak een <b>Halt-straf</b>. Maak je die goed af, dan krijg je geen strafblad.</li></ul>${VB('de scooterboete','Te hard rijden met je scooter is een verkeersovertreding. Daarvoor krijg je een boete thuisgestuurd, ook als je 16 bent. Rijd je veel te hard of zonder rijbewijs, dan kan het een strafzaak worden.')}`,['Een jongen van 14 gooit een ruit in bij de bushalte. Wat is een waarschijnlijke straf?','Een Halt-straf, bijvoorbeeld de schade herstellen en excuses aanbieden','Een gevangenisstraf van vijf jaar|Niets, want hij is te jong|Een boete voor de school','Hij is 12 of ouder, dus wel strafbaar. Bij zo’n licht vergrijp past een Halt-straf. Vijf jaar cel is veel te zwaar en de school is niet verantwoordelijk.']]
]},
{id:'pd',t:'Parlementaire democratie',kort:'Verkiezingen, Kamers, kabinet, partijen, gemeente en zelf invloed uitoefenen',ic:'🏛️',lp:[
 ['Wat is een parlementaire democratie?',`<p><b>Democratie</b> = het volk regeert. Niet rechtstreeks: we kiezen <b>vertegenwoordigers</b> die namens ons beslissen. Dat heet een <b>representatieve</b> (vertegenwoordigende) democratie.</p><p><b>Parlementair</b> betekent: het <b>parlement</b> (de Staten-Generaal: Tweede en Eerste Kamer) controleert de regering. Een minister die het vertrouwen van de Kamer kwijt is, moet weg.</p><p>Nederland is ook een <b>constitutionele monarchie</b>: er is een koning, maar zijn macht staat in de Grondwet en is heel beperkt. De <b>ministers</b> zijn verantwoordelijk, niet de koning (<b>ministeriële verantwoordelijkheid</b>).</p>`,['Wat betekent ‘parlementair’ in parlementaire democratie?','Het parlement controleert de regering en kan een minister wegsturen','De koning beslist alles|Burgers stemmen over elke wet zelf|Er is maar één partij','Parlementair verwijst naar de controle door het parlement. De koning heeft weinig macht, we stemmen niet over elke wet (dat zou directe democratie zijn), en er zijn veel partijen.']],
 ['Verkiezingen',`<ul><li>De <b>Tweede Kamer</b> wordt gekozen, normaal <b>elke vier jaar</b> (eerder als het kabinet valt).</li><li>Stemmen mag vanaf <b>18 jaar</b> en is een recht, geen plicht.</li><li>Je stemt op een <b>persoon</b> op de lijst van een <b>partij</b>. Bovenaan staat de <b>lijsttrekker</b>.</li><li>We hebben <b>evenredige vertegenwoordiging</b>: een partij krijgt zetels naar verhouding van de stemmen. Ongeveer 1/150 van de stemmen = 1 zetel.</li></ul><p>Daardoor komen er veel partijen in de Kamer, ook kleine. We kiezen ook de <b>gemeenteraad</b>, de <b>Provinciale Staten</b>, de <b>waterschappen</b> en het <b>Europees Parlement</b>.</p>`,['Een partij krijgt 10% van alle stemmen. Ongeveer hoeveel zetels in de Tweede Kamer is dat?','15','10|75|1','10% van 150 zetels = 15 zetels. Zetels gaan naar verhouding van de stemmen (evenredige vertegenwoordiging).']],
 ['Tweede en Eerste Kamer',`<table class="gt"><tr><th></th><th>Tweede Kamer</th><th>Eerste Kamer</th></tr><tr><td>leden</td><td>150</td><td>75</td></tr><tr><td>gekozen door</td><td>de kiezers</td><td>de Provinciale Staten</td></tr><tr><td>wetten</td><td>kan wetten veranderen (amendement) en zelf voorstellen</td><td>alleen ja of nee</td></tr></table><p>Rechten van de Tweede Kamer, onder meer:</p><ul><li><b>motie</b>: een verzoek of mening aan de regering (een <b>motie van wantrouwen</b> kan een minister wegsturen);</li><li><b>amendement</b>: een wetsvoorstel veranderen;</li><li><b>vragen stellen</b> aan ministers, bijvoorbeeld in het vragenuur;</li><li><b>budgetrecht</b>: de Kamer moet de begroting goedkeuren;</li><li><b>enquête</b>: een groot onderzoek met verhoren onder ede.</li></ul>`,['Wat kan de Eerste Kamer níet?','Een wetsvoorstel veranderen','Een wetsvoorstel aannemen|Een wetsvoorstel verwerpen|Wetten controleren','De Eerste Kamer kan alleen ja of nee zeggen. Veranderen (amenderen) kan alleen de Tweede Kamer.']],
 ['Formatie, coalitie en kabinet',`<ol><li>Na de verkiezingen zoeken partijen een <b>meerderheid</b>: minstens <b>76</b> van de 150 zetels.</li><li>Die partijen vormen een <b>coalitie</b> en schrijven een <b>coalitieakkoord</b> (de plannen). Dit heet de <b>formatie</b>; een <b>informateur</b> en <b>formateur</b> leiden die.</li><li>Het <b>kabinet</b> = de ministers en staatssecretarissen, onder leiding van de <b>minister-president</b>.</li></ol><p>De partijen die niet meeregeren vormen de <b>oppositie</b>: zij controleren extra kritisch en laten andere ideeën horen.</p><p>Op <b>Prinsjesdag</b> (derde dinsdag van september) leest de koning de <b>troonrede</b> voor: de plannen van het kabinet voor het komende jaar.</p>`,['Hoeveel zetels heeft een coalitie minimaal nodig voor een meerderheid in de Tweede Kamer?','76','75|100|50','Meer dan de helft van 150 is 76. Met 75 heb je precies de helft, en dat is geen meerderheid.']],
 ['Links, rechts, progressief, conservatief',`<p>Partijen kun je ruwweg indelen. Het zijn windrichtingen, geen vaste hokjes:</p><table class="gt"><tr><th>links</th><th>rechts</th></tr><tr><td>meer gelijkheid tussen arm en rijk; de overheid doet meer; sterkste schouders, zwaarste lasten</td><td>meer vrije markt; lagere belastingen; eigen verantwoordelijkheid; de overheid doet minder</td></tr></table><table class="gt"><tr><th>progressief</th><th>conservatief</th></tr><tr><td>open voor verandering en vernieuwing</td><td>bestaande tradities en waarden bewaren</td></tr></table><p>Een partij kan op beide lijnen ergens anders staan (bijvoorbeeld economisch rechts en progressief). Daarom gebruikt men ook wel een assenstelsel in plaats van één lijn. Partijen in het <b>midden</b> zoeken vaak een compromis.</p>`,['Welk standpunt past het best bij <b>conservatief</b>?','Bestaande tradities moeten we zoveel mogelijk bewaren','De belasting voor rijken moet omhoog|Alles moet zo snel mogelijk veranderen|De overheid moet meer uitkeringen geven','Conservatief = bewaren wat er is. Belasting voor rijken en meer uitkeringen gaan over de links-rechtsas, en snel veranderen is juist progressief.']],
 ['Gemeente en provincie',`<table class="gt"><tr><th></th><th>gemeente</th><th>provincie</th></tr><tr><td>gekozen</td><td>gemeenteraad</td><td>Provinciale Staten</td></tr><tr><td>dagelijks bestuur</td><td>burgemeester en wethouders (het college)</td><td>Gedeputeerde Staten</td></tr><tr><td>voorzitter (benoemd)</td><td>burgemeester</td><td>commissaris van de Koning</td></tr><tr><td>gaat over</td><td>speeltuinen, afval, bijstand, jeugdzorg, paspoort</td><td>natuur, provinciale wegen, streekvervoer</td></tr></table><p>De burgemeester wordt dus niet gekozen, maar <b>benoemd</b> door de regering (de Kroon), na een voordracht van de gemeenteraad.</p>`,['Wie beslist over het sluiten van een skatebaan in jouw dorp?','De gemeente','De provincie|De Tweede Kamer|De Europese Unie','Een skatebaan is een plaatselijke voorziening, dus de gemeenteraad en het college beslissen. Provincie, Kamer en Europese Unie gaan over grotere zaken.']],
 ['Zelf invloed uitoefenen',`<p>Stemmen is niet de enige manier om invloed te hebben. Ook als je nog geen 18 bent, kun je:</p><ul><li>✍️ een <b>petitie</b> starten of tekenen;</li><li>🎤 <b>inspreken</b> bij de gemeenteraad;</li><li>📣 <b>demonstreren</b> (grondrecht; je meldt het vooraf bij de gemeente);</li><li>📺 de <b>media</b> en social media gebruiken;</li><li>🤝 lid worden van een <b>actiegroep</b>, jongerenraad of politieke jongerenorganisatie.</li></ul><p><b>Lobbyen</b> = politici proberen te overtuigen met informatie en gesprekken. Bedrijven, vakbonden, boeren en milieuorganisaties doen dat allemaal. Zulke groepen heten <b>belangengroepen</b> of <b>pressiegroepen</b>.</p>`,['Een milieuorganisatie praat met Kamerleden om ze te overtuigen van strengere regels. Hoe heet dat?','Lobbyen','Demonstreren|Stemmen|Een enquête houden','Lobbyen is het overtuigen van politici met gesprekken en informatie. Demonstreren is op straat, stemmen doe je bij verkiezingen, en een enquête is een onderzoek van de Kamer.']]
]},
{id:'vs',t:'Verzorgingsstaat',kort:'Sociale zekerheid, zorg, onderwijs, belasting en de discussie over de rol van de overheid',ic:'🤝',lp:[
 ['Wat is een verzorgingsstaat?',`<p>In een <b>verzorgingsstaat</b> zorgt de overheid ervoor dat iedereen een <b>bestaansminimum</b> heeft en toegang heeft tot <b>zorg, onderwijs en huisvesting</b>.</p><p>Vroeger waren mensen bij ziekte, werkloosheid of ouderdom afhankelijk van familie, de kerk of liefdadigheid. Na de <b>Tweede Wereldoorlog</b> bouwde Nederland de verzorgingsstaat uit, met onder meer de <b>AOW</b> (1957).</p><p>Het idee: <b>solidariteit</b>. Wie gezond is en werkt, betaalt mee voor wie ziek, oud of werkloos is. Morgen kun jij het zijn die hulp nodig heeft.</p>`,['Welk idee zit achter de verzorgingsstaat?','Solidariteit: wie het goed heeft, betaalt mee voor wie hulp nodig heeft','Iedereen zorgt alleen voor zichzelf|De kerk zorgt voor de armen|Alleen rijke mensen krijgen zorg','De verzorgingsstaat draait om solidariteit via de overheid. Alleen voor jezelf zorgen of de kerk laten zorgen was juist de situatie van vroeger.']],
 ['Sociale zekerheid',`<table class="gt"><tr><th>regeling</th><th>voor wie</th></tr><tr><td><b>AOW</b></td><td>basispensioen vanaf de AOW-leeftijd (nu 67)</td></tr><tr><td><b>WW</b></td><td>werkloosheidsuitkering als je je baan verliest (tijdelijk, deel van je loon)</td></tr><tr><td><b>WIA</b></td><td>als je door ziekte niet (volledig) kunt werken</td></tr><tr><td><b>bijstand</b></td><td>het laatste vangnet als je geen inkomen en weinig geld hebt; de <b>gemeente</b> regelt het</td></tr></table><p>Daarnaast zijn er <b>toeslagen</b> (zorgtoeslag, huurtoeslag, kinderopvangtoeslag) en de <b>kinderbijslag</b> voor ouders.</p><p>💡 Bijstand is een <b>vangnet</b>: je krijgt het pas als er geen andere uitkering of eigen geld is.</p>`,['De vader van een vriendin wordt ontslagen omdat het bedrijf failliet gaat. Welke uitkering krijgt hij waarschijnlijk eerst?','WW','AOW|bijstand|kinderbijslag','Bij baanverlies krijg je eerst de WW. De AOW is voor ouderen, bijstand pas als de WW op is en er geen geld meer is, en kinderbijslag hangt niet van je baan af.']],
 ['Zorg',`<ul><li>Vanaf <b>18 jaar</b> moet iedereen een <b>basisverzekering</b> hebben. Onder de 18 ben je gratis meeverzekerd bij je ouders.</li><li>Je betaalt elke maand <b>premie</b> aan een zorgverzekeraar. Wie weinig verdient, krijgt <b>zorgtoeslag</b>.</li><li>Het <b>eigen risico</b>: een bedrag van een paar honderd euro per jaar dat je eerst zelf betaalt (niet voor de huisarts, en niet voor jongeren onder 18).</li><li>Langdurige zorg (zoals een verpleeghuis) wordt grotendeels uit belastinggeld en premies betaald.</li></ul>${VB('je 18e verjaardag','Op je 18e komt er een brief: je moet binnen vier maanden zelf een zorgverzekering afsluiten. Veel jongeren vragen dan meteen zorgtoeslag aan.')}`,['Vanaf wanneer moet je zelf een zorgverzekering hebben?','Vanaf 18 jaar','Vanaf 16 jaar|Vanaf je eerste bijbaantje|Vanaf 21 jaar','De verzekeringsplicht geldt vanaf 18. Tot dan ben je gratis meeverzekerd bij je ouders, ook als je een bijbaantje hebt.']],
 ['Onderwijs en werk',`<ul><li><b>Leerplicht</b>: van 5 tot en met het schooljaar waarin je 16 wordt.</li><li><b>Kwalificatieplicht</b>: tot je 18e moet je naar school tot je een <b>startkwalificatie</b> hebt (diploma havo, vwo of minstens mbo 2).</li><li>De overheid betaalt het grootste deel van je school. Ouders betalen hooguit een vrijwillige ouderbijdrage.</li><li>Studenten kunnen <b>studiefinanciering</b> krijgen.</li></ul><p><b>Werk</b>: vanaf 13 mag je licht werk doen (zoals kranten bezorgen), met strenge regels over werktijden. Er is een <b>minimumloon</b>; onder de 21 geldt een lager <b>jeugdloon</b>.</p>`,['Hoe heet het minimumloon voor jongeren onder de 21?','Jeugdloon','Bijstand|Kinderbijslag|Zakgeld','Onder de 21 geldt een lager wettelijk minimum: het jeugdloon. Bijstand en kinderbijslag zijn uitkeringen, en zakgeld komt van je ouders.']],
 ['Belasting betalen',`<p>De verzorgingsstaat kost veel geld. Dat komt vooral uit <b>belastingen en premies</b>.</p><ul><li><b>Inkomstenbelasting</b> (loonbelasting): over wat je verdient. Het is <b>progressief</b>: wie meer verdient, betaalt over het hogere deel een hoger percentage.</li><li><b>Btw</b>: over wat je koopt: 21%, of 9% op onder meer eten en boeken.</li><li><b>Accijns</b>: extra belasting op onder meer benzine, alcohol en tabak.</li></ul><p>Belasting heeft ook een <b>sturende</b> functie: hoge accijns op sigaretten moet roken ontmoedigen.</p>`,['Eva koopt een zak chips. Welke belasting betaalt ze daarbij?','Btw','Inkomstenbelasting|Accijns|Geen, want ze is 15','Over producten betaal je btw, ook als je jong bent. Inkomstenbelasting gaat over je loon, en accijns zit op dingen als benzine, alcohol en tabak.']],
 ['Hoeveel moet de overheid doen?',`<p>Dé vraag bij de verzorgingsstaat: <b>hoeveel moet de overheid voor ons regelen?</b></p><table class="gt"><tr><th>meer overheid</th><th>minder overheid</th></tr><tr><td>Iedereen verdient zekerheid. Pech (ziekte, ontslag) kan iedereen overkomen. De sterkste schouders dragen de zwaarste lasten.</td><td>Mensen kunnen veel zelf. Lagere belastingen geven meer vrijheid. Te veel uitkeringen kunnen het minder aantrekkelijk maken om te werken.</td></tr></table><p>Ook zijn er <b>problemen</b>: de <b>vergrijzing</b> (meer ouderen, minder werkenden) maakt AOW en zorg duurder. Daarom gaat de AOW-leeftijd omhoog. Sinds ongeveer 2013 spreekt men ook van een <b>participatiesamenleving</b>: burgers moeten zelf meer doen, bijvoorbeeld voor familie en buren.</p><p>Wie gelijk heeft, hangt af van wat je belangrijker vindt. Daar gaan verkiezingen vaak over.</p>`,['Wat bedoelt men met vergrijzing?','Er komen meer ouderen en verhoudingsgewijs minder werkenden','Mensen krijgen sneller grijs haar|Er komen meer jongeren|De belasting gaat omlaag','Vergrijzing = de bevolking wordt gemiddeld ouder. Daardoor betalen minder werkenden voor meer ouderen, en dat maakt AOW en zorg duurder.']]
]},
{id:'ps',t:'Pluriforme samenleving',kort:'Cultuur, waarden en normen, socialisatie, identiteit, migratie en samenleven',ic:'🌍',lp:[
 ['Cultuur',`<p>Bij maatschappijleer betekent <b>cultuur</b>: alles wat mensen in een groep van elkaar <b>aanleren</b> en delen. Taal, gewoontes, kleding, eten, feesten, waarden en normen.</p><p>Cultuur is dus niet aangeboren, maar <b>aangeleerd</b>. En cultuur verandert: denk aan hoe we nu appen in plaats van bellen.</p><p>Een <b>pluriforme</b> (veelvormige) samenleving bestaat uit veel groepen met verschillende culturen, geloven en leefstijlen. Binnen een land kunnen ook <b>subculturen</b> bestaan: groepen met eigen gewoontes, zoals gamers, boeren of skaters.</p>`,['Welke uitspraak over cultuur klopt?','Cultuur is aangeleerd en kan veranderen','Cultuur is aangeboren|Cultuur gaat alleen over kunst en musea|Iedereen in Nederland heeft precies dezelfde cultuur','Cultuur leer je van je omgeving en verandert met de tijd. Kunst is maar één deel ervan, en in een pluriforme samenleving verschillen culturen juist.']],
 ['Waarden en normen',`<table class="gt"><tr><th>waarde</th><th>norm die erbij hoort</th></tr><tr><td>respect</td><td>niet door iemand heen praten</td></tr><tr><td>eerlijkheid</td><td>niet spieken bij een toets</td></tr><tr><td>gezondheid</td><td>niet roken op het schoolplein</td></tr><tr><td>vrijheid</td><td>iedereen mag zijn eigen kleding kiezen</td></tr></table><p><b>Waarde</b> = iets wat je belangrijk vindt (een idee). <b>Norm</b> = een regel voor gedrag die daarbij hoort.</p><p>Sommige normen zijn vastgelegd in de <b>wet</b> (niet stelen). Andere zijn ongeschreven (je bedankt de buschauffeur). Breek je een norm, dan volgt vaak een <b>sanctie</b>: een boete, of gewoon een boze blik.</p>`,['Welke is een <b>norm</b>?','Je stapt op voor een oudere in de bus','Behulpzaamheid|Respect|Vrijheid','Opstaan voor een oudere is een gedragsregel: een norm. Behulpzaamheid, respect en vrijheid zijn waarden, de ideeën erachter.']],
 ['Socialisatie en identiteit',`<p><b>Socialisatie</b> = het proces waarin je de cultuur van je omgeving aanleert. Wie je daarbij beïnvloeden heten <b>socialisatoren</b>:</p><ul><li><b>gezin</b>: daar begint het (primaire socialisatie);</li><li><b>school</b>, <b>vrienden</b> (de peergroup), <b>sportclub</b>, <b>geloof</b>;</li><li><b>media en social media</b>.</li></ul><p>Zo ontstaat je <b>identiteit</b>: hoe je jezelf ziet en hoe anderen jou zien. Iedereen heeft <b>meerdere identiteiten</b> tegelijk: dochter, gymnasiast, hockeyer, Brabander, gamer. Daardoor heb je met heel verschillende mensen iets gemeen.</p>`,['Wat bedoelen we met ‘de peergroup’?','Leeftijdgenoten met wie je omgaat, zoals vrienden','Je ouders|De leraren|De politie','De peergroup zijn mensen van ongeveer je eigen leeftijd. Ze hebben veel invloed in je tienerjaren. Ouders, leraren en politie zijn andere socialisatoren of hebben er weinig mee te maken.']],
 ['Van verzuiling naar pluriform',`<p>Tot ongeveer de jaren zestig was Nederland <b>verzuild</b>. Elke groep had zijn eigen ‘zuil’:</p><ul><li>katholieken, protestanten, socialisten en liberalen;</li><li>elk met een eigen school, krant, omroep, vakbond, partij en zelfs sportclub.</li></ul><p>De top van de zuilen werkte samen in de politiek, maar gewone mensen kwamen elkaar weinig tegen. Vanaf de jaren zestig verdween de verzuiling (<b>ontzuiling</b>): mensen werden <b>individualistischer</b> en minder kerkelijk.</p><p>💡 Je ziet het nog terug: in Nederland zijn er bijzondere scholen (katholiek, protestants, islamitisch) en omroepen met een eigen achtergrond.</p>`,['Wat was een kenmerk van de verzuiling?','Elke levensbeschouwelijke groep had eigen scholen, kranten en clubs','Iedereen ging naar dezelfde school|Er waren geen politieke partijen|Nederland had geen kerken','In de verzuiling leefden groepen naast elkaar, met eigen instellingen. Er waren juist veel partijen en kerken, en iedereen had zijn eigen school.']],
 ['Migratie',`<table class="gt"><tr><th>periode</th><th>wie kwamen er?</th></tr><tr><td>na 1945</td><td>mensen uit het voormalige <b>Nederlands-Indië</b> (Indonesië), later uit <b>Suriname</b> en de <b>Antillen</b> (koloniaal verleden)</td></tr><tr><td>jaren 60-70</td><td><b>arbeidsmigranten</b> uit onder meer Italië, Spanje, Turkije en Marokko; later volgde <b>gezinshereniging</b></td></tr><tr><td>vanaf jaren 90</td><td><b>vluchtelingen</b> (asielzoekers) uit oorlogsgebieden</td></tr><tr><td>vanaf 2004</td><td>werknemers uit nieuwe <b>EU-landen</b>, zoals Polen; ook kennismigranten en studenten</td></tr></table><p>Ongeveer een <b>kwart</b> van de mensen in Nederland heeft een migratieachtergrond (zelf in het buitenland geboren of minstens één ouder). Mensen <b>emigreren</b> ook uit Nederland, bijvoorbeeld naar Canada of Australië.</p>`,['Waarom kwamen er in de jaren zestig veel Turkse en Marokkaanse arbeidsmigranten naar Nederland?','Er was een tekort aan arbeidskrachten in de fabrieken','Ze vluchtten voor een oorlog|Het waren voormalige koloniën van Nederland|Ze kwamen hier studeren','Er was werk, dus bedrijven haalden mensen hierheen. Turkije en Marokko waren geen Nederlandse koloniën (dat waren onder meer Indonesië en Suriname), en het ging niet om vluchten of studeren.']],
 ['Vooroordelen en discriminatie',`<ul><li><b>Stereotype</b>: een vereenvoudigd beeld van een hele groep (‘alle Nederlanders zijn gierig’).</li><li><b>Vooroordeel</b>: een (vaak negatieve) mening over iemand zonder dat je diegene kent, vaak gebaseerd op een stereotype.</li><li><b>Discriminatie</b>: iemand echt <b>anders behandelen</b> vanwege bijvoorbeeld afkomst, geloof, geslacht of seksuele voorkeur. Verboden volgens artikel 1 van de Grondwet.</li></ul><p>💡 Snap je het zo? Stereotype en vooroordeel zitten <b>in je hoofd</b>. Discriminatie is wat je <b>doet</b>.</p>${VB('de bijbaan','Twee meiden met dezelfde cijfers en ervaring solliciteren bij een café. Eén wordt niet uitgenodigd vanwege haar achternaam. Dat is discriminatie, en daar kun je een melding van maken bij een antidiscriminatievoorziening of het College voor de Rechten van de Mens.')}`,['Een winkelbediende loopt een meisje met een hoofddoek achterna, alleen omdat hij denkt dat ‘zulke meisjes stelen’. Wat is hier aan de hand?','Discriminatie op basis van een vooroordeel','Socialisatie|Sociale cohesie|Een gewone norm','Hij heeft een vooroordeel (in zijn hoofd) en behandelt haar daardoor anders (discriminatie). Socialisatie en cohesie gaan over iets anders, en dit is geen acceptabele norm.']],
 ['Samenleven: sociale cohesie',`<p><b>Sociale cohesie</b> = hoe sterk mensen in een samenleving zich met elkaar <b>verbonden</b> voelen. Veel cohesie: mensen vertrouwen elkaar en helpen elkaar.</p><p>Hoe ga je om met verschillen? Daar zijn verschillende ideeën over:</p><ul><li><b>Assimilatie</b>: nieuwkomers nemen de cultuur van het nieuwe land helemaal over.</li><li><b>Integratie</b>: nieuwkomers doen volwaardig mee (taal, werk, school) en mogen een deel van hun eigen cultuur houden.</li><li><b>Multiculturele samenleving</b>: groepen behouden hun eigen cultuur naast elkaar.</li></ul><p>Wat helpt: <b>ontmoeting</b> (school, sport, buurt), de taal spreken, en gedeelde regels zoals de Grondwet. Hoeveel migratie Nederland wil en wat je van nieuwkomers mag verwachten, is een echte politieke discussie.</p>`,['Een nieuwkomer leert Nederlands en werkt, maar viert ook zijn eigen feesten. Welk begrip past daarbij?','Integratie','Assimilatie|Verzuiling|Discriminatie','Meedoen én een deel van je eigen cultuur houden is integratie. Bij assimilatie neem je de nieuwe cultuur helemaal over. Verzuiling en discriminatie gaan over iets anders.']]
]}
];

'intro':[
{t:'Wat is maatschappijleer eigenlijk?',s:[
['E','Daan, volgend jaar krijgen we maatschappijleer. Ik heb geen idee wat dat is.'],
['D','Ik ook maar half. Mijn broer zegt: het gaat over hoe Nederland in elkaar zit, en hoe jij daarin meedoet.'],
['E','Meedoen? Ik ben vijftien. Ik doe toch nog nergens aan mee?'],
['D','Meer dan je denkt. Jij hebt een bijbaantje bij de supermarkt, toch? Dan gelden er regels over hoe lang je mag werken en wat je minimaal verdient.'],
['E','Ja, en ik betaal er zelfs belasting over, zag ik op mijn loonstrook.'],
['D','Zie je. En wie bedenkt die regels? Dat is de politiek. Daar gaat maatschappijleer over.'],
['E','Oké. Maar het is toch niet alleen politiek?'],
['D','Nee. Het vak heeft vier grote thema’s. Het eerste is de rechtsstaat: regels, rechten en rechters.'],
['E','Dus ook die scooterboete van mijn neef.'],
['D','Precies. Het tweede is de parlementaire democratie: verkiezingen, de Tweede Kamer, het kabinet, en de gemeente.'],
['E','En het derde?'],
['D','De verzorgingsstaat. Hoe de overheid zorgt voor mensen die ziek, oud of werkloos zijn. Denk aan pensioen en de zorgverzekering van je ouders.'],
['E','En nummer vier?'],
['D','De pluriforme samenleving. Pluriform betekent veelvormig: in Nederland wonen mensen met heel verschillende achtergronden, gewoontes en geloven.'],
['E','Dus hoe we samenleven met al die verschillen.'],
['D','Ja. Rechtsstaat, democratie, verzorgingsstaat en pluriforme samenleving. Die vier komen steeds terug.'],
['E','Klinkt eigenlijk best nuttig. Over drie jaar mag ik stemmen.'],
['D','Daarom bestaat het vak ook. Je leert snappen wat er in het nieuws gebeurt, zodat je zelf een mening kunt vormen.'],
['E','Een mening vormen, dus niet de mening van de leraar overnemen?'],
['D','Nee, juist niet. Een goede leraar maatschappijleer vertelt je niet op wie je moet stemmen. Je leert zelf nadenken.']
],q:[
['Welke vier thema’s heeft maatschappijleer?','Rechtsstaat, parlementaire democratie, verzorgingsstaat en pluriforme samenleving','Geschiedenis, aardrijkskunde, economie en recht|Politiek, sport, cultuur en religie|Grondwet, belasting, verkeer en school','Dit zijn de vier vaste thema’s van het vak. De andere rijtjes noemen losse onderwerpen of andere vakken: die komen hooguit als voorbeeld voorbij.'],
['Wat betekent ‘pluriform’?','Veelvormig: met veel verschillende groepen en gewoontes','Eenvormig: iedereen is hetzelfde|Met veel regels|Met veel politieke partijen','Pluri betekent veel, vorm is vorm. Een pluriforme samenleving heeft veel verschillende mensen en leefstijlen. Het gaat niet over regels of partijen.'],
['Waarom heeft het vak iets te maken met Eva’s bijbaantje?','Er gelden regels over werktijden, loon en belasting, en die maakt de politiek','Omdat de supermarkt van de overheid is|Omdat je voor een bijbaantje een examen moet doen|Het heeft er niets mee te maken','Regels over hoe lang je mag werken, het minimumloon en belasting worden door de politiek gemaakt. De supermarkt is gewoon een bedrijf, en een examen is niet nodig.'],
['Wat hoort een leraar maatschappijleer níet te doen?','Vertellen op welke partij je moet stemmen','Uitleggen hoe verkiezingen werken|Laten zien dat er verschillende meningen zijn|Je leren een mening te onderbouwen','Het vak is neutraal: je leert hoe het werkt en hoe je zelf nadenkt. Stemadvies geven past daar niet bij. De andere drie horen er juist wel bij.']
]},
{t:'Hoe werk je bij maatschappijleer?',s:[
['D','Eva, weet je hoe zo’n les eruitziet? Ik dacht eerst: veel stampen.'],
['E','En is dat zo?'],
['D','Valt mee. Je begint vaak met iets uit het nieuws. Een actualiteit, heet dat.'],
['E','Zoals het plan om vuurwerk helemaal te verbieden?'],
['D','Ja, perfect voorbeeld. Dan bekijk je zo’n probleem van verschillende kanten.'],
['E','Hoe dan?'],
['D','Daar heb je een vast stappenplan voor: de politiek probleembenadering. Eerst vraag je: wat is precies het probleem?'],
['E','Bij vuurwerk: gewonden, schade, en dieren die schrikken.'],
['D','Goed. Dan: waarom is het een maatschappelijk probleem? Het raakt veel mensen, en mensen vinden dat de overheid er iets aan moet doen.'],
['E','En dan zoek je de oorzaken?'],
['D','Ja. Daarna kijk je naar de oplossingen, en wie welke oplossing wil. Hulpverleners willen een verbod, sommige verkopers en liefhebbers juist niet.'],
['E','Dus iedereen heeft andere belangen.'],
['D','En andere waarden. De een vindt veiligheid het belangrijkst, de ander vrijheid en traditie.'],
['E','En wie beslist uiteindelijk?'],
['D','Dat is de volgende stap: de besluitvorming. Gemeente, kabinet of Tweede Kamer. En als laatste: werkt het besluit in de praktijk?'],
['E','Dat klinkt eigenlijk als een recept dat je bij elk onderwerp kunt gebruiken.'],
['D','Precies. Verder voer je veel discussies en schrijf je soms een betoog. Dan moet je jouw standpunt onderbouwen met argumenten.'],
['E','Niet alleen roepen: ik vind dit, punt.'],
['D','Nee, je zegt waarom, en je denkt ook na over wat de andere kant zou zeggen.'],
['E','Dat lijkt me eerlijk gezegd wel leuk. Lekker discussiëren.']
],q:[
['Wat is meestal de eerste stap van de politiek probleembenadering?','Vaststellen wat precies het probleem is','Kiezen welke oplossing het beste is|Stemmen in de klas|Een betoog schrijven','Je begint altijd met de vraag wat het probleem is. Oplossingen, besluiten en betogen komen pas later.'],
['Waarom willen mensen bij vuurwerk verschillende oplossingen?','Ze hebben verschillende belangen en vinden verschillende waarden belangrijk','Omdat niemand het probleem kent|Omdat de wet dat voorschrijft|Omdat er maar één goede oplossing is','Belangen (wat levert het mij op of kost het mij?) en waarden (wat vind ik belangrijk, zoals veiligheid of vrijheid) verschillen per groep. Daarom is er discussie.'],
['Wat is een actualiteit?','Iets wat nu in het nieuws is','Een oude wet|Een vaste regel van school|Een politieke partij','Actueel betekent: van nu. Lessen beginnen vaak met zo’n nieuwsonderwerp.'],
['Wat doe je in een goed betoog?','Je standpunt onderbouwen met argumenten en de tegenargumenten serieus nemen','Zo hard mogelijk je mening herhalen|Alleen feiten opsommen zonder mening|De mening van de leraar overnemen','Een betoog heeft een standpunt plus argumenten, en je laat zien dat je de andere kant kent. Alleen herhalen of overnemen is geen onderbouwing.']
]}
],
'rs':[
{t:'Regels, rechten en de Grondwet',s:[
['E','Daan, mijn neef kreeg gisteren een boete. Hij reed met zijn scooter veel te hard.'],
['D','Auw. Maar eerlijk is eerlijk: hij hield zich niet aan de regels.'],
['E','Hij zei: de politie mag ook niet zomaar alles.'],
['D','Daar heeft hij gelijk in. Dat is precies het idee van een rechtsstaat.'],
['E','Wat is dat precies?'],
['D','Een land waar niet alleen burgers zich aan de wet moeten houden, maar de overheid ook. De regering, de politie, iedereen.'],
['E','Dus de overheid kan niet zomaar iemand opsluiten.'],
['D','Nee. Alleen als de wet dat toestaat, en dan beslist uiteindelijk een rechter.'],
['E','Waar staan die regels dan?'],
['D','De belangrijkste staan in de Grondwet. Daarin staan onze grondrechten.'],
['E','Zoals vrijheid van meningsuiting.'],
['D','Ja. En vrijheid van godsdienst, het recht op privacy, en het verbod op discriminatie in artikel 1.'],
['E','Artikel 1 ken ik. Iedereen moet in gelijke gevallen gelijk behandeld worden.'],
['D','Goed! Die rechten noemen we klassieke grondrechten. Ze beschermen jou tegen de overheid. De overheid moet je met rust laten.'],
['E','Zijn er ook andere?'],
['D','Ja, sociale grondrechten. Daarbij moet de overheid juist iets doen. Zorgen voor onderwijs, voor goede gezondheidszorg, voor werk en bestaanszekerheid.'],
['E','Dus bij klassieke rechten blijft de overheid eraf, en bij sociale rechten moet ze juist helpen.'],
['D','Precies. Maar een grondrecht is niet onbeperkt. Vrijheid van meningsuiting betekent niet dat je mag bedreigen of beledigen.'],
['E','Snap ik. Mijn vrijheid houdt op waar die van een ander begint.'],
['D','Mooi gezegd. Dat zou zo in een maatschappijleerboek kunnen staan.']
],q:[
['Wat is het belangrijkste kenmerk van een rechtsstaat?','Ook de overheid moet zich aan de wet houden','De politie mag alles om criminelen te pakken|Er zijn geen boetes|Burgers maken zelf de wetten','In een rechtsstaat is de macht van de overheid beperkt door de wet. De politie mag dus niet alles, en boetes bestaan wel degelijk.'],
['Welk grondrecht is een klassiek grondrecht?','Vrijheid van godsdienst','Recht op onderwijs dat de overheid regelt|Zorg voor werkgelegenheid|Zorg voor de volksgezondheid','Bij een klassiek grondrecht moet de overheid je met rust laten, zoals bij je geloof. De andere drie zijn sociale grondrechten: daar moet de overheid juist iets voor doen.'],
['Wat staat er in artikel 1 van de Grondwet?','Gelijke behandeling in gelijke gevallen, en een verbod op discriminatie','Vrijheid van meningsuiting|Het recht om te stemmen|Dat de koning het land bestuurt','Artikel 1 is het gelijkheidsbeginsel met het discriminatieverbod. Meningsuiting staat in een ander artikel, en de koning bestuurt het land niet zelf.'],
['Mag je alles zeggen dankzij de vrijheid van meningsuiting?','Nee, bedreigen, opruien en discrimineren zijn bijvoorbeeld strafbaar','Ja, alles mag|Nee, je mag geen kritiek op de regering hebben|Alleen als je ouder bent dan 18','Grondrechten hebben grenzen. Kritiek op de regering mag juist wel, en de vrijheid geldt voor iedereen, niet alleen voor volwassenen.']
]},
{t:'Machten, rechters en jongeren',s:[
['E','Daan, wie maakt eigenlijk de wetten? En wie zorgt dat ze worden uitgevoerd?'],
['D','Dat is een slimme vraag. Een Franse denker, Montesquieu, zei al in de achttiende eeuw: verdeel de macht in drieën.'],
['E','De trias politica! Die naam heb ik weleens gehoord.'],
['D','Ja. Er is een wetgevende macht die wetten maakt, een uitvoerende macht die ze uitvoert, en een rechterlijke macht die oordeelt bij ruzie of misdaad.'],
['E','En waarom drie?'],
['D','Zodat niemand alle macht heeft. Ze houden elkaar in evenwicht.'],
['E','En wie is wie in Nederland?'],
['D','Wetten maken doen de regering en het parlement samen. Uitvoeren doet de regering met de ministeries. En de rechters zijn onafhankelijk.'],
['E','Oké. Stel nu dat een jongen uit mijn klas een fiets steelt. Wat gebeurt er dan?'],
['D','Eerst doet de politie onderzoek. Dat heet opsporing. Ze verhoort hem en verzamelt bewijs.'],
['E','En dan gaat hij meteen naar de rechter?'],
['D','Nee, eerst beslist het Openbaar Ministerie, met de officier van justitie, of hij vervolgd wordt.'],
['E','En tot de rechter iets beslist?'],
['D','Is hij onschuldig. Iemand is onschuldig tot het tegendeel bewezen is. Hij heeft ook recht op een advocaat.'],
['E','Maar hij is pas veertien. Krijgt hij dezelfde straf als een volwassene?'],
['D','Nee. Vanaf twaalf jaar kun je worden vervolgd, maar tot achttien geldt het jeugdstrafrecht. Daarin staat leren van je fout voorop.'],
['E','Wat voor straf dan?'],
['D','Bij kleine dingen, zoals vandalisme of vuurwerk afsteken op de verkeerde dag, krijg je vaak een Halt-straf. Bijvoorbeeld schade herstellen en excuses aanbieden.'],
['E','En dan heb je geen strafblad?'],
['D','Als je de Halt-straf goed afmaakt, niet. Een tweede kans dus. Maar bij ernstige dingen kan een jongere ook jeugddetentie krijgen.']
],q:[
['Wat bedoelde Montesquieu met de trias politica?','De macht verdelen over wetgevend, uitvoerend en rechtsprekend, zodat niemand alle macht heeft','Drie politieke partijen in het parlement|Drie keer per jaar verkiezingen|Een koning, een president en een paus','Trias politica betekent driedeling van de macht. Het gaat niet over partijen, verkiezingen of drie leiders.'],
['Wie beslist of een verdachte wordt vervolgd?','Het Openbaar Ministerie (de officier van justitie)','De politie|De burgemeester|Het slachtoffer','De politie spoort op, het Openbaar Ministerie besluit over vervolgen, de rechter oordeelt. Burgemeester en slachtoffer beslissen dat niet.'],
['Vanaf welke leeftijd kun je in Nederland strafrechtelijk worden vervolgd?','12 jaar','10 jaar|16 jaar|18 jaar','Vanaf 12 jaar kun je worden vervolgd, en tot 18 jaar geldt meestal het jeugdstrafrecht. 16 en 18 zijn dus te laat, 10 is te vroeg.'],
['Wat is een Halt-straf?','Een straf voor jongeren bij lichte vergrijpen, zoals schade herstellen of excuses aanbieden','Een gevangenisstraf voor jongeren|Een boete voor ouders|Een verbod om op straat te komen','Halt is bedoeld voor kleine vergrijpen en geeft een tweede kans. Het is geen celstraf, geen boete voor ouders en geen straatverbod.']
]}
],
'pd':[
{t:'Verkiezingen en de Tweede Kamer',s:[
['E','Daan, mijn ouders stonden gisteren in de rij bij het stembureau in onze school.'],
['D','Leuk. Dan waren er verkiezingen. Weet je waarvoor?'],
['E','Voor de Tweede Kamer, zeiden ze. Wat is dat eigenlijk?'],
['D','De Tweede Kamer is het belangrijkste deel van het parlement. Er zitten honderdvijftig Kamerleden in.'],
['E','En wat doen die?'],
['D','Twee dingen. Ze maken samen met de regering de wetten, en ze controleren de regering.'],
['E','Hoe kom je in de Kamer?'],
['D','Via een politieke partij. Elke partij heeft een kandidatenlijst. Bovenaan staat de lijsttrekker.'],
['E','En hoe vaak zijn er verkiezingen?'],
['D','Normaal elke vier jaar. Maar als een kabinet eerder valt, zijn er vaak eerder nieuwe verkiezingen.'],
['E','En wie mag er stemmen?'],
['D','Iedere Nederlander vanaf achttien jaar. Stemmen is wel een recht, maar geen plicht.'],
['E','Mijn moeder zei dat er wel twintig partijen op het biljet stonden.'],
['D','Klopt. Dat komt door ons kiesstelsel. Het aantal zetels per partij hangt af van het percentage stemmen. Met ongeveer een honderdvijftigste deel van alle stemmen heb je al een zetel.'],
['E','Dus ook kleine partijen komen erin.'],
['D','Precies. En daardoor heeft bijna nooit één partij de meerderheid. Partijen moeten samenwerken.'],
['E','Is er ook een Eerste Kamer?'],
['D','Ja, die heeft vijfenzeventig leden. Die worden niet door ons gekozen, maar door de leden van de Provinciale Staten.'],
['E','Wat doet die Eerste Kamer?'],
['D','Ze controleert wetten nog een keer goed. Ze kan een wet alleen aannemen of verwerpen, niet zelf veranderen. Daarom heet ze ook wel de chambre de réflexion: de kamer van bezinning.']

['Hoeveel leden heeft de Tweede Kamer?','150','75|100|225','De Tweede Kamer heeft 150 leden. De Eerste Kamer heeft er 75.'],
['Wat zijn de twee hoofdtaken van de Tweede Kamer?','Wetten maken (samen met de regering) en de regering controleren','Rechtspreken en straffen|Belasting innen en uitgeven|De koning kiezen en benoemen','Wetgeven en controleren zijn de taken van het parlement. Rechtspreken doen rechters, belasting innen doet de Belastingdienst, en de koning wordt niet gekozen.'],
['Waarom regeert in Nederland bijna nooit één partij alleen?','Omdat bijna geen partij in haar eentje een meerderheid van de zetels haalt','Omdat dat in de Grondwet verboden is|Omdat de koning dat beslist|Omdat er maar twee partijen zijn','Door ons kiesstelsel komen veel partijen in de Kamer, dus een meerderheid (76 zetels) haal je bijna altijd alleen samen. Het is niet verboden en de koning beslist het niet.'],
['Hoe worden de leden van de Eerste Kamer gekozen?','Door de leden van de Provinciale Staten','Direct door alle kiezers|Door de koning|Door de Tweede Kamer','Wij kiezen de Provinciale Staten, en die kiezen de Eerste Kamer. Het is dus een indirecte verkiezing.']

{t:'Kabinet, partijen en meepraten',s:[
['E','Oké, Daan, na de verkiezingen. Wie gaat er dan regeren?'],
['D','Dan begint de formatie. Partijen die samen meer dan de helft van de zetels hebben, gaan onderhandelen. Dat is een coalitie.'],
['E','Meer dan de helft van honderdvijftig, dus minstens zesenzeventig.'],
['D','Precies. Ze schrijven samen een coalitieakkoord: wat ze de komende jaren willen doen.'],
['E','En dan heb je een kabinet?'],
['D','Ja: de ministers en staatssecretarissen. De minister-president leidt het kabinet.'],
['E','En wat is links en rechts dan eigenlijk? Dat hoor ik steeds in het nieuws.'],
['D','Grof gezegd: links vindt meestal dat de overheid meer moet doen om verschillen tussen arm en rijk kleiner te maken.'],
['E','En rechts?'],
['D','Rechts legt meestal meer nadruk op de vrije markt, lagere belastingen en eigen verantwoordelijkheid.'],
['E','En progressief en conservatief?'],
['D','Progressief betekent: open voor verandering en vernieuwing. Conservatief betekent: bestaande tradities en waarden willen bewaren.'],
['E','Dus een partij kan bijvoorbeeld rechts en progressief zijn?'],
['D','Ja, dat kan allemaal door elkaar. Het zijn meer windrichtingen dan vaste hokjes.'],
['E','En dichterbij? Bij ons in het dorp gaan ze een skatebaan sluiten.'],
['D','Dat beslist de gemeente. De gemeenteraad wordt door de inwoners gekozen. De burgemeester en de wethouders voeren het uit.'],
['E','Kan ik daar iets tegen doen, ook al mag ik nog niet stemmen?'],

['D','Ja. Lobbyen is proberen politici te overtuigen met informatie en gesprekken. Belangengroepen doen dat ook, van boeren tot milieuclubs.']

['Wat is meestal een standpunt dat bij politiek links past?','De overheid moet meer doen om verschillen tussen arm en rijk te verkleinen','Belastingen moeten zo laag mogelijk|Bedrijven moeten zo vrij mogelijk zijn|Tradities moeten altijd blijven zoals ze zijn','Links wil vaak meer gelijkheid via de overheid. Lage belastingen en een vrije markt passen meer bij rechts, en tradities bewaren is conservatief.'],
['Wie kiest de gemeenteraad?','De inwoners van de gemeente die mogen stemmen','De burgemeester|De Tweede Kamer|De koning','Inwoners kiezen de raad. De burgemeester wordt benoemd, niet gekozen, en de Tweede Kamer of de koning kiezen de raad niet.'],

'vs':[
{t:'Wat doet de verzorgingsstaat?',s:[
['E','Daan, mijn opa is net met pensioen. Hij krijgt nu elke maand geld van de overheid. Hoe zit dat?'],
['D','Dat is de AOW: de algemene ouderdomswet. Iedereen die lang genoeg in Nederland heeft gewoond, krijgt vanaf een bepaalde leeftijd een basispensioen.'],
['E','Vanaf welke leeftijd?'],
['D','Nu ongeveer zevenenzestig jaar. Die leeftijd gaat langzaam omhoog, omdat mensen ouder worden.'],
['E','En wie betaalt dat?'],
['D','De mensen die nu werken, via premies en belasting. Werkende mensen betalen voor de ouderen van nu.'],
['E','Dat heet toch de verzorgingsstaat?'],
['D','Ja. Een land waarin de overheid zorgt dat iedereen een bestaansminimum heeft, en toegang tot zorg en onderwijs.'],
['E','Wat valt daar nog meer onder?'],
['D','De WW, de werkloosheidsuitkering. Als je je baan verliest, krijg je een tijdje een deel van je loon.'],
['E','En als je geen werk vindt en geen geld meer hebt?'],
['D','Dan is er de bijstand. Die regelt de gemeente. Het is het vangnet waar je op terugvalt als niets anders lukt.'],
['E','Mijn moeder klaagde laatst over de zorgverzekering. Moet zij die betalen?'],
['D','Iedereen vanaf achttien moet een basisverzekering hebben. Kinderen onder de achttien zijn gratis meeverzekerd bij hun ouders.'],
['E','Dus ik kost mijn moeder niks. Mooi.'],
['D','Haha, voor de zorgverzekering niet. Maar als jij achttien wordt, moet je het zelf regelen. Wie weinig verdient, krijgt zorgtoeslag.'],
['E','En onderwijs hoort er ook bij, toch?'],
['D','Ja. Er is leerplicht tot je zestien bent, en tot je achttiende moet je naar school tot je een startkwalificatie hebt: een diploma van havo, vwo of minstens mbo niveau twee. En de overheid betaalt het grootste deel van jouw school.'],
['E','Wanneer is dit allemaal ontstaan?'],
['D','Vooral na de Tweede Wereldoorlog. De AOW is uit negentienhonderd zevenenvijftig. Daarvoor waren veel ouderen afhankelijk van hun kinderen of van de kerk.']
],q:[
['Wat is de AOW?','Een basispensioen van de overheid voor iedereen vanaf de AOW-leeftijd','Een uitkering als je je baan verliest|Een uitkering van de gemeente als je geen geld hebt|Een verzekering voor de tandarts','De AOW is het ouderdomspensioen. Werkloosheid is de WW, het vangnet van de gemeente is de bijstand, en de tandarts valt onder zorgverzekeringen.'],
['Wie regelt de bijstand?','De gemeente','De werkgever|De zorgverzekeraar|De Europese Unie','De bijstand is een vangnet dat de gemeente uitvoert. Werkgevers, verzekeraars en de Europese Unie betalen die niet uit.'],
['Moet Eva (15) zelf een zorgverzekering betalen?','Nee, tot 18 jaar ben je gratis meeverzekerd bij je ouders','Ja, vanaf 12 jaar|Ja, als ze een bijbaantje heeft|Nee, want jongeren krijgen nooit zorg','Tot je 18de ben je gratis meeverzekerd. Een bijbaantje verandert daar niets aan, en jongeren krijgen natuurlijk wel zorg.'],
['Wie betaalt de AOW van de ouderen van nu?','Vooral de mensen die nu werken, via premies en belasting','De ouderen zelf, van hun spaargeld|De gemeente uit eigen geld|De banken','De AOW werkt met een omslagstelsel: werkenden betalen voor de ouderen van nu. Ouderen hoeven er niet zelf voor te sparen, en gemeente of banken betalen het niet.']
]},
{t:'Belasting en hoeveel de overheid moet doen',s:[
['E','Daan, al die uitkeringen en zorg. Dat kost toch bakken met geld?'],
['D','Zeker. Daarom betalen we belasting. Jij ook, trouwens.'],
['E','Ik? Ik verdien maar een paar tientjes per week.'],
['D','Als je een zak chips koopt, betaal je btw. Dat is belasting op wat je koopt. Op eten en boeken is het negen procent, op de meeste andere dingen eenentwintig procent.'],
['E','Oh ja. En op mijn loon?'],
['D','Daar kan loonbelasting af gaan. Met een klein bijbaantje is dat vaak weinig of niets, en anders krijg je het meestal terug als je aangifte doet.'],
['E','Is het voor iedereen hetzelfde percentage?'],
['D','Nee. Wie meer verdient, betaalt over het hogere deel een hoger percentage. Dat heet een progressief belastingstelsel.'],
['E','Is dat niet oneerlijk voor wie hard werkt?'],
['D','Daar gaat precies de grote discussie over. Sommige mensen vinden: de sterkste schouders moeten de zwaarste lasten dragen.'],
['E','En anderen?'],
['D','Die vinden dat de overheid minder moet doen. Lagere belastingen, minder regels, en mensen meer eigen verantwoordelijkheid geven.'],
['E','Wie heeft er gelijk?'],
['D','Dat is geen kwestie van gelijk of ongelijk. Het hangt af van wat je belangrijker vindt: gelijkheid en zekerheid, of vrijheid en eigen keuzes.'],
['E','Er zijn toch ook problemen met de verzorgingsstaat?'],
['D','Ja. Mensen worden ouder en de zorg wordt duurder. Daarom gaat de AOW-leeftijd omhoog en wordt er gesproken over eigen risico en eigen bijdragen.'],
['E','En wat is dat eigen risico?'],
['D','Een bedrag dat je eerst zelf betaalt voor sommige zorg, voordat de verzekering betaalt. Een paar honderd euro per jaar.'],
['E','Dus de vraag blijft: hoeveel moet de overheid voor ons zorgen?'],
['D','Precies. Dat is één van de vaste discussies bij maatschappijleer, en bij bijna elke verkiezing.']
],q:[
['Wat is btw?','Belasting die je betaalt over wat je koopt','Belasting over je loon|Een uitkering voor jongeren|Een boete voor te hard rijden','Btw zit in de prijs van producten en diensten. Loonbelasting gaat van je loon af, en een uitkering of boete is iets anders.'],
['Wat betekent een progressief belastingstelsel?','Wie meer verdient, betaalt over het hogere deel een hoger percentage','Iedereen betaalt precies hetzelfde bedrag|Jongeren betalen meer dan ouderen|Belasting gaat elk jaar omhoog','Progressief betekent hier: het percentage stijgt met het inkomen. Het gaat niet om gelijke bedragen, leeftijd of jaarlijkse stijgingen.'],
['Iemand vindt: ‘Mensen moeten meer zelf regelen en de belasting moet omlaag.’ Welke kant van de discussie is dat?','De overheid moet minder doen','De overheid moet meer doen|De sterkste schouders moeten de zwaarste lasten dragen|De verzorgingsstaat moet groter','Minder belasting en meer eigen verantwoordelijkheid betekent een kleinere rol voor de overheid. De andere drie antwoorden pleiten juist voor meer overheid.'],
['Waarom gaat de AOW-leeftijd omhoog?','Omdat mensen gemiddeld ouder worden en de AOW anders te duur wordt','Omdat jongeren niet meer willen werken|Omdat de Grondwet dat voorschrijft|Omdat er minder ouderen komen','Mensen leven langer, dus de AOW wordt langer uitbetaald. Er komen juist méér ouderen, en de Grondwet zegt er niets over.']
]}

{t:'Cultuur, waarden en normen',s:[
['E','Daan, bij mijn vriendin Yasmin thuis trekken ze de schoenen uit bij de deur. Bij ons niet.'],
['D','En bij ons eten we altijd om zes uur, en bij mijn oom pas om acht. Dat noemen ze cultuur.'],

['E','Wat is het verschil tussen waarden en normen?'],
['D','Waarden zijn dingen die je belangrijk vindt. Zoals eerlijkheid, vrijheid of respect.'],
['E','En normen?'],
['D','Normen zijn de regels voor gedrag die bij die waarden horen. Als je respect belangrijk vindt, is een norm: niet door iemand heen praten.'],
['E','Dus de waarde is het idee, en de norm is wat je daarom doet.'],
['D','Precies. En hoe leer je die eigenlijk?'],

['D','Ja, dat is socialisatie: hoe je de cultuur van je omgeving aanleert. Eerst thuis in het gezin, daarna op school, bij vrienden, op sport en via social media.'],
['E','Dus mijn TikTok-feed bepaalt ook wie ik ben?'],
['D','Een beetje wel. Al die invloeden samen vormen je identiteit: wie je bent en bij welke groepen je hoort.'],
['E','Ik ben dus tegelijk dochter, gymnasiast, hockeyer en Brabander.'],
['D','Haha, ja. Iedereen heeft meerdere identiteiten. Dat maakt het ook makkelijker om met verschillende mensen iets gemeen te hebben.'],
['E','En waarom heet het een pluriforme samenleving?'],
['D','Omdat Nederland uit heel veel groepen bestaat, met verschillende culturen, geloven en leefstijlen.'],
['E','Was dat vroeger anders?'],
['D','Vroeger was Nederland verzuild. Katholieken, protestanten, socialisten en liberalen hadden elk hun eigen school, krant, omroep en zelfs voetbalclub.']

['Wat is socialisatie?','Het aanleren van de cultuur van je omgeving: waarden, normen en gewoontes','Het gebruiken van social media|Het lid worden van een politieke partij|Het verhuizen naar een ander land','Socialisatie is het proces waarin je leert hoe je je hoort te gedragen, vooral via gezin, school, vrienden en media. Social media is maar één van die invloeden.'],
['Waar begint socialisatie meestal?','In het gezin','Op de middelbare school|Op het werk|In de politiek','Je eerste waarden en normen leer je thuis. School, vrienden en werk komen later.'],
['Wat was de verzuiling?','Een tijd waarin elke levensbeschouwelijke groep haar eigen scholen, kranten en clubs had','Een periode met veel oorlog|Het bouwen van kerken met zuilen|Een wet tegen migratie','Katholieken, protestanten, socialisten en liberalen leefden vooral binnen hun eigen ‘zuil’. Het gaat niet over bouwwerken, oorlog of wetten.']

['E','Hoeveel mensen in Nederland hebben eigenlijk een migratieachtergrond?'],

const stemKw=v=>{const t=(v.voiceURI||'')+' '+v.name;return /premium/i.test(t)?3:/enhanced|verbeterd|neural|natural|online/i.test(t)?2:/compact/i.test(t)?0:1};
const stemLabel=v=>`${v.name.replace(/\s*\((verbeterd|enhanced|premium)\)/i,'')}${stemKw(v)>=2?' (verbeterd)':''}${/BE/i.test(v.lang)?' · Vlaams':''}`;
function nlStemmen(){return kanPraten?speechSynthesis.getVoices().filter(v=>/^nl/i.test(v.lang)):[]}
function eigenKeuze(){try{return JSON.parse(localStorage.getItem('leren-stem')||'{}')}catch(e){return {}}}
function stemmen(){if(!kanPraten)return null;const nl=nlStemmen(),k0=eigenKeuze();if(!nl.length)return k0.een?{E:{v:null,p:1},D:{v:null,p:1},tekst:'één voorlezer (standaardstem)'}:{E:{v:null,p:1.15},D:{v:null,p:.82},tekst:'geen Nederlandse stem gevonden, de standaardstem leest voor'};
 const beste=l=>[...l].sort((a,b)=>(stemKw(b)+(/nl-NL/i.test(b.lang)?.5:0))-(stemKw(a)+(/nl-NL/i.test(a.lang)?.5:0)))[0];
 if(k0.een){const v=nl.find(x=>x.voiceURI===k0.een)||beste(nl);return {E:{v,p:1},D:{v,p:1},een:v,tekst:`één voorlezer: ${stemLabel(v)}`}}
 const vr=/claire|ellen|fenna|colette|lotte|femke|anna|female|vrouw|google nederlands/i,mn=/xander|maarten|frank|arnaud|male|\bman\b/i;
 const zoek=u=>nl.find(v=>v.voiceURI===u);let e=zoek(k0.E)||beste(nl.filter(v=>vr.test(v.name))),d=zoek(k0.D)||beste(nl.filter(v=>mn.test(v.name)&&!vr.test(v.name)));
 if(e&&d&&e!==d)return {E:{v:e,p:1},D:{v:d,p:1},tekst:`Lotte = ${stemLabel(e)}, Sem = ${stemLabel(d)}`};
 const een=e||d||beste(nl);return {E:{v:een,p:1.18},D:{v:een,p:.8},tekst:`één stem (${stemLabel(een)}) op twee toonhoogtes`}}

 const wissel=`<div class="podmode" style="margin:6px 0"><button class="btn klein ${een?'licht':''}" id="kTwee">👥 Twee stemmen</button><button class="btn klein ${een?'':'licht'}" id="kEen">👤 Eén voorlezer</button></div>`;
 if(!nl.length)return wissel+'<p class="src">Op dit apparaat zijn geen Nederlandse stemmen gevonden.</p>';
 const opt=w=>nl.map(v=>`<option value="${esc(v.voiceURI)}"${st[w]&&st[w].v===v?' selected':''}>${esc(stemLabel(v))}</option>`).join('');
 if(een)return wissel+`<div class="stemkies"><label><b>Voorlezer</b><select id="kN">${nl.map(v=>`<option value="${esc(v.voiceURI)}"${st.een===v?' selected':''}>${esc(stemLabel(v))}</option>`).join('')}</select></label><button class="btn klein licht" data-test="E">▶ test</button></div>`;
 return wissel+`<div class="stemkies"><label><b class="wie E">Lotte</b><select id="kE">${opt('E')}</select></label><button class="btn klein licht" data-test="E">▶ test</button><label><b class="wie D">Sem</b><select id="kD">${opt('D')}</select></label><button class="btn klein licht" data-test="D">▶ test</button></div><p class="src" style="margin:4px 0 0">Staat je gedownloade stem er niet bij? Sluit Safari helemaal af en open de pagina opnieuw.</p>`}
function stemKiezerKoppel(){const k=eigenKeuze(),bew=()=>{try{localStorage.setItem('leren-stem',JSON.stringify(k))}catch(e){}podDraw()};
 const t2=document.getElementById('kTwee');if(t2){t2.onclick=()=>{delete k.een;bew()};document.getElementById('kEen').onclick=()=>{const st=stemmen()||{};k.een=(st.E&&st.E.v&&st.E.v.voiceURI)||'auto';bew()}}
 const sn=document.getElementById('kN');if(sn)sn.onchange=()=>{k.een=sn.value;bew()};['E','D'].forEach(w=>{const s=document.getElementById('k'+w);if(s)s.onchange=()=>{k[w]=s.value;bew()}});
 P.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{stilte();const w=b.dataset.test,sv=(stemmen()||{})[w]||{};const u=new SpeechSynthesisUtterance(eigenKeuze().een?'Hoi, ik lees het voor.':w==='E'?'Hoi, ik ben Lotte.':'En ik ben Sem.');u.lang='nl-NL';if(sv.v)u.voice=sv.v;u.pitch=sv.p||1;u.rate=TEMPO[S.tempo??1][1];speechSynthesis.speak(u)})}

 P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="stap">${A?A.titel:`Podcast ${G.sec} · deel ${G.i+1}`}</span><span class="teller" id="cnt"></span></div>
 <div class="kaart">${A?'':`<h2 style="margin-top:0">${p.t}</h2>`}
  ${kanPraten?`<div class="podmode"><button class="btn klein ${G.mode==='luister'?'':'licht'}" id="mLuis">🎧 Luisteren</button><button class="btn klein ${G.mode==='lees'?'':'licht'}" id="mLees">📖 Lezen</button></div>`:''}

/* ---------- 💡 Hoe pak ik dit aan? De aanpak (q.hint) en het kaartje uit het leerpad waar de vraag over gaat; niet in de proeftoets ---------- */
const STOPW=new Set('deze die dat wat welke hoeveel waarom wordt worden niet zijn heeft hebben kunnen moet maar ook door naar voor over onder tussen bij zonder iets meer minder alle elke steeds daarna eerst juist goed fout klopt uitspraak uitspraken antwoord'.split(' '));
const woorden=t=>(String(t).replace(/<[^>]+>/g,' ').toLowerCase().match(/[a-zà-ÿ]{4,}/g)||[]).filter(x=>!STOPW.has(x));
function kaartVoor(q){const h=q.sec&&SECN[q.sec];if(!h)return null;const w=new Set(woorden(q.q));let best=null,bs=0;h.lp.forEach(l=>{const n=new Set(woorden(l[0]+' '+l[1]).filter(x=>w.has(x))).size;if(n>bs){bs=n;best=l}});return bs>=2?best:null}
function hintVan(q){const k=kaartVoor(q);if(!q.hint&&!k)return '';return `<div>${q.hint||'Zoek de kernwoorden in de vraag. Weet je niet meer wat ze betekenen? Lees het kaartje hieronder nog eens, en kijk dan opnieuw naar de opties.'}</div>${k?`<details class="hkaart"><summary>📖 Kaartje uit het leerpad: ${k[0]}</summary>${k[1]}</details>`:''}`}

  ${o.titel!=='Proeftoets'&&hintVan(q)?`<div class="hintrij"><button class="btn licht klein" type="button" id="hintb">💡 Hoe pak ik dit aan?</button><div id="hintbox" class="hintbox" hidden>${hintVan(q)}</div></div>`:''}
  ${q.num?`<form class="typerow" id="nf" autocomplete="off"><input id="ni" inputmode="numeric" placeholder="aantal" aria-label="Antwoord"><button class="btn" type="submit" id="nb">Controleer</button></form>`:`<div class="opts">${opts.map((x,k)=>`<button class="opt" data-k="${k}">${x}</button>`).join('')}</div>`}<div id="fb"></div></div>`;
  $('#stop').onclick=goHome;const hb=$('#hintb');if(hb)hb.onclick=()=>{$('#hintbox').hidden=false;hb.hidden=true};
  const af=ok=>{const hr=P.querySelector('.hintrij');if(hr)hr.hidden=true;if(ok&&o.opGoed)o.opGoed(q);if(!her&&ok)goed++;if(ok){if(q.id)delete S.mis[q.id]}else{if(q.id&&q.sec&&!o.geenMis)S.mis[q.id]=q.sec;if(!her)opnieuw.push(q)}save();
   $('#fb').innerHTML=`<div class="uitleg"><b class="${ok?'goed-t':'fout-t'}">${ok?'Goed!':'Niet goed.'}</b> ${q.num&&!ok?`Het antwoord is <b>${q.a}</b>. `:''}${q.w||''}</div><div class="acts"><button class="btn" id="vd">Verder ↵</button></div>`;
   i++;$('#vd').onclick=volgende;$('#vd').focus()};
  if(q.num){const inp=$('#ni');inp.focus();$('#nf').onsubmit=e=>{e.preventDefault();const v=parseInt(inp.value,10);if(isNaN(v)){inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');return}inp.readOnly=true;$('#nb').hidden=true;af(v===q.a)}}
