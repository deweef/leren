 const einde=()=>{P.innerHTML=`<div class="kaart" style="text-align:center"><div class="label">${o.titel}</div><div class="groot">${goed}<span> / ${n}</span></div>${o.klaar(goed,n)}</div>`;o.na&&o.na()};
 show('play');volgende()}
function ronde(id){stilte();const qs=shuffle(MCQ[id]).slice(0,10).map(v=>mcItem(v,id));
 quiz(qs,{titel:'Oefenronde: '+SECN[id].t,klaar:(goed,n)=>{const f=goed/n;if(f>(S.b[id]||0))S.b[id]=f;save();
  return `<p>${f>=.8?'Gehaald! 🎉':'Nog niet: 8 van de 10 in één keer goed is het doel.'}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een ronde</button><button class="btn licht" id="lp">Leerpad nalezen</button>${terugKnop()}</div>`},
  na:()=>{$('#opn').onclick=()=>ronde(id);$('#lp').onclick=()=>leerpad(id);$('#hm').onclick=goHome}})}
const exItem=v=>({q:v[1],a:v[2],opts:[v[2],...v[3].split('|')],w:v[4],hint:v[5],sec:v[0],id:'ex|'+v[1].slice(0,60)});
function examen(){stilte();quiz(shuffle(EXAM).slice(0,12).map(exItem),{titel:'Toetsvragen',geenHer:1,geenMis:1,klaar:(goed,n)=>{const f=goed/n;if(f>S.ex)S.ex=f;save();
 return `<p>${Math.round(f*100)}% goed${f>=.7?' · gehaald! 🎉':' · doel: 70%'}</p><p class="sub">Toetsvragen zijn lastig: lees de uitleg goed, daar zie je hoe je moet redeneren.</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een keer</button>${terugKnop()}</div>`},na:()=>{$('#opn').onclick=examen;$('#hm').onclick=goHome}})}
function spelKlaar(k,goed,n){const f=goed/n,d=SPEL[k].doel;if(f>(S.sp[k]||0))S.sp[k]=f;save();
 return `<p>${f>=d?'Gehaald! 🎉':`Doel: ${Math.ceil(d*n)} van de ${n} in één keer goed.`}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een keer</button>${terugKnop()}</div>`}
function spel(k){stilte();if(k==='stel')return stelSpel();const f=null;
 quiz(Array.from({length:10},f),{titel:SPEL[k].t,geenHer:1,klaar:(g,n)=>spelKlaar(k,g,n),na:()=>{$('#opn').onclick=()=>spel(k);$('#hm').onclick=goHome}})}
function volg(){const set=shuffle(VOLG).slice(0,5);let i=0,goed=0;show('play');
 const teken=()=>{if(i>=set.length){P.innerHTML=`<div class="kaart" style="text-align:center"><div class="label">${SPEL.volg.t}</div><div class="groot">${goed}<span> / ${set.length}</span></div>${spelKlaar('volg',goed,set.length)}</div>`;$('#opn').onclick=volg;$('#hm').onclick=goHome;return}
  const [titel,juist]=set[i];let los;do{los=shuffle(juist)}while(los.join()===juist.join());const rij=[];
  const bouw=()=>{P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="stap">${SPEL.volg.t}</span><span class="teller">${i+1}/${set.length}</span></div>
   <div class="kaart"><div class="label">Zet op volgorde</div><div class="vraag">${titel}</div><p class="sub" style="margin:4px 0 0">Tik de stappen aan van eerste naar laatste.</p>
   <ol class="volgrij">${rij.map(t=>`<li>${t}</li>`).join('')}</ol><div class="tegels">${los.map((t,k)=>`<button class="tegel${rij.includes(t)?' weg':''}" data-k="${k}">${t}</button>`).join('')}</div>
   <div id="fb"></div><div class="acts" id="ra">${rij.length?'<button class="btn licht klein" id="wis2">↺ Opnieuw</button>':''}</div></div>`;
   $('#stop').onclick=goHome;const w=$('#wis2');if(w)w.onclick=()=>{rij.length=0;bouw()};
   P.querySelectorAll('.tegel').forEach(b=>b.onclick=()=>{if(b.classList.contains('weg'))return;rij.push(los[+b.dataset.k]);if(rij.length<juist.length)return bouw();
    bouw();const ok=rij.join()===juist.join();if(ok)goed++;$('#ra').innerHTML='';P.querySelectorAll('.tegel').forEach(x=>x.disabled=true);
    $('#fb').innerHTML=`<div class="uitleg"><b class="${ok?'goed-t':'fout-t'}">${ok?'Goed!':'Niet goed.'}</b>${ok?'':` De goede volgorde:<ol>${juist.map(t=>`<li>${t}</li>`).join('')}</ol>`}</div><div class="acts"><button class="btn" id="vd">Verder ↵</button></div>`;$('#vd').onclick=()=>{i++;teken()};$('#vd').focus()})};
  bouw()};
 teken()}
function toets(){stilte();const mc=shuffle(H.flatMap(h=>shuffle(MCQ[h.id]).slice(0,2).map(v=>mcItem(v,h.id))));const ex=shuffle(EXAM).slice(0,6).map(exItem);
 const qs=shuffle([...mc.slice(0,12),...ex,]);
 quiz(qs,{titel:'Proeftoets',geenHer:1,geenMis:1,klaar:(goed,n)=>{const c=Math.round((1+9*goed/n)*10)/10;if(c>S.toets)S.toets=c;save();
  return `<p>Cijfer: <b style="font-size:22px">${nf(c)}</b>${c>=7?' 🎉':''}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een proeftoets</button>${terugKnop()}</div>`},na:()=>{$('#opn').onclick=toets;$('#hm').onclick=goHome}})}
function foutRonde(){const lijst=Object.entries(S.mis).map(([id,sec])=>{const v=(MCQ[sec]||[]).find(v=>v[0]===id);return v?mcItem(v,sec):null}).filter(Boolean);
 if(!lijst.length){S.mis={};save();return goHome()}quiz(shuffle(lijst).slice(0,15),{titel:'Mijn fouten',klaar:()=>`<p>${Object.keys(S.mis).length?`Nog ${Object.keys(S.mis).length} in je foutenlijst.`:'Foutenlijst leeg. Top!'}</p><div class="acts" style="justify-content:center">${terugKnop()}</div>`,na:()=>{$('#hm').onclick=goHome}})}

/* ---------- open vragen: invullen en nakijken ---------- */
const oId=q=>q[0]+'|'+q[1];
function openMenu(){stilte();show('play');const o=OS();
 P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Terug</button><span class="stap">Open vragen</span><span></span></div>
 <div class="kaart"><p style="margin:0">Typ je antwoord in je eigen woorden, zoals op de toets. Tik daarna op <b>Nakijken</b>: je ziet jouw antwoord en daaronder het goede antwoord, en je vinkt aan welke punten je had.</p></div>
 <button class="mode main" id="opw" style="width:100%;margin:8px 0"><h3>✍️ Proefwerk: 8 open vragen</h3><p>Uit alle basisstoffen. Ongeveer 25 minuten.${o.best?` Beste: ${Math.round(o.best*100)}%.`:''}</p></button>
 ${H.map(h=>{const n=OPEN.filter(q=>q[0]===h.id).length;return n?`<button class="mode${(o.per[h.id]||0)>=.6?' gehaald':''}" data-os="${h.id}" style="width:100%;margin:8px 0"><h3>${h.ic} ${h.id} ${h.t}</h3><p>${n} open vragen.${o.per[h.id]?` Beste: ${Math.round(o.per[h.id]*100)}%.`:''}</p></button>`:''}).join('')}`;
 $('#stop').onclick=goHome;$('#opw').onclick=openProefwerk;P.querySelectorAll('[data-os]').forEach(b=>b.onclick=()=>openSet(OPEN.filter(q=>q[0]===b.dataset.os),'Open vragen '+b.dataset.os,b.dataset.os))}
function openProefwerk(){const qs=[];H.forEach(h=>{const l=shuffle(OPEN.filter(q=>q[0]===h.id));qs.push(...l.slice(0,h.id==='gr'?2:1))});openSet(qs.slice(0,8),'Proefwerk open vragen',null)}
function openSet(qs,titel,sec){stilte();show('play');G={m:'open',qs,titel,sec};const o=OS();
 P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="stap">${titel}</span><span class="teller">${qs.length} vragen</span></div>
 <p class="src">Je antwoorden worden bewaard, ook als je even weggaat. Schrijf in hele zinnen.</p>
 ${qs.map((q,i)=>`<div class="kaart ovraag"><div class="label">Vraag ${i+1} · ${q[0]} · ${q[3].length} punten</div><div class="vraag">${q[1]}</div><textarea data-i="${i}" rows="4" placeholder="Jouw antwoord…">${esc(o.a[oId(q)]||'')}</textarea></div>`).join('')}
 <div class="acts"><button class="btn" id="nakijk">Nakijken →</button><button class="btn licht" id="leeg">Antwoorden wissen</button></div>`;
 P.querySelectorAll('textarea').forEach(t=>t.oninput=()=>{o.a[oId(qs[+t.dataset.i])]=t.value;save()});
 $('#stop').onclick=()=>RT.on?goHome():openMenu();$('#leeg').onclick=()=>{if(!confirm('Alle antwoorden van deze vragen wissen?'))return;qs.forEach(q=>delete o.a[oId(q)]);save();openSet(qs,titel,sec)};
 $('#nakijk').onclick=()=>{const l=qs.filter(q=>!(o.a[oId(q)]||'').trim()).length;if(l&&!confirm(`${l} vraag${l>1?'en zijn':' is'} nog leeg. Toch nakijken?`))return;openNakijk()}}
function oMarkeer(tekst,q){if(!(tekst||'').trim())return '<i class="src">(niet ingevuld)</i>';const iv=[];
 q[3].forEach(p=>{try{const r=new RegExp(p[1],'gi');let m;while((m=r.exec(tekst))){if(!m[0].length){r.lastIndex++;continue}iv.push([m.index,m.index+m[0].length])}}catch(e){}});
 iv.sort((a,b)=>a[0]-b[0]);const mg=[];iv.forEach(x=>{const l=mg[mg.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else mg.push(x.slice())});
 let h='',k=0;mg.forEach(([a,b])=>{h+=esc(tekst.slice(k,a))+'<mark>'+esc(tekst.slice(a,b))+'</mark>';k=b});h+=esc(tekst.slice(k));return h.replace(/\n/g,'<br>')}
function openNakijk(){const {qs,titel,sec}=G,o=OS();show('play');
 P.innerHTML=`<div class="top"><button class="btn licht klein" id="terug">← Antwoorden</button><span class="stap">Nakijken</span><span class="teller" id="osc"></span></div>
 <p class="src">Vergelijk je antwoord met het goede antwoord. Woorden die al lijken te kloppen zijn <mark>gemarkeerd</mark> en dat punt staat al aangevinkt. Klopt het niet? Haal het vinkje weg. Had je het in andere woorden? Vink het aan.</p>
 ${qs.map((q,i)=>{const t=o.a[oId(q)]||'';return `<div class="kaart ovraag"><div class="label">Vraag ${i+1} · ${q[0]}</div><div class="vraag">${q[1]}</div>
  <div class="oantw"><div class="label">Jouw antwoord</div>${oMarkeer(t,q)}</div><div class="omodel"><div class="label">Goed antwoord</div>${q[2]}</div>
  <div class="opunt"><div class="label">Had jij dit? (1 punt per vinkje)</div>${q[3].map((p,k)=>{let ok=false;try{ok=new RegExp(p[1],'i').test(t)}catch(e){}return `<label><input type="checkbox" data-p="${i}-${k}"${ok?' checked':''}> ${p[0]}</label>`}).join('')}</div></div>`}).join('')}
 <div class="kaart" id="ouit"></div>`;
 const tel=()=>{const c=P.querySelectorAll('[data-p]'),g=[...c].filter(x=>x.checked).length,f=c.length?g/c.length:0,cijfer=Math.round((1+9*f)*10)/10;$('#osc').textContent=`${g}/${c.length} punten`;
  $('#ouit').innerHTML=`<h3>Score: ${g} van de ${c.length} punten · cijfer ${nf(cijfer)}</h3><p class="sub">${f>=.8?'Super! Dit kun je op de toets ook.':f>=.6?'Goed bezig. Kijk nog even naar de punten die je miste.':'Lees de goede antwoorden nog eens rustig door, en probeer het daarna opnieuw.'}</p><div class="acts"><button class="btn" id="obew">Score bewaren</button><button class="btn licht" id="oopn">Opnieuw</button></div>`;
  $('#obew').onclick=()=>{if(sec)o.per[sec]=Math.max(o.per[sec]||0,f);else o.best=Math.max(o.best||0,f);save();$('#obew').textContent='Bewaard ✓';$('#obew').disabled=true;const n=document.createElement('button');n.className='btn licht';n.textContent=RT.on?'Terug naar de route':'Naar het menu';n.onclick=()=>RT.on?goHome():openMenu();$('#obew').after(n)};
  $('#oopn').onclick=()=>sec?openSet(qs,titel,sec):openProefwerk()};
 P.querySelectorAll('[data-p]').forEach(x=>x.onchange=tel);tel();$('#terug').onclick=()=>openSet(qs,titel,sec)}

/* ---------- begrippenblitz ---------- */
function blitz(){stilte();let punten=0,eind=Date.now()+60000;show('play');
 const vraag=()=>{if(Date.now()>=eind)return stop();const b=pick(BEGR),rev=Math.random()<.5;const fout=shuffle(BEGR.filter(x=>x!==b)).slice(0,2);const goedT=rev?b[0]:b[1];const opts=shuffle([goedT,...fout.map(x=>rev?x[0]:x[1])]);
  P.innerHTML=`<div class="top"><button class="btn licht klein" id="stop">Stoppen</button><span class="teller ok">${punten} punten</span><span class="teller" id="tijd">60 s</span></div>
  <div class="kaart"><div class="label">${rev?'Welk begrip hoort hierbij?':'Wat betekent dit begrip?'}</div><div class="vraag">${rev?b[1]:b[0]}</div><div class="opts">${opts.map((x,k)=>`<button class="opt" data-k="${k}">${x}</button>`).join('')}</div><div id="fb"></div></div>`;
  tik();$('#stop').onclick=goHome;
  P.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{if(P.querySelector('.opt.goed'))return;const ok=opts[+x.dataset.k]===goedT;P.querySelectorAll('.opt').forEach((y,k)=>{if(opts[k]===goedT)y.classList.add('goed');else if(y===x)y.classList.add('fout')});
   if(ok){punten++;setTimeout(vraag,350)}else{$('#fb').innerHTML=`<div class="uitleg"><b class="fout-t">Fout.</b> <b>${b[0]}</b> = ${b[1]}.</div><div class="acts"><button class="btn" id="vd">Verder ↵</button></div>`;$('#vd').onclick=vraag;$('#vd').focus()}})};
 const tik=()=>{const e=$('#tijd');if(e)e.textContent=Math.max(0,Math.ceil((eind-Date.now())/1000))+' s'};
 const stop=()=>{clearInterval(window.__klok);const rec=punten>S.blitz;if(rec)S.blitz=punten;save();
  P.innerHTML=`<div class="kaart" style="text-align:center"><div class="label">Begrippenblitz</div><div class="groot">${punten}</div><p>${rec?'Nieuw record! 🎉':`Record: ${S.blitz}`}${S.blitz>=15?'':' · doel: 15'}</p><div class="acts" style="justify-content:center"><button class="btn" id="opn">Nog een keer</button>${terugKnop()}</div></div>`;
  $('#opn').onclick=blitz;$('#hm').onclick=goHome};
 window.__klok=setInterval(()=>{tik();if(Date.now()>=eind&&!P.querySelector('#vd'))stop()},250);vraag()}

/* ---------- alles nalezen ---------- */
function samen(){stilte();S.samen=1;save();show('play');
 P.innerHTML=`<div class="top"><button class="btn licht klein" id="terug">‹ Terug</button><span class="stap">Alles nog eens lezen</span><span></span></div>
 <div class="kaart"><p style="margin:0"><b>Introductie maatschappijleer.</b> Hoe de samenleving werkt en hoe je zelf meedoet: wat het vak is en hoe je naar een probleem kijkt, de rechtsstaat, de parlementaire democratie, de verzorgingsstaat en de pluriforme samenleving.</p></div>
 ${H.map(h=>`<h2>${h.ic} ${h.id} ${h.t}</h2>${h.lp.map(c=>`<div class="kaart"><h3>${c[0]}</h3>${c[1]}</div>`).join('')}`).join('')}
 <h2>Begrippen</h2><div class="kaart"><dl class="begr">${BEGR.map(b=>`<dt>${b[0]}</dt><dd>${b[1]}</dd>`).join('')}</dl></div>
 <div class="acts"><button class="btn licht" id="terug2">‹ Terug</button></div>`;$('#terug').onclick=goHome;$('#terug2').onclick=goHome}

renderHome();
</script>
</body>
</html>
