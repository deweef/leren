<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="leerlog.js"></script><script>(function(){try{if(localStorage.getItem('leren-ok')!=='53a39a231246354922d1b5f7242c1639ebdc75da84bde2e766eed704f5a89cf8'){location.replace('index.html')}}catch(e){location.replace('index.html')}})();</script>
<title>Profielkeuze · Wat past bij jou?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* iPad: twee keer snel tikken mag niet inzoomen (knijpen om te zoomen blijft werken) */
*{touch-action:manipulation}
:root{--bg:#F5F2EC;--surface:#fff;--ink:#1E2230;--muted:#5D6375;--line:#DDD6CB;--chip:#EEE8DE;--accent:#2E7D5B;--gold:#B8860B;--good:#1E8E5A;--good-bg:#E3F4EA;--bad:#C0392B;--bad-bg:#FBE9E7;--tip:#FFF6DA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161D;--surface:#1D2029;--ink:#E9EAF0;--muted:#A0A5B5;--line:#30343F;--chip:#272A35;--accent:#5FC596;--gold:#E8B84A;--good:#4CD68A;--good-bg:#173226;--bad:#FF7B6B;--bad-bg:#3A1E1B;--tip:#2E2A1C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161D;--surface:#1D2029;--ink:#E9EAF0;--muted:#A0A5B5;--line:#30343F;--chip:#272A35;--accent:#5FC596;--gold:#E8B84A;--good:#4CD68A;--good-bg:#173226;--bad:#FF7B6B;--bad-bg:#3A1E1B;--tip:#2E2A1C;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-wrap:break-word}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font:800 clamp(30px,7vw,44px)/1.05 Archivo,system-ui,sans-serif;font-stretch:90%;margin:4px 0 6px}
h2{font:800 22px/1.2 Archivo,system-ui,sans-serif;margin:22px 0 8px}
h3{font:800 18px/1.25 Archivo,system-ui,sans-serif;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 16px}
.terug{display:inline-block;margin:0 0 10px;color:inherit;opacity:.7;text-decoration:none;font:700 14px system-ui,sans-serif}
.kaart{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{font:700 16px system-ui,sans-serif;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.licht{background:var(--chip);color:var(--ink)}
.balk{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:8px 0}.balk i{display:block;height:100%;background:var(--accent)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin:6px 0 14px}
.vak{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 8px;font:800 17px/1.2 Archivo,system-ui,sans-serif;cursor:pointer;min-height:64px}
.vak small{display:block;font:400 12.5px/1.3 "Atkinson Hyperlegible",system-ui;color:var(--muted);margin-top:4px}
.vak.gek{border-color:var(--accent);background:var(--good-bg)}
.even{border:2px dashed var(--line);background:none;color:var(--muted);border-radius:14px;padding:6px 8px;font:700 13px/1.2 system-ui;cursor:pointer;width:74px}
.even.gek{border-style:solid;border-color:var(--gold);color:var(--ink)}
.vraag{font:800 15px/1.2 Archivo,system-ui,sans-serif;margin:6px 0 2px}
.rij{display:flex;align-items:center;gap:8px;margin:5px 0}.rij .nm{width:150px;flex:none;font-weight:700;font-size:15px}.rij .b{flex:1;height:14px;border-radius:7px;background:var(--chip);overflow:hidden}.rij .b i{display:block;height:100%}
.prof{border-width:3px}.prof.top{border-color:var(--accent)}
.pakket{font-size:14.5px;color:var(--muted)}
.let{background:var(--tip);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pk{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}.pk td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}.pk small{color:var(--muted)}
.tag{display:inline-block;font:700 11.5px/1.2 system-ui;border-radius:6px;padding:3px 6px;white-space:nowrap}.tag.c{background:var(--good-bg);color:var(--good)}.tag.s{background:var(--chip);color:var(--muted)}.tag.q{background:var(--tip)}.tag.n{background:var(--tip);color:var(--ink)}
details summary{cursor:pointer;font-weight:700;color:var(--accent);margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY='profiel-v1';
const VAK={
 na:['Natuurkunde','stroom, krachten, licht'],sk:['Scheikunde','stoffen en reacties'],bi:['Biologie','planten, dieren, je lichaam'],
 wi:['Wiskunde','sommen, formules, grafieken'],ec:['Economie','geld, bedrijven, waarom dingen kosten wat ze kosten'],gs:['Geschiedenis','vroeger en waarom het zo ging'],
 ak:['Aardrijkskunde','landen, klimaat, steden'],du:['Duits',''],fr:['Frans',''],gr:['Grieks','taal en verhalen'],la:['Latijn','taal en verhalen'],
 fi:['Filosofie','nadenken over grote vragen: wat is waar, wat is eerlijk?'],ku:['Kunst algemeen','kunst, muziek, film en theater bekijken en bespreken']};
const IDS=Object.keys(VAK);
const NAAM=v=>({wd:'Wiskunde D',wiA:'Wiskunde A of B',wiB:'Wiskunde B',ne:'Nederlands',en:'Engels',lo:'LO (gym)',co:'Cultuur van de oudheid'}[v]||VAK[v][0]);
/* examen: c = centraal examen (en schoolexamen), s = alleen schoolexamen, ? = navragen */
const EX=v=>v==='lo'||v==='wd'?'s':v==='co'?'q':'c';
const EXT={c:'centraal examen',s:'alleen schoolexamen',
 q:'navragen bij school'};
function maakDuels(){for(let t=0;t<400;t++){const tel={},paar=new Set(),d=[];IDS.forEach(i=>tel[i]=0);let ok=true;
  for(let k=0;k<26&&ok;k++){const kand=IDS.filter(i=>tel[i]<4).sort(()=>Math.random()-.5).sort((a,b)=>tel[a]-tel[b]);let g=false;
   for(const a of kand){for(const b of kand){if(a===b)continue;const s=[a,b].sort().join();if(paar.has(s))continue;paar.add(s);tel[a]++;tel[b]++;d.push(Math.random()<.5?[a,b]:[b,a]);g=true;break}if(g)break}
   if(!g)ok=false}
  if(ok)return d.sort(()=>Math.random()-.5)}}
let S;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
const nieuwS=()=>({duels:maakDuels(),ant:{},klaar:0,nieuw:['ec','fi','ku'],cijfer:{}});
if(!S||!S.duels)S=nieuwS();if(!S.nieuw)S.nieuw=['ec','fi','ku'];if(!S.cijfer)S.cijfer={};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const A=document.getElementById('app');let i=0;
const isNieuw=v=>S.nieuw.includes(v);
function start(){const n=Object.keys(S.ant).length;
 A.innerHTML=`<a href="index.html" class="terug">‹ Alle vakken</a><h1>Welk profiel past bij jou?</h1>
 <p class="sub">Je krijgt steeds twee vakken naast elkaar. Kies welk vak je <b>het leukst</b> vindt en waar je <b>het beste in</b> bent. Twijfel je? Kies ‘even’. Niet te lang nadenken: je eerste gevoel is meestal goed.</p>
 <div class="kaart"><h3>1. Welke vakken heb je nog niet (echt) gehad?</h3><p class="sub" style="margin:0 0 8px">Bij die vakken vragen we alleen of het je <b>leuk lijkt</b>, niet waar je goed in bent.</p>
 <div class="acts" style="margin-top:4px">${IDS.map(v=>`<button class="btn ${isNieuw(v)?'':'licht'}" data-n="${v}" style="padding:8px 12px;font-size:14px">${isNieuw(v)?'✓ ':''}${VAK[v][0]}</button>`).join('')}</div></div>
 <div class="kaart"><h3>2. Je cijfers (mag je overslaan)</h3><p class="sub" style="margin:0 0 8px">Weet je niet goed waar je beter in bent? Vul je laatste rapportcijfers in, dan tellen die mee bij ‘goed in’.</p>
 ${IDS.filter(v=>!isNieuw(v)).map(v=>`<label class="rij" style="margin:6px 0"><span class="nm">${VAK[v][0]}</span><input data-c="${v}" inputmode="decimal" value="${S.cijfer[v]??''}" placeholder="bijv. 7,2" style="width:90px;font:16px system-ui;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink)"></label>`).join('')}</div>
 <div class="kaart"><h3>3. De tweetallen</h3><p style="margin:0">26 tweetallen, ongeveer 5 minuten.${n?` Je hebt er al ${n} gedaan.`:''}</p>
 <div class="acts"><button class="btn" id="go">${n?(n>=S.duels.length?'Nog eens langs':'Verder waar je was'):'Begin'}</button>${n>=S.duels.length?'<button class="btn licht" id="uit">Bekijk de uitslag</button>':''}${n?'<button class="btn licht" id="opn">Opnieuw (nieuwe tweetallen)</button>':''}</div></div>`;
 A.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const v=b.dataset.n;S.nieuw=isNieuw(v)?S.nieuw.filter(x=>x!==v):[...S.nieuw,v];save();start()});
 A.querySelectorAll('[data-c]').forEach(inp=>inp.onchange=()=>{const x=parseFloat(inp.value.replace(',','.'));if(x>=1&&x<=10)S.cijfer[inp.dataset.c]=x;else delete S.cijfer[inp.dataset.c];save()});
 document.getElementById('go').onclick=()=>{i=0;while(S.ant[i]&&klaarMet(i)&&i<S.duels.length-1)i++;duel()};
 const u=document.getElementById('uit');if(u)u.onclick=uitslag;const o=document.getElementById('opn');if(o)o.onclick=()=>{if(confirm('Opnieuw beginnen?')){const nw=S.nieuw,c=S.cijfer;S=nieuwS();S.nieuw=nw;S.cijfer=c;save();start()}}}
const skipGoed=k=>{const [a,b]=S.duels[k];return isNieuw(a)||isNieuw(b)};
const klaarMet=k=>{const x=S.ant[k]||{};return x.leuk&&(x.goed||skipGoed(k))};
const knop=(id,kant,gek)=>`<button class="vak${gek?' gek':''}" data-k="${kant}">${VAK[id][0]}${isNieuw(id)?' <small>(nog niet gehad)</small>':''}${VAK[id][1]?`<small>${VAK[id][1]}</small>`:''}</button>`;
function duel(){const [a,b]=S.duels[i],an=S.ant[i]||{};const n=S.duels.length,sk=skipGoed(i);
 const blok=(v,tit)=>`<div class="vraag">${tit}</div><div class="duel" data-v="${v}">${knop(a,'a',an[v]==='a')}<button class="even${an[v]==='='?' gek':''}" data-k="=">even</button>${knop(b,'b',an[v]==='b')}</div>`;
 A.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><button class="btn licht" id="stop" style="padding:8px 14px">‹ Stoppen</button><span class="sub" style="margin:0">${i+1} / ${n}</span></div>
 <div class="balk"><i style="width:${i/n*100}%"></i></div>
 <div class="kaart">${blok('leuk',sk?'😍 Wat lijkt je het leukst?':'😍 Wat vind je het leukst?')}${sk?`<p class="sub" style="font-size:14px">💪 ‘Waar ben je het beste in?’ slaan we hier over: ${[a,b].filter(isNieuw).map(v=>VAK[v][0]).join(' en ')} heb je nog niet gehad.</p>`:blok('goed','💪 Waar ben je het beste in?')}
 <div class="acts" style="justify-content:space-between">${i?'<button class="btn licht" id="vorig">‹ Vorige</button>':'<span></span>'}<button class="btn" id="vd" ${klaarMet(i)?'':'disabled style="opacity:.4"'}>${i===n-1?'Naar de uitslag':'Volgende ›'}</button></div></div>`;
 document.getElementById('stop').onclick=start;
 A.querySelectorAll('.duel button').forEach(b=>b.onclick=()=>{const v=b.parentNode.dataset.v,was=klaarMet(i);S.ant[i]={...(S.ant[i]||{}),[v]:b.dataset.k};save();duel();if(klaarMet(i)&&!was)setTimeout(volg,300)});
 const vg=document.getElementById('vorig');if(vg)vg.onclick=()=>{i--;duel()};
 document.getElementById('vd').onclick=volg}
function volg(){if(i<S.duels.length-1){i++;duel()}else{S.klaar=1;save();uitslag()}}
function scores(){const s={};IDS.forEach(v=>s[v]={leuk:0,goed:0,nl:0,ng:0});
 S.duels.forEach(([a,b],k)=>{const x=S.ant[k];if(!x)return;const tel=(v,r)=>{if(r==='a')s[a][v]+=1;else if(r==='b')s[b][v]+=1;else if(r==='='){s[a][v]+=.5;s[b][v]+=.5}};
  if(x.leuk){s[a].nl++;s[b].nl++;tel('leuk',x.leuk)}
  if(x.goed&&!skipGoed(k)){s[a].ng++;s[b].ng++;tel('goed',x.goed)}});
 IDS.forEach(v=>{const o=s[v];o.leuk=o.nl?o.leuk/o.nl:.5;o.goed=o.ng?o.goed/o.ng:null;
  const c=S.cijfer[v];if(c!=null){const cs=Math.max(0,Math.min(1,(c-4.5)/4));o.goed=o.goed==null?cs:.6*cs+.4*o.goed}
  o.nieuw=isNieuw(v);o.tot=o.goed==null?o.leuk:.5*o.leuk+.5*o.goed});
 s.wd={...s.wi};return s}
const PROF=[
 {n:'Natuur & Techniek',kl:'#2E86C1',vast:['na','sk','wi'],keuze:[['bi','wd']],vrij:['ak','bi','du','ec','fi','fr','gs','gr','ku','la','wd'],tekst:'Natuurkunde, scheikunde en wiskunde B, plus biologie of wiskunde D.'},
 {n:'Natuur & Gezondheid',kl:'#1E8E5A',vast:['bi','sk'],keuze:[['wi'],['ak','na']],vrij:['ak','du','ec','fi','fr','gs','gr','ku','la','na','wd'],tekst:'Biologie en scheikunde, wiskunde A of B, en aardrijkskunde of natuurkunde.'},
 {n:'Economie & Maatschappij',kl:'#D68910',vast:['ec','gs'],keuze:[['wi'],['ak','du','fr']],vrij:['ak','bi','du','fi','fr','gr','ku','la','wd'],tekst:'Economie en geschiedenis, wiskunde A of B, en aardrijkskunde, Duits of Frans.'},
 {n:'Cultuur & Maatschappij',kl:'#8E44AD',vast:['gs'],keuze:[['wi'],['ak','ec'],['du','fi','fr','gr','ku','la']],vrij:['ak','bi','du','ec','fi','fr','gr','ku','la'],tekst:'Geschiedenis, wiskunde A of B, aardrijkskunde of economie, en een taal, filosofie of kunst.'}];
function pakket(p,s){const best=l=>l.slice().sort((a,b)=>s[b].tot-s[a].tot)[0];
 const taal1=best(['la','gr']),taal2=best(['du','fr']);const bezet=new Set([taal1,taal2]);
 const prof=[...p.vast,...p.keuze.map(box=>{const v=best(box.filter(x=>!bezet.has(x)));bezet.add(v);return v})];prof.forEach(v=>bezet.add(v));
 const wiB=p.n.startsWith('Natuur & T');
 const vrij=best(p.vrij.filter(v=>!bezet.has(v)&&!(v==='wd'&&!wiB)&&!(v==='wd'&&prof.includes('wd'))));
 const sc=prof.reduce((t,v)=>t+s[v].tot,0)/prof.length;
 const rij=[['ne','gemeenschappelijk'],['en','gemeenschappelijk'],['lo','gemeenschappelijk'],['co','gemeenschappelijk'],[taal1,'gemeenschappelijk (Latijn of Grieks)'],[taal2,'gemeenschappelijk (Duits of Frans)'],
  ...prof.map((v,j)=>[v==='wi'?(wiB?'wiB':'wiA'):v,j<p.vast.length?'profielvak':'profielvak (keuze)']),[vrij,'vrije deel']];
 return {...p,sc,rij,prof,wiB}}
function uitslag(){const s=scores();const pr=v=>Math.round(v*100);
 const R=PROF.map(p=>pakket(p,s)).sort((a,b)=>b.sc-a.sc);
 const gelijk=R.filter(p=>pr(p.sc)===pr(R[0].sc));
 const lijst=p=>`<table class="pk">${p.rij.map(([v,w])=>`<tr><td><b>${NAAM(v)}</b>${['ec','fi','ku'].includes(v)&&isNieuw(v)?' <span class="tag n">nieuw</span>':''}<br><small>${w}</small></td><td><span class="tag ${EX(v)}">${EXT[EX(v)]}</span></td></tr>`).join('')}</table>`;
 const rij=IDS.slice().sort((a,b)=>s[b].tot-s[a].tot);
 A.innerHTML=`<a href="index.html" class="terug">‹ Alle vakken</a><h1>Jouw uitslag</h1>
 <p class="sub">Op basis van wat je het leukst vindt en waar je goed in bent${Object.keys(S.cijfer).length?' (ook met je cijfers)':''}. Vakken die je nog niet hebt gehad tellen alleen mee met ‘lijkt me leuk’. Het is een hulpmiddel, geen besluit: praat er ook over met je mentor en thuis.</p>
 ${gelijk.length>1?`<div class="let"><b>Gelijkspel!</b> ${gelijk.map(p=>p.n).join(' en ')} passen even goed. Hieronder zie je bij allebei welke 11 vakken het zouden worden: kijk welk rijtje je het fijnst vindt.</div>`:''}
 <h2>Profielen</h2>
 ${R.map((p,k)=>`<div class="kaart prof${pr(p.sc)===pr(R[0].sc)?' top':''}"><h3>${pr(p.sc)===pr(R[0].sc)?'🏆 ':''}${p.n} <span style="float:right">${pr(p.sc)}%</span></h3><div class="balk"><i style="width:${pr(p.sc)}%;background:${p.kl}"></i></div>
  <div class="pakket">${p.tekst}</div>
  <details${pr(p.sc)>=pr(R[0].sc)-3?' open':''}><summary>Jouw 11 vakken in dit profiel</summary>${lijst(p)}${p.wiB?'<p class="pakket">Wiskunde B mag alleen als je eindcijfer wiskunde B in klas 3 minimaal een 6,0 is.</p>':''}</details></div>`).join('')}
 <div class="let"><b>Examenvak?</b> Bijna alle vakken hebben een centraal examen. LO en wiskunde D sluit je af met alleen een schoolexamen. Of Cultuur van de oudheid een centraal examen heeft, staat niet op het formulier: vraag het na op school.</div>
 <h2>Alle vakken</h2><div class="kaart"><p class="sub" style="margin:0 0 8px">Groen = leuk, blauw = goed in (grijs = nog niet gehad).</p>
 ${rij.map(v=>`<div class="rij"><span class="nm">${VAK[v][0]}${S.cijfer[v]!=null?` <small>(${String(S.cijfer[v]).replace('.',',')})</small>`:''}</span><span class="b"><i style="width:${pr(s[v].leuk)}%;background:#1E8E5A"></i></span><span class="b">${s[v].goed==null?'':`<i style="width:${pr(s[v].goed)}%;background:#2E86C1"></i>`}</span></div>`).join('')}</div>
 <div class="acts"><button class="btn licht" id="cij">Nieuwe vakken en cijfers aanpassen</button><button class="btn licht" id="terugk">Antwoorden aanpassen</button><button class="btn licht" id="opn">Opnieuw doen</button></div>`;
 document.getElementById('cij').onclick=start;
 document.getElementById('opn').onclick=()=>{if(confirm('Opnieuw beginnen met nieuwe tweetallen?')){const nw=S.nieuw,c=S.cijfer;S=nieuwS();S.nieuw=nw;S.cijfer=c;save();start()}};
 document.getElementById('terugk').onclick=()=>{i=0;duel()}}
window.leerVoortgang=()=>Math.round(Object.keys(S.ant).length/S.duels.length*100);
S.klaar?uitslag():start();
</script>
</body>
</html>
