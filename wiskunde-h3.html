  <div class="modes">
    <button class="mode" id="plijn"><h3>📈 Welke formule?</h3><p>Grafiek gegeven: kies de formule.</p></button>
    <button class="mode" id="pkies"><h3>🎯 Welke lijn?</h3><p>Formule gegeven: kies de lijn.</p></button>
    <button class="mode" id="prc"><h3>🧮 Twee punten</h3><p>Reken a en b uit twee punten.</p></button>

    <button class="mode" id="pctx"><h3>🚕 In het echt</h3><p>Taxi, kaars, ijssalon.</p></button>
    <button class="mode" id="pberg"><h3>📈 De stijgende lijn</h3><p>Alle vragen, één stuk per paragraaf.</p></button>

<script>
/* ---------- plaatjes ---------- */
const KLR=['#2E86C1','#E67E22','#27AE60','#C0392B'];
function figLijn(lijnen,o={}){const xmin=o.xmin??-2,xmax=o.xmax??8,ymin=o.ymin??-2,ymax=o.ymax??10,W=300,H=Math.round(300*(ymax-ymin)/(xmax-xmin));const Hh=Math.min(Math.max(H,180),340);
 const X=x=>20+(x-xmin)/(xmax-xmin)*(W-30),Y=y=>Hh-20-(y-ymin)/(ymax-ymin)*(Hh-30);let s='';
 const st=(xmax-xmin)>20?5:1,sy=(ymax-ymin)>20?5:1;
 for(let x=Math.ceil(xmin/st)*st;x<=xmax;x+=st)s+=`<line x1="${X(x)}" y1="${Y(ymin)}" x2="${X(x)}" y2="${Y(ymax)}" stroke="currentColor" stroke-opacity=".12"/>`+(x&&x%(st*2)===0||st===1&&x?`<text x="${X(x)}" y="${Y(0)+13}" text-anchor="middle" font-size="9" fill="currentColor" opacity=".7">${x}</text>`:'');
 for(let y=Math.ceil(ymin/sy)*sy;y<=ymax;y+=sy)s+=`<line x1="${X(xmin)}" y1="${Y(y)}" x2="${X(xmax)}" y2="${Y(y)}" stroke="currentColor" stroke-opacity=".12"/>`+(y&&(sy===1||y%(sy*2)===0)?`<text x="${X(0)-4}" y="${Y(y)+3}" text-anchor="end" font-size="9" fill="currentColor" opacity=".7">${y}</text>`:'');
 s+=`<line x1="${X(xmin)}" y1="${Y(0)}" x2="${X(xmax)}" y2="${Y(0)}" stroke="currentColor" stroke-width="1.5"/><line x1="${X(0)}" y1="${Y(ymin)}" x2="${X(0)}" y2="${Y(ymax)}" stroke="currentColor" stroke-width="1.5"/><text x="${X(xmax)-4}" y="${Y(0)-5}" text-anchor="end" font-size="11" fill="currentColor">${o.xl||'x'}</text><text x="${X(0)+5}" y="${Y(ymax)+11}" font-size="11" fill="currentColor">${o.yl||'y'}</text>`;
 lijnen.forEach((l,i)=>{const k=l.kl||KLR[i%4];if(l.x!=null){s+=`<line x1="${X(l.x)}" y1="${Y(ymin)}" x2="${X(l.x)}" y2="${Y(ymax)}" stroke="${k}" stroke-width="3"/>`;return}
  const p=[xmin,xmax].map(x=>[x,l.a*x+l.b]);s+=`<clipPath id="c${i}"><rect x="${X(xmin)}" y="${Y(ymax)}" width="${X(xmax)-X(xmin)}" height="${Y(ymin)-Y(ymax)}"/></clipPath><line clip-path="url(#c${i})" x1="${X(p[0][0])}" y1="${Y(p[0][1])}" x2="${X(p[1][0])}" y2="${Y(p[1][1])}" stroke="${k}" stroke-width="3"/>`;if(l.nm)s+=`<text x="${X(xmax)-6}" y="${Y(Math.max(ymin+0.5,Math.min(ymax-0.5,l.a*xmax+l.b)))-6}" text-anchor="end" font-size="12" font-weight="800" fill="${k}">${l.nm}</text>`});
 (o.pt||[]).forEach(([x,y])=>{s+=`<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="#C0392B"/><text x="${X(x)+7}" y="${Y(y)-6}" font-size="10" fill="currentColor">(${String(x).replace('.',',')}; ${String(y).replace('.',',')})</text>`});
 return `<svg viewBox="0 0 ${W} ${Hh}" class="fig" style="max-width:340px" role="img" aria-label="grafiek">${s}</svg>`}
function figTabel(...rijen){return `<table class="gt" style="width:auto">${rijen.map(r=>`<tr>${r.map((c,j)=>j?`<td>${String(c).replace('.',',')}</td>`:`<th>${c}</th>`).join('')}</tr>`).join('')}</table>`}
/* ---------- rekenen ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const pick=a=>a[Math.random()*a.length|0];
const k=x=>String(Math.round(x*100)/100).replace('.',',');
const fm=(a,b)=>`y = ${a===1?'':a===-1?'−':k(a).replace('-','−')}x${b?` ${b<0?'−':'+'} ${k(Math.abs(b))}`:''}`;
const RC=[-3,-2,-1,-0.5,0.5,1,2,3];
const LHINT='<b>b</b> = startgetal: waar de lijn de y-as snijdt (x = 0). <b>a</b> = richtingscoëfficiënt: hoeveel de lijn stijgt (+) of daalt (−) als je <b>1 naar rechts</b> gaat. Kies twee roosterpunten en reken a = Δy ÷ Δx.';
function formuleBijLijn(){const a=pick(RC),b=R(-1,6);const goed=fm(a,b);const f=new Set();[[b,a],[-a,b],[a,-b],[a*2,b],[a,b+1]].forEach(([x,y])=>{if(x!==0&&fm(x,y)!==goed)f.add(fm(x,y))});
 return {fig:figLijn([{a,b}],{xmin:-4,xmax:6,ymin:-6,ymax:10}),q:'Welke formule hoort bij deze lijn?',a:goed,opts:[goed,...[...f].slice(0,3)],w:`De lijn snijdt de y-as bij ${b}: b = ${b}. Eén stap naar rechts gaat de lijn ${a>0?k(a)+' omhoog':k(-a)+' omlaag'}: a = ${k(a)}. Dus <b>${goed}</b>.`,hint:LHINT}}
function lijnBijFormule(){const ls=[];while(ls.length<3){const a=pick(RC),b=R(-1,6);if(!ls.some(l=>l.a===a&&l.b===b))ls.push({a,b})}
 const t=R(0,2),nm=['blauw','oranje','groen'];return {fig:figLijn(ls,{xmin:-4,xmax:6,ymin:-6,ymax:10}),q:`Welke lijn hoort bij <b>${fm(ls[t].a,ls[t].b)}</b>?`,a:nm[t],opts:nm.slice(),w:`Begin bij b = ${ls[t].b} op de y-as en ga 1 naar rechts en ${k(ls[t].a)} omhoog: dat is de <b>${nm[t]}e</b> lijn.`,hint:LHINT}}
function rcTweePunten(){const x1=R(-2,4),x2=x1+R(1,5),a=pick(RC),b=R(-5,10),y1=a*x1+b,y2=a*x2+b;const t=R(0,1);
 if(t===0)return {q:`Een lijn gaat door (${k(x1)}; ${k(y1)}) en (${k(x2)}; ${k(y2)}). Bereken de richtingscoëfficiënt a.`,a,num:1,tol:.01,w:`a = Δy ÷ Δx = (${k(y2)} − ${k(y1)}) ÷ (${x2} − ${x1}) = ${k(y2-y1)} ÷ ${x2-x1} = <b>${k(a)}</b>.`,hint:'a = Δy ÷ Δx: het verschil in y gedeeld door het verschil in x (zelfde volgorde boven en onder!).'};
 return {q:`Een lijn gaat door (${k(x1)}; ${k(y1)}) en (${k(x2)}; ${k(y2)}). Bereken het getal b in y = ax + b.`,a:b,num:1,tol:.01,w:`1) a = (${k(y2)} − ${k(y1)}) ÷ ${x2-x1} = ${k(a)}. 2) Vul (${x1}; ${k(y1)}) in: ${k(y1)} = ${k(a)} × ${x1} + b, dus b = ${k(y1)} − ${k(a*x1)} = <b>${k(b)}</b>.`,hint:'Eerst a uitrekenen (Δy ÷ Δx). Daarna één punt invullen in y = ax + b en b oplossen.'}}
function snijVraag(){const t=R(0,2);
 if(t===0){const a=pick([-3,-2,2,3,4,5]),b=R(-10,10)||3;const x=-b/a;return {q:`Bereken het snijpunt van ${fm(a,b)} met de x-as. Geef de x-coördinaat${Number.isInteger(x)?'':' (op 2 decimalen)'}.`,a:Math.round(x*100)/100,num:1,tol:.011,w:`Op de x-as is y = 0: ${k(a)}x ${b<0?'−':'+'} ${Math.abs(b)} = 0 → ${k(a)}x = ${k(-b)} → x = ${k(-b)} ÷ ${k(a)} = <b>${k(x)}</b>.`,hint:'Snijpunt met de x-as: vul y = 0 in en los de vergelijking op (balansmethode).'}}
 const a1=pick([1,2,3,-1]),a2=pick([-2,-1,0.5,4]);if(a1===a2)return snijVraag();const xs=R(-2,6),b1=R(-3,6),b2=a1*xs+b1-a2*xs;
 if(t===1)return {fig:figLijn([{a:a1,b:b1,nm:'l'},{a:a2,b:b2,nm:'m'}],{xmin:-4,xmax:8,ymin:Math.min(-4,a1*xs+b1-4),ymax:Math.max(10,a1*xs+b1+4)}),q:`l: ${fm(a1,b1)} en m: ${fm(a2,b2)}. Bereken de x-coördinaat van het snijpunt.`,a:xs,num:1,tol:.01,w:`Stel gelijk: ${k(a1)}x + ${k(b1)} = ${k(a2)}x + ${k(b2)}. → ${k(a1-a2)}x = ${k(b2-b1)} → x = <b>${xs}</b>.`,hint:'Snijpunt van twee lijnen: zet de twee formules gelijk aan elkaar en los x op.'};
 const p=R(2,6),q2=R(10,30),c=R(40,90),x0=(c-q2)/p;const ok=`x > ${k(Math.round(x0*100)/100)}`;
 return {q:`Los op: ${p}x + ${q2} > ${c}`,a:ok,opts:[ok,`x < ${k(Math.round(x0*100)/100)}`,`x > ${k(Math.round((c+q2)/p*100)/100)}`,`x > ${k(Math.round((c-q2)*p*100)/100)}`],w:`1) Los eerst de vergelijking op: ${p}x + ${q2} = ${c} → ${p}x = ${c-q2} → x = ${k(x0)}. 2) Het getal voor x is positief: hoe groter x, hoe groter de linkerkant. Dus de oplossing is <b>x > ${k(Math.round(x0*100)/100)}</b>.`,hint:'Werkschema ongelijkheid: los eerst de bijbehorende vergelijking op (= in plaats van >). Kijk daarna in een schets of met een getal welke kant waar is.'}}
function contextVraag(){const t=R(0,2);
 if(t===0){const vast=R(2,4)+0.5,km=pick([1.8,2.1,2.4,2.5]),d=R(5,25);return {q:`Een taxirit kost een vast bedrag van € ${k(vast)} plus € ${k(km)} per kilometer. Wat kost een rit van ${d} km (in euro)?`,a:Math.round((vast+km*d)*100)/100,num:1,tol:.01,w:`K = ${k(km)}a + ${k(vast)} → K = ${k(km)} × ${d} + ${k(vast)} = <b>${k(vast+km*d)}</b>.`,hint:'Startgetal = het vaste bedrag, richtingscoëfficiënt = de prijs per kilometer. Vul het aantal km in.'}}
 if(t===1){const l0=R(20,30),v=pick([0.5,1,1.5,2]),tt=R(2,8);return {q:`Een kaars is ${l0} cm lang en brandt elk uur ${k(v)} cm korter. Hoe lang is hij na ${tt} uur (cm)?`,a:l0-v*tt,num:1,tol:.01,w:`L = ${l0} − ${k(v)}t → ${l0} − ${k(v)} × ${tt} = <b>${k(l0-v*tt)}</b>. De rc is negatief, want de kaars wordt korter.`,hint:'Begin = startgetal, korter worden per uur = een negatieve richtingscoëfficiënt.'}}
 const x1=R(1,4)*10,x2=x1+R(2,5)*10,y1=R(20,40),y2=y1+R(10,40),x3=x1+(x2-x1)/2;const a=(y2-y1)/(x2-x1);
 return {q:`Bij ${x1} graden verkoopt een ijssalon ${y1} bekers, bij ${x2} graden ${y2}. Neem aan dat het verband lineair is. Hoeveel bekers bij ${x3} graden? (interpoleren)`,a:Math.round((y1+a*(x3-x1))*100)/100,num:1,tol:.05,w:`a = (${y2} − ${y1}) ÷ (${x2} − ${x1}) = ${k(a)} per graad. ${x3} ligt ${x3-x1} graden boven ${x1}: ${y1} + ${k(a)} × ${x3-x1} = <b>${k(y1+a*(x3-x1))}</b>.`,hint:'Interpoleren = een waarde tússen twee bekende punten schatten. Reken eerst uit hoeveel er per graad bij komt.'}}
Object.defineProperty(window,'TOETSGEN',{get:()=>[formuleBijLijn(),rcTweePunten(),snijVraag(),contextVraag()]});

const VB=(t,h)=>`<div class="vb"><b>📎 Voorbeeld: ${t}</b><br>${h}</div>`;
const H=[
// ================= 3.1 =================
{id:'3.1',t:'Lineaire formules',kort:'y = ax + b, richtingscoëfficiënt, tekenen, evenwijdig, evenredig',ic:'📈',lp:[
 ['Wat is een lineaire formule?',`<p>Een formule van de vorm <b>y = ax + b</b> heet een <b>lineaire formule</b>. De grafiek is altijd een <b>rechte lijn</b>.</p><p>Voorbeelden: y = 0,5x + 2, y = −1,5x + 5, y = 3x − 7. Er staat geen x², geen x onder een breuk: alleen ‘een getal keer x’ plus of min een getal.</p>${figLijn([{a:0.5,b:2}],{xmin:-1,xmax:6,ymin:-1,ymax:6})}<p>Hierboven: de lijn y = 0,5x + 2.</p><p>💡 Snap je het zo? Elke keer dat x 1 groter wordt, komt er bij y steeds <b>hetzelfde</b> bij. Daarom wordt het een rechte lijn.</p>`,
  ['Welke formule is een lineaire formule?','y = 4x − 3','y = 4x² − 3|y = 4 : x|y = x² + x','Alleen y = 4x − 3 heeft de vorm y = ax + b (a = 4, b = −3).<br>Fout: met x² of met x onder de deelstreep krijg je een kromme lijn, geen rechte.']],
 ['Het getal b: snijpunt met de y-as',`<p>In y = ax + b vertelt <b>b</b> waar de lijn de <b>y-as</b> snijdt: in het punt <b>(0, b)</b>.</p><p>Waarom? Op de y-as is x = 0. Vul je x = 0 in, dan blijft over: y = a × 0 + b = b.</p><ul><li>y = 0,5x + 2 snijdt de y-as in (0, 2).</li><li>y = −1,5x + 5 snijdt de y-as in (0, 5).</li><li>y = 3x − 7 snijdt de y-as in (0, −7).</li></ul><p>In een verhaal is b vaak de <b>beginwaarde</b>: wat er is als je nog niets gedaan hebt (bij x = 0).</p>`,
  ['Waar snijdt y = 2x − 6 de y-as?','(0, −6)','(0, 2)|(−6, 0)|(3, 0)','Vul x = 0 in: y = 2 × 0 − 6 = −6, dus (0, −6).<br>Fout: 2 is de rc, niet het snijpunt. (−6, 0) heeft x en y omgedraaid. (3, 0) is het snijpunt met de <b>x</b>-as.']],
 ['Het getal a: de richtingscoëfficiënt',`<p>Het getal <b>a</b> in y = ax + b heet de <b>richtingscoëfficiënt</b> (kort: <b>rc</b>). Het zegt hoe steil de lijn is.</p><p><b>rc = a betekent: ga je 1 naar rechts, dan ga je a omhoog.</b> Dat is een trapje.</p>${figLijn([{a:0.5,b:2},{a:-1.5,b:5}],{xmin:-1,xmax:6,ymin:-1,ymax:6,pt:[[0,2],[1,2.5],[0,5],[1,3.5]]})}<ul><li>l: y = 0,5x + 2 → rc<sub>l</sub> = 0,5: 1 naar rechts, 0,5 omhoog (stijgt).</li><li>m: y = −1,5x + 5 → rc<sub>m</sub> = −1,5: 1 naar rechts, −1,5 omhoog = <b>1,5 omlaag</b> (daalt). Dat is hetzelfde als 2 naar rechts en 3 omlaag.</li></ul><p>Positieve rc: lijn stijgt. Negatieve rc: lijn daalt. Hoe groter het getal (zonder min), hoe steiler.</p><p>Let op: in y = 4 − 2,5x staat de x achteraan. De rc is het getal vóór de x: <b>−2,5</b>. De 4 is b.</p>`,
  ['Wat is de rc van y = 4 − 2,5x?','−2,5','4|2,5|−4','De rc is het getal dat bij de x hoort, mét het teken ervoor: −2,5.<br>Fout: 4 is b (snijpunt y-as). 2,5 vergeet de min. −4 haalt a en b door elkaar.']],
 ['Werkschema: een lijn tekenen',`<p>Voor een rechte lijn heb je maar <b>twee punten</b> nodig.</p><ol><li>Maak een tabel met <b>twee handige x-waarden</b> (zo dat y een mooi getal wordt).</li><li>Reken bij elke x de y uit.</li><li>Zet de twee punten in het assenstelsel en trek er een rechte lijn door.</li></ol>${VB('y = −0,8x + 3',`Stap 1 en 2: x = 0 geeft y = 3; x = 5 geeft y = −0,8 × 5 + 3 = −4 + 3 = −1.<br>${figTabel(['x',0,5],['y',3,-1])}Stap 3: punten (0, 3) en (5, −1) verbinden.${figLijn([{a:-0.8,b:3}],{xmin:-1,xmax:6,ymin:-2,ymax:4,pt:[[0,3],[5,-1]]})}Waarom x = 5? Omdat 0,8 × 5 = 4 een heel getal is.`)}<p>Je kunt ook het trapje gebruiken: begin in (0, b) en zet stapjes van ‘1 naar rechts, a omhoog’.</p>`,
  ['Je tekent y = 0,25x + 1. Welke x-waarde geeft naast x = 0 een handig tweede punt?','x = 4','x = 1|x = 3|x = 0,25','x = 4 geeft y = 0,25 × 4 + 1 = 2, een heel getal.<br>Fout: x = 1 geeft 1,25 en x = 3 geeft 1,75: lastig precies te tekenen. x = 0,25 geeft ook een kommagetal.']],
 ['Ligt een punt op de lijn?',`<p>Een punt ligt op een lijn als de coördinaten <b>kloppen</b> in de formule.</p><ol><li>Vul de x van het punt in de formule in.</li><li>Reken y uit.</li><li>Is dat de y van het punt? Dan ligt het erop. Anders niet.</li></ol>${VB('A(10, −6) en l: y = −0,8x + 3',`1. x = 10 invullen: y = −0,8 × 10 + 3<br>2. y = −8 + 3 = −5<br>3. Het punt heeft y = −6, de lijn geeft −5. Dus A ligt <b>niet</b> op l.`)}`,
  ['Ligt B(4, 5) op y = 1,5x − 1?','ja, want 1,5 × 4 − 1 = 5','nee, want 1,5 × 4 − 1 = 7|nee, want 1,5 × 5 − 1 = 6,5|ja, want 4 + 1 = 5','1,5 × 4 = 6, min 1 is 5. Dat is precies de y van B, dus B ligt erop.<br>Fout: 1,5 × 4 − 1 is niet 7. In de derde optie is de y ingevuld in plaats van de x. ‘4 + 1’ heeft niets met de formule te maken.']],
 ['Evenwijdige lijnen',`<p><b>Lijnen met dezelfde rc zijn evenwijdig.</b> Ze zijn even steil en snijden elkaar nooit.</p>${figLijn([{a:3,b:-5},{a:3,b:1}],{xmin:-1,xmax:4,ymin:-6,ymax:8})}<p>p: y = 3x − 5 en q: y = 3x + 1 hebben allebei rc 3, dus p en q zijn evenwijdig.</p>${VB('evenwijdige lijn door een punt op de y-as',`Lijn k is evenwijdig met l: y = −0,8x + 3 en gaat door B(0, 12).<br>1. Evenwijdig → zelfde rc: a = −0,8.<br>2. Door (0, 12) → b = 12.<br>3. k: y = −0,8x + 12.`)}<p>Een lijn door de <b>oorsprong</b> O(0, 0) heeft b = 0, bijvoorbeeld y = −2,5x.</p>`,
  ['Lijn n is evenwijdig met y = 1,2x − 2 en gaat door (0, 4). Wat is de formule van n?','y = 1,2x + 4','y = 4x − 2|y = −1,2x + 4|y = 1,2x − 2','Evenwijdig = zelfde rc (1,2), door (0, 4) = b is 4.<br>Fout: y = 4x − 2 verwisselt rc en b. −1,2 heeft het verkeerde teken. y = 1,2x − 2 is de oude lijn zelf.']],
 ['Horizontale en verticale lijnen',`<p><b>Horizontale lijn</b>: ga je 1 naar rechts, dan ga je 0 omhoog. Dus rc = 0. De formule y = 0x + 2 schrijf je kort als <b>y = 2</b>. Alle punten op die lijn hebben y-coördinaat 2.</p>${figLijn([{a:0,b:2}],{xmin:-1,xmax:5,ymin:-1,ymax:5,pt:[[3,2]]})}<p><b>Verticale lijn</b> (rechtop): alle punten hebben dezelfde x, bijvoorbeeld x = 3. De formule is <b>x = 3</b>. Een verticale lijn heeft <b>geen rc</b> en kun je niet schrijven als y = ax + b.</p><ul><li>y = 5: horizontaal door (0, 5).</li><li>x = 6: verticaal door (6, 0).</li></ul><p>💡 Ezelsbruggetje: ‘y = getal’ ligt plat (alle y’s gelijk), ‘x = getal’ staat rechtop.</p>`,
  ['Welke formule hoort bij de verticale lijn door (5, 4)?','x = 5','y = 5|y = 4|x = 4','Op een verticale lijn hebben alle punten dezelfde x, hier 5. Dus x = 5.<br>Fout: y = 4 is de horizontale lijn door dat punt. y = 5 en x = 4 halen x en y door elkaar.']],
 ['Een formule uit een verhaal',`<p>In veel verhalen zit een vast bedrag plus een bedrag per stuk. Dat geeft een lineaire formule:</p><p><b>totaal = (per stuk) × aantal + vast bedrag</b>, dus a = het bedrag per stuk, b = het vaste bedrag.</p><ul><li><b>Vaste kosten</b> (huur, machines) hangen niet af van hoeveel je maakt: dat is b.</li><li><b>Variabele kosten</b> (grondstoffen, loon) groeien mee met het aantal: dat is a.</li></ul>${VB('balpennen',`Een fabriek heeft € 200 vaste kosten per dag en € 0,25 per balpen. Kosten K bij q balpennen: <b>K = 0,25q + 200</b>.<br>Het punt (500, 325) betekent: 500 balpennen kosten € 325.<br>Hogere vaste kosten → lijn schuift omhoog. Hogere kosten per pen → lijn wordt steiler.`)}${VB('bestelauto huren',`€ 75 per dag plus € 0,10 per km: B = 0,1a + 75. Voor 50 km: 0,1 × 50 + 75 = € 80.`)}`,
  ['Een taxi kost € 3 instaptarief en € 2,10 per km. Welke formule hoort bij de kosten K bij d km?','K = 2,10d + 3','K = 3d + 2,10|K = 5,10d|K = 2,10d − 3','Per km (a) = 2,10, vast (b) = 3.<br>Fout: K = 3d + 2,10 verwisselt a en b. 5,10d telt het instaptarief bij elke km. Met − 3 krijg je geld terug in plaats van dat je betaalt.']],
 ['Let op de eenheden',`<p>Kijk goed in welke eenheden de formule moet en reken zo nodig eerst om.</p>${VB('vat dat leegloopt',`Een vat bevat 1,2 m water. Per kwartier zakt het peil 30 cm. Gevraagd: h in cm na t minuten.<br>1. Beginhoogte in cm: 1,2 m = <b>120 cm</b>.<br>2. Per minuut: 30 : 15 = <b>2 cm</b> omlaag.<br>3. h = 120 − 2t.<br>(Fout zou zijn: h = 1,2 − 30t, want daar staan meters en kwartieren door elkaar.)`)}${VB('druk onder water',`Aan het oppervlak is de druk 1,015 bar. Per hectometer (100 m) dieper komt er 10 bar bij. P in bar bij d meter diepte:<br>1. Per meter: 10 : 100 = 0,1 bar erbij.<br>2. <b>P = 1,015 + 0,1d</b> (of P = 0,1d + 1,015).<br>⚠ In het boek staat hier een min, maar de druk neemt <b>toe</b>, dus het is een plus.`)}<p>Handig: km/u → m/s: 18 km/u = 18 000 m per 3600 s = 5 m/s. Per uur → per minuut: delen door 60.</p>`,
  ['Een oven warmt 720 °C per uur op en begint op 22 °C. Wat is de formule voor T na m minuten?','T = 12m + 22','T = 720m + 22|T = 22m + 12|T = 12m + 720','Per minuut: 720 : 60 = 12 °C erbij; begin 22. Dus T = 12m + 22.<br>Fout: 720m rekent per uur terwijl m in minuten is. De andere twee halen de getallen door elkaar.']],
 ['Recht evenredig verband',`<p>Een lineair verband met <b>beginwaarde 0</b> heet een <b>(recht) evenredig verband</b>.</p><p>Herkennen, alle drie tegelijk waar:</p><ul><li>de formule is <b>y = ax</b> (geen + b);</li><li>de tabel is een <b>verhoudingstabel</b> (y : x is steeds hetzelfde);</li><li>de grafiek is een lijn door de <b>oorsprong</b> O(0, 0).</li></ul>${figTabel(['t (min)',1,2,3,4],['N (flessen)',140,280,420,560])}<p>Een machine maakt 140 flessen per minuut: N = 140t.</p>${VB('formule uit één punt',`B is evenredig met n, en bij n = 12 hoort B = 99.<br>1. B = an.<br>2. Invullen: a × 12 = 99, dus a = 99 : 12 = 8,25.<br>3. B = 8,25n. Bij n = 14,8: B = 8,25 × 14,8 = 122,1.`)}<p>💡 Niet evenredig: B = 3096d + 19 350, want bij d = 0 is B niet 0.</p>`,
  ['y is evenredig met x en bij x = 15 hoort y = 24. Wat is de formule?','y = 1,6x','y = 0,625x|y = 1,6x + 15|y = 24x','a = 24 : 15 = 1,6, dus y = 1,6x.<br>Fout: 0,625 is 15 : 24, omgedraaid gedeeld. Een evenredig verband heeft geen + b. y = 24x zou bij x = 15 veel te groot zijn.']]
]},
// ================= 3.2 =================
{id:'3.2',t:'Formules opstellen',kort:'Formule bij rc en punt, rc uit twee punten (Δy/Δx), formules in praktische situaties',ic:'✏️',lp:[
 ['Werkschema: formule bij rc en een punt',`<p>Weet je de rc en één punt van de lijn, dan vind je b door het punt in te vullen.</p><ol><li>Schrijf y = ax + b op met de rc al ingevuld.</li><li>Vul de x en y van het punt in.</li><li>Los b op.</li><li>Schrijf de formule op.</li></ol>${VB('rc −0,75 door A(2, 6)',`1. y = −0,75x + b<br>2. x = 2 en y = 6: −0,75 × 2 + b = 6<br>3. −1,5 + b = 6, dus b = 6 + 1,5 = 7,5<br>4. y = −0,75x + 7,5`)}${figLijn([{a:-0.75,b:7.5}],{xmin:0,xmax:9,ymin:0,ymax:8,pt:[[2,6]]})}<p>Let op bij −1,5 + b = 6: je doet <b>+1,5</b> aan beide kanten, dus b = 7,5 (niet 4,5).</p>`,
  ['Lijn l heeft rc 2 en gaat door A(5, 8). Wat is de formule?','y = 2x − 2','y = 2x + 8|y = 2x + 18|y = 8x + 2','2 × 5 + b = 8 → 10 + b = 8 → b = −2. Dus y = 2x − 2.<br>Fout: b is niet zomaar de y van het punt (8), want het punt ligt niet op de y-as. 18 komt van 8 + 10 (teken fout). y = 8x + 2 verwisselt van alles.']],
 ['Formule bij een verhaal met één meetpunt',`<p>Vaak staat in een verhaal hoeveel er per minuut bijkomt (de rc) en één meting. Gebruik dan hetzelfde werkschema. Met een <b>accolade</b> } geef je aan welke getallen bij elkaar horen.</p>${VB('regenton',`Er komt 0,75 liter per minuut bij. Na 10 minuten zit er 25 liter in. N in liters na t minuten.<br>1. N = 0,75t + b<br>2. t = 10 en N = 25 } → 0,75 × 10 + b = 25<br>3. 7,5 + b = 25, dus b = 17,5<br>4. N = 0,75t + 17,5<br>(In het boek staat bij de tussenstap ‘= 10’, dat moet 25 zijn.)`)}${VB('kaars',`Een kaars wordt elke minuut 0,5 mm korter. Na een uur is hij 55 mm.<br>1. l = −0,5t + b (min, want korter)<br>2. Een uur = 60 minuten: −0,5 × 60 + b = 55<br>3. −30 + b = 55, dus b = 85<br>4. l = −0,5t + 85: de kaars was 8,5 cm lang.`)}`,
  ['Een bad krijgt 12 liter per minuut erbij. Na 5 minuten zit er 90 liter in. Wat is de formule voor W na t minuten?','W = 12t + 30','W = 12t + 90|W = 12t + 150|W = 18t','12 × 5 + b = 90 → 60 + b = 90 → b = 30.<br>Fout: 90 is de hoeveelheid na 5 minuten, niet bij het begin. 150 = 90 + 60 (teken fout). 18t gaat door 0, maar er zat al water in.']],
 ['De rc uit twee punten: het trapje',`<p>Weet je twee punten, dan reken je eerst de rc uit. Kijk hoeveel je naar rechts en hoeveel omhoog gaat van het ene punt naar het andere.</p>${VB('A(8, 17) en B(13, 23)',`1. Naar rechts: 13 − 8 = 5<br>2. Omhoog: 23 − 17 = 6<br>3. Bij 1 naar rechts hoort 6 : 5 = 1,2 omhoog. Dus rc = 1,2.<br>4. Invullen: 1,2 × 8 + b = 17 → 9,6 + b = 17 → b = 7,4. Dus y = 1,2x + 7,4.`)}${figLijn([{a:1.2,b:7.4}],{xmin:0,xmax:15,ymin:0,ymax:26,pt:[[8,17],[13,23]]})}<p>💡 Altijd: <b>omhoog gedeeld door naar rechts</b>, niet andersom.</p>`,
  ['Wat is de rc van de lijn door (2, 3) en (6, 11)?','2','0,5|8|4','Naar rechts 6 − 2 = 4, omhoog 11 − 3 = 8, rc = 8 : 4 = 2.<br>Fout: 0,5 is 4 : 8, omgedraaid. 8 en 4 zijn alleen het omhoog- of het naar-rechts-stuk, nog niet gedeeld.']],
 ['rc = Δy / Δx',`<p>Kort opgeschreven gebruik je de letter <b>Δ</b> (spreek uit: <b>delta</b>) voor ‘verschil’.</p><ul><li>Δx = x<sub>B</sub> − x<sub>A</sub> (verschil van de x-coördinaten)</li><li>Δy = y<sub>B</sub> − y<sub>A</sub> (verschil van de y-coördinaten)</li></ul><p><b>a = Δy / Δx = (y<sub>B</sub> − y<sub>A</sub>) / (x<sub>B</sub> − x<sub>A</sub>)</b></p><p>Welk punt je A of B noemt maakt niet uit, als je maar <b>boven en onder dezelfde volgorde</b> neemt. (5 − −1)/(6 − 2) = 6/4 = 1,5 en (−1 − 5)/(2 − 6) = −6/−4 = 1,5: hetzelfde.</p><p>⚠ Pas op met min-getallen: 5 − −1 = 5 + 1 = 6.</p>`,
  ['Je rekent Δy = y<sub>P</sub> − y<sub>Q</sub>. Welke Δx hoort daarbij?','x<sub>P</sub> − x<sub>Q</sub>','x<sub>Q</sub> − x<sub>P</sub>|y<sub>Q</sub> − y<sub>P</sub>|x<sub>P</sub> + x<sub>Q</sub>','Boven en onder dezelfde volgorde: eerst P, dan Q.<br>Fout: x<sub>Q</sub> − x<sub>P</sub> draait de volgorde om, dan krijg je het verkeerde teken. y<sub>Q</sub> − y<sub>P</sub> is geen x-verschil. Optellen is geen verschil.']],
 ['Werkschema: formule door twee punten',`<ol><li>Bereken a = Δy / Δx.</li><li>Vul a en één van de punten in y = ax + b in.</li><li>Los b op.</li><li>Schrijf de formule op.</li></ol>${VB('P(2, −1) en Q(6, 5)',`1. a = (5 − −1) / (6 − 2) = 6 / 4 = 1,5<br>2. y = 1,5x + b met x = 2 en y = −1 } → 1,5 × 2 + b = −1<br>3. 3 + b = −1, dus b = −4<br>4. y = 1,5x − 4`)}${figLijn([{a:1.5,b:-4}],{xmin:-1,xmax:8,ymin:-5,ymax:7,pt:[[2,-1],[6,5]]})}<p>Controle: vul het andere punt in. x = 6: 1,5 × 6 − 4 = 5 ✓.</p>`,
  ['Wat is de formule van de lijn door (−1, 1) en (1, 4)?','y = 1,5x + 2,5','y = 1,5x − 2,5|y = 2,5x + 1,5|y = 0,67x + 1,67','a = (4 − 1)/(1 − −1) = 3/2 = 1,5. Invullen (1, 4): 1,5 + b = 4, b = 2,5.<br>Fout: − 2,5 is een tekenfout. 2,5x + 1,5 verwisselt a en b. 0,67 is Δx/Δy (omgedraaid).']],
 ['Pas op met negatieve getallen',`${VB('C(2, 0) en D(−3, 5)',`1. a = (5 − 0) / (−3 − 2) = 5 / −5 = −1<br>2. Invullen C: −1 × 2 + b = 0<br>3. −2 + b = 0, dus b = 2<br>4. y = −x + 2`)}${VB('grote getallen: P(25, 493) en Q(75, 229)',`1. a = (229 − 493) / (75 − 25) = −264 / 50 = −5,28<br>2. Invullen P: −5,28 × 25 + b = 493<br>3. −132 + b = 493, dus b = 625<br>4. y = −5,28x + 625`)}<p>💡 Een dalende lijn (het tweede punt ligt lager terwijl je naar rechts gaat) moet een <b>negatieve</b> rc krijgen. Zo controleer je je teken.</p>`,
  ['Wat is de rc van de lijn door (−23, −125) en (17, 155)?','7','−7|0,14|2,5','Δy = 155 − −125 = 280, Δx = 17 − −23 = 40, a = 280 : 40 = 7.<br>Fout: −7 heeft een tekenfout. 0,14 is 40 : 280 (omgedraaid). Wie 155 − 125 en 17 − 23 rekent vergeet de minnen en komt op iets anders uit.']],
 ['Een formule aflezen uit een grafiek',`<p>Kies twee punten die <b>precies op een roosterpunt</b> liggen, dan lees je ze goed af. Ga daarna verder met het werkschema voor twee punten.</p>${figLijn([{a:0.4,b:1.6}],{xmin:0,xmax:7,ymin:0,ymax:5,pt:[[1,2],[6,4]]})}<p>De lijn hierboven snijdt de y-as niet op een mooi getal. Maar (1, 2) en (6, 4) zijn goed af te lezen.</p><ol><li>a = (4 − 2) / (6 − 1) = 2 / 5 = 0,4</li><li>0,4 × 1 + b = 2, dus b = 1,6</li><li>y = 0,4x + 1,6</li></ol>`,
  [`Welke formule hoort bij deze lijn? ${figLijn([{a:1,b:5}],{xmin:0,xmax:12,ymin:0,ymax:20,pt:[[0,5],[10,15]]})}`,'y = x + 5','y = 5x + 1|y = x + 10|y = 2x + 5','Door (0, 5) en (10, 15): a = 10 : 10 = 1, b = 5.<br>Fout: 5x + 1 verwisselt a en b. x + 10 heeft de verkeerde b. 2x + 5 is te steil: bij x = 10 zou y = 25 zijn.']],
 ['Lineaire verbanden in praktische situaties',`<p>In een verhaal heten de variabelen niet x en y. Vraag je af: wat is de <b>invoer</b> (staat op de horizontale as) en wat de <b>uitkomst</b>? Dan geldt: <b>a = Δuitkomst / Δinvoer</b>.</p>${VB('bonbons',`Mevrouw Hak krijgt een basisloon plus een bedrag per verkochte doos. Bij 350 dozen verdient ze € 270, bij 500 dozen € 315.<br>1. a = ΔR / Δq = (315 − 270) / (500 − 350) = 45 / 150 = 0,3 → € 0,30 per doos<br>2. 0,3 × 350 + b = 270 → 105 + b = 270 → b = 165 → basisloon € 165<br>3. R = 0,3q + 165`)}${VB('T-shirts',`Bij € 5 verkoopt een marktkoopman 90 shirts per week, bij € 8 nog 30. Gevraagd: q (aantal) uitgedrukt in p (prijs).<br>1. a = Δq / Δp = (30 − 90) / (8 − 5) = −60 / 3 = −20<br>2. −20 × 5 + b = 90 → −100 + b = 90 → b = 190<br>3. q = −20p + 190`)}`,
  ['Bij een energiebedrijf kost 3250 kWh € 841,60 en 4426 kWh € 1112,08. Wat is de prijs per kWh?','€ 0,23','€ 4,35|€ 0,26|€ 270,48','a = (1112,08 − 841,60) / (4426 − 3250) = 270,48 / 1176 = 0,23.<br>Fout: 4,35 is 1176 : 270,48 (omgedraaid). 0,26 is 841,60 : 3250: dan tel je het vastrecht mee. 270,48 is alleen het verschil in euro’s.']],
 ['Een grafiek uit stukken',`<p>Soms verandert de prijs per stuk na een bepaald aantal (staffelprijzen). Dan bestaat de grafiek uit <b>lijnstukken</b> met elk een eigen formule.</p>${VB('geboortekaartjes',`De eerste 50 kaartjes kosten € 1,95 per stuk, de volgende 50 € 1,45 per stuk.<br>• Van 0 tot 50: K = 1,95q. Bij q = 50: K = 97,50.<br>• Van 50 tot 100: rc 1,45 door (50; 97,50): 1,45 × 50 + b = 97,50 → 72,50 + b = 97,50 → b = 25. Dus K = 1,45q + 25.<br>• Kost 200 stuks € 265 en 100 stuks € 170, dan geldt vanaf 100: a = 95 / 100 = 0,95 en K = 0,95q + 75.`)}<p>Elk volgend stuk begint waar het vorige ophoudt: gebruik dat <b>knikpunt</b> als bekend punt.</p>`,
  ['Twee lopers: Janne loopt A = 0,25t (km na t min). Marlijn loopt 0,2 km per minuut en wordt op t = 10 door Janne ingehaald. Wat is de formule van Marlijn?','A = 0,2t + 0,5','A = 0,2t|A = 0,2t + 2,5|A = 0,25t + 0,5','Op t = 10 zijn ze op dezelfde plek: A = 0,25 × 10 = 2,5. Dan 0,2 × 10 + b = 2,5 → b = 0,5.<br>Fout: zonder + b zou Marlijn op t = 0 bij de start staan, maar ze was eerder vertrokken. 2,5 is de plek op t = 10, niet op t = 0. 0,25 is Jannes tempo.']]
]},
// ================= 3.3 =================
{id:'3.3',t:'Vergelijkingen en ongelijkheden',kort:'Balansmethode, snijpunten berekenen, ongelijkheden oplossen in praktische situaties',ic:'⚖️',lp:[
 ['De balansmethode',`<p>Een vergelijking is als een weegschaal in evenwicht: wat je links doet, doe je ook rechts.</p>${VB('10x − 4 = 7x + 20',`1. Haal de x’en naar één kant: −7x aan beide kanten → 3x − 4 = 20<br>2. Haal de losse getallen naar de andere kant: +4 → 3x = 24<br>3. Deel door het getal voor x: : 3 → x = 8<br>Controle: 10 × 8 − 4 = 76 en 7 × 8 + 20 = 76 ✓`)}${VB('2x − 5 = 6x + 3',`1. −6x: −4x − 5 = 3<br>2. +5: −4x = 8<br>3. : −4: x = −2`)}<p>⚠ Deel je door een negatief getal, dan wordt de uitkomst ook van teken omgedraaid: 8 : −4 = −2.</p>`,
  ['Los op: 7x + 1 = 4x − 8','x = −3','x = 3|x = −2,33|x = −9','−4x: 3x + 1 = −8. −1: 3x = −9. : 3: x = −3.<br>Fout: x = 3 is een tekenfout. −2,33 krijg je als je −8 + 1 = −7 rekent (verkeerde kant op). −9 vergeet te delen door 3.']],
 ['Snijpunten met de assen',`<ul><li><b>Snijpunt met de x-as</b>: daar is <b>y = 0</b>. Stel de formule gelijk aan 0 en los op.</li><li><b>Snijpunt met de y-as</b>: daar is <b>x = 0</b>. Dat is gewoon (0, b).</li></ul>${VB('l: y = 2x − 4',`x-as: 2x − 4 = 0 → 2x = 4 → x = 2. Snijpunt (2, 0).<br>y-as: x = 0 → y = −4. Snijpunt (0, −4).`)}${figLijn([{a:2,b:-4}],{xmin:-1,xmax:5,ymin:-5,ymax:4,pt:[[2,0],[0,-4]]})}<p>💡 Haal ze niet door elkaar: x-as → y = 0, y-as → x = 0.</p>`,
  ['Waar snijdt y = 5 − x de x-as?','(5, 0)','(0, 5)|(−5, 0)|(1, 0)','x-as: y = 0. 5 − x = 0 geeft x = 5, dus (5, 0).<br>Fout: (0, 5) is het snijpunt met de y-as. −5 is een tekenfout. (1, 0) is een gok op basis van de rc.']],
 ['Werkschema: snijpunt van twee lijnen',`<p>In het snijpunt hebben beide lijnen <b>dezelfde x én dezelfde y</b>.</p><ol><li>Stel de rechterleden van de twee formules aan elkaar gelijk.</li><li>Los de vergelijking op. De oplossing is de x van het snijpunt.</li><li>Vul die x in één van de formules in: dat geeft de y.</li></ol>${VB('m: y = 5 − x en l: y = 2x − 4',`1. 5 − x = 2x − 4<br>2. +x: 5 = 3x − 4. +4: 9 = 3x. : 3: x = 3<br>3. y = 5 − 3 = 2. Snijpunt S(3, 2).`)}${figLijn([{a:-1,b:5},{a:2,b:-4}],{xmin:-1,xmax:6,ymin:-5,ymax:6,pt:[[3,2]]})}`,
  ['Wat is de x-coördinaat van het snijpunt van y = 15x − 31 en y = 7x + 5?','4,5','3,25|−4,5|36','15x − 31 = 7x + 5 → 8x = 36 → x = 4,5.<br>Fout: 3,25 komt van 8x = 26 (−31 en 5 verkeerd samengenomen). −4,5 is een tekenfout. 36 vergeet nog te delen door 8.']],
 ['Puntkomma en de handigste formule',`${VB('p: y = 0,8x en q: y = 3 − 1,2x',`1. 0,8x = 3 − 1,2x<br>2. +1,2x: 2x = 3, dus x = 1,5<br>3. Invullen in de <b>eenvoudigste</b> formule: y = 0,8 × 1,5 = 1,2. Snijpunt A(1,5; 1,2).`)}<p>Twee dingen om te onthouden:</p><ul><li>Vul de x in de formule in waar je het minst hoeft te rekenen. Het antwoord is hetzelfde (3 − 1,2 × 1,5 = 1,2), maar minder kans op fouten.</li><li>Staan er kommagetallen in een punt, zet dan een <b>puntkomma</b> tussen x en y: (1,5; 1,2). Anders zie je niet waar het ene getal ophoudt.</li></ul><p>Snijden met een horizontale lijn gaat net zo: y = −2,5x + 5 en y = 25 → −2,5x + 5 = 25 → −2,5x = 20 → x = −8. Snijpunt (−8, 25).</p>`,
  ['Wat is het snijpunt van y = −0,8x + 3 en y = 1,7x − 4,25?','(2,9; 0,68)','(0,68; 2,9)|(2,9; 5,32)|(−2,9; 5,32)','−0,8x + 3 = 1,7x − 4,25 → 7,25 = 2,5x → x = 2,9. y = −0,8 × 2,9 + 3 = 0,68.<br>Fout: (0,68; 2,9) verwisselt x en y. 5,32 is 3 + 2,32: tekenfout. −2,9 is ook een tekenfout.']],
 ['Een punt met gegeven y berekenen',`<p>Weet je de y van een punt op een lijn en zoek je de x? Stel de formule gelijk aan die y en los op.</p>${VB('n: y = −2,5x + 35',`Punt met x = −20: y = −2,5 × −20 + 35 = 50 + 35 = 85.<br>Punt met y = 45: −2,5x + 35 = 45 → −2,5x = 10 → x = −4.`)}${VB('kerosine',`Een vliegtuig heeft k = 11,75 − 0,003V ton kerosine na V km. Bij 1,5 ton gaat een alarm. Wanneer?<br>1. 11,75 − 0,003V = 1,5<br>2. −11,75: −0,003V = −10,25<br>3. : −0,003: V ≈ 3416,7 → ongeveer 3400 km.`)}`,
  ['Bij y = 3x + 6: bij welke x hoort y = 21?','x = 5','x = 69|x = 9|x = 7','3x + 6 = 21 → 3x = 15 → x = 5.<br>Fout: 69 = 3 × 21 + 6: dan heb je 21 als x ingevuld. 9 komt van 3x = 27 (tekenfout). 7 = 21 : 3, de 6 vergeten.']],
 ['Vergelijking of ongelijkheid?',`<p>Twee taxi’s: K<sub>A</sub> = 1,2d + 20 en K<sub>B</sub> = 1,6d.</p><ul><li>‘Wanneer zijn ze <b>even duur</b>?’ → <b>vergelijking</b> K<sub>A</sub> = K<sub>B</sub>. 1,2d + 20 = 1,6d → 20 = 0,4d → d = 50.</li><li>‘Wanneer is A <b>goedkoper</b>?’ → <b>ongelijkheid</b> K<sub>A</sub> &lt; K<sub>B</sub> (lees: K<sub>A</sub> kleiner dan K<sub>B</sub>).</li></ul>${figLijn([{a:1.2,b:20},{a:1.6,b:0}],{xmin:0,xmax:90,ymin:0,ymax:140,pt:[[50,80]]})}<p>Rechts van d = 50 ligt de lijn van A <b>onder</b> die van B. Dus A is goedkoper bij <b>d &gt; 50</b>.</p><p>&lt; = kleiner dan, &gt; = groter dan. 💡 De punt van het teken wijst naar het kleinste.</p>`,
  ['Wat betekent K<sub>A</sub> &lt; K<sub>B</sub>?','bij A betaal je minder dan bij B','bij A betaal je meer dan bij B|A en B kosten evenveel|de lijn van A ligt boven die van B','&lt; betekent kleiner dan: K<sub>A</sub> is kleiner, dus A is goedkoper.<br>Fout: meer betalen is &gt;. Evenveel is =. Goedkoper betekent dat de lijn van A <b>onder</b> die van B ligt, niet erboven.']],
 ['Werkschema: ongelijkheid A < B oplossen',`<ol><li>Los de vergelijking A = B op.</li><li>Kijk in de grafiek (of met een getal proberen) waar A <b>onder</b> B ligt.</li><li>Geef antwoord op de vraag.</li></ol>${VB('ijssalon',`Opbrengst R = 2,25q, kosten K = 1,15q + 352. Wanneer winst?<br>Winst als R &gt; K.<br>1. 2,25q = 1,15q + 352 → 1,10q = 352 → q = 320<br>2. R begint bij 0 en is steiler, dus rechts van 320 ligt R boven K.<br>3. Bij meer dan 320 ijsjes per week maakt ze winst. (Minder dan 320: verlies.)`)}<p>Geen grafiek? Probeer één getal aan één kant. q = 400: R = 900, K = 812 → R &gt; K, dus de kant van ‘meer dan 320’ is goed.</p>`,
  ['Reparatie I kost 22t + 80, reparatie II 18t + 96 (t in uren). Wanneer is I voordeliger?','bij minder dan 4 uur','bij meer dan 4 uur|bij minder dan 44 uur|bij meer dan 16 uur','22t + 80 = 18t + 96 → 4t = 16 → t = 4. I begint lager (80) en is steiler, dus I is goedkoper vóór t = 4.<br>Fout: na 4 uur is II goedkoper. 44 en 16 zijn rekenfouten (16 vergeet te delen door 4).']],
 ['Afronden in een verhaal',`<p>Bij aantallen (ijsjes, keren golfen, machines) moet het antwoord een heel getal zijn. Denk na welke kant je op moet afronden.</p>${VB('wasmachines',`R = 400q, K = 250q + 50 000. 400q = 250q + 50 000 → 150q = 50 000 → q ≈ 333,3.<br>Bij 333 is er nog net verlies, dus winst vanaf <b>334</b> machines (naar boven afronden).`)}${VB('golfen met een budget',`Club B kost 17,5n + 350 per jaar. Je hebt maximaal € 600.<br>17,5n + 350 = 600 → 17,5n = 250 → n ≈ 14,3. Je kunt <b>14</b> keer (naar beneden: 15 keer is te duur).`)}<p>💡 Altijd controleren: vul het afgeronde getal in en kijk of het klopt.</p>`,
  ['Club A kost 12n + 435, club B 17,5n + 350 per jaar (n = aantal keer golfen). Vanaf hoeveel keer is A goedkoper?','16 keer','15 keer|25 keer|6 keer','12n + 435 = 17,5n + 350 → 85 = 5,5n → n ≈ 15,45. Daarna is A goedkoper, dus vanaf 16 keer (bij 15 keer is B nog goedkoper: 612,50 tegen 615).<br>Fout: 15 is naar beneden afgerond. 25 en 6 zijn rekenfouten.']],
 ['Tegemoet lopen en inhalen',`<p>Twee mensen bewegen; je wilt weten <b>wanneer ze elkaar treffen</b>. Dat is weer een snijpunt: stel de afstanden aan elkaar gelijk.</p>${VB('zwemmen en rennen',`Jori zwemt: A<sub>J</sub> = 120t. Zijn broertje rent hem tegemoet vanaf 1200 m: A<sub>W</sub> = 1200 − 60t (t in minuten, A in meter vanaf de start van Jori).<br>1. 120t = 1200 − 60t<br>2. 180t = 1200 → t = 6⅔ minuut = 6 min 40 s<br>3. A<sub>J</sub> = 120 × 6⅔ = 800 m: Jori heeft 800 m gezwommen.<br>Afstand tussen ze op een moment = A<sub>W</sub> − A<sub>J</sub>. Na 2,5 min: 1050 − 300 = 750 m.`)}<p>⅔ minuut = ⅔ × 60 = 40 seconden.</p>`,
  ['0,4 minuut is hoeveel seconden?','24 seconden','40 seconden|4 seconden|0,24 seconden','0,4 × 60 = 24 seconden.<br>Fout: 40 seconden zou je krijgen als een minuut 100 seconden had. 4 en 0,24 zijn rekenfouten.']]
]},
// ================= 3.4 =================
{id:'3.4',t:'Twee variabelen',kort:'px + qy = r, y vrijmaken, tekenen, twee vergelijkingen in praktische situaties',ic:'🔀',lp:[
 ['Een vergelijking met twee onbekenden',`<p>Een gymdocent koopt hamburgers van € 6 (x stuks) en gezonde broodjes van € 3 (y stuks) en betaalt in totaal € 42.</p><p>De hamburgers kosten 6x, de broodjes 3y. Samen: <b>6x + 3y = 42</b>.</p>${figTabel(['x',0,1,2,3,4,5,6,7],['y',14,12,10,8,6,4,2,0])}<p>Alle mogelijkheden liggen op één <b>rechte lijn</b>: elke hamburger meer betekent 2 broodjes minder.</p>${figLijn([{a:-2,b:14}],{xmin:0,xmax:8,ymin:0,ymax:15,pt:[[0,14],[2,10],[4,6],[7,0]]})}<p>Zo’n vergelijking heet een <b>lineaire vergelijking met twee variabelen</b>.</p>`,
  ['De docent koopt 5 hamburgers (€ 6) en geeft in totaal € 42 uit aan broodjes. Hoeveel gezonde broodjes (€ 3) koopt hij?','4','2|12|6','5 × 6 = 30, er blijft 42 − 30 = 12 over, en 12 : 3 = 4.<br>Fout: 2 = 12 : 6 (verkeerde prijs). 12 is het geld, nog niet gedeeld. 6 hoort bij 4 hamburgers.']],
 ['De vorm px + qy = r',`<p>De algemene vorm van een lineaire vergelijking met x en y is <b>px + qy = r</b>. De grafiek is een rechte lijn.</p><ul><li>2x − 3y = 6: p = 2, q = −3, r = 6.</li><li>6x + 3y = 42: p = 6, q = 3, r = 42.</li></ul><p>Een punt ligt op de lijn als het <b>invullen klopt</b>:</p>${VB('ligt (14, 3) op 2x − 5y = 8?',`2 × 14 − 5 × 3 = 28 − 15 = 13. Dat is niet 8 (je schrijft 13 ≠ 8), dus het punt ligt <b>niet</b> op de lijn.<br>(9, 4) op 2x − 3y = 6? 18 − 12 = 6 ✓, dat punt ligt er wel op.`)}<p>≠ betekent: is niet gelijk aan.</p>`,
  ['Ligt (4, 1) op de lijn 3x + 2y = 12?','nee, want 3 × 4 + 2 × 1 = 14','ja, want 3 × 4 = 12|ja, want 3 × 1 + 2 × 4 = 11|nee, want 4 + 1 = 5','Vul allebei in: 12 + 2 = 14 ≠ 12, dus niet op de lijn.<br>Fout: je mag de y niet vergeten. In de derde optie zijn x en y verwisseld (en 11 is ook niet 12). 4 + 1 heeft niets met de vergelijking te maken.']],
 ['Werkschema: y vrijmaken',`<p><b>y vrijmaken</b> (ook: <b>y uitdrukken in x</b>) = de vergelijking omschrijven tot y = ax + b.</p><ol><li>Breng de term met x naar de andere kant (het teken draait om).</li><li>Deel <b>alle</b> termen door het getal voor y.</li></ol>${VB('6x + 3y = 42',`1. 3y = −6x + 42<br>2. : 3 → y = −2x + 14. De lijn heeft rc −2.`)}${VB('2x − 5y = 8',`1. −5y = −2x + 8<br>2. : −5 → y = 0,4x − 1,6 (−2 : −5 = 0,4 en 8 : −5 = −1,6)`)}<p>⚠ Deel echt <b>elke</b> term, ook het losse getal. En delen door een negatief getal draait alle tekens om.</p>`,
  ['Maak y vrij in 3x + 2y = 12.','y = −1,5x + 6','y = 1,5x + 6|y = −3x + 12|y = −1,5x + 12','2y = −3x + 12, dan alles : 2 → y = −1,5x + 6.<br>Fout: + 1,5x vergeet dat het teken omdraait bij het verplaatsen. −3x + 12 is nog niet gedeeld. −1,5x + 12 deelt alleen de x-term.']],
 ['Werkschema: de lijn px + qy = r tekenen',`<ol><li>Neem x = 0 en reken y uit.</li><li>Neem y = 0 en reken x uit.</li><li>Teken de twee punten (op de assen) en trek de lijn.</li></ol>${VB('2x − 3y = 6',`1. x = 0: −3y = 6 → y = −2 → punt (0, −2)<br>2. y = 0: 2x = 6 → x = 3 → punt (3, 0)`)}${figLijn([{a:2/3,b:-2}],{xmin:-2,xmax:6,ymin:-3,ymax:2,pt:[[0,-2],[3,0]]})}<p>Krijg je een lastig kommagetal (bij 2x − 5y = 8 geeft x = 0 juist y = −1,6)? Kies dan een andere x, bijvoorbeeld x = −1: −2 − 5y = 8 → y = −2. Punt (−1, −2).</p>`,
  ['Door welke twee punten op de assen gaat de lijn 3x − 4y = 12?','(0, −3) en (4, 0)','(0, 3) en (−4, 0)|(0, 4) en (−3, 0)|(0, −4) en (3, 0)','x = 0: −4y = 12 → y = −3. y = 0: 3x = 12 → x = 4.<br>Fout: de tweede optie heeft beide tekens fout. In de laatste twee zijn de 3 en 4 bij de verkeerde letter gezet.']],
 ['Andere letters',`<p>Het werkt hetzelfde met andere letters. ‘Druk p uit in q’ betekent: schrijf het als p = … q + ….</p>${VB('3p − 1,2q = 16,5, druk p uit in q',`1. 3p = 1,2q + 16,5 (de −1,2q gaat naar rechts en wordt +)<br>2. : 3 → p = 0,4q + 5,5`)}${VB('5a − 2b = 16, maak b vrij',`1. −2b = −5a + 16<br>2. : −2 → b = 2,5a − 8`)}<p>💡 Controleer met een punt: a = 4 geeft b = 2. Klopt 5 × 4 − 2 × 2 = 16? Ja ✓.</p>`,
  ['Maak q vrij in 4p + 8q = 2.','q = −0,5p + 0,25','q = 0,5p + 0,25|q = −2p + 0,25|q = −0,5p + 2','8q = −4p + 2, alles : 8 → q = −0,5p + 0,25.<br>Fout: + 0,5p is een tekenfout. −2p is 8 : 4 (omgedraaid). + 2 vergeet het losse getal te delen.']],
 ['Een vergelijking opstellen uit een verhaal',`<p>Kies wat x en y zijn en schrijf op wat er bij elkaar opgeteld wordt.</p>${VB('thee en koffie',`2 muntthee en 4 koffie kosten samen € 18. x = prijs muntthee, y = prijs koffie.<br>2x + 4y = 18. (Kost muntthee € 5, dan 10 + 4y = 18, dus koffie € 2.)`)}${VB('lijn bij een rc en een punt',`Lijn met rc −2 door (1, 3): y = −2x + b, −2 + b = 3, b = 5. Dus y = −2x + 5, en met 2x naar links: <b>2x + y = 5</b>.`)}<p>💡 Twee soorten vergelijkingen kom je steeds tegen:</p><ul><li>een <b>aantallen</b>-vergelijking: x + y = totaal aantal;</li><li>een <b>geld</b>-vergelijking: (prijs₁)x + (prijs₂)y = totaal bedrag.</li></ul>`,
  ['Een restaurant heeft 19 tafels: x tafels voor 4 en y tafels voor 2 personen, samen 52 plaatsen. Welke twee vergelijkingen horen hierbij?','x + y = 19 en 4x + 2y = 52','x + y = 52 en 4x + 2y = 19|4x + 2y = 19 en 2x + 4y = 52|x + y = 19 en 2x + 4y = 52','Aantal tafels: x + y = 19. Plaatsen: 4 per grote tafel en 2 per kleine: 4x + 2y = 52.<br>Fout: in de tweede optie zijn de totalen verwisseld. De derde past bij geen van de twee. In de laatste horen 4 en 2 bij de verkeerde letter.']],
 ['Werkschema: situaties met twee variabelen',`<ol><li>Noem de variabelen x en y.</li><li>Stel twee vergelijkingen op.</li><li>Druk bij beide vergelijkingen y uit in x en stel ze aan elkaar gelijk.</li><li>Los die vergelijking op.</li><li>Gebruik de oplossing om de vraag te beantwoorden.</li></ol>${VB('tafels',`1. x = tafels voor 4, y = tafels voor 2<br>2. x + y = 19 en 4x + 2y = 52<br>3. y = −x + 19 en y = −2x + 26 → −x + 19 = −2x + 26<br>4. x = 7<br>5. y = −7 + 19 = 12. Dus 7 tafels voor vier en 12 tafels voor twee. Controle: 28 + 24 = 52 ✓`)}${figLijn([{a:-1,b:19},{a:-2,b:26}],{xmin:0,xmax:14,ymin:0,ymax:28,pt:[[7,12]]})}<p>De oplossing is het <b>snijpunt</b> van de twee lijnen.</p>`,
  ['In een envelop zitten 20 briefjes van € 5 en € 10, samen € 135. Hoeveel briefjes van € 5?','13','7|27|6,75','x + y = 20 → y = −x + 20 en 5x + 10y = 135 → y = −0,5x + 13,5. −x + 20 = −0,5x + 13,5 → 6,5 = 0,5x → x = 13 (en 7 tientjes: 65 + 70 = 135).<br>Fout: 7 is het aantal tientjes. 27 = 135 : 5 (alsof alles vijfjes waren). 6,75 = 135 : 20.']],
 ['Nog een voorbeeld: bollen',`${VB('kaasbollen en bruine bollen',`Roel koopt 13 bollen: kaasbollen van € 1,50 en bruine bollen van € 1,20. Hij betaalt € 18.<br>1. x = kaasbollen, y = bruine bollen<br>2. x + y = 13 en 1,5x + 1,2y = 18<br>3. y = −x + 13 en 1,2y = −1,5x + 18 → y = −1,25x + 15. Gelijkstellen: −x + 13 = −1,25x + 15<br>4. +1,25x: 0,25x + 13 = 15 → 0,25x = 2 → x = 8<br>5. y = −8 + 13 = 5. Dus 8 kaasbollen en 5 bruine bollen. Controle: 12 + 6 = 18 ✓`)}${VB('meubels (met grote getallen)',`52 tafels en stoelen, tafel € 750, stoel € 350, samen € 24 600.<br>x + y = 52 → y = −x + 52. 750x + 350y = 24 600 → y = −2<sup>1</sup>/<sub>7</sub>x + 70<sup>2</sup>/<sub>7</sub>. Gelijkstellen en oplossen (handig met de GR: optie oplossen of snijpunt) geeft x = 16 en y = 36.`)}`,
  ['Bij de bollen: welke vergelijking krijg je in stap 3?','−x + 13 = −1,25x + 15','x + 13 = 1,25x + 15|−x + 13 = −1,5x + 18|−x + 18 = −1,25x + 13','y = −x + 13 en y = −1,25x + 15 (want 1,5 : 1,2 = 1,25 en 18 : 1,2 = 15).<br>Fout: de eerste vergeet de mintekens. De derde deelt niet door 1,2. De vierde haalt de getallen 13 en 18 door elkaar.']],
 ['Controleren en de GR',`<p>Je mag vergelijkingen ook met de <b>GR</b> oplossen (optie <b>oplossen</b>, of de grafieken tekenen en het <b>snijpunt</b> laten berekenen). Met de balansmethode kan het ook.</p><p><b>Controleer altijd</b> je antwoord in <b>beide</b> oorspronkelijke vergelijkingen. Bij de meubels: 16 + 36 = 52 ✓ en 750 × 16 + 350 × 36 = 12 000 + 12 600 = 24 600 ✓.</p><p>Het maakt niet uit welke letters je kiest (t en s in plaats van x en y): je krijgt dezelfde vergelijkingen en dus hetzelfde antwoord.</p>${VB('een prijs die van een andere afhangt',`Een kaartje voor een jongere is € 5 goedkoper dan voor een volwassene. 2 jongeren en 2 volwassenen betalen € 80.<br>x = volwassene, y = jongere: y = x − 5 en 2x + 2y = 80 → y = −x + 40.<br>x − 5 = −x + 40 → 2x = 45 → x = 22,50. Volwassene € 22,50, jongere € 17,50.`)}`,
  ['Iemand vindt x = 10 en y = 9 bij x + y = 19 en 4x + 2y = 52. Wat zegt de controle?','fout, want 4 × 10 + 2 × 9 = 58','goed, want 10 + 9 = 19|goed, want 4 × 10 + 2 × 9 = 52|fout, want 10 + 9 = 21','10 + 9 = 19 klopt, maar 40 + 18 = 58 ≠ 52. Het moet in béide kloppen.<br>Fout: alleen de eerste vergelijking controleren is niet genoeg. 40 + 18 is geen 52. 10 + 9 is wel 19.']]
]},
// ================= 3.5 =================
{id:'3.5',t:'Interpoleren en modellen',kort:'Lineair interpoleren en extrapoleren, lineaire modellen, kritisch kijken naar uitkomsten',ic:'🔮',lp:[
 ['Interpoleren en extrapoleren',`<ul><li><b>Interpoleren</b> = een waarde schatten die <b>tussen</b> de gegevens ligt.</li><li><b>Extrapoleren</b> = een waarde schatten die <b>buiten</b> de gegevens ligt (vóór de eerste of na de laatste).</li></ul><p>Ga je ervan uit dat het tussen twee gegevens met een vaste stap verandert (een rechte lijn), dan heet het <b>lineair</b> interpoleren of extrapoleren.</p>${figTabel(['jaar',2000,2009,2015,2021],['sportclubs',26620,28700,28210,25450])}<p>Het aantal in 2012 schatten = interpoleren (2012 ligt tussen 2009 en 2015). Het aantal in 2025 = extrapoleren (na 2021).</p><p>💡 <b>inter</b> = ertussen (zoals interland, tussen landen), <b>extra</b> = erbuiten.</p>`,
  ['Je schat met de tabel hierboven het aantal sportclubs in 1995. Is dat interpoleren of extrapoleren?','extrapoleren, want 1995 ligt vóór 2000','interpoleren, want 1995 ligt vóór 2000|interpoleren, want het is een schatting|extrapoleren, want 1995 is een oneven jaar','1995 ligt buiten de gegevens (de eerste is 2000), dus extrapoleren.<br>Fout: interpoleren is tussen gegevens. Allebei zijn schattingen, dat zegt dus niets. Even of oneven doet er niet toe.']],
 ['Werkschema: lineair interpoleren',`<ol><li>Zoek de twee gegevens <b>waar je waarde tussen ligt</b>.</li><li>Bereken de verandering per stap (per jaar): verschil ÷ aantal jaren.</li><li>Begin bij het eerste gegeven en tel er (aantal jaren × verandering per jaar) bij.</li></ol>${VB('ijssalons',`2020: 945, 2023: 1206. Schat 2022.<br>1. 2020 en 2023<br>2. In 3 jaar komen er 1206 − 945 = 261 bij, dus 261 : 3 = 87 per jaar<br>3. 2022 is 2 jaar na 2020: 945 + 2 × 87 = <b>1119</b>`)}${VB('niet halverwege',`2011: 181, 2016: 220. Schat 2014.<br>1. 2011 en 2016<br>2. 39 erbij in 5 jaar = 7,8 per jaar<br>3. 181 + 3 × 7,8 = 204,4 ≈ <b>204</b>`)}`,
  ['2015: 28 210 sportclubs, 2021: 25 450. Schat met lineair interpoleren het aantal in 2019.','26 370','25 910|27 750|26 830','Afname 2760 in 6 jaar = 460 per jaar. 2019 is 4 jaar na 2015: 28 210 − 4 × 460 = 26 370.<br>Fout: 25 910 telt 5 jaar. 27 750 telt maar 1 jaar. 26 830 = halverwege, maar 2019 ligt niet halverwege.']],
 ['Werkschema: lineair extrapoleren',`<ol><li>Neem de twee gegevens die het <b>dichtst bij</b> het gevraagde jaar liggen.</li><li>Bereken de verandering per jaar.</li><li>Ga vanaf het dichtstbijzijnde gegeven het juiste aantal jaren verder.</li></ol>${VB('ijssalons 2027',`Met 87 per jaar en 1206 in 2023: 2027 is 4 jaar later → 1206 + 4 × 87 = <b>1554</b>.`)}${VB('een tabel met meer jaren',`${figTabel(['jaar',2000,2007,2011,2016,2025],['aantal',570,408,181,220,194])}Schat 2032. Dichtstbij: 2016 en 2025.<br>In 9 jaar 26 minder → 26 : 9 ≈ 2,89 minder per jaar.<br>2032 is 7 jaar na 2025: 194 − 7 × 2,89 ≈ <b>174</b>.`)}<p>⚠ Neem niet de eerste en laatste uit de tabel, maar de <b>dichtstbijzijnde</b>.</p>`,
  ['Woningen (× 1000): 1998: 6425, 2023: 8125. Schat met lineair extrapoleren 2026.','8329','8193|8227|9825','1700 erbij in 25 jaar = 68 per jaar. 2026 is 3 jaar na 2023: 8125 + 3 × 68 = 8329.<br>Fout: 8193 telt maar 1 jaar. 8227 rekent per 50 jaar (34 per jaar). 9825 telt 1700 er nog eens helemaal bij.']],
 ['Interpoleren met een formule',`<p>Je kunt bij een stukje van de tabel ook een formule maken. Kies t = 0 bij het eerste jaar van dat stukje.</p>${VB('2011 tot 2016',`Per jaar +7,8, begin 181 in 2011: <b>N = 7,8t + 181</b> met t = jaren na 2011.<br>2014: t = 3 → 7,8 × 3 + 181 = 204,4 ≈ 204 (hetzelfde als eerst).<br>2012: t = 1 → 188,8 ≈ 189.`)}<p>⚠ Deze formule geldt alleen <b>tussen 2011 en 2016</b>. Voor 2020 hoort een ander stuk van de tabel (2016-2025) met een andere verandering per jaar.</p><p>Terugrekenen kan ook. Ballonvaart: 150 m → 20,2 °C, 225 m → 19,2 °C. Bij welke hoogte is het 20,0 °C? 1,0 °C per 75 m, dus 0,2 °C hoort bij 0,2 × 75 = 15 m. Antwoord: 150 + 15 = <b>165 m</b>.</p>`,
  ['Ballonvaart: op 150 m 20,2 °C, op 225 m 19,2 °C. Schat de temperatuur op 180 m.','19,8 °C','19,7 °C|20,6 °C|19,6 °C','−1,0 °C per 75 m. 180 m is 30 m boven 150: 30 : 75 = 0,4 °C kouder → 20,2 − 0,4 = 19,8.<br>Fout: 19,7 is precies halverwege, maar 180 ligt niet halverwege. 20,6 telt erbij in plaats van eraf. 19,6 rekent 0,6 graad.']],
 ['Wanneer is lineair niet verstandig?',`<p>Lineair interpoleren werkt alleen goed als de grafiek tussen de gegevens (ongeveer) <b>recht</b> is.</p>${VB('100 meter sprint',`${figTabel(['t (s)',0,3.78,6.29,9.58],['d (m)',0,30,60,100])}Na 5 s (tussen 3,78 en 6,29): 30 m in 2,51 s ≈ 11,95 m/s. 30 + 1,22 × 11,95 ≈ 44,6 m. Goede schatting: daar loopt hij op topsnelheid, de grafiek is bijna recht.<br>Na 1 s: 30 : 3,78 ≈ 7,9 m. Slechte schatting: bij de start moet hij nog <b>versnellen</b>, de grafiek is daar krom. Echt is het minder dan 7,9 m.`)}<p>💡 Vraag je altijd af: verandert het hier echt met een vaste stap?</p>`,
  ['Waarom is lineair interpoleren bij de start van een sprint onverstandig?','de loper versnelt nog, dus de grafiek is daar niet recht','de loper loopt dan al op topsnelheid|aan het begin zijn er geen gegevens|lineair interpoleren mag alleen bij jaartallen','Bij de start neemt de snelheid toe, dus komt er niet elke seconde evenveel afstand bij.<br>Fout: topsnelheid haalt hij pas later. Er zijn wel gegevens (0 en 3,78 s). Interpoleren kan bij elke grootheid, niet alleen jaartallen.']],
 ['Wiskundig model en modelvorming',`<p>Doe je alsof de grafiek (ongeveer) een rechte lijn is, dan gebruik je een <b>wiskundig model</b>, hier een <b>lineair model</b>.</p><p>Belangrijk: controleer of wat het model voorspelt past bij de metingen. Het opstellen en steeds aanpassen van een model heet <b>modelvorming</b>. Dat gaat in een rondje:</p><ol><li><b>Praktisch probleem</b> → meten → <b>gegevens</b></li><li>Gegevens → modelleren → <b>wiskundig model</b></li><li>Model → toepassen → <b>voorspellingen</b></li><li>Voorspellingen → controleren → terug naar de gegevens (klopt het niet? model aanpassen)</li></ol>`,
  ['Wat is de goede volgorde bij modelvorming?','meten, modelleren, toepassen, controleren','modelleren, meten, controleren, toepassen|toepassen, meten, modelleren, controleren|meten, toepassen, modelleren, controleren','Eerst meet je (gegevens), dan maak je een model, dat pas je toe (voorspellingen) en die controleer je met de gegevens.<br>Fout: je kunt geen model maken voordat je gemeten hebt, en niet toepassen voordat er een model is.']],
 ['Een lineair model opstellen en gebruiken',`<p>Bij een puntenwolk teken je een lijn die er zo goed mogelijk doorheen loopt. Met twee goed afleesbare punten op die lijn maak je de formule (werkschema uit 3.2).</p>${VB('bladeren en temperatuur',`Hoe warmer het klimaat, hoe meer plantensoorten gladde (gaafrandige) bladeren hebben. Op de modellijn liggen A(p = 25, T = 10) en B(p = 75, T = 25), met p = percentage gaafrandige soorten en T = gemiddelde jaartemperatuur.<br>1. a = (25 − 10) / (75 − 25) = 15 / 50 = 0,3<br>2. 0,3 × 25 + b = 10 → 7,5 + b = 10 → b = 2,5<br>3. <b>T = 0,3p + 2,5</b><br>Fossielen met 80% tot 85% gaafrandig: T = 26,5 tot 28 °C.`)}${figLijn([{a:0.3,b:2.5}],{xmin:0,xmax:90,ymin:0,ymax:30,pt:[[25,10],[75,25]]})}`,
  ['Met T = 0,3p + 2,5: welke temperatuur hoort bij p = 60?','20,5 °C','18 °C|191,7 °C|62,8 °C','0,3 × 60 + 2,5 = 18 + 2,5 = 20,5.<br>Fout: 18 vergeet de + 2,5. 191,7 = (60 − 2,5) : 0,3: dan reken je de andere kant op. 62,8 telt alles bij elkaar op.']],
 ['Procentuele afwijking',`<p>Hoe ver zit het model ernaast? Reken het verschil uit als percentage van de <b>echte waarde</b>:</p><p><b>afwijking = (model − werkelijk) : werkelijk × 100%</b></p>${VB('huishoudelijk afval',`Model N = 9,5t + 281 (t = jaren na 1970). In 2004 is t = 34: N = 9,5 × 34 + 281 = 604 kg. Echt was het 561 kg.<br>(604 − 561) : 561 × 100% ≈ 7,7%. Het model zit 7,7% te hoog.`)}${VB('temperatuur',`Iemand voorspelt 7,9 °C, echt wordt het 3,2 °C. (7,9 − 3,2) : 3,2 × 100% ≈ 147% te hoog.`)}<p>⚠ Deel door de <b>werkelijke</b> waarde, niet door die van het model.</p>`,
  ['Het model geeft 64,8 en echt is het 65,8. Hoeveel procent wijkt het model af?','ongeveer 1,5% te laag','ongeveer 1,5% te hoog|ongeveer 1,0% te laag|ongeveer 6,6% te laag','(64,8 − 65,8) : 65,8 × 100% ≈ −1,5%: het model zit 1,5% te laag.<br>Fout: het model is kleiner dan echt, dus te laag, niet te hoog. 1,0 is alleen het verschil, nog niet gedeeld. 6,6 is een rekenfout.']],
 ['Kritisch kijken naar een model',`<p>Een lineair model geldt meestal maar voor een <b>beperkt gebied</b>.</p><ul><li>Afval nam tot 2000 toe en daarna af. Een stijgend model past na 2000 dus niet meer.</li><li>Sprinttijden worden steeds korter. Met een lineair model krijg je ver in de toekomst tijden van 7,9 s (45 km/u) en uiteindelijk zelfs 0 of negatief. Dat kan niet.</li><li>Een formule voor de lengte uit de bovenarm geldt alleen voor botten tussen 10 en 40 cm.</li></ul><p>💡 Ver extrapoleren is onbetrouwbaar: niemand weet of het lineair doorgaat. Vraag je altijd af of de uitkomst <b>realistisch</b> is.</p>`,
  ['Een model voor de winnende sprinttijd daalt elk jaar met 0,014 s. Waarom kun je het niet gebruiken voor het jaar 2500?','tijden kunnen niet eindeloos lineair dalen, je krijgt onmogelijke uitkomsten','de rc is te klein om mee te rekenen|het model is alleen voor vrouwen|in 2500 is er geen sprint meer','Ver buiten de gegevens hoeft het niet lineair door te gaan; de tijd zou absurd laag worden.<br>Fout: met een kleine rc kun je prima rekenen. Voor wie het model is, maakt voor deze vraag niet uit. Of er in 2500 nog gesprint wordt, is niet de reden.']]
]}
];

[`Welke formule hoort bij deze lijn? ${figLijn([{a:2,b:-1}],{xmin:-2,xmax:4,ymin:-4,ymax:6,pt:[[0,-1],[1,1]]})}`,'y = 2x − 1','y = −x + 2|y = 2x + 1|y = −2x − 1',
 'De lijn snijdt de y-as in (0, −1), dus b = −1. Bij 1 naar rechts ga je 2 omhoog: rc 2. Dus <b>y = 2x − 1</b>.<br>Fout: y = −x + 2 verwisselt a en b. + 1 heeft het verkeerde snijpunt. −2x zou een dalende lijn zijn.',
 'Lees eerst af waar de lijn de y-as snijdt (b). Zet dan een trapje van 1 naar rechts: hoeveel ga je omhoog?'],
['Op welke lijn ligt het punt A(14, 6)?','y = 0,5x − 1','y = −3x + 2|y = 2x|y = 2',
 'Vul x = 14 in: 0,5 × 14 − 1 = 7 − 1 = 6 ✓.<br>Fout: −3 × 14 + 2 = −40, 2 × 14 = 28 en y = 2 geeft altijd 2. Geen van die is 6.',
 'Vul bij elke formule x = 14 in en kijk of er 6 uitkomt.'],
['Lijn k is evenwijdig met y = −0,8x + 3 en gaat door (0, 12). Wat is de formule van k?','y = −0,8x + 12','y = 12x − 0,8|y = 0,8x + 12|y = −0,8x + 3',
 'Evenwijdig = zelfde rc (−0,8). Door (0, 12) = b is 12. Dus <b>y = −0,8x + 12</b>.<br>Fout: 12x − 0,8 verwisselt a en b. 0,8 mist de min. y = −0,8x + 3 is de oude lijn zelf.',
 'Evenwijdige lijnen hebben dezelfde rc. Het punt op de y-as geeft je b.'],
['Welke twee lijnen zijn evenwijdig?<br>p: y = 3x − 5, q: y = 3x + 7, r: y = −3x + 7','p en q','q en r|p en r|geen enkel paar',
 'p en q hebben allebei rc 3, dus ze zijn evenwijdig.<br>Fout: r heeft rc −3, dat is een andere richting (dalend). q en r hebben wel dezelfde b, maar dan snijden ze elkaar juist op de y-as.',
 'Vergelijk alleen de rc’s. Ook het teken telt mee.'],
['Wat is de formule van de horizontale lijn door (5, 4)?','y = 4','x = 5|y = 5|x = 4',
 'Op een horizontale lijn hebben alle punten dezelfde y, hier 4: <b>y = 4</b>.<br>Fout: x = 5 is de verticale lijn door dat punt. y = 5 en x = 4 halen de coördinaten door elkaar.',
 'Horizontaal = plat. Welke coördinaat blijft dan steeds gelijk?'],
['Welke lijn kun je <b>niet</b> schrijven als y = ax + b?','x = 3','y = 3|y = 3x|y = −x + 3',
 'x = 3 is een verticale lijn: die heeft geen rc, dus geen vorm y = ax + b.<br>Fout: y = 3 is y = 0x + 3, y = 3x is y = 3x + 0 en y = −x + 3 heeft a = −1. Die passen allemaal wel.',
 'Welke lijn staat rechtop? Die heeft geen richtingscoëfficiënt.'],
['De kosten van een fabriek zijn K = 0,25q + 200 euro per dag (q = aantal balpennen). Hoe hoog zijn de vaste kosten?','€ 200','€ 0,25|€ 200,25|€ 50',
 'Vaste kosten hangen niet van q af: dat is het losse getal b = <b>€ 200</b>.<br>Fout: € 0,25 zijn de variabele kosten per pen. 200,25 telt beide bij elkaar op. 50 = 0,25 × 200, dat betekent niets.',
 'Welk deel van de formule blijft hetzelfde als je q verandert?'],
['Een taxi rekent € 3 instaptarief en € 2,10 per km. Welke formule geeft de kosten K bij d km?','K = 2,10d + 3','K = 3d + 2,10|K = 5,10d|K = 2,10d − 3',
 'Per km = rc = 2,10, vast bedrag = b = 3: <b>K = 2,10d + 3</b>.<br>Fout: 3d + 2,10 verwisselt a en b. 5,10d rekent het instaptarief elke km opnieuw. − 3 zou betekenen dat je geld terugkrijgt.',
 'Het bedrag per km komt bij de d, het vaste bedrag staat los.'],
['Een oven warmt 720 °C per uur op en staat bij het aanzetten op 22 °C. Wat is T na m minuten?','T = 12m + 22','T = 720m + 22|T = 22m + 12|T = 12m + 720',
 'Per minuut: 720 : 60 = 12 °C. Begin: 22. Dus <b>T = 12m + 22</b>.<br>Fout: 720m rekent per uur terwijl m minuten zijn. De andere twee zetten de getallen op de verkeerde plek.',
 'Let op de eenheid: m is in minuten. Reken de opwarming eerst om naar per minuut.'],
['In een vat staat het water 1,2 m hoog. Per kwartier zakt het 30 cm. Wat is de formule voor h in cm na t minuten?','h = 120 − 2t','h = 1,2 − 30t|h = 120 − 30t|h = 120 + 2t',
 'Begin: 1,2 m = 120 cm. Per minuut: 30 : 15 = 2 cm omlaag. Dus <b>h = 120 − 2t</b>.<br>Fout: 1,2 − 30t gooit meters en kwartieren door elkaar. 120 − 30t rekent 30 cm per minuut. + 2t laat het water stijgen.',
 'Zet alles eerst in de gevraagde eenheden: cm en minuten.'],
['Een parachutist zit op 600 m en daalt met 18 km/u. Welke formule geeft h in meter na t seconden?','h = 600 − 5t','h = 600 − 18t|h = 600 − 0,3t|h = 600 + 5t',
 '18 km/u = 18 000 m per 3600 s = 5 m per seconde. Dalen = min: <b>h = 600 − 5t</b>.<br>Fout: 18 is in km/u, niet m/s. 0,3 is km per minuut. + 5t zou betekenen dat hij stijgt.',
 'Reken km/u om naar meter per seconde: km × 1000, uur = 3600 seconden.'],
['y is evenredig met x en bij x = 15 hoort y = 24. Wat is de formule?','y = 1,6x','y = 0,625x|y = 1,6x + 15|y = 24x',
 'Evenredig: y = ax. a = 24 : 15 = 1,6. Dus <b>y = 1,6x</b>.<br>Fout: 0,625 = 15 : 24 (omgedraaid). Evenredig heeft geen + b. y = 24x geeft bij x = 15 veel te veel.',
 'Evenredig betekent y = ax. Vul het punt in en los a op.'],
['Welke tabel hoort bij een (recht) evenredig verband?','x: 1, 2, 3 en y: 0,3; 0,6; 0,9','x: 0, 1, 2 en y: 0,7; 1,4; 2,1|x: −1, 0, 1 en y: 4, 2, 0|x: 1, 2, 3 en y: 2, 3, 4',
 'Bij 0,3; 0,6; 0,9 is y : x steeds 0,3: een verhoudingstabel, dus <b>evenredig</b> (y = 0,3x).<br>Fout: bij de tweede is y = 0,7 als x = 0, dus niet door de oorsprong. Bij de derde is y = 2 als x = 0. Bij de vierde is y : x steeds anders (2, 1,5, 1,33).',
 'Evenredig = verhoudingstabel: deel y door x. Is dat steeds hetzelfde getal? En hoort bij x = 0 de y = 0?'],
['Otto heeft na d dagen in Thailand B = 3096d + 19 350 baht opgenomen. Is B evenredig met d?','nee, want bij d = 0 is B niet 0','ja, want de grafiek is een rechte lijn|ja, want B neemt elke dag evenveel toe|nee, want de lijn daalt',
 'Evenredig vraagt een lijn door de oorsprong (y = ax). Hier is er een beginwaarde 19 350, dus <b>niet evenredig</b>.<br>Fout: recht en elke dag evenveel erbij geldt voor elk lineair verband, dat is niet genoeg. De lijn stijgt juist.',
 'Evenredig = lineair én beginwaarde 0. Kijk naar het getal zonder d.'],
['De vaste kosten van een bedrijf worden hoger, de kosten per product blijven gelijk. Wat gebeurt er met de grafiek van de kosten?','hij schuift omhoog en blijft even steil','hij wordt steiler|hij wordt minder steil|hij gaat door de oorsprong',
 'Hogere vaste kosten = grotere b: de lijn begint hoger en schuift dus <b>omhoog</b>, met dezelfde rc.<br>Fout: steiler of minder steil hoort bij een andere rc (kosten per product). Door de oorsprong zou betekenen: geen vaste kosten.',
 'Vaste kosten zijn de b, kosten per stuk de a. Welke van de twee verandert er?']
],
'3.2':[
['Een lijn heeft rc −0,75 en gaat door (2, 6). Wat is de formule?','y = −0,75x + 7,5','y = −0,75x + 4,5|y = −0,75x + 6|y = 6x − 0,75',
 '−0,75 × 2 + b = 6 → −1,5 + b = 6 → b = <b>7,5</b>.<br>Fout: 4,5 krijg je als je 1,5 eraf haalt in plaats van erbij. b = 6 is de y van het punt, maar het punt ligt niet op de y-as. 6x − 0,75 verwisselt alles.',
 'Schrijf y = −0,75x + b, vul x = 2 en y = 6 in en los b op.'],
['Lijn l heeft rc 2 en gaat door A(5, 8). Wat is de formule?','y = 2x − 2','y = 2x + 8|y = 2x + 18|y = 8x + 2',
 '2 × 5 + b = 8 → 10 + b = 8 → b = −2. Dus <b>y = 2x − 2</b>.<br>Fout: + 8 neemt de y van het punt als b. 18 = 8 + 10 (tekenfout). 8x + 2 verwisselt a en b.',
 'Vul het punt in y = 2x + b in. Wat moet b zijn zodat er 8 uitkomt?'],
['Lijn m heeft rc −1,8 en gaat door (−10, 5). Waar snijdt m de y-as?','(0, −13)','(0, 23)|(0, 5)|(0, 13)',
 '−1,8 × −10 + b = 5 → 18 + b = 5 → b = −13. Snijpunt <b>(0, −13)</b>.<br>Fout: 23 = 5 + 18 (−1,8 × −10 als −18 gerekend). 5 is de y van het punt. 13 mist de min.',
 'Min keer min is plus: −1,8 × −10 = +18. Los daarna b op.'],
['Wat is de rc van de lijn door A(8, 17) en B(13, 23)?','1,2','ongeveer 0,83|6|−1,2',
 'Δy = 23 − 17 = 6, Δx = 13 − 8 = 5, rc = 6 : 5 = <b>1,2</b>.<br>Fout: 0,83 = 5 : 6 (omgedraaid). 6 is alleen Δy. −1,2: de lijn stijgt, dus de rc is positief.',
 'rc = Δy : Δx = verschil in y gedeeld door verschil in x.'],
['Wat is de rc van de lijn door P(2, −1) en Q(6, 5)?','1,5','1|0,67|6',
 'Δy = 5 − −1 = 6, Δx = 6 − 2 = 4, rc = 6 : 4 = <b>1,5</b>.<br>Fout: 1 krijg je als je 5 − 1 = 4 rekent (min vergeten). 0,67 is Δx : Δy. 6 is alleen Δy.',
 'Let op: 5 − −1 = 5 + 1.'],
['Welke formule hoort bij de lijn door (−1, 1) en (1, 4)?','y = 1,5x + 2,5','y = 1,5x − 2,5|y = 2,5x + 1,5|y = 0,67x + 1,67',
 'a = (4 − 1) : (1 − −1) = 3 : 2 = 1,5. Invullen (1, 4): 1,5 + b = 4 → b = 2,5.<br>Fout: − 2,5 is een tekenfout. 2,5x + 1,5 verwisselt a en b. 0,67 is Δx : Δy.',
 'Eerst a = Δy : Δx, dan één punt invullen voor b.'],
['Welke formule hoort bij de lijn door C(2, 0) en D(−3, 5)?','y = −x + 2','y = x − 2|y = −x − 2|y = 5x + 2',
 'a = (5 − 0) : (−3 − 2) = 5 : −5 = −1. Invullen C: −2 + b = 0 → b = 2. Dus <b>y = −x + 2</b>.<br>Fout: y = x − 2 heeft de verkeerde rc (de lijn daalt). −x − 2 heeft de verkeerde b. 5x + 2 deelt niet.',
 'Δx = −3 − 2 is negatief. Wat betekent dat voor het teken van de rc?'],
['Welke formule hoort bij de lijn door (25, 493) en (75, 229)?','y = −5,28x + 625','y = 5,28x + 361|y = −5,28x + 361|y = −0,19x + 498',
 'a = (229 − 493) : (75 − 25) = −264 : 50 = −5,28. −5,28 × 25 + b = 493 → −132 + b = 493 → b = 625.<br>Fout: 5,28 vergeet de min (de lijn daalt). 361 = 493 − 132 (tekenfout bij b). −0,19 is Δx : Δy.',
 'Bij −132 + b = 493 tel je 132 op aan beide kanten.'],
[`Welke formule hoort bij deze lijn? ${figLijn([{a:-0.5,b:4}],{xmin:-1,xmax:9,ymin:-1,ymax:5,pt:[[0,4],[8,0]]})}`,'y = −0,5x + 4','y = −2x + 4|y = 0,5x + 4|y = 4x − 0,5',
 'Door (0, 4) en (8, 0): a = (0 − 4) : (8 − 0) = −0,5, b = 4.<br>Fout: −2 is Δx : Δy. + 0,5 zou stijgen, maar de lijn daalt. 4x − 0,5 verwisselt a en b.',
 'Zoek twee punten precies op het rooster, bijvoorbeeld op de assen.'],
['Mevrouw Hak verdient bij 350 verkochte dozen bonbons € 270 per week en bij 500 dozen € 315. Hoeveel krijgt ze per doos?','€ 0,30','€ 3,33|€ 0,77|€ 45',
 'a = ΔR : Δq = (315 − 270) : (500 − 350) = 45 : 150 = <b>€ 0,30</b>.<br>Fout: 3,33 = 150 : 45 (omgedraaid). 0,77 = 270 : 350: dan tel je het basisloon mee. 45 is het verschil, nog niet gedeeld.',
 'Bedrag erbij gedeeld door dozen erbij.'],
['Mevrouw Hak krijgt € 0,30 per doos en verdient bij 350 dozen € 270. Hoe hoog is haar basisloon?','€ 165','€ 270|€ 105|€ 375',
 '0,3 × 350 = 105, dus 105 + b = 270 → b = <b>€ 165</b>.<br>Fout: 270 is het hele inkomen. 105 is wat ze met de dozen verdient. 375 = 270 + 105 (tekenfout).',
 'Vul q = 350 en R = 270 in R = 0,3q + b in.'],
['Bij € 5 verkoopt een koopman 90 T-shirts per week, bij € 8 nog maar 30. Welke formule geeft q (aantal) uitgedrukt in p (prijs)?','q = −20p + 190','q = −20p + 90|q = 20p − 10|p = −20q + 190',
 'a = Δq : Δp = (30 − 90) : (8 − 5) = −20. −20 × 5 + b = 90 → b = 190.<br>Fout: + 90 neemt de y van een punt als b. + 20p laat de verkoop stijgen bij een hogere prijs. p = … zet de variabelen verkeerd om.',
 'q is de uitkomst, p de invoer. Dus a = Δq : Δp.'],
['Familie A verbruikt 3250 kWh en betaalt € 841,60. Familie B verbruikt 4426 kWh en betaalt € 1112,08. Hoe hoog is het vastrecht?','€ 94,10','€ 0,23|€ 841,60|€ 270,48',
 'a = 270,48 : 1176 = 0,23 per kWh. b = 841,60 − 0,23 × 3250 = 841,60 − 747,50 = <b>€ 94,10</b>.<br>Fout: 0,23 is de prijs per kWh. 841,60 is de hele rekening. 270,48 is het verschil tussen de rekeningen.',
 'Reken eerst de prijs per kWh (a) uit, dan b met één van de twee families.'],
['Een kaars wordt elke minuut 0,5 mm korter. Na een uur is hij 55 mm. Welke formule geeft de lengte l in mm na t minuten?','l = −0,5t + 85','l = −0,5t + 25|l = 0,5t + 55|l = −0,5t + 55',
 '−0,5 × 60 + b = 55 → −30 + b = 55 → b = 85.<br>Fout: 25 = 55 − 30 (tekenfout). + 0,5t laat de kaars groeien. 55 is de lengte na een uur, niet bij het begin.',
 'Een uur = 60 minuten. Vul t = 60 en l = 55 in.'],
['Hoe bereken je de rc van de lijn door A en B?','(y<sub>B</sub> − y<sub>A</sub>) : (x<sub>B</sub> − x<sub>A</sub>)','(x<sub>B</sub> − x<sub>A</sub>) : (y<sub>B</sub> − y<sub>A</sub>)|(y<sub>B</sub> − x<sub>B</sub>) : (y<sub>A</sub> − x<sub>A</sub>)|(y<sub>B</sub> + y<sub>A</sub>) : (x<sub>B</sub> + x<sub>A</sub>)',
 'rc = Δy : Δx, verschil in y boven, verschil in x onder.<br>Fout: de tweede is omgedraaid. De derde haalt x en y van hetzelfde punt door elkaar. Optellen is geen verschil.',
 'Omhoog gedeeld door naar rechts.'],
['Lotte rekent bij P(2, −1) en Q(6, 5): Δy = y<sub>P</sub> − y<sub>Q</sub> = −6. Welke Δx moet ze dan nemen?','x<sub>P</sub> − x<sub>Q</sub> = −4','x<sub>Q</sub> − x<sub>P</sub> = 4|x<sub>P</sub> + x<sub>Q</sub> = 8|y<sub>Q</sub> − y<sub>P</sub> = 6',
 'Boven en onder dezelfde volgorde: x<sub>P</sub> − x<sub>Q</sub> = 2 − 6 = −4. Dan rc = −6 : −4 = 1,5 ✓.<br>Fout: 4 draait de volgorde om (dan krijg je −1,5). Optellen is geen verschil. y<sub>Q</sub> − y<sub>P</sub> is geen x-verschil.',
 'Als je bij y eerst P neemt, neem je bij x ook eerst P.'],
['De eerste 50 geboortekaartjes kosten € 1,95 per stuk, de volgende 50 € 1,45 per stuk. Welke formule geldt van 50 tot 100 kaartjes?','K = 1,45q + 25','K = 1,45q|K = 1,45q + 97,50|K = 1,95q + 25',
 'Bij q = 50 betaal je 50 × 1,95 = 97,50. Daarna rc 1,45: 1,45 × 50 + b = 97,50 → 72,50 + b = 97,50 → b = 25.<br>Fout: 1,45q vergeet dat de eerste 50 duurder waren. + 97,50 telt de eerste 50 dubbel. 1,95 is de prijs van het eerste stuk.',
 'Het tweede stuk begint in het knikpunt (50; 97,50). Gebruik dat punt en de nieuwe rc.'],
['Janne loopt A = 0,25t (km na t minuten). Marlijn loopt 0,2 km per minuut en is eerder vertrokken. Op t = 10 haalt Janne haar in. Wat is de formule van Marlijn?','A = 0,2t + 0,5','A = 0,2t|A = 0,2t + 2,5|A = 0,25t + 0,5',
 'Op t = 10 zijn ze op dezelfde plek: 0,25 × 10 = 2,5 km. Marlijn: 0,2 × 10 + b = 2,5 → b = 0,5.<br>Fout: zonder b zou Marlijn op t = 0 nog bij de start staan. 2,5 is de plek op t = 10. 0,25 is het tempo van Janne.',
 'Inhalen = op hetzelfde moment op dezelfde plek. Reken die plek uit met Jannes formule.']
],
'3.3':[
['Los op: 5x − 3 = 3x + 5','x = 4','x = 1|x = −4|x = 0,25',
 '−3x: 2x − 3 = 5. +3: 2x = 8. : 2: <b>x = 4</b>.<br>Fout: x = 1 krijg je bij 2x = 2 (−3 en 5 verkeerd samengenomen). −4 is een tekenfout. 0,25 = 2 : 8 (omgedraaid gedeeld).',
 'Breng de x’en naar links, de losse getallen naar rechts, en deel dan.'],
['Los op: 2x − 5 = 6x + 3','x = −2','x = 2|x = −0,5|x = −1',
 '−6x: −4x − 5 = 3. +5: −4x = 8. : −4: <b>x = −2</b>.<br>Fout: 2 vergeet dat je door een negatief getal deelt. −0,5 = −4 : 8 (omgedraaid). −1 komt van −4x = 4 (rekenfout).',
 'Na het verplaatsen krijg je −4x = 8. Deel door −4.'],
['Waar snijdt y = 2x − 4 de x-as?','(2, 0)','(0, −4)|(−2, 0)|(4, 0)',
 'x-as: y = 0. 2x − 4 = 0 → 2x = 4 → x = 2. Dus <b>(2, 0)</b>.<br>Fout: (0, −4) is het snijpunt met de y-as. −2 is een tekenfout. (4, 0) vergeet te delen door 2.',
 'Op de x-as is y = 0. Stel de formule gelijk aan 0.'],
['Waar snijdt y = 0,8x − 6 de y-as?','(0, −6)','(7,5; 0)|(0; 0,8)|(−6, 0)',
 'y-as: x = 0, dan blijft y = −6. Dus <b>(0, −6)</b>.<br>Fout: (7,5; 0) is het snijpunt met de x-as. 0,8 is de rc. (−6, 0) heeft x en y verwisseld.',
 'Op de y-as is x = 0.'],
['Wat is het snijpunt van y = 5 − x en y = 2x − 4?','(3, 2)','(2, 3)|(3, 8)|(1, 4)',
 '5 − x = 2x − 4 → 9 = 3x → x = 3. y = 5 − 3 = 2. Dus <b>(3, 2)</b>.<br>Fout: (2, 3) verwisselt x en y. y = 8 is 5 + 3 (tekenfout). (1, 4): bij x = 1 geven de formules 4 en −2, dat is geen snijpunt.',
 'Stel de twee rechterleden gelijk, los x op en vul x in één formule in.'],
['Wat is de x-coördinaat van het snijpunt van y = 15x − 31 en y = 7x + 5?','4,5','3,25|−4,5|36',
 '15x − 31 = 7x + 5 → 8x = 36 → x = <b>4,5</b>.<br>Fout: 3,25 komt van 8x = 26 (−31 + 5). −4,5 is een tekenfout. 36 vergeet te delen door 8.',
 '−7x en +31 aan beide kanten. Dan delen.'],
['Wat is stap 1 van het werkschema voor het snijpunt van twee lijnen?','de rechterleden van de formules aan elkaar gelijkstellen','in beide formules y = 0 invullen|in beide formules x = 0 invullen|de twee rc’s bij elkaar optellen',
 'In het snijpunt hebben beide lijnen dezelfde y, dus stel je de rechterleden gelijk.<br>Fout: y = 0 geeft het snijpunt met de x-as, x = 0 dat met de y-as. Optellen van rc’s heeft geen betekenis.',
 'In het snijpunt is de y van de ene lijn gelijk aan de y van de andere.'],
['Wat is het snijpunt van y = −2,5x + 5 en de lijn y = 25?','(−8, 25)','(8, 25)|(−12, 25)|(0, 25)',
 '−2,5x + 5 = 25 → −2,5x = 20 → x = −8.<br>Fout: 8 vergeet de min. −12 komt van −2,5x = 30 (tekenfout bij de 5). (0, 25) ligt niet op de eerste lijn (die geeft 5).',
 'y = 25 is een horizontale lijn. Stel −2,5x + 5 gelijk aan 25.'],
['Op de lijn y = −2,5x + 35 ligt een punt met y = 45. Wat is de x-coördinaat?','−4','4|−32|32',
 '−2,5x + 35 = 45 → −2,5x = 10 → x = <b>−4</b>.<br>Fout: 4 vergeet de min. 32 en −32 komen van 80 : 2,5 (35 opgeteld in plaats van afgetrokken).',
 'Stel de formule gelijk aan 45 en gebruik de balansmethode.'],
['Taxi A: K = 1,2d + 20. Taxi B: K = 1,6d. Bij welke afstand zijn ze even duur?','d = 50','d = 12,5|d = 7,1|d = 20',
 '1,2d + 20 = 1,6d → 20 = 0,4d → d = <b>50</b>.<br>Fout: 12,5 = 20 : 1,6. 7,1 = 20 : 2,8 (rc’s opgeteld). 20 is het instaptarief.',
 'Even duur = vergelijking K<sub>A</sub> = K<sub>B</sub>.'],
['Taxi A: K = 1,2d + 20. Taxi B: K = 1,6d. Bij welke afstanden is A goedkoper?','d > 50','d < 50|d = 50|d > 20',
 'Even duur bij 50 km. A begint hoger maar stijgt langzamer, dus na 50 km ligt A onder B: <b>d &gt; 50</b>.<br>Fout: vóór 50 km is B goedkoper. Bij precies 50 zijn ze gelijk. 20 is het instaptarief.',
 'Los eerst de vergelijking op. Probeer dan een getal, bijvoorbeeld d = 100: welke is goedkoper?'],
['Een ijssalon heeft opbrengst R = 2,25q en kosten K = 1,15q + 352 (q ijsjes per week). Wanneer maakt de salon winst?','bij meer dan 320 ijsjes','bij minder dan 320 ijsjes|bij meer dan 156 ijsjes|bij meer dan 352 ijsjes',
 'Winst als R &gt; K. 2,25q = 1,15q + 352 → 1,10q = 352 → q = 320. R is steiler, dus rechts van 320 ligt R boven K.<br>Fout: onder 320 is er verlies. 156 = 352 : 2,25. 352 zijn de vaste kosten.',
 'Winst betekent opbrengst groter dan kosten. Los R = K op.'],
['Een fabriek: K = 250q + 50 000 en R = 400q. Hoeveel wasmachines moet ze minstens maken voor winst?','334','333|200|125',
 '400q = 250q + 50 000 → 150q = 50 000 → q ≈ 333,3. Bij 333 is er nog verlies, dus minimaal <b>334</b>.<br>Fout: 333 is naar beneden afgerond (net verlies). 200 = 50 000 : 250 en 125 = 50 000 : 400.',
 'Bij een kommagetal: welke kant op moet je afronden zodat het echt winst is?'],
['Golfclub A kost 12n + 435 euro per jaar, club B 17,5n + 350 euro (n = aantal keer golfen). Vanaf hoeveel keer is A goedkoper?','16 keer','15 keer|25 keer|6 keer',

['Golfclub B kost 17,5n + 350 euro per jaar. Je wilt maximaal € 600 uitgeven. Hoe vaak kun je golfen?','14 keer','15 keer|13 keer|34 keer',

 'Bij een budget mag je er niet boven: rond naar beneden af.'],
['Wat betekent K<sub>A</sub> &lt; K<sub>B</sub>?','bij A betaal je minder dan bij B','bij A betaal je meer dan bij B|A en B kosten evenveel|de grafiek van A ligt boven die van B',

 'De punt van het teken wijst naar de kleinste.'],
['Reparateur I kost 22t + 80 euro, reparateur II 18t + 96 euro (t in uren). Wanneer is I voordeliger?','bij minder dan 4 uur','bij meer dan 4 uur|bij minder dan 16 uur|bij meer dan 16 uur',

 'Los de vergelijking op en kijk wie lager begint.'],
['Een vliegtuig heeft k = 11,75 − 0,003V ton kerosine na V km. Bij 1,5 ton gaat een alarm. Na ongeveer hoeveel km is dat?','ongeveer 3400 km','ongeveer 500 km|ongeveer 4400 km|ongeveer 3900 km',

 'Stel de formule gelijk aan 1,5 en los V op.'],
['Jori zwemt A = 120t meter. Zijn broer rent hem tegemoet: A = 1200 − 60t (t in minuten). Wanneer treffen ze elkaar?','na 6 min 40 s','na 20 min|na 10 min|na 6 min 67 s',

 'Treffen = zelfde plek. Stel de twee formules gelijk. Reken het deel van een minuut om met × 60.']

'3.4':[
['Maak y vrij in 6x + 3y = 42.','y = −2x + 14','y = 2x + 14|y = −6x + 42|y = −0,5x + 7',

['Door welke punten op de assen gaat de lijn 3x + 2y = 12?','(0, 6) en (4, 0)','(0, 4) en (6, 0)|(0, 12) en (12, 0)|(0, 3) en (2, 0)',

['Wat is de rc van de lijn 3x + 2y = 12?','−1,5','1,5|3|−0,67',

['Druk p uit in q bij 3p − 1,2q = 16,5.','p = 0,4q + 5,5','p = −0,4q + 5,5|p = 1,2q + 16,5|q = 2,5p − 13,75',

['Maak b vrij in 5a − 2b = 16.','b = 2,5a − 8','b = −2,5a + 8|b = 2,5a + 8|a = 0,4b + 3,2',

 'Na het verplaatsen staat er −2b. Deel alles door −2.'],
['2 muntthee en 4 koffie kosten samen € 18. Muntthee kost x euro, koffie y euro. Welke vergelijking klopt?','2x + 4y = 18','x + y = 18|4x + 2y = 18|2x + 4y = 6',

 'Aantal keer prijs, voor elke drank, en dat bij elkaar opgeteld.'],
['Welke vergelijking hoort bij de lijn met rc −2 door (1, 3)?','2x + y = 5','2x + y = 0|x + 2y = 5|2x − y = 5',

 'Stel eerst y = ax + b op en breng dan de x-term naar links.'],
['Een restaurant heeft 19 tafels voor 4 (x) en voor 2 (y) personen met samen 52 plaatsen. Hoeveel tafels voor 4?','7','12|13|9,5',

 'Stel x + y = 19 en 4x + 2y = 52 op en volg het werkschema.'],
['Roel koopt 13 bollen: x kaasbollen van € 1,50 en y bruine bollen van € 1,20, samen € 18. Welke twee vergelijkingen horen hierbij?','x + y = 13 en 1,5x + 1,2y = 18','x + y = 18 en 1,5x + 1,2y = 13|1,2x + 1,5y = 18 en x + y = 13|x + y = 13 en 1,5x + 1,2y = 13',
 'Aantal: x + y = 13. Geld: 1,5x + 1,2y = 18.<br>Fout: de tweede verwisselt de totalen. De derde zet de prijzen bij de verkeerde bol. De laatste gebruikt 13 ook als bedrag.',
 'Eén vergelijking voor het aantal, één voor het geld.'],
['In een envelop zitten 20 briefjes van € 5 en € 10, samen € 135. Hoeveel briefjes van € 5?','13','7|27|6,75',

 'x = aantal vijfjes, y = aantal tientjes. Stel twee vergelijkingen op.'],
['Een jongere betaalt € 5 minder dan een volwassene. 2 jongeren en 2 volwassenen betalen € 80. Wat betaalt een volwassene?','€ 22,50','€ 17,50|€ 20|€ 42,50',

 'Schrijf de prijs voor een jongere als x − 5.'],
['Bij een barbecue komen 250 mensen. Kinderen betalen € 6, volwassenen € 8, samen € 1764. Hoeveel kinderen?','118','132|220|294',

 'Werkschema: twee vergelijkingen, y vrijmaken, gelijkstellen, oplossen.'],
['Wat is stap 3 van het werkschema voor situaties met twee variabelen?','bij beide vergelijkingen y uitdrukken in x en ze gelijkstellen','de twee vergelijkingen bij elkaar optellen|in beide vergelijkingen x = 0 invullen|de antwoorden controleren',

 'Je wilt één vergelijking met alleen x overhouden.']

['Bolt liep 30 m in de eerste 3,78 s. Waarom is lineair interpoleren voor de afstand na 1 s geen goed idee?','hij versnelt dan nog, dus de grafiek is daar krom','hij loopt dan al op topsnelheid|er zijn daar geen gegevens|interpoleren mag alleen met jaartallen',

['Woningen (× 1000): in 1971 waren er 3873, in 1998 waren het er 6425. Schat met lineair interpoleren het aantal in 1990.','ongeveer 5669 duizend','ongeveer 5149 duizend|ongeveer 4600 duizend|ongeveer 6050 duizend',
